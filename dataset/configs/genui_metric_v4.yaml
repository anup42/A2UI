metric:
  name: GenUI Representation Quality
  version: "4.0.0"
  construct: >-
    The degree to which a renderer-compatible JSON specification faithfully,
    appropriately, robustly, accessibly, and economically represents the
    supplied source text as a usable native UI.
  source_text_quality_is_out_of_scope: true
  calibration_status: uncalibrated_engineering_score

dimension_weights:
  integrity: 0.25
  fidelity: 0.40
  semantic_mapping: 0.15
  hierarchy: 0.10
  economy: 0.07
  accessibility: 0.03

atomic_weights:
  integrity:
    schema_contract: 0.25
    declared_root_reachability: 0.25
    reference_integrity: 0.20
    type_semantic_contract: 0.25
    native_render_smoke: 0.05
  fidelity:
    visible_content_multiset_fbeta: 0.25
    exact_numbers_dates_units_fbeta: 0.18
    markdown_table_fidelity: 0.24
    heading_fidelity_and_order: 0.12
    action_and_source_link_fidelity: 0.15
    media_fidelity: 0.06
  semantic_mapping:
    required_component_roles: 0.65
    component_appropriateness: 0.35
  hierarchy:
    root_layout: 0.20
    root_distance_depth: 0.25
    container_fanout: 0.20
    heading_grouping: 0.20
    text_chunking: 0.15
  economy:
    semantic_non_duplication: 0.40
    renderer_aware_wrapper_economy: 0.30
    json_to_source_size: 0.30
  accessibility:
    applicable_accessibility_contracts: 1.00

aggregation:
  arithmetic_share: 0.75
  geometric_floor: 0.03

fidelity:
  content_beta: 2.0
  value_beta: 2.0
  table_beta: 2.0

economy:
  good_json_to_source_ratio: 3.0
  bad_json_to_source_ratio: 7.0

guardrails:
  max_atomic_global_weight: 0.10

caps:
  missing_root: 0.10
  schema_severe: 0.25
  schema_moderate: 0.45
  reference_or_cycle: 0.25
  reachability_below_90: 0.40
  partial_reachability: 0.70
  type_contract_severe: 0.45
  render_failure: 0.30
  missing_table: 0.65
  partial_table: 0.90
  missing_chart: 0.78
  chart_below_two_thirds: 0.88
  partial_chart: 0.94
  missing_special_role: 0.78
  partial_special_role: 0.92
  missing_action: 0.75
  action_below_half: 0.88
  partial_action: 0.96

grpo:
  reward_transform: "r = 2Q - 1"
  reward_min: -1.0
  reward_max: 1.0
  recommended_num_generations: 8
  recommended_loss_type: dapo
  recommended_scale_rewards: batch
  mask_truncated_completions: true

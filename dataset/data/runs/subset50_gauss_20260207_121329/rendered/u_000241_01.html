 {"children": {"explicitList": ["icon_img_9", "icon_label_9"]}, "alignment": "center"}}}, {"id": "icon_img_10", "component": {"Image": {"url": {"literalString": "https://image.url/ramen"}, "usageHint": "icon"}}}, {"id": "icon_label_10", "component": {"Text": {"text": {"literalString": "A Bowl of Premium Ramen"}, "usageHint": "body"}}}, {"id": "icon_row_10", "component": {"Row": {"children": {"explicitList": ["icon_img_10", "icon_label_10"]}, "alignment": "center"}}}, {"id": "text_11", "component": {"Text": {"text": {"literalString": "### Tokyo Itinerary Summary: Anime, Temples & Ramen"}, "usageHint": "body"}}}, {"id": "text_12", "component": {"Text": {"text": {"literalString": "This 3-day plan balances Tokyo's vibrant pop culture with its serene traditions. You'll explore the electric streets of Akihabara, the historic grounds of Asakusa, and the bustling hub of Shinjuku, all while enjoying some of the city's best ramen."}, "usageHint": "body"}}}, {"id": "text_13", "component": {"Text": {"text": {"literalString": "**Total Estimated Budget:** 30,000 - 35,000 JPY (well under the 45,000 JPY limit for 3 days)"}, "usageHint": "body"}}}, {"id": "text_14", "component": {"Text": {"text": {"literalString": "---"}, "usageHint": "body"}}}, {"id": "text_15", "component": {"Text": {"text": {"literalString": "### Pre-Travel Checklist"}, "usageHint": "body"}}}, {"id": "text_16", "component": {"Text": {"text": {"literalString": "- [ ] **Transport Card:** Purchase a Suica or Pasmo card at the airport or a major train station. This is a rechargeable IC card for seamless travel on subways, trains, and buses.\n- [ ] **Connectivity:** Rent a pocket Wi-Fi device or get a travel SIM card for navigation and on-the-go research.\n- [ ] **Cash:** While cards are widely accepted, many smaller ramen shops, street food stalls, and temple vendors are cash-only. It's wise to carry at least 10,000 JPY in cash.\n- [ ] **Check Opening Times:** Use the provided links or Google Maps to verify the opening hours of attractions and restaurants before you go, especially since it's a weekend."}, "usageHint": "body"}}}, {"id": "text_17", "component": {"Text": {"text": {"literalString": "---"}, "usageHint": "body"}}}, {"id": "text_18", "component": {"Text": {"text": {"literalString": "### Day 1: Modern Tokyo & Anime Mecca (2025-05-10, Saturday)"}, "usageHint": "body"}}}, {"id": "text_19", "component": {"Text": {"text": {"literalString": "Focus: Youth culture, iconic cityscapes, and the heart of anime/gaming."}, "usageHint": "body"}}}, {"id": "text_20", "component": {"Text": {"text": {"literalString": "**Morning (9:00 AM - 1:00 PM): Harajuku & Meiji Shrine**\n- **Activity:** Start at Meiji Jingu Shrine, a peaceful oasis dedicated to Emperor Meiji. The walk through the forested grounds is a calming contrast to the city's hustle.\n- **Activity:** Walk to Harajuku's Takeshita Street. Experience the epicenter of Japanese youth fashion, browse unique shops, and try a famous Harajuku crepe.\n- **Travel:** Take the JR Yamanote Line to Harajuku Station."}, "usageHint": "body"}}}, {"id": "text_21", "component": {"Text": {"text": {"literalString": "**Afternoon (1:00 PM - 5:00 PM): Shibuya's Scramble**\n- **Food:** Grab lunch in the Harajuku/Omotesando area.\n- **Travel:** Walk (approx. 15-20 mins) or take the JR Yamanote Line one stop from Harajuku to Shibuya.\n- **Activity:** Witness the famous Shibuya Crossing from a high vantage point like the Starbucks in the Tsutaya building. Don't forget to visit the Hachiko Statue outside the station."}, "usageHint": "body"}}}, {"id": "text_22", "component": {"Text": {"text": {"literalString": "**Evening (5:00 PM onwards): Akihabara Electric Town**\n- **Travel:** Take the JR Yamanote Line from Shibuya to Akihabara Station.\n- **Activity:** Dive into the world of anime, manga, and gaming. Explore multi-story arcades like Taito Station or SEGA, browse figure shops like AmiAmi, and experience the unique atmosphere of \"Electric Town.\"\n- **Food:** Dinner is your first high-end ramen experience in the heart of Akihabara."}, "usageHint": "body"}}}, {"id": "text_23", "component": {"Text": {"text": {"literalString": "**Daily Budget Breakdown (Estimated):**\n- **Travel:** 1,000 JPY (Suica/Pasmo top-up)\n- **Food:** 6,000 JPY (crepe, lunch, dinner, drinks)\n- **Activities:** 2,000 JPY (shrine donation, arcade games)\n- **Total:** ~9,000 JPY"}, "usageHint": "body"}}}, {"id": "text_24", "component": {"Text": {"text": {"literalString": "**Ramen Spotlight: Day 1**\nOption 1: Motenashi Kuroki | Shio (salt-based) ramen with delicate, complex flavors. | Approx. 2,000 JPY | [Link to map/info]\nOption 2: Kikanbo, Akihabara | Spicy Miso ramen with customizable spice levels. A fiery and unforgettable bowl. | Approx. 1,800 JPY | [Link to map/info]"}, "usageHint": "body"}}}, {"id": "text_25", "component": {"Text": {"text": {"literalString": "---"}, "usageHint": "body"}}}, {"id": "text_26", "component": {"Text": {"text": {"literalString": "### Day 2: Tradition & Culture (2025-05-11, Sunday)"}, "usageHint": "body"}}}, {"id": "text_27", "component": {"Text": {"text": {"literalString": "Focus: Historic temples, traditional markets, and sweeping city views."}, "usageHint": "body"}}}, {"id": "text_28", "component": {"Text": {"text": {"literalString": "**Morning (9:00 AM - 1:00 PM): Asakusa's Senso-ji Temple**\n- **Travel:** Take the Tokyo Metro Ginza Line to Asakusa Station.\n- **Activity:** Walk through the Kaminarimon (Thunder Gate) and down Nakamise-dori, a bustling street filled with traditional snacks and souvenirs leading to Senso-ji, Tokyo's oldest temple.\n- **Tip:** Try some local snacks like Ningyo-yaki (small cakes with red bean filling) or Agemanju (deep-fried manju buns)."}, "usageHint": "body"}}}, {"id": "text_29", "component": {"Text": {"text": {"literalString": "**Afternoon (1:00 PM - 5:00 PM): Ueno Park & Museums**\n- **Food:** Enjoy lunch in Asakusa. There are many great tempura and unagi restaurants in the area.\n- **Travel:** Take the Tokyo Metro Ginza Line from Asakusa to Ueno Station (5 mins).\n- **Activity:** Stroll through Ueno Park. You have several options here:\n    - Visit the Tokyo National Museum for Japanese art and archaeology (entry fee ~1,000 JPY).\n    - Explore the lively Ameya Yokocho Market for street food and bargain shopping.\n    - Visit the Ueno Zoo (entry fee ~600 JPY)."}, "usageHint": "body"}}}, {"id": "text_30", "component": {"Text": {"text": {"literalString": "**Evening (5:00 PM onwards): Tokyo Skytree Views**\n- **Activity:** For a modern view, head towards the Tokyo Skytree (a short walk or one subway stop from Asakusa). You can ascend for panoramic views (ticket prices vary) or explore the Solamachi shopping center at its base.\n- **Food:** Dinner is your second high-end ramen experience, with many excellent choices in the Ueno and Skytree areas."}, "usageHint": "body"}}}, {"id": "text_31", "component": {"Text": {"text": {"literalString": "**Daily Budget Breakdown (Estimated):**\n- **Travel:** 800 JPY\n- **Food:** 7,000 JPY (snacks, lunch, ramen dinner)\n- **Activities:** 1,500 JPY (e.g., museum entrance)\n- **Total:** ~9,300 JPY"}, "usageHint": "body"}}}, {"id": "text_32", "component": {"Text": {"text": {"literalString": "**Ramen Spotlight: Day 2**\nOption 1: Ichiran, Ueno | Classic Tonkotsu (pork bone) ramen with customizable solo \"flavor concentration\" booths. | Approx. 1,500 JPY | [Link to map/info]\nOption 2: Mensho | A creative ramen shop known for its unique lamb-based or chocolate-infused bowls. | Approx. 1,800 JPY | [Link to map/info]"}, "usageHint": "body"}}}, {"id": "text_33", "component": {"Text": {"text": {"literalString": "---"}, "usageHint": "body"}}}, {"id": "text_34", "component": {"Text": {"text": {"literalString": "### Day 3: Gardens, City Views & Shinjuku Nights (2025-05-12, Monday)"}, "usageHint": "body"}}}, {"id": "text_35", "component": {"Text": {"text": {"literalString": "Focus: A perfect blend of nature, panoramic cityscapes, and vibrant nightlife."}, "usageHint": "body"}}}, {"id": "text_36", "component": {"Text": {"text": {"literalString": "**Morning (9:30 AM - 12:30 PM): Shinjuku Gyoen National Garden**\n- **Travel:** Take the Tokyo Metro Marunouchi Line to Shinjuku-gyoenmae Station.\n- **Activity:** Escape the city bustle in one of Tokyo's most beautiful gardens. Shinjuku Gyoen features three distinct styles: French Formal, English Landscape, and Japanese Traditional.\n- **Budget:** Entrance fee is 500 JPY."}, "usageHint": "body"}}}, {"id": "text_37", "component": {"Text": {"text": {"literalString": "**Afternoon (12:30 PM - 5:00 PM): Free Views & Department Stores**\n- **Food:** For lunch, experience a \"depachika\" (department store food hall) at Isetan or Takashimaya. You can find an incredible variety of high-quality bento boxes, sushi, and pastries.\n- **Activity:** Walk to the Tokyo Metropolitan Government Building. Take the free elevator to the observation decks on the 45th floor for stunning panoramic views of Tokyo. On a clear day, you might see Mt. Fuji."}, "usageHint": "body"}}}, {"id": "text_38", "component": {"Text": {"text": {"literalString": "**Evening (5:00 PM onwards): Shinjuku's Alleys & Final Ramen**\n- **Activity:** As dusk falls, explore the atmospheric side of Shinjuku.\n    - **Omoide Yokocho (Memory Lane):** A network of narrow alleys packed with tiny yakitori stalls and bars.\n    - **Golden Gai:** Another area with several blocks of tiny, unique bars, each with its own character.\n- **Food:** Conclude your trip with a final, exceptional bowl of ramen in Shinjuku, a highly competitive ramen district."}, "usageHint": "body"}}}, {"id": "text_39", "component": {"Text": {"text": {"literalString": "**Daily Budget Breakdown (Estimated):**\n- **Travel:** 800 JPY\n- **Food:** 7,500 JPY (depachika lunch, ramen dinner, a drink)\n- **Activities:** 500 JPY (garden entrance)\n- **Total:** ~8,800 JPY"}, "usageHint": "body"}}}, {"id": "text_40", "component": {"Text": {"text": {"literalString": "**Ramen Spotlight: Day 3**\nOption 1: Ichiran, Shinjuku Central East Exit | The quintessential Tonkotsu experience, perfect for a final classic bowl. | Approx. 1,500 JPY | [Link to map/info]\nOption 2: Fu-unji | Famous for its rich, thick tsukemen (dipping noodles) with a flavorful fish and pork broth. | Approx. 1,600 JPY | [Link to map/info]\nOption 3: Ramen Nagi (Golden Gai) | A tiny shop serving an intense Niboshi (dried sardine) broth ramen, open 24/7. | Approx. 1,500 JPY | [Link to map/info]"}, "usageHint": "body"}}}, {"id": "btn_label_41", "component": {"Text": {"text": {"literalString": "Get a Suica Card"}, "usageHint": "body"}}}, {"id": "btn_41", "component": {"Button": {"child": "btn_label_41", "action": {"name": "openUrl", "context": [{"key": "url", "value": {"literalString": "https://www.jreast.co.jp/multi/en/pass/suica.html"}}]}, "primary": true}}}, {"id": "btn_label_42", "component": {"Text": {"text": {"literalString": "Explore Tokyo on TripAdvisor"}, "usageHint": "body"}}}, {"id": "btn_42", "component": {"Button": {"child": "btn_label_42", "action": {"name": "openUrl", "context": [{"key": "url", "value": {"literalString": "https://www.tripadvisor.com/Tourism"}}]}, "primary": true}}}]}}];

          function renderSurfaces() {
            container.innerHTML = "";
            for (const [surfaceId, surface] of processor.getSurfaces()) {
              const el = document.createElement("a2ui-surface");
              el.surfaceId = surfaceId;
              el.surface = surface;
              el.processor = processor;
              container.appendChild(el);
            }
          }

          function renderMessages(payload, reset) {
            const messages = parseMessages(payload);
            if (!Array.isArray(messages)) {
              console.warn("GenUICraft payload was not an array", messages);
              return;
            }
            if (reset) {
              processor.clearSurfaces();
            }
            processor.processMessages(messages);
            renderSurfaces();
            window.__GenUICraft_RENDER_DONE = true;
          }

          window.renderA2uiMessages = renderMessages;
          window.GenUICraft_READY = true;

          const queued = window.__GenUICraft_QUEUE || [];
          window.__GenUICraft_QUEUE = [];
          queued.forEach((item) => renderMessages(item.payload, item.reset));

          if (window.__GenUICraft_MESSAGES__) {
            renderMessages(window.__GenUICraft_MESSAGES__, window.__GenUICraft_RESET__);
          }
        } catch (err) {
          console.error("Failed to load GenUICraft Lit renderer", err);
          setStatus("Lit renderer failed to load.");
        }
      }

      init();
    </script>
  </body>
</html>

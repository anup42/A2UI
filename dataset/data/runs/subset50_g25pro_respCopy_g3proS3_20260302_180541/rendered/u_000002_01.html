he most important item."}, "usageHint": "body"}}}, {"id": "text_5", "component": {"Text": {"text": {"literalString": "---\nSECTION: BUDGET & TICKET FRAMEWORK"}, "usageHint": "body"}}}, {"id": "text_6", "component": {"Text": {"text": {"literalString": "This is an example breakdown of your daily 100 Euro budget."}, "usageHint": "body"}}}, {"id": "text_7", "component": {"Text": {"text": {"literalString": "TABLE: DAILY BUDGET ESTIMATE\nCategory | Estimated Cost | Notes\n--- | --- | ---\nEntry Fees (Avg.) | €25 | Colosseum (~€20), Vatican (~€25), Pantheon (€5). Averaged over 2 days.\nBreakfast | €5 | Cappuccino and a cornetto at a local bar (standing at the counter is cheaper).\nLunch | €15 | Pizza al taglio (by the slice) or a fresh panino.\nDinner | €40 | A sit-down meal at a trattoria (pasta/pizza, glass of house wine, water).\nSnacks/Gelato | €15 | Includes water, coffee breaks, and essential daily gelato.\n**Total** | **€100** |"}, "usageHint": "body"}}}, {"id": "text_8", "component": {"Text": {"text": {"literalString": "HOW TO VERIFY TICKET PRICES & BOOK:\n1. Visit the official websites provided in the 'Sources' section below.\n2. Select your desired date (2024-09-15 for Colosseum, 2024-09-16 for Vatican).\n3. Choose your time slot. Morning slots are highly recommended.\n4. Complete the purchase and save the digital ticket to your phone."}, "usageHint": "body"}}}, {"id": "text_9", "component": {"Text": {"text": {"literalString": "---"}, "usageHint": "body"}}}, {"id": "icon_img_10", "component": {"Image": {"url": {"literalString": "https://icon.url/sightseeing"}, "usageHint": "icon"}}}, {"id": "icon_label_10", "component": {"Text": {"text": {"literalString": "SIGHTSEEING"}, "usageHint": "body"}}}, {"id": "icon_row_10", "component": {"Row": {"children": {"explicitList": ["icon_img_10", "icon_label_10"]}, "alignment": "center"}}}, {"id": "icon_img_11", "component": {"Image": {"url": {"literalString": "https://icon.url/food"}, "usageHint": "icon"}}}, {"id": "icon_label_11", "component": {"Text": {"text": {"literalString": "FOOD"}, "usageHint": "body"}}}, {"id": "icon_row_11", "component": {"Row": {"children": {"explicitList": ["icon_img_11", "icon_label_11"]}, "alignment": "center"}}}, {"id": "icon_img_12", "component": {"Image": {"url": {"literalString": "https://icon.url/walking"}, "usageHint": "icon"}}}, {"id": "icon_label_12", "component": {"Text": {"text": {"literalString": "WALKING"}, "usageHint": "body"}}}, {"id": "icon_row_12", "component": {"Row": {"children": {"explicitList": ["icon_img_12", "icon_label_12"]}, "alignment": "center"}}}, {"id": "icon_img_13", "component": {"Image": {"url": {"literalString": "https://icon.url/tip"}, "usageHint": "icon"}}}, {"id": "icon_label_13", "component": {"Text": {"text": {"literalString": "TIP"}, "usageHint": "body"}}}, {"id": "icon_row_13", "component": {"Row": {"children": {"explicitList": ["icon_img_13", "icon_label_13"]}, "alignment": "center"}}}, {"id": "icon_img_14", "component": {"Image": {"url": {"literalString": "https://example.image.url/colosseum"}, "usageHint": "icon"}}}, {"id": "icon_label_14", "component": {"Text": {"text": {"literalString": "The Colosseum"}, "usageHint": "body"}}}, {"id": "icon_row_14", "component": {"Row": {"children": {"explicitList": ["icon_img_14", "icon_label_14"]}, "alignment": "center"}}}, {"id": "icon_img_15", "component": {"Image": {"url": {"literalString": "https://example.image.url/stpeters"}, "usageHint": "icon"}}}, {"id": "icon_label_15", "component": {"Text": {"text": {"literalString": "St. Peter's Basilica"}, "usageHint": "body"}}}, {"id": "icon_row_15", "component": {"Row": {"children": {"explicitList": ["icon_img_15", "icon_label_15"]}, "alignment": "center"}}}, {"id": "icon_img_16", "component": {"Image": {"url": {"literalString": "https://example.image.url/trevi"}, "usageHint": "icon"}}}, {"id": "icon_label_16", "component": {"Text": {"text": {"literalString": "The Trevi Fountain"}, "usageHint": "body"}}}, {"id": "icon_row_16", "component": {"Row": {"children": {"explicitList": ["icon_img_16", "icon_label_16"]}, "alignment": "center"}}}, {"id": "icon_img_17", "component": {"Image": {"url": {"literalString": "https://example.image.url/pantheon"}, "usageHint": "icon"}}}, {"id": "icon_label_17", "component": {"Text": {"text": {"literalString": "The Pantheon"}, "usageHint": "body"}}}, {"id": "icon_row_17", "component": {"Row": {"children": {"explicitList": ["icon_img_17", "icon_label_17"]}, "alignment": "center"}}}, {"id": "text_18", "component": {"Text": {"text": {"literalString": "[Button: Book Colosseum Tickets] coopculture.it\n[Button: Book Vatican Museums Tickets] museivaticani.va"}, "usageHint": "body"}}}, {"id": "text_19", "component": {"Text": {"text": {"literalString": "---\nSECTION: ITINERARY DAY 1 (2024-09-15): ANCIENT ROME"}, "usageHint": "body"}}}, {"id": "text_20", "component": {"Text": {"text": {"literalString": "Focus: Immerse yourself in the heart of the Roman Empire."}, "usageHint": "body"}}}, {"id": "text_21", "component": {"Text": {"text": {"literalString": "MORNING (8:00 AM - 1:00 PM)"}, "usageHint": "body"}}}, {"id": "text_22", "component": {"Text": {"text": {"literalString": "- (SIGHTSEEING) 8:00 AM: Start from your lodging near the Pantheon. Walk towards Piazza Venezia to see the Altare della Patria (Vittoriano). You can view it from the outside to save time and money.\n  - (WALKING) Pantheon to Piazza Venezia: Approx. 10 minutes.\n- (SIGHTSEEING) 8:30 AM: Walk along Via dei Fori Imperiali towards the Colosseum. This road is flanked by the ruins of ancient forums.\n- (SIGHTSEEING) 9:00 AM - 12:00 PM: **Colosseum, Roman Forum & Palatine Hill**.\n  - (TIP) Use your pre-booked 9:00 AM ticket for the Colosseum. The visit takes about 1.5 hours.\n  - After the Colosseum, your ticket gives you access to the adjacent Roman Forum and Palatine Hill. Allow at least 1.5 hours to explore these vast ruins. Start with Palatine Hill for great views over the Forum.\n  - (WALKING) Piazza Venezia to Colosseum: Approx. 15 minutes."}, "usageHint": "body"}}}, {"id": "text_23", "component": {"Text": {"text": {"literalString": "LUNCH (1:00 PM - 2:00 PM)"}, "usageHint": "body"}}}, {"id": "text_24", "component": {"Text": {"text": {"literalString": "- (FOOD) Avoid the restaurants directly facing the Colosseum. Walk a few blocks away towards the Monti or Celio neighborhoods for better value and quality."}, "usageHint": "body"}}}, {"id": "text_25", "component": {"Text": {"text": {"literalString": "EXAMPLE LUNCH OPTIONS (CARDS):\nOption 1: Pizza al Taglio | Forno da Milvio | Grab delicious, affordable pizza by the slice. | €10-€15\nOption 2: Quick Panini | La Prezzemolina | Fresh, made-to-order sandwiches perfect for a fast and tasty lunch. | €8-€12\nOption 3: Local Trattoria | Hostaria I Clementini | A short walk away for authentic Roman pasta if you want a sit-down meal. | €20-€25"}, "usageHint": "body"}}}, {"id": "text_26", "component": {"Text": {"text": {"literalString": "AFTERNOON (2:00 PM - 6:00 PM)"}, "usageHint": "body"}}}, {"id": "text_27", "component": {"Text": {"text": {"literalString": "- (WALKING) 2:00 PM: A gentle stroll past historical sites.\n  - Walk past the Circus Maximus, the ancient chariot racing stadium.\n  - Optional: See the Mouth of Truth (Bocca della Verità) at the nearby church. Expect a queue for photos.\n- (SIGHTSEEING) 4:00 PM: Climb Capitoline Hill.\n  - (TIP) Don't miss the free, spectacular panoramic view over the Roman Forum from the back of the main square (Piazza del Campidoglio), designed by Michelangelo. It's especially beautiful in the late afternoon light.\n  - (WALKING) Colosseum area to Capitoline Hill: Approx. 20 minutes."}, "usageHint": "body"}}}, {"id": "text_28", "component": {"Text": {"text": {"literalString": "EVENING (6:00 PM onwards)"}, "usageHint": "body"}}}, {"id": "text_29", "component": {"Text": {"text": {"literalString": "- (FOOD) 7:30 PM: Dinner in the Jewish Ghetto or near Campo de' Fiori, both known for fantastic Roman cuisine.\n- (SIGHTSEEING) 9:30 PM: **Trevi Fountain**.\n  - Walk from your dinner spot to the Trevi Fountain. It is famously crowded but magical when illuminated at night. Toss a coin to ensure your return to Rome.\n  - (WALKING) Capitoline Hill to Trevi Fountain: Approx. 15 minutes."}, "usageHint": "body"}}}, {"id": "text_30", "component": {"Text": {"text": {"literalString": "EXAMPLE DINNER OPTIONS (CARDS):\nOption 1: Roman-Jewish | Nonna Betta | Famous for artichokes \"alla giudia\" in the heart of the Jewish Ghetto. | €35-€45\nOption 2: Classic Pasta | Osteria da Fortunata | Near Campo de' Fiori, watch pasta being handmade in the window. | €30-€40\nOption 3: Budget Pizza | Emma Pizzeria | Excellent thin-crust Roman pizza in a stylish setting. | €25-€35"}, "usageHint": "body"}}}, {"id": "text_31", "component": {"Text": {"text": {"literalString": "---\nSECTION: ITINERARY DAY 2 (2024-09-16): VATICAN & RENAISSANCE WONDERS"}, "usageHint": "body"}}}, {"id": "text_32", "component": {"Text": {"text": {"literalString": "Focus: Art, architecture, and the splendor of Vatican City and Rome's famous piazzas."}, "usageHint": "body"}}}, {"id": "text_33", "component": {"Text": {"text": {"literalString": "MORNING (8:00 AM - 1:00 PM)"}, "usageHint": "body"}}}, {"id": "text_34", "component": {"Text": {"text": {"literalString": "- (WALKING) 8:00 AM: Walk from the Pantheon area across the Tiber River towards Vatican City.\n  - (WALKING) Pantheon to St. Peter's Square: Approx. 25-30 minutes.\n- (SIGHTSEEING) 8:30 AM - 12:30 PM: **Vatican Museums & Sistine Chapel**.\n  - Use your pre-booked 8:30 AM ticket to enter the museums.\n  - Follow the signs on the one-way route. Highlights include the Raphael Rooms, the Gallery of Maps, and the tour's finale, the Sistine Chapel.\n  - (TIP) The visit takes a minimum of 3-4 hours. Do not rush. Photography is forbidden inside the Sistine Chapel.\n- (SIGHTSEEING) 12:30 PM: **St. Peter's Basilica**.\n  - There is a special passage that sometimes connects the Sistine Chapel directly to St. Peter's Basilica, allowing you to bypass the main security line outside. Look for it. If it's closed, you'll have to exit the museums and queue for the Basilica (entry is free, but the security line can be long).\n  - (TIP) Dress code is strictly enforced: knees and shoulders must be covered for both men and women."}, "usageHint": "body"}}}, {"id": "text_35", "component": {"Text": {"text": {"literalString": "LUNCH (1:30 PM - 2:30 PM)"}, "usageHint": "body"}}}, {"id": "text_36", "component": {"Text": {"text": {"literalString": "- (FOOD) The area around the Vatican (Prati) has many great, non-touristy food options if you walk 5-10 minutes away from St. Peter's Square."}, "usageHint": "body"}}}, {"id": "text_37", "component": {"Text": {"text": {"literalString": "EXAMPLE LUNCH OPTIONS (CARDS):\nOption 1: Gourmet Street Food | Trapizzino | A unique pizza-pocket filled with classic Roman stews. | €10-€15\nOption 2: Roman Deli | Panificio Bonci | Legendary bakery offering incredible pizza by the slice and baked goods. | €15-€20\nOption 3: Local Favorite | Hostaria Dino e Toni | A no-frills, authentic Roman trattoria loved by locals. | €20-€25"}, "usageHint": "body"}}}, {"id": "text_38", "component": {"Text": {"text": {"literalString": "AFTERNOON (2:30 PM - 6:00 PM)"}, "usageHint": "body"}}}, {"id": "text_39", "component": {"Text": {"text": {"literalString": "- (WALKING) 2:30 PM: Walk from the Vatican back towards the city center via Ponte Sant'Angelo, the beautiful bridge lined with angel statues, with Castel Sant'Angelo guarding the entrance.\n- (SIGHTSEEING) 3:30 PM: **Piazza Navona**.\n  - Admire Bernini's Fountain of the Four Rivers in this stunning baroque square.\n- (SIGHTSEEING) 4:30 PM: **Pantheon**.\n  - Head to your \"home base.\" Now is the time to go inside. The visit itself is quick (20-30 minutes) but awe-inspiring. Remember the ~€5 entry fee.\n- (SIGHTSEEING) 5:30 PM: **Spanish Steps**.\n  - A short walk from the Pantheon. Climb the steps for a nice view and enjoy the bustling atmosphere of the luxury shopping streets below.\n  - (WALKING) Piazza Navona -> Pantheon -> Spanish Steps is a 15-20 minute walk in total."}, "usageHint": "body"}}}, {"id": "text_40", "component": {"Text": {"text": {"literalString": "EVENING (6:00 PM onwards)"}, "usageHint": "body"}}}, {"id": "text_41", "component": {"Text": {"text": {"literalString": "- (FOOD) 7:30 PM: For your final dinner, find a cozy spot near the Spanish Steps or head to the Trastevere neighborhood (a 25-min walk or short bus ride) for a charming, lively atmosphere.\n- (TIP) Enjoy a final evening passeggiata (stroll) through the illuminated streets before concluding your trip."}, "usageHint": "body"}}}, {"id": "text_42", "component": {"Text": {"text": {"literalString": "EXAMPLE DINNER OPTIONS (CARDS):\nOption 1: Trastevere Classic | Tonnarello | Extremely popular spot in Trastevere known for huge portions of classic pasta. | €30-€40\nOption 2: Near Spanish Steps | Ginger. Sapori e Salute | A healthier, modern option with fresh juices, salads, and gourmet dishes. | €40-€50\nOption 3: Hidden Gem | Armando al Pantheon | (Book far in advance) A Roman institution right by the Pantheon for an unforgettable final meal. | €50-€60"}, "usageHint": "body"}}}, {"id": "text_43", "component": {"Text": {"text": {"literalString": "---"}, "usageHint": "body"}}}, {"id": "text_44", "component": {"Text": {"text": {"literalString": "- Official Colosseum Ticket Vendor: https://www.coopculture.it/en/products/ticket-colosseum-roman-forum-palatine_24h/\n- Official Vatican Museums Tickets: https://tickets.museivaticani.va/home\n- Official Pantheon Information: https://www.pantheonroma.com/home/"}, "usageHint": "body"}}}]}}];

                  'object-position',
                  squareAirlineLogo ? 'center center' : 'left center',
                  'important'
                );
                img.style.display = 'block';
              }
            }
          }

          function enhanceCardDeckRows() {
            const rowHosts = collectHostsDeep(container, 'a2ui-row');
            const narrowViewport = window.innerWidth <= 980;
            for (const rowHost of rowHosts) {
              const children = getDirectElementChildren(rowHost);
              if (!children.length) {
                continue;
              }
              const allCards = children.every(
                (child) => child.tagName && child.tagName.toLowerCase() === 'a2ui-card'
              );
              if (!allCards || children.length < 2) {
                continue;
              }

              const section = rowHost.shadowRoot?.querySelector('section');
              if (!section) {
                continue;
              }

              section.style.display = 'grid';
              section.style.gridTemplateColumns = narrowViewport
                ? '1fr'
                : `repeat(${Math.min(3, children.length)}, minmax(0, 1fr))`;
              section.style.columnGap = '14px';
              section.style.rowGap = '14px';
              section.style.alignItems = 'stretch';
              section.style.padding = '0';
              section.style.margin = '0';

              for (const card of children) {
                card.style.width = '100%';
                card.style.minWidth = '0';
                card.style.maxWidth = 'none';
              }
            }
          }

          function styleTableCell(cellHost, isHeader, isLastCell) {
            if (!cellHost) {
              return;
            }
            cellHost.style.display = 'block';
            cellHost.style.padding = '11px 14px';
            cellHost.style.margin = '0';
            cellHost.style.minWidth = '0';
            cellHost.style.borderRight = isLastCell
              ? 'none'
              : '1px solid var(--oneui-color-outline-variant)';

            const textNode = cellHost.shadowRoot?.querySelector(
              'p, h1, h2, h3, h4, h5, h6'
            );
            if (textNode) {
              textNode.style.margin = '0';
              textNode.style.textAlign = 'left';
              textNode.style.wordBreak = 'break-word';
              if (isHeader) {
                textNode.style.fontWeight = '700';
                textNode.style.color = '#0f172a';
              } else {
                textNode.style.color = '#334155';
              }
            }
          }

          function styleTableRows(rows, dividerHosts) {
            if (!rows.length) {
              return;
            }
            const template = getGridTemplateFromWeights(rows[0]) || '1fr 1fr';
            rows.forEach((row, rowIndex) => {
              row.style.display = 'block';
              row.style.margin = '0';

              const section = row.shadowRoot?.querySelector('section');
              if (!section) {
                return;
              }

              section.style.display = 'grid';
              section.style.gridTemplateColumns = template;
              section.style.columnGap = '0';
              section.style.rowGap = '0';
              section.style.alignItems = 'stretch';
              section.style.padding = '0';
              section.style.margin = '0';
              section.style.borderBottom =
                rowIndex < rows.length - 1
                  ? '1px solid var(--oneui-color-outline-variant)'
                  : 'none';
              section.style.background =
                rowIndex === 0 ? '#eaf1fb' : '#ffffff';

              const cells = getDirectElementChildren(row);
              cells.forEach((cell, cellIndex) => {
                styleTableCell(cell, rowIndex === 0, cellIndex === cells.length - 1);
              });
            });

            for (const dividerHost of dividerHosts) {
              dividerHost.style.display = 'none';
            }
          }

          function enhanceTableLikeLists() {
            const listHosts = collectHostsDeep(container, 'a2ui-list');
            for (const listHost of listHosts) {
              const direction = String(
                listHost.direction || listHost.getAttribute('direction') || 'vertical'
              ).toLowerCase();
              if (direction !== 'vertical') {
                continue;
              }

              const rows = getDirectElementChildren(listHost).filter(
                (child) => child.tagName && child.tagName.toLowerCase() === 'a2ui-row'
              );
              if (rows.length < 2) {
                continue;
              }
              const cellCounts = rows.map(
                (row) => getDirectElementChildren(row).length
              );
              if (cellCounts.some((count) => count < 2)) {
                continue;
              }
              if (new Set(cellCounts).size !== 1) {
                continue;
              }

              listHost.classList.add('genui-table-list');
              listHost.style.border = '1px solid #d7e2f0';
              listHost.style.borderRadius = '14px';
              listHost.style.overflow = 'hidden';
              listHost.style.background = 'var(--oneui-color-surface)';
              listHost.style.boxShadow = '0 4px 12px rgba(15, 23, 42, 0.08)';

              styleTableRows(rows, []);
            }
          }

                    function enhanceTableLikeColumns() {
            const columnHosts = collectHostsDeep(container, 'a2ui-column');
            for (const columnHost of columnHosts) {
              const directChildren = getDirectElementChildren(columnHost);
              const groups = [];
              let currentRows = [];
              let currentDividers = [];

              const flushGroup = () => {
                if (currentRows.length > 0) {
                  groups.push({ rows: currentRows, dividers: currentDividers });
                }
                currentRows = [];
                currentDividers = [];
              };

              for (const child of directChildren) {
                const tag = child.tagName ? child.tagName.toLowerCase() : '';
                if (tag === 'a2ui-row') {
                  currentRows.push(child);
                  continue;
                }
                if (tag === 'a2ui-divider' && currentRows.length > 0) {
                  currentDividers.push(child);
                  continue;
                }
                flushGroup();
              }
              flushGroup();

              let styledAnyGroup = false;
              for (const group of groups) {
                const rows = group.rows;
                const dividers = group.dividers;
                if (rows.length < 2) {
                  continue;
                }

                const cellCounts = rows.map(
                  (row) => getDirectElementChildren(row).length
                );
                if (cellCounts.some((count) => count < 2)) {
                  continue;
                }
                if (new Set(cellCounts).size !== 1) {
                  continue;
                }

                const hasDividers = dividers.length > 0;
                const columnCount = cellCounts[0] || 0;
                if (!hasDividers) {
                  if (rows.length < 3 || columnCount < 3) {
                    continue;
                  }
                }

                styleTableRows(rows, hasDividers ? dividers : []);
                styledAnyGroup = true;
              }

              if (!styledAnyGroup) {
                continue;
              }

              columnHost.classList.add('genui-table-list');
              columnHost.style.border = '1px solid #d7e2f0';
              columnHost.style.borderRadius = '14px';
              columnHost.style.overflow = 'hidden';
              columnHost.style.background = 'var(--oneui-color-surface)';
              columnHost.style.boxShadow = '0 4px 12px rgba(15, 23, 42, 0.08)';
            }
          }

          function enhanceTableLayouts() {
            enhanceTableLikeLists();
            enhanceTableLikeColumns();
          }

          function pickMediaRailImageHost(children) {
            const listIndexes = [];
            const imageIndexes = [];
            for (let index = 0; index < children.length; index += 1) {
              const child = children[index];
              const tag = child.tagName ? child.tagName.toLowerCase() : '';
              if (
                tag === 'a2ui-list' &&
                child.style.display !== 'none' &&
                !child.classList.contains('genui-table-list')
              ) {
                listIndexes.push(index);
                continue;
              }
              if (
                tag === 'a2ui-image' &&
                child.style.display !== 'none' &&
                !isIconImageHost(child) &&
                !child.classList.contains('genui-image-missing-icon') &&
                !child.classList.contains('genui-image-unavailable')
              ) {
                imageIndexes.push(index);
              }
            }
            if (!listIndexes.length || !imageIndexes.length) {
              return null;
            }
            const anchor = listIndexes[0];
            let bestIndex = imageIndexes[0];
            let bestDistance = Math.abs(bestIndex - anchor);
            for (let i = 1; i < imageIndexes.length; i += 1) {
              const candidate = imageIndexes[i];
              const distance = Math.abs(candidate - anchor);
              if (distance < bestDistance) {
                bestIndex = candidate;
                bestDistance = distance;
              }
            }
            return children[bestIndex] || null;
          }

          function resetMediaRailStyles(columnHost, children) {
            const section = columnHost?.shadowRoot?.querySelector('section');
            if (section) {
              section.style.removeProperty('display');
              section.style.removeProperty('grid-template-columns');
              section.style.removeProperty('column-gap');
              section.style.removeProperty('row-gap');
              section.style.removeProperty('align-items');
            }
            for (const child of children) {
              child.style.removeProperty('grid-column');
              child.style.removeProperty('grid-row');
              child.style.removeProperty('align-self');
              child.style.removeProperty('justify-self');
              child.style.removeProperty('width');
              child.style.removeProperty('max-width');
            }
          }

          function enhanceMediaRails() {
            const columnHosts = collectHostsDeep(container, 'a2ui-column');
            const narrowViewport = window.innerWidth <= 920;
            for (const columnHost of columnHosts) {
              const directChildren = getDirectElementChildren(columnHost);
              columnHost.classList.remove('genui-media-rail');
              for (const child of directChildren) {
                child.classList.remove('genui-media-rail-main');
                child.classList.remove('genui-media-rail-media');
              }

              resetMediaRailStyles(columnHost, directChildren);

              if (
                narrowViewport ||
                !directChildren.length ||
                columnHost.classList.contains('genui-table-list')
              ) {
                continue;
              }

              let listHost = null;
              let listIndex = -1;
              for (let index = 0; index < directChildren.length; index += 1) {
                const child = directChildren[index];
                const tag = child.tagName ? child.tagName.toLowerCase() : '';
                if (
                  tag === 'a2ui-list' &&
                  child.style.display !== 'none' &&
                  !child.classList.contains('genui-table-list')
                ) {
                  listHost = child;
                  listIndex = index;
                  break;
                }
              }
              if (!listHost) {
                continue;
              }

              const mediaHost = pickMediaRailImageHost(directChildren);
              if (!mediaHost) {
                continue;
              }

              const section = columnHost.shadowRoot?.querySelector('section');
              if (!section) {
                continue;
              }

              section.style.display = 'grid';
              section.style.gridTemplateColumns = 'minmax(0, 1fr) minmax(220px, 320px)';
              section.style.columnGap = '16px';
              section.style.rowGap = '12px';
              section.style.alignItems = 'start';

              columnHost.classList.add('genui-media-rail');

              let row = 1;

              for (let index = 0; index < listIndex; index += 1) {
                const child = directChildren[index];
                if (child === mediaHost) {
                  continue;
                }
                child.classList.add('genui-media-rail-main');
                child.style.gridColumn = '1 / -1';
                child.style.gridRow = String(row);
                row += 1;
              }

              const railRow = row;
              row += 1;

              listHost.classList.add('genui-media-rail-main');
              listHost.style.gridColumn = '1';
              listHost.style.gridRow = String(railRow);
              listHost.style.minWidth = '0';
              listHost.style.alignSelf = 'start';

              mediaHost.classList.add('genui-media-rail-media');
              mediaHost.style.gridColumn = '2';
              mediaHost.style.gridRow = String(railRow);
              mediaHost.style.alignSelf = 'start';
              mediaHost.style.justifySelf = 'stretch';
              mediaHost.style.width = 'min(100%, 320px)';
              mediaHost.style.maxWidth = '320px';

              for (let index = listIndex + 1; index < directChildren.length; index += 1) {
                const child = directChildren[index];
                if (child === mediaHost) {
                  continue;
                }
                child.classList.add('genui-media-rail-main');
                child.style.gridColumn = '1 / -1';
                child.style.gridRow = String(row);
                row += 1;
              }
            }
          }

          function smoothCardCorners() {
            const cardHosts = collectHostsDeep(container, 'a2ui-card');
            for (const cardHost of cardHosts) {
              cardHost.style.borderRadius = '20px';
              cardHost.style.overflow = 'hidden';
              cardHost.style.backgroundClip = 'padding-box';
              cardHost.style.setProperty('-webkit-mask-image', '-webkit-radial-gradient(white, black)');

              const cardSection = cardHost.shadowRoot?.querySelector('section');
              if (!cardSection) {
                continue;
              }

              cardSection.style.borderRadius = '20px';
              cardSection.style.overflow = 'hidden';
              cardSection.style.backgroundClip = 'padding-box';
              cardSection.style.setProperty('-webkit-mask-image', '-webkit-radial-gradient(white, black)');
            }
          }
          async function renderMessages(payload, reset) {
            const messages = parseMessages(payload);
            if (!Array.isArray(messages)) {
              console.warn("GenUICraft payload was not an array", messages);
              return;
            }
            if (reset) {
              processor.clearSurfaces();
            }
            processor.processMessages(messages);
            renderSurfaces();
            // Let custom elements and nested shadow DOM settle before image checks.
            await new Promise((resolve) =>
              requestAnimationFrame(() => requestAnimationFrame(resolve))
            );
            enhanceButtons();
            enhanceTableLayouts();
            enhanceCardDeckRows();
            smoothCardCorners();
            await markMissingImages();
            normalizeIconImageSizing();
            enhanceMediaRails();
            await new Promise((resolve) => setTimeout(resolve, 180));
            enhanceButtons();
            enhanceTableLayouts();
            enhanceCardDeckRows();
            smoothCardCorners();
            await markMissingImages();
            normalizeIconImageSizing();
            enhanceMediaRails();
            window.__GenUICraft_RENDER_DONE = true;
          }

          window.renderA2uiMessages = renderMessages;
          window.GenUICraft_READY = true;

          const queued = window.__GenUICraft_QUEUE || [];
          window.__GenUICraft_QUEUE = [];
          for (const item of queued) {
            await renderMessages(item.payload, item.reset);
          }

          if (window.__GenUICraft_MESSAGES__) {
            await renderMessages(window.__GenUICraft_MESSAGES__, window.__GenUICraft_RESET__);
          }
        } catch (err) {
          console.error("Failed to load GenUICraft Lit renderer", err);
          const assetDiagnostics = await collectAssetDiagnostics();
          const details = `${formatErrorDetails(err)}\n\n${assetDiagnostics}`;
          setStatus("Lit renderer failed to load.", details);
        }
      }

      init();
    </script>
  </body>
</html>

            for (const [surfaceId, surface] of processor.getSurfaces()) {
              const el = document.createElement("a2ui-surface");
              el.surfaceId = surfaceId;
              el.surface = surface;
              el.processor = processor;
              container.appendChild(el);
            }
          }

          const unavailableImageHashSet = new Set([
            // Placeholder PNG that renders: "The image you are requesting does not exist..."
            "9b5936f4006146e4e1e9025b474c02863c0b5614132ad40db4b925a10e8bfbb9"
          ]);
          const unavailableImageCache = new Map();

          async function sha256Hex(arrayBuffer) {
            const digest = await crypto.subtle.digest("SHA-256", arrayBuffer);
            const bytes = new Uint8Array(digest);
            return Array.from(bytes)
              .map((b) => b.toString(16).padStart(2, "0"))
              .join("");
          }

          async function isUnavailablePlaceholderFromUrl(src) {
            if (!src || typeof src !== "string" || src.startsWith("data:")) {
              return false;
            }
            if (unavailableImageCache.has(src)) {
              return unavailableImageCache.get(src);
            }
            const checkPromise = (async () => {
              try {
                const response = await fetch(src, { cache: "force-cache" });
                if (!response.ok) {
                  return false;
                }
                const body = await response.arrayBuffer();
                // Fast guard for tiny placeholder images.
                if (body.byteLength > 8192) {
                  return false;
                }
                const hash = await sha256Hex(body);
                return unavailableImageHashSet.has(hash);
              } catch (_err) {
                return false;
              }
            })();
            unavailableImageCache.set(src, checkPromise);
            return checkPromise;
          }

          function waitForImageSettle(img, timeoutMs) {
            if (!img || img.complete) {
              return Promise.resolve();
            }
            return new Promise((resolve) => {
              let done = false;
              const finish = () => {
                if (done) {
                  return;
                }
                done = true;
                resolve();
              };
              img.addEventListener("load", finish, { once: true });
              img.addEventListener("error", finish, { once: true });
              setTimeout(finish, timeoutMs);
            });
          }

          function collectImageHostsDeep(rootNode) {
            const results = [];
            const stack = [rootNode];
            while (stack.length) {
              const node = stack.pop();
              if (!node) {
                continue;
              }
              if (node.nodeType === Node.ELEMENT_NODE) {
                const el = node;
                if (el.tagName && el.tagName.toLowerCase() === "a2ui-image") {
                  results.push(el);
                }
                if (el.shadowRoot) {
                  stack.push(el.shadowRoot);
                }
                if (el.children && el.children.length) {
                  for (let i = 0; i < el.children.length; i += 1) {
                    stack.push(el.children[i]);
                  }
                }
              } else if (node instanceof ShadowRoot || node instanceof DocumentFragment) {
                if (node.children && node.children.length) {
                  for (let i = 0; i < node.children.length; i += 1) {
                    stack.push(node.children[i]);
                  }
                }
              }
            }
            return results;
          }

          async function markMissingImages() {
            const hosts = collectImageHostsDeep(container);
            await Promise.all(
              hosts.map(async (host) => {
                const sr = host.shadowRoot;
                if (!sr) {
                  return;
                }
                let missing = false;
                const srText = (sr.textContent || "").trim();
                if (
                  srText === "(empty)" ||
                  srText === "(no model)" ||
                  srText === "Invalid image URL"
                ) {
                  missing = true;
                }
                if (
                  /image you are requesting/i.test(srText) &&
                  /does not exist|no longer available/i.test(srText)
                ) {
                  host.dataset.genuiImageUnavailable = "1";
                }

                const imgs = Array.from(sr.querySelectorAll("img"));
                if (imgs.length) {
                  await Promise.all(
                    imgs.map(async (img) => {
                      await waitForImageSettle(img, 1200);
                      if (!img.naturalWidth || !img.naturalHeight) {
                        img.style.display = "none";
                        host.dataset.genuiImageBroken = "1";
                        return;
                      }
                      const src = img.currentSrc || img.src || "";
                      if (await isUnavailablePlaceholderFromUrl(src)) {
                        img.style.display = "none";
                        host.dataset.genuiImageUnavailable = "1";
                      }
                    })
                  );
                }

                const unavailablePlaceholder = host.dataset.genuiImageUnavailable === "1";
                const broken = host.dataset.genuiImageBroken === "1";
                const usageHint = String(
                  host.usageHint || host.getAttribute("usage-hint") || ""
                ).toLowerCase();
                const isIconHint = usageHint === "icon";

                if (isIconHint) {
                  host.classList.add("genui-image-missing-icon");
                  host.classList.remove("genui-image-missing");
                  host.classList.remove("genui-image-unavailable");
                  host.style.display = "none";
                  delete host.dataset.genuiImageBroken;
                  delete host.dataset.genuiImageUnavailable;
                  return;
                }

                if (unavailablePlaceholder) {
                  host.classList.add("genui-image-unavailable");
                  host.classList.remove("genui-image-missing");
                  host.classList.remove("genui-image-missing-icon");
                  host.style.display = "none";
                  delete host.dataset.genuiImageBroken;
                  return;
                }

                if (missing || broken) {
                  host.classList.add("genui-image-missing");
                  host.classList.remove("genui-image-missing-icon");
                  host.classList.remove("genui-image-unavailable");
                  host.style.display = "";
                } else if (!sr.querySelector("img")) {
                  host.classList.remove("genui-image-missing");
                  host.classList.remove("genui-image-missing-icon");
                  host.classList.remove("genui-image-unavailable");
                  host.style.display = "";
                  delete host.dataset.genuiImageBroken;
                  delete host.dataset.genuiImageUnavailable;
                } else {
                  host.classList.remove("genui-image-missing");
                  host.classList.remove("genui-image-missing-icon");
                  host.classList.remove("genui-image-unavailable");
                  host.style.display = "";
                  delete host.dataset.genuiImageBroken;
                  delete host.dataset.genuiImageUnavailable;
                }
              })
            );
          }

          function collectHostsDeep(rootNode, tagNameLower) {
            const results = [];
            const stack = [rootNode];
            while (stack.length) {
              const node = stack.pop();
              if (!node) {
                continue;
              }
              if (node.nodeType === Node.ELEMENT_NODE) {
                const el = node;
                if (el.tagName && el.tagName.toLowerCase() === tagNameLower) {
                  results.push(el);
                }
                if (el.shadowRoot) {
                  stack.push(el.shadowRoot);
                }
                if (el.children && el.children.length) {
                  for (let i = 0; i < el.children.length; i += 1) {
                    stack.push(el.children[i]);
                  }
                }
              } else if (node instanceof ShadowRoot || node instanceof DocumentFragment) {
                if (node.children && node.children.length) {
                  for (let i = 0; i < node.children.length; i += 1) {
                    stack.push(node.children[i]);
                  }
                }
              }
            }
            return results;
          }

          function getDirectElementChildren(host) {
            if (!host || !host.children) {
              return [];
            }
            return Array.from(host.children).filter(
              (child) => child && child.nodeType === Node.ELEMENT_NODE
            );
          }

          function parseHostWeight(host) {
            const styleWeight = Number(
              String(host?.style?.getPropertyValue('--weight') || '').trim()
            );
            if (Number.isFinite(styleWeight) && styleWeight > 0) {
              return styleWeight;
            }

            const weightRaw =
              host?.component?.properties?.weight ??
              host?.component?.weight ??
              host?.getAttribute('weight');
            const parsed = Number(weightRaw);
            if (Number.isFinite(parsed) && parsed > 0) {
              return parsed;
            }
            return 1;
          }

          function getGridTemplateFromWeights(rowHost) {
            const cells = getDirectElementChildren(rowHost);
            const weights = cells.map((cell) => parseHostWeight(cell));
            return weights.map((weight) => `${weight}fr`).join(' ');
          }

          function isBorderlessButtonHost(host) {
            const variant = String(
              host?.component?.properties?.variant ??
                host?.component?.variant ??
                host?.getAttribute('variant') ??
                ''
            ).toLowerCase();
            return variant === 'borderless';
          }

          function attachPressAnimation(buttonEl) {
            if (!buttonEl || buttonEl.dataset.genuiEnhancedPress === '1') {
              return;
            }

            const restore = () => {
              buttonEl.style.transform = 'translateZ(0)';
              buttonEl.style.filter = '';
            };

            buttonEl.addEventListener('pointerdown', () => {
              buttonEl.style.transform = 'translateZ(0) scale(0.98)';
              buttonEl.style.filter = 'brightness(0.95)';
            });
            buttonEl.addEventListener('pointerup', restore);
            buttonEl.addEventListener('pointerleave', restore);
            buttonEl.addEventListener('pointercancel', restore);
            buttonEl.dataset.genuiEnhancedPress = '1';
          }

          function enhanceButtons() {
            const buttonHosts = collectHostsDeep(container, 'a2ui-button');
            for (const host of buttonHosts) {
              const button = host.shadowRoot?.querySelector('button');
              if (!button) {
                continue;
              }

              button.style.cursor = 'pointer';
              button.style.transition =
                'transform 120ms ease, box-shadow 180ms ease, filter 120ms ease, background-color 120ms ease';
              button.style.transform = 'translateZ(0)';
              button.style.userSelect = 'none';
              button.style.touchAction = 'manipulation';
              attachPressAnimation(button);

              if (isBorderlessButtonHost(host)) {
                host.classList.add('genui-button-borderless');
                button.style.background = 'transparent';
                button.style.border = 'none';
                button.style.boxShadow = 'none';
                button.style.padding = '0';
                button.style.minHeight = 'auto';
                button.style.borderRadius = '0';
                button.style.justifyContent = 'flex-start';
                button.style.color = 'var(--oneui-color-primary)';
                button.style.setProperty(
                  '--oneui-color-on-surface',
                  'var(--oneui-color-primary)'
                );
                button.style.setProperty(
                  '--oneui-color-on-surface-variant',
                  'var(--oneui-color-primary)'
                );
              } else {
                host.classList.remove('genui-button-borderless');
                button.style.setProperty(
                  '--oneui-color-on-surface',
                  'var(--oneui-color-on-primary)'
                );
                button.style.setProperty(
                  '--oneui-color-on-surface-variant',
                  'var(--oneui-color-on-primary)'
                );
              }
            }
          }

          function styleTableCell(cellHost, isHeader, isLastCell) {
            if (!cellHost) {
              return;
            }
            cellHost.style.display = 'block';
            cellHost.style.padding = '10px 12px';
            cellHost.style.margin = '0';
            cellHost.style.minWidth = '0';
            cellHost.style.borderRight = isLastCell
              ? 'none'
              : '1px solid var(--oneui-color-outline-variant)';

            const textNode = cellHost.shadowRoot?.querySelector(
              'p, h1, h2, h3, h4, h5, h6'
            );
            if (textNode) {
              textNode.style.margin = '0';
              textNode.style.textAlign = 'left';
              textNode.style.wordBreak = 'break-word';
              if (isHeader) {
                textNode.style.fontWeight = '700';
              }
            }
          }

          function styleTableRows(rows, dividerHosts) {
            if (!rows.length) {
              return;
            }
            const template = getGridTemplateFromWeights(rows[0]) || '1fr 1fr';
            rows.forEach((row, rowIndex) => {
              row.style.display = 'block';
              row.style.margin = '0';

              const section = row.shadowRoot?.querySelector('section');
              if (!section) {
                return;
              }

              section.style.display = 'grid';
              section.style.gridTemplateColumns = template;
              section.style.columnGap = '0';
              section.style.rowGap = '0';
              section.style.alignItems = 'stretch';
              section.style.padding = '0';
              section.style.margin = '0';
              section.style.borderBottom =
                rowIndex < rows.length - 1
                  ? '1px solid var(--oneui-color-outline-variant)'
                  : 'none';
              section.style.background =
                rowIndex === 0 ? '#f1f5f9' : '#ffffff';

              const cells = getDirectElementChildren(row);
              cells.forEach((cell, cellIndex) => {
                styleTableCell(cell, rowIndex === 0, cellIndex === cells.length - 1);
              });
            });

            for (const dividerHost of dividerHosts) {
              dividerHost.style.display = 'none';
            }
          }

          function enhanceTableLikeLists() {
            const listHosts = collectHostsDeep(container, 'a2ui-list');
            for (const listHost of listHosts) {
              const direction = String(
                listHost.direction || listHost.getAttribute('direction') || 'vertical'
              ).toLowerCase();
              if (direction !== 'vertical') {
                continue;
              }

              const rows = getDirectElementChildren(listHost).filter(
                (child) => child.tagName && child.tagName.toLowerCase() === 'a2ui-row'
              );
              if (rows.length < 2) {
                continue;
              }
              const cellCounts = rows.map(
                (row) => getDirectElementChildren(row).length
              );
              if (cellCounts.some((count) => count < 2)) {
                continue;
              }
              if (new Set(cellCounts).size !== 1) {
                continue;
              }

              listHost.classList.add('genui-table-list');
              listHost.style.border = '1px solid #e2e8f0';
              listHost.style.borderRadius = '12px';
              listHost.style.overflow = 'hidden';
              listHost.style.background = 'var(--oneui-color-surface)';
              listHost.style.boxShadow = '0 2px 8px rgba(15, 23, 42, 0.08)';

              styleTableRows(rows, []);
            }
          }

                    function enhanceTableLikeColumns() {
            const columnHosts = collectHostsDeep(container, 'a2ui-column');
            for (const columnHost of columnHosts) {
              const directChildren = getDirectElementChildren(columnHost);
              const groups = [];
              let currentRows = [];
              let currentDividers = [];

              const flushGroup = () => {
                if (currentRows.length > 0) {
                  groups.push({ rows: currentRows, dividers: currentDividers });
                }
                currentRows = [];
                currentDividers = [];
              };

              for (const child of directChildren) {
                const tag = child.tagName ? child.tagName.toLowerCase() : '';
                if (tag === 'a2ui-row') {
                  currentRows.push(child);
                  continue;
                }
                if (tag === 'a2ui-divider' && currentRows.length > 0) {
                  currentDividers.push(child);
                  continue;
                }
                flushGroup();
              }
              flushGroup();

              let styledAnyGroup = false;
              for (const group of groups) {
                const rows = group.rows;
                const dividers = group.dividers;
                if (rows.length < 2 || dividers.length < 1) {
                  continue;
                }

                const cellCounts = rows.map(
                  (row) => getDirectElementChildren(row).length
                );
                if (cellCounts.some((count) => count < 2)) {
                  continue;
                }
                if (new Set(cellCounts).size !== 1) {
                  continue;
                }

                styleTableRows(rows, dividers);
                styledAnyGroup = true;
              }

              if (!styledAnyGroup) {
                continue;
              }

              columnHost.classList.add('genui-table-list');
              columnHost.style.border = '1px solid #e2e8f0';
              columnHost.style.borderRadius = '12px';
              columnHost.style.overflow = 'hidden';
              columnHost.style.background = 'var(--oneui-color-surface)';
              columnHost.style.boxShadow = '0 2px 8px rgba(15, 23, 42, 0.08)';
            }
          }

          function enhanceTableLayouts() {
            enhanceTableLikeLists();
            enhanceTableLikeColumns();
          }
          async function renderMessages(payload, reset) {
            const messages = parseMessages(payload);
            if (!Array.isArray(messages)) {
              console.warn("GenUICraft payload was not an array", messages);
              return;
            }
            if (reset) {
              processor.clearSurfaces();
            }
            processor.processMessages(messages);
            renderSurfaces();
            // Let custom elements and nested shadow DOM settle before image checks.
            await new Promise((resolve) =>
              requestAnimationFrame(() => requestAnimationFrame(resolve))
            );
            enhanceButtons();
            enhanceTableLayouts();
            await markMissingImages();
            await new Promise((resolve) => setTimeout(resolve, 180));
            enhanceButtons();
            enhanceTableLayouts();
            await markMissingImages();
            window.__GenUICraft_RENDER_DONE = true;
          }

          window.renderA2uiMessages = renderMessages;
          window.GenUICraft_READY = true;

          const queued = window.__GenUICraft_QUEUE || [];
          window.__GenUICraft_QUEUE = [];
          for (const item of queued) {
            await renderMessages(item.payload, item.reset);
          }

          if (window.__GenUICraft_MESSAGES__) {
            await renderMessages(window.__GenUICraft_MESSAGES__, window.__GenUICraft_RESET__);
          }
        } catch (err) {
          console.error("Failed to load GenUICraft Lit renderer", err);
          setStatus("Lit renderer failed to load.");
        }
      }

      init();
    </script>
  </body>
</html>

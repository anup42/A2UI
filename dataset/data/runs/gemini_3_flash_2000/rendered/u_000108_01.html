urvivability.\n- Strength: 12 (+1) - Useful for athletics and carrying capacity.\n- Charisma: 10 (+0) - Neutral social capability.\n- Intelligence: 8 (-1) - Your lowest stat; you rely on intuition over book learning."}, "usageHint": "body"}}}, {"id": "text_7", "component": {"Text": {"text": {"literalString": "Starting Equipment Checklist\n- Leather Armor (Armor Class 11 + Dex modifier)\n- Two Shortswords (for close-quarters combat)\n- A Longbow and a quiver of 20 arrows (your primary weapon)\n- An Explorer's Pack (includes bedroll, rations, rope, and torches)\n- Herbalism Kit (from background)"}, "usageHint": "body"}}}, {"id": "btn_label_8", "component": {"Text": {"text": {"literalString": "View Ranger Spells (Unlocked at Level 2)"}, "usageHint": "body"}}}, {"id": "btn_8", "component": {"Button": {"child": "btn_label_8", "action": {"name": "openUrl", "context": [{"key": "url", "value": {"literalString": "https://www.dndbeyond.com/spells/class/ranger"}}]}, "primary": true}}}, {"id": "text_9", "component": {"Text": {"text": {"literalString": "[Button: Official Character Sheet PDF] /assets/r_000108_01_1_5E_CharacterSheet_Fillable.pdf"}, "usageHint": "body"}}}, {"id": "icon_img_10", "component": {"Image": {"url": {"literalString": "https://img.icons8.com/ios/50/000000/bow-and-arrow.png"}, "usageHint": "icon"}}}, {"id": "icon_label_10", "component": {"Text": {"text": {"literalString": "Combat"}, "usageHint": "body"}}}, {"id": "icon_row_10", "component": {"Row": {"children": {"explicitList": ["icon_img_10", "icon_label_10"]}, "alignment": "center"}}}, {"id": "text_11", "component": {"Text": {"text": {"literalString": "- Nature: /assets/r_000108_01_3_deciduous-tree.png"}, "usageHint": "body"}}}, {"id": "icon_img_12", "component": {"Image": {"url": {"literalString": "https://img.icons8.com/ios/50/000000/clandestine.png"}, "usageHint": "icon"}}}, {"id": "icon_label_12", "component": {"Text": {"text": {"literalString": "Stealth"}, "usageHint": "body"}}}, {"id": "icon_row_12",     <script type="module">
      const container = document.getElementById("surfaces");
      const assetBase = new URL("../../../../renderer/lit/", window.location.href).href;

      function setStatus(message) {
        container.innerHTML = "";
        const note = document.createElement("div");
        note.textContent = message;
        note.style.padding = "16px";
        note.style.color = "#b00020";
        note.style.fontSize = "14px";
        container.appendChild(note);
      }

      function parseMessages(payload) {
        return typeof payload === "string" ? JSON.parse(payload) : payload;
      }

      function createDefaultTheme() {

            ol: emptyList,
            li: emptyList,
            a: emptyList,
            strong: emptyList,
            em: emptyList

        };

        try {
          const libUrl = new URL("vendor/a2ui/index.js", assetBase);
          const uiUrl = new URL("vendor/a2ui/0.8/ui/ui.js", assetBase);

            container.innerHTML = "";
            for (const [surfaceId, surface] of processor.getSurfaces()) {

              el.surfaceId = surfaceId;
              el.surface = surface;
              el.processor = processor;
              container.appendChild(el);
            }
          }

            const messages = parseMessages(payload);
            if (!Array.isArray(messages)) {
              console.warn("GenUICraft payload was not an array", messages);
              return;

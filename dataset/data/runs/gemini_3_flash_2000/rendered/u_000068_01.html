text": {"literalString": "1. Verify Service Health and Readiness Probes\nCheck if the backend application process is actually running and healthy. In containerized environments like Kubernetes, verify that the pod status is Running and that Readiness Probes are not failing. If a probe fails, the load balancer will stop sending traffic to that instance, resulting in a 503 error for any existing or misrouted requests."}, "usageHint": "body"}}}, {"id": "text_8", "component": {"Text": {"text": {"literalString": "2. Check Network Connectivity and Firewall Rules\nEnsure there is a clear network path between the proxy and the upstream service. Verify that the security groups, firewalls, or Network Policies allow traffic on the specific port the application is listening on. A common cause is a mismatch between the port the proxy is sending traffic to and the port the application is actually using."}, "usageHint": "body"}}}, {"id": "text_9", "component": {"Text": {"text": {"literalString": "3. Analyze Application Logs and Resource Constraints\nExamine the backend application logs for signs of crashing, segmentation faults, or Out of Memory (OOM) errors. If the application is overwhelmed by requests, it may reach its connection limit and begin dropping new connections immediately. Check CPU and memory metrics to ensure the service is not being throttled by the host."}, "usageHint": "body"}}}, {"id": "text_10", "component": {"Text": {"text": {"literalString": "COMPARISON OF COMMON CAUSES\nError Sub-type | Primary Cause | Recommended Tool\nConnection Timeout | Network congestion or firewall | ping / traceroute\nConnection Refused | Service is down or wrong port | telnet / nc\nReset before headers | App crash or timeout settings | Application logs"}, "usageHint": "body"}}}, {"id": "btn_label_11", "component": {"Text": {"text": {"literalString": "Envoy Troubleshooting Guide"}, "usageHint": "body"}}}, {"id": "btn_11", "component": {"Button": {"child": "btn_label_11", "action": {"n     <script type="module">
      const container = document.getElementById("surfaces");
      const assetBase = new URL("../../../../renderer/lit/", window.location.href).href;

      function setStatus(message) {
        container.innerHTML = "";
        const note = document.createElement("div");
        note.textContent = message;
        note.style.padding = "16px";
        note.style.color = "#b00020";
        note.style.fontSize = "14px";
        container.appendChild(note);
      }

      function parseMessages(payload) {
        return typeof payload === "string" ? JSON.parse(payload) : payload;
      }

      function createDefaultTheme() {
        const empty = {};
        const emptyList = [];
        return {
          components: {
            AudioPlayer: empty,
            Button: empty,
            Card: empty,
            Column: empty,
            CheckBox: { container: empty, element: empty, label: empty },
            DateTimeInput: { container: empty, element: empty, label: empty },
            Divider: empty,
            Image: {

              icon: empty,
              avatar: empty,
              smallFeature: empty,
              mediumFeature: empty,
              largeFeature: empty,
              header: empty
            },
            Icon: empty,
            List: empty,
            Modal: { backdrop: empty, element: empty },
            MultipleChoice: { container: empty, element: empty, label: empty },
            Row: empty,
            Slider: { container: empty, element: empty, label: empty },
            Tabs: { container: empty, element: empty, controls: { all: empty, selected: empty } },
            Text: {
              all: empty,
              h1: empty,
              h2: empty,
              h3: empty,
              h4: empty,
              h5: empty,
              caption: empty,
              body: empty
            },
            TextField: { container: empty, element: empty, label: empty },
            Video: empty
          },
          elements: {
            a: empty,
            audio: empty,
            body: empty,
            button: empty,
            h1: empty,
            h2: empty,
            h3: empty,
            h4: empty,
            h5: empty,
            iframe: empty,
            input: empty,
            p: empty,
            pre: empty,
            textarea: empty,
            video: empty
          },
          markdown: {
            p: emptyList,
            h1: emptyList,
            h2: emptyList,
            h3: emptyList,
            h4: emptyList,
            h5: emptyList,
            ul: emptyList,
            ol: emptyList,
            li: emptyList,
            a: emptyList,
            strong: emptyList,
            em: emptyList
          }
        };
      }

      async function init() {
        try {
          const libUrl = new URL("vendor/a2ui/index.js", assetBase);
          const uiUrl = new URL("vendor/a2ui/0.8/ui/ui.js", assetBase);
          const { v0_8 } = await import(libUrl.href);
          await import(uiUrl.href);
          const theme = createDefaultTheme();
          window.addEventListener("context-request", (event) => {
            const contextKey = event.context ?? event.detail?.context;
            if (
              contextKey !== v0_8.UI.Context.themeContext &&
              contextKey !== "GenUICraftTheme"
            ) {
              return;
            }
            event.stopPropagation();
            const callback = event.callback ?? event.detail?.callback;
            if (typeof callback === "function") {
              callback(theme);
            }
          });

          const processor = v0_8.Data.createSignalA2uiMessageProcessor
            ? v0_8.Data.createSignalA2uiMessageProcessor()
            : new v0_8.Data.A2uiMessageProcessor();

          function renderSurfaces() {
            container.innerHTML = "";
            for (const [surfaceId, surface] of processor.getSurfaces()) {
              const el = document.createElement("a2ui-surface");
              el.surfaceId = surfaceId;
              el.surface = surface;
              el.processor = processor;
              container.appendChild(el);
            }
          }

          function renderMessages(payload, reset) {
            const messages = parseMessages(payload);
            if (!Array.isArray(messages)) {
              console.warn("GenUICraft payload was not an array", messages);
              return;
            }
            if (reset) {
              processor.clearSurfaces();
            }
            processor.processMessages(messages);
            renderSurfaces();
            window.__GenUICraft_RENDER_DONE = true;
          }

          window.renderA2uiMessages = renderMessages;
          window.GenUICraft_READY = true;

          const queued = window.__GenUICraft_QUEUE || [];
          window.__GenUICraft_QUEUE = [];
          queued.forEach((item) => renderMessages(item.payload, item.reset));

          if (window.__GenUICraft_MESSAGES__) {
            renderMessages(window.__GenUICraft_MESSAGES__, window.__GenUICraft_RESET__);
          }
        } catch (err) {
          console.error("Failed to load GenUICraft Lit renderer", err);
          setStatus("Lit renderer failed to load.");
        }
      }

      init();

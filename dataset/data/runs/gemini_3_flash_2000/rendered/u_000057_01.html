: Kyoto Sightseeing Pass | 1-day bus and subway pass | 1,100 JPY | https://www.city.kyoto.lg.jp"}, "usageHint": "body"}}}, {"id": "text_5", "component": {"Text": {"text": {"literalString": "ITINERARY SUMMARY TABLE\nDay | Area | Primary Theme | Key Photo Spot\nDay 1 | Arashiyama | Nature and Zen | Bamboo Grove & River Bridge\nDay 2 | Higashiyama | Historic Streets | Kiyomizu-dera Stage\nDay 3 | Northern Kyoto | Icons and Color | Golden Pavilion & Eikando"}, "usageHint": "body"}}}, {"id": "text_6", "component": {"Text": {"text": {"literalString": "DAY 1: ARASHIYAMA (WESTERN KYOTO)\n- Sight 1: Sagano Bamboo Grove. Arrive by 7:30 AM to capture the towering stalks without crowds. The morning light filtering through the green is perfect for photography.\n- Sight 2: Tenryu-ji Temple. A UNESCO site with a 14th-century garden. In November, the surrounding mountains provide a stunning autumn backdrop to the Sogenchi Pond.\n- Sight 3: Otagi Nenbutsu-ji. A 15-minute bus ride or 25-minute walk from the center. It features 1,200 unique stone statues and is much quieter than the main grove, offering intimate photo opportunities.\n- Lunch Recommendation: Yudofu Sagano. Traditional boiled tofu served in a beautiful garden setting. Located near Tenryu-ji."}, "usageHint": "body"}}}, {"id": "text_7", "component": {"Text": {"text": {"literalString": "DAY 2: HIGASHIYAMA (EASTERN KYOTO)\n- Sight 1: Kiyomizu-dera. Famous for its massive wooden stage. The temple is surrounded by hundreds of maple trees that turn vibrant red in mid-November.\n- Sight 2: Sannenzaka and Ninenzaka Slopes. Preserved streets with traditional wooden buildings. Ideal for \"old Japan\" street photography.\n- Sight 3: Kodai-ji Temple. Known for its Zen gardens and bamboo grove. In the evening, they often host a spectacular autumn light-up and projection mapping.\n- Lunch Recommendation: Omen Ginkakuji (Pontocho branch or main). Famous for thick udon noodles served with seasonal Kyoto vegetables."}, "usageHint": "body"}}}, {"id": "text_8", "component": {"Text": {"text": {"literalString": "DAY 3: NORTHERN AND CENTRAL KYOTO\n- Sight 1: Kinkaku-ji (The Golden Pavilion). The gold leaf reflects brilliantly against the autumn colors and the surrounding pond. Best photographed in the morning light.\n- Sight 2: Ryoan-ji Temple. Home to Japan's most famous rock garden. The contrast of the minimalist stones against the fiery maple leaves over the wall is a classic shot.\n- Sight 3: Eikando Zenrin-ji. Widely considered the best spot in Kyoto for autumn colors. The grounds feature a pond, a pagoda, and over 3,000 maple trees.\n- Lunch Recommendation: Nishiki Market. Known as \"Kyoto's Kitchen.\" Explore dozens of stalls for fresh seafood, pickled vegetables, and street food like takotago (octopus)."}, "usageHint": "body"}}}, {"id": "btn_label_9", "component": {"Text": {"text": {"literalString": "View Live Foliage Map"}, "usageHint": "body"}}}, {"id": "btn_9", "component": {"Button": {"child": "btn_label_9", "action": {"name": "openUrl", "context": [{"key": "url", "value": {"literalString": "https://www.kyokanko.or.jp/koyo/"}}]}, "primary": true}}}, {"id": "btn_label_10", "component": {"Text": {"text": {"literalString": "Book Kyoto Photo Tour"}, "usageHint": "body"}}}, {"id": "btn_10", "component": {"Button": {"child": "btn_label_10", "action": {"name": "openUrl", "context": [{"key": "url", "value": {"literalString": "https://www.viator.com/Kyoto/d332-ttd"}}]}, "primary": true}}}, {"id": "btn_label_11", "component": {"Text": {"text": {"literalString": "Reserve Shinkansen Tickets"}, "usageHint": "body"}}}, {"id": "btn_11", "component": {"Button": {"child": "btn_label_11", "action": {"name": "openUrl", "context": [{"key": "url", "value": {"literalString": "https://smart-ex.jp/en/index.php"}}]}, "primary": true}}}, {"id": "text_12", "component": {"Text": {"text": {"literalString": "- Arashiyama Bamboo Grove: /assets/r_000057_01_1_photo-1493976040374-85c8e12f0c0e.jpg"}, "usageHint": "body"}}}, {

y shorter than Java. Java requires explicit block delimiters and semicolons, leading to more boilerplate code for simple tasks like printing to the console or defining a class."}, "usageHint": "body"}}}, {"id": "text_6", "component": {"Text": {"text": {"literalString": "2. Dynamic vs. Static Typing\nIn Python, variables are labels for objects, and types are determined at runtime. You do not need to declare a variable's type. In Java, types must be explicitly declared (or inferred via \"var\" in modern versions) and are checked at compile time. This makes Java generally safer for large-scale refactoring, while Python allows for faster prototyping."}, "usageHint": "body"}}}, {"id": "text_7", "component": {"Text": {"text": {"literalString": "3. Memory Management Architecture\nWhile both use automatic garbage collection, their implementations differ. Python primarily uses reference counting, where an object is deallocated as soon as its reference count hits zero, supplemented by a cyclic garbage collector. Java relies on sophisticated generational garbage collection algorithms that move objects between \"young\" and \"old\" memory generations to optimize performance for long-running server applications."}, "usageHint": "body"}}}, {"id": "text_8", "component": {"Text": {"text": {"literalString": "4. Pure Object-Orientation vs. Primitives\nIn Python, everything is an object, including integers, strings, and even functions. This allows for high levels of introspection. Java maintains a distinction between primitive types (like int, boolean, char) and objects (Integer, Boolean, String) for the sake of memory efficiency and performance, though \"autoboxing\" helps bridge the gap."}, "usageHint": "body"}}}, {"id": "text_9", "component": {"Text": {"text": {"literalString": "5. Interpreted vs. JIT Compilation\nPython is typically executed by the CPython interpreter, which translates source code into bytecode and executes it immediately. Java code is compiled into bytecode by \"     <script type="module">
      const container = document.getElementById("surfaces");
      const assetBase = new URL("../../../../renderer/lit/", window.location.href).href;

      function setStatus(message) {
        container.innerHTML = "";
        const note = document.createElement("div");
        note.textContent = message;
        note.style.padding = "16px";
        note.style.color = "#b00020";
        note.style.fontSize = "14px";
        container.appendChild(note);
      }

      function parseMessages(payload) {
        return typeof payload === "string" ? JSON.parse(payload) : payload;
      }

            ul: emptyList,
            ol: emptyList,
            li: emptyList,

            em: emptyList

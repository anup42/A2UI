 Fretboard Navigation\nHendrix was famous for his \"thumb-over-neck\" technique. Because he had exceptionally large hands, he used his thumb to play bass notes on the low E string, freeing up his other fingers to play fluid R&B-style fills and double-stops (influenced by Curtis Mayfield). Clapton utilized a more traditional, \"textbook\" hand position. His signature technical trait is his vibrato—a fast, precise, and consistent shimmer that mimics a human voice, which earned him the nickname \"Slowhand\" for his deceptive ease."}, "usageHint": "body"}}}, {"id": "text_6", "component": {"Text": {"text": {"literalString": "2. Sonic Texture: Feedback vs. Purity\nHendrix viewed the guitar as a sound-generation tool rather than just a stringed instrument. He pioneered the use of controlled feedback and the whammy bar to create \"non-musical\" sounds that simulated bombs, screams, or sirens. Clapton, by contrast, sought a \"pure\" and vocal-like lead tone. During his Cream years, he perfected the \"Woman Tone,\" a thick, creamy overdriven sound achieved by using the bridge humbucker with the guitar's tone knob turned all the way down, focusing on sustain rather than sonic chaos."}, "usageHint": "body"}}}, {"id": "text_7", "component": {"Text": {"text": {"literalString": "3. Rhythmic Philosophy\nHendrix blurred the lines between rhythm and lead guitar. In a power trio format, he would play chords and lead lines simultaneously, filling the sonic space with \"double-stops\" and hammer-ons. Clapton’s approach was more compartmentalized. He followed a traditional blues-rock structure where rhythm parts were distinct and repetitive, providing a solid foundation for his solos, which were constructed as logical, melodic narratives with a clear beginning, middle, and end."}, "usageHint": "body"}}}, {"id": "btn_label_8", "component": {"Text": {"text": {"literalString": "Watch Hendrix Live at Woodstock"}, "usageHint": "body"}}}, {"id": "btn_8", "component": {"Button": {"child": "btn_

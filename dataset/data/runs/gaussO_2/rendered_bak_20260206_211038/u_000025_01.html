    <script>
      window.__GenUICraft_MESSAGES__ = [{"beginRendering": {"root": "root", "surfaceId": "gatsby_guide"}}, {"surfaceUpdate": {"surfaceId": "gatsby_guide", "components": [{"id": "root", "component": {"Column": {"children": {"explicitList": ["summaryHeader", "summaryText", "plotHeader", "plotText", "questionsHeader", "questionsList", "playlistHeader", "playlistList"]}}}}, {"id": "summaryHeader", "component": {"Text": {"text": {"literalString": "SUMMARY"}, "usageHint": "h3"}}}, {"id": "summaryText", "component": {"Text": {"text": {"literalString": "This guide provides a structured approach to discussing F. Scott Fitzgerald's masterpiece, focusing on the decay of the American Dream and the power of symbols."}, "usageHint": "body"}}}, {"id": "plotHeader", "component": {"Text": {"text": {"literalString": "PLOT SUMMARY"}, "usageHint": "h3"}}}, {"id": "plotText", "component": {"Text": {"text": {"literalString": "Set in the summer of 1922, the story follows Nick Carraway, who moves to Long Island and becomes entangled in the life of his mysterious neighbor, Jay Gatsby. Gatsby is a self-made millionaire obsessed with reuniting with his former flame, Daisy Buchanan, who is married to the wealthy but unfaithful Tom. As Gatsby uses his lavish parties to draw Daisy in, the facade of his wealth and the purity of his dream begin to crumble. The narrative explores themes of social stratification and the moral void of the Jazz Age, culminating in a series of tragic events that reveal the hollowness of the upper class and the impossibility of recapturing the past."}, "usageHint": "body"}}}, {"id": "questionsHeader", "component": {"Text": {"text": {"literalString": "DISCUSSION QUESTIONS"}, "usageHint": "h3"}}}, {"id": "questionsList", "component": {"List": {"children": {"explicitList": ["question1", "question2", "question3", "question4", "question5"]}, "direction": "vertical"}}}, {"id": "question1", "component": {"Text": {"text": {"literalString": "1. How does Gatsby’s pursuit of the American Dream differ from the reality of the social class he tries to join?"}, "usageHint": "body"}}}, {"id": "question2", "component": {"Text": {"text": {"literalString": "2. What does the 'Green Light' at the end of Daisy’s dock represent at the beginning versus the end of the novel?"}, "usageHint": "body"}}}, {"id": "question3", "component": {"Text": {"text": {"literalString": "3. Analyze the Valley of Ashes: How does it serve as a symbolic contrast to East and West Egg?"}, "usageHint": "body"}}}, {"id": "question4", "component": {"Text": {"text": {"literalString": "4. Do any characters in the book truly achieve 'The American Dream', or is it depicted as an inherent illusion?"}, "usageHint": "body"}}}, {"id": "question5", "component": {"Text": {"text": {"literalString": "5. How does the recurring motif of 'The Eyes of Doctor T.J. Eckleburg' function as a commentary on the characters' morality?"}, "usageHint": "body"}}}, {"id": "playlistHeader", "component": {"Text": {"text": {"literalString": "BACKGROUND JAZZ PLAYLIST"}, "usageHint": "h3"}}}, {"id": "playlistList", "component": {"List": {"children": {"explicitList": ["song1", "song2", "song3"]}, "direction": "vertical"}}}, {"id": "song1", "component": {"Text": {"text": {"literalString": "- Rhapsody in Blue by George Gershwin (1924)"}, "usageHint": "body"}}}, {"id": "song2", "component": {"Text": {"text": {"literalString": "- West End Blues by Louis Armstrong (1928)"}, "usageHint": "body"}}}, {"id": "song3", "component": {"Text": {"text": {"literalString": "- The Charleston by James P. Johnson (1923)"}, "usageHint": "body"}}}]}}];
      window.__GenUICraft_RESET__ = true;

    <script type="module">
      const container = document.getElementById("surfaces");
      const assetBase = new URL("../../../../renderer/lit/", window.location.href).href;

      function setStatus(message) {
        container.innerHTML = "";
        const note = document.createElement("div");
        note.textContent = message;
        note.style.padding = "16px";
        note.style.color = "#b00020";
        note.style.fontSize = "14px";
        container.appendChild(note);
      }

      function parseMessages(payload) {
        return typeof payload === "string" ? JSON.parse(payload) : payload;
      }

      function createDefaultTheme() {
        const empty = {};
        const emptyList = [];
        return {
          components: {
            AudioPlayer: empty,
            Button: empty,
            Card: empty,
            Column: empty,
            CheckBox: { container: empty, element: empty, label: empty },
            DateTimeInput: { container: empty, element: empty, label: empty },
            Divider: empty,
            Image: {
              all: empty,
              icon: empty,
              avatar: empty,
              smallFeature: empty,
              mediumFeature: empty,
              largeFeature: empty,
              header: empty
            },
            Icon: empty,
            List: empty,
            Modal: { backdrop: empty, element: empty },
            MultipleChoice: { container: empty, element: empty, label: empty },
            Row: empty,
            Slider: { container: empty, element: empty, label: empty },
            Tabs: { container: empty, element: empty, controls: { all: empty, selected: empty } },
            Text: {
              all: empty,
              h1: empty,
              h2: empty,
              h3: empty,
              h4: empty,
              h5: empty,
              caption: empty,
              body: empty
            },
            TextField: { container: empty, element: empty, label: empty },
            Video: empty
          },
          elements: {
            a: empty,
            audio: empty,
            body: empty,
            button: empty,
            h1: empty,
            h2: empty,
            h3: empty,
            h4: empty,
            h5: empty,
            iframe: empty,
            input: empty,
            p: empty,
            pre: empty,
            textarea: empty,
            video: empty
          },
          markdown: {
            p: emptyList,
            h1: emptyList,
            h2: emptyList,
            h3: emptyList,
            h4: emptyList,
            h5: emptyList,
            ul: emptyList,
            ol: emptyList,
            li: emptyList,
            a: emptyList,
            strong: emptyList,
            em: emptyList
          }
        };
      }

      async function init() {
        try {
          const libUrl = new URL("vendor/a2ui/index.js", assetBase);
          const uiUrl = new URL("vendor/a2ui/0.8/ui/ui.js", assetBase);
          const { v0_8 } = await import(libUrl.href);
          await import(uiUrl.href);
          const theme = createDefaultTheme();
          window.addEventListener("context-request", (event) => {
            const contextKey = event.context ?? event.detail?.context;
            if (
              contextKey !== v0_8.UI.Context.themeContext &&
              contextKey !== "GenUICraftTheme"
            ) {
              return;
            }
            event.stopPropagation();
            const callback = event.callback ?? event.detail?.callback;
            if (typeof callback === "function") {
              callback(theme);
            }
          });

          const processor = v0_8.Data.createSignalA2uiMessageProcessor
            ? v0_8.Data.createSignalA2uiMessageProcessor()
            : new v0_8.Data.A2uiMessageProcessor();

          function renderSurfaces() {
            container.innerHTML = "";
            for (const [surfaceId, surface] of processor.getSurfaces()) {
              const el = document.createElement("a2ui-surface");
              el.surfaceId = surfaceId;
              el.surface = surface;
              el.processor = processor;
              container.appendChild(el);
            }
          }

          function renderMessages(payload, reset) {
            const messages = parseMessages(payload);
            if (!Array.isArray(messages)) {
              console.warn("GenUICraft payload was not an array", messages);
              return;
            }
            if (reset) {
              processor.clearSurfaces();
            }
            processor.processMessages(messages);
            renderSurfaces();
            window.__GenUICraft_RENDER_DONE = true;
          }

          window.renderA2uiMessages = renderMessages;
          window.GenUICraft_READY = true;

          const queued = window.__GenUICraft_QUEUE || [];
          window.__GenUICraft_QUEUE = [];
          queued.forEach((item) => renderMessages(item.payload, item.reset));

          if (window.__GenUICraft_MESSAGES__) {
            renderMessages(window.__GenUICraft_MESSAGES__, window.__GenUICraft_RESET__);
          }
        } catch (err) {
          console.error("Failed to load GenUICraft Lit renderer", err);
          setStatus("Lit renderer failed to load.");
        }
      }

      init();
    </script>

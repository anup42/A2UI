    <script>
      window.__GenUICraft_MESSAGES__ = [{"beginRendering": {"root": "root", "surfaceId": "datavizpro_guide"}}, {"surfaceUpdate": {"surfaceId": "datavizpro_guide", "components": [{"id": "root", "component": {"Column": {"children": {"explicitList": ["title", "installation_section", "quickstart_section", "function_docs_section", "quick_actions"]}}}}, {"id": "title", "component": {"Text": {"text": {"literalString": "DataVizPro: Getting Started Guide"}, "usageHint": "h1"}}}, {"id": "installation_section", "component": {"Column": {"children": {"explicitList": ["installation_title", "installation_text"]}}}}, {"id": "installation_title", "component": {"Text": {"text": {"literalString": "1. Installation"}, "usageHint": "h2"}}}, {"id": "installation_text", "component": {"Text": {"text": {"literalString": "Install the library via pip using the command line:\npip install datavizpro"}, "usageHint": "body"}}}, {"id": "quickstart_section", "component": {"Column": {"children": {"explicitList": ["quickstart_title", "quickstart_text", "code_example"]}}}}, {"id": "quickstart_title", "component": {"Text": {"text": {"literalString": "2. Quick Start Example"}, "usageHint": "h2"}}}, {"id": "quickstart_text", "component": {"Text": {"text": {"literalString": "Create a simple line chart with the following code snippet:"}, "usageHint": "body"}}}, {"id": "code_example", "component": {"Text": {"text": {"literalString": "import datavizpro as dvp\n\ndata = [10, 25, 15, 30, 45]\ndvp.plot_line(data)\ndvp.save_plot(filename='my_chart.png', dpi=300)"}, "usageHint": "caption"}}}, {"id": "function_docs_section", "component": {"Column": {"children": {"explicitList": ["function_docs_title", "function_docs_table"]}}}}, {"id": "function_docs_title", "component": {"Text": {"text": {"literalString": "3. Function Documentation: save_plot()"}, "usageHint": "h2"}}}, {"id": "function_docs_table", "component": {"Text": {"text": {"literalString": "Saves the current visualization to a file.\n\nParameter | Type | Description\nfilename | String | The name of the file (e.g., 'chart.png').\ndpi | Integer | Resolution in dots per inch (default is 100).\nformat | String | File format: 'png', 'pdf', or 'svg'."}, "usageHint": "body"}}}, {"id": "quick_actions", "component": {"Row": {"children": {"explicitList": ["view_docs_button", "github_repo_button"]}, "distribution": "spaceBetween"}}}, {"id": "view_docs_button", "component": {"Button": {"child": "view_docs_text", "action": {"name": "openUrl", "context": [{"key": "url", "value": {"literalString": "https://datavizpro.example.com/docs"}}]}}}}, {"id": "view_docs_text", "component": {"Text": {"text": {"literalString": "View Full Docs"}, "usageHint": "body"}}}, {"id": "github_repo_button", "component": {"Button": {"child": "github_repo_text", "action": {"name": "openUrl", "context": [{"key": "url", "value": {"literalString": "https://github.com/example/datavizpro"}}]}}}}, {"id": "github_repo_text", "component": {"Text": {"text": {"literalString": "GitHub Repository"}, "usageHint": "body"}}}]}}];
      window.__GenUICraft_RESET__ = true;
      window.__GenUICraft_QUEUE = [];

    <script type="module">
      const container = document.getElementById("surfaces");
      const assetBase = new URL("../../../../renderer/lit/", window.location.href).href;

      function setStatus(message) {
        container.innerHTML = "";
        const note = document.createElement("div");
        note.textContent = message;
        note.style.padding = "16px";
        note.style.color = "#b00020";
        note.style.fontSize = "14px";
        container.appendChild(note);
      }

      function parseMessages(payload) {
        return typeof payload === "string" ? JSON.parse(payload) : payload;
      }

      function createDefaultTheme() {
        const empty = {};
        const emptyList = [];
        return {
          components: {
            AudioPlayer: empty,
            Button: empty,
            Card: empty,
            Column: empty,
            CheckBox: { container: empty, element: empty, label: empty },
            DateTimeInput: { container: empty, element: empty, label: empty },
            Divider: empty,
            Image: {
              all: empty,
              icon: empty,
              avatar: empty,
              smallFeature: empty,
              mediumFeature: empty,
              largeFeature: empty,
              header: empty
            },
            Icon: empty,
            List: empty,
            Modal: { backdrop: empty, element: empty },
            MultipleChoice: { container: empty, element: empty, label: empty },
            Row: empty,
            Slider: { container: empty, element: empty, label: empty },
            Tabs: { container: empty, element: empty, controls: { all: empty, selected: empty } },
            Text: {
              all: empty,
              h1: empty,
              h2: empty,
              h3: empty,
              h4: empty,
              h5: empty,
              caption: empty,
              body: empty
            },
            TextField: { container: empty, element: empty, label: empty },
            Video: empty
          },
          elements: {
            a: empty,
            audio: empty,
            body: empty,
            button: empty,
            h1: empty,
            h2: empty,
            h3: empty,
            h4: empty,
            h5: empty,
            iframe: empty,
            input: empty,
            p: empty,
            pre: empty,
            textarea: empty,
            video: empty
          },
          markdown: {
            p: emptyList,
            h1: emptyList,
            h2: emptyList,
            h3: emptyList,
            h4: emptyList,
            h5: emptyList,
            ul: emptyList,
            ol: emptyList,
            li: emptyList,
            a: emptyList,
            strong: emptyList,
            em: emptyList
          }
        };
      }

      async function init() {
        try {
          const libUrl = new URL("vendor/a2ui/index.js", assetBase);
          const uiUrl = new URL("vendor/a2ui/0.8/ui/ui.js", assetBase);
          const { v0_8 } = await import(libUrl.href);
          await import(uiUrl.href);
          const theme = createDefaultTheme();
          window.addEventListener("context-request", (event) => {
            const contextKey = event.context ?? event.detail?.context;
            if (
              contextKey !== v0_8.UI.Context.themeContext &&
              contextKey !== "GenUICraftTheme"
            ) {
              return;
            }
            event.stopPropagation();
            const callback = event.callback ?? event.detail?.callback;
            if (typeof callback === "function") {
              callback(theme);
            }
          });

          const processor = v0_8.Data.createSignalA2uiMessageProcessor
            ? v0_8.Data.createSignalA2uiMessageProcessor()
            : new v0_8.Data.A2uiMessageProcessor();

          function renderSurfaces() {
            container.innerHTML = "";
            for (const [surfaceId, surface] of processor.getSurfaces()) {
              const el = document.createElement("a2ui-surface");
              el.surfaceId = surfaceId;
              el.surface = surface;
              el.processor = processor;
              container.appendChild(el);
            }
          }

          function renderMessages(payload, reset) {
            const messages = parseMessages(payload);
            if (!Array.isArray(messages)) {
              console.warn("GenUICraft payload was not an array", messages);
              return;
            }
            if (reset) {
              processor.clearSurfaces();
            }
            processor.processMessages(messages);
            renderSurfaces();
            window.__GenUICraft_RENDER_DONE = true;
          }

          window.renderA2uiMessages = renderMessages;
          window.GenUICraft_READY = true;

          const queued = window.__GenUICraft_QUEUE || [];
          window.__GenUICraft_QUEUE = [];
          queued.forEach((item) => renderMessages(item.payload, item.reset));

          if (window.__GenUICraft_MESSAGES__) {
            renderMessages(window.__GenUICraft_MESSAGES__, window.__GenUICraft_RESET__);
          }
        } catch (err) {
          console.error("Failed to load GenUICraft Lit renderer", err);
          setStatus("Lit renderer failed to load.");
        }
      }

      init();
    </script>
  </body>

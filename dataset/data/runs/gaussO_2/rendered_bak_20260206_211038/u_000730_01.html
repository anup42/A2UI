    <script>
      window.__GenUICraft_MESSAGES__ = [{"beginRendering": {"root": "root", "surfaceId": "animalFarmSummary"}}, {"surfaceUpdate": {"surfaceId": "animalFarmSummary", "components": [{"id": "root", "component": {"Column": {"children": {"explicitList": ["title", "paragraph1", "paragraph2", "paragraph3", "historicalFiguresTitle", "historicalFiguresList"]}}}}, {"id": "title", "component": {"Text": {"text": {"literalString": "Plot Summary of 'Animal Farm'"}, "usageHint": "h2"}}}, {"id": "paragraph1", "component": {"Text": {"text": {"literalString": "The story begins on Manor Farm, where the animals, led by Old Major the pig, revolt against their neglectful human farmer, Mr. Jones. They establish 'Animalism,' a philosophy of equality, and rename the farm 'Animal Farm.' Initially, the animals thrive, working together and following the Seven Commandments, with the most important being 'All animals are equal.'"}, "usageHint": "body"}}}, {"id": "paragraph2", "component": {"Text": {"text": {"literalString": "Power struggles soon emerge between two pigs, Napoleon and Snowball. Napoleon eventually uses a pack of fierce dogs to drive Snowball away and takes total control. Under Napoleon's leadership, the farm becomes increasingly oppressive. The pigs begin to take on human characteristics, living in the farmhouse, drinking alcohol, and changing the commandments to justify their special privileges."}, "usageHint": "body"}}}, {"id": "paragraph3", "component": {"Text": {"text": {"literalString": "As years pass, the pigs become indistinguishable from the humans they once overthrew. The original dream of equality is completely dead, replaced by the final, single commandment: 'All animals are equal, but some animals are more equal than others.' The animals realize that their new masters are just as tyrannical as the old ones."}, "usageHint": "body"}}}, {"id": "historicalFiguresTitle", "component": {"Text": {"text": {"literalString": "Historical Figures and Groups"}, "usageHint": "h3"}}}, {"id": "historicalFiguresList", "component": {"List": {"children": {"explicitList": ["figure1", "figure2", "figure3", "figure4", "figure5"]}, "direction": "vertical"}}}, {"id": "figure1", "component": {"Text": {"text": {"literalString": "1. Old Major represents Karl Marx and Vladimir Lenin. He provides the original revolutionary vision and the intellectual framework for the uprising."}, "usageHint": "body"}}}, {"id": "figure2", "component": {"Text": {"text": {"literalString": "2. Napoleon represents Joseph Stalin. He is the brutal dictator who uses force and manipulation to consolidate power and eliminate his rivals."}, "usageHint": "body"}}}, {"id": "figure3", "component": {"Text": {"text": {"literalString": "3. Snowball represents Leon Trotsky. He is the intellectual leader who is exiled by Napoleon and later used as a scapegoat for the farm's failures."}, "usageHint": "body"}}}, {"id": "figure4", "component": {"Text": {"text": {"literalString": "4. Boxer (the horse) represents the Russian Working Class (Proletariat). He is hardworking and loyal but ultimately betrayed by the leadership he trusted."}, "usageHint": "body"}}}, {"id": "figure5", "component": {"Text": {"text": {"literalString": "5. Mr. Jones represents Tsar Nicholas II. He is the incompetent monarch whose negligence and cruelty sparked the revolution in the first place."}, "usageHint": "body"}}}]}}];
      window.__GenUICraft_RESET__ = true;

    <script type="module">
      const container = document.getElementById("surfaces");
      const assetBase = new URL("../../../../renderer/lit/", window.location.href).href;

      function setStatus(message) {
        container.innerHTML = "";
        const note = document.createElement("div");
        note.textContent = message;
        note.style.padding = "16px";
        note.style.color = "#b00020";
        note.style.fontSize = "14px";
        container.appendChild(note);
      }

      function parseMessages(payload) {
        return typeof payload === "string" ? JSON.parse(payload) : payload;
      }

      function createDefaultTheme() {
        const empty = {};
        const emptyList = [];
        return {
          components: {
            AudioPlayer: empty,
            Button: empty,
            Card: empty,
            Column: empty,
            CheckBox: { container: empty, element: empty, label: empty },
            DateTimeInput: { container: empty, element: empty, label: empty },
            Divider: empty,
            Image: {
              all: empty,
              icon: empty,
              avatar: empty,
              smallFeature: empty,
              mediumFeature: empty,
              largeFeature: empty,
              header: empty
            },
            Icon: empty,
            List: empty,
            Modal: { backdrop: empty, element: empty },
            MultipleChoice: { container: empty, element: empty, label: empty },
            Row: empty,
            Slider: { container: empty, element: empty, label: empty },
            Tabs: { container: empty, element: empty, controls: { all: empty, selected: empty } },
            Text: {
              all: empty,
              h1: empty,
              h2: empty,
              h3: empty,
              h4: empty,
              h5: empty,
              caption: empty,
              body: empty
            },
            TextField: { container: empty, element: empty, label: empty },
            Video: empty
          },
          elements: {
            a: empty,
            audio: empty,
            body: empty,
            button: empty,
            h1: empty,
            h2: empty,
            h3: empty,
            h4: empty,
            h5: empty,
            iframe: empty,
            input: empty,
            p: empty,
            pre: empty,
            textarea: empty,
            video: empty
          },
          markdown: {
            p: emptyList,
            h1: emptyList,
            h2: emptyList,
            h3: emptyList,
            h4: emptyList,
            h5: emptyList,
            ul: emptyList,
            ol: emptyList,
            li: emptyList,
            a: emptyList,
            strong: emptyList,
            em: emptyList
          }
        };
      }

      async function init() {
        try {
          const libUrl = new URL("vendor/a2ui/index.js", assetBase);
          const uiUrl = new URL("vendor/a2ui/0.8/ui/ui.js", assetBase);
          const { v0_8 } = await import(libUrl.href);
          await import(uiUrl.href);
          const theme = createDefaultTheme();
          window.addEventListener("context-request", (event) => {
            const contextKey = event.context ?? event.detail?.context;
            if (
              contextKey !== v0_8.UI.Context.themeContext &&
              contextKey !== "GenUICraftTheme"
            ) {
              return;
            }
            event.stopPropagation();
            const callback = event.callback ?? event.detail?.callback;
            if (typeof callback === "function") {
              callback(theme);
            }
          });

          const processor = v0_8.Data.createSignalA2uiMessageProcessor
            ? v0_8.Data.createSignalA2uiMessageProcessor()
            : new v0_8.Data.A2uiMessageProcessor();

          function renderSurfaces() {
            container.innerHTML = "";
            for (const [surfaceId, surface] of processor.getSurfaces()) {
              const el = document.createElement("a2ui-surface");
              el.surfaceId = surfaceId;
              el.surface = surface;
              el.processor = processor;
              container.appendChild(el);
            }
          }

          function renderMessages(payload, reset) {
            const messages = parseMessages(payload);
            if (!Array.isArray(messages)) {
              console.warn("GenUICraft payload was not an array", messages);
              return;
            }
            if (reset) {
              processor.clearSurfaces();
            }
            processor.processMessages(messages);
            renderSurfaces();
            window.__GenUICraft_RENDER_DONE = true;
          }

          window.renderA2uiMessages = renderMessages;
          window.GenUICraft_READY = true;

          const queued = window.__GenUICraft_QUEUE || [];
          window.__GenUICraft_QUEUE = [];
          queued.forEach((item) => renderMessages(item.payload, item.reset));

          if (window.__GenUICraft_MESSAGES__) {
            renderMessages(window.__GenUICraft_MESSAGES__, window.__GenUICraft_RESET__);
          }
        } catch (err) {
          console.error("Failed to load GenUICraft Lit renderer", err);
          setStatus("Lit renderer failed to load.");
        }
      }

      init();
    </script>

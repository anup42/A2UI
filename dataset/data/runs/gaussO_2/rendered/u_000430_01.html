    <script>
      window.__GenUICraft_MESSAGES__ = [{"beginRendering": {"root": "root", "surfaceId": "errorDbSurface"}}, {"surfaceUpdate": {"surfaceId": "errorDbSurface", "components": [{"id": "root", "component": {"Column": {"children": {"explicitList": ["titleText", "summaryText", "divider1", "flowchartTitle", "step1", "step2", "step3", "step4", "step5", "divider2", "quickActionsTitle", "debugButton"]}}}}, {"id": "titleText", "component": {"Text": {"text": {"literalString": "Error Establishing a Database Connection"}, "usageHint": "h2"}}}, {"id": "summaryText", "component": {"Text": {"text": {"literalString": "The 'Error Establishing a Database Connection' typically means WordPress cannot communicate with your MySQL database due to incorrect credentials or a server failure."}, "usageHint": "body"}}}, {"id": "divider1", "component": {"Divider": {}}}, {"id": "flowchartTitle", "component": {"Text": {"text": {"literalString": "Troubleshooting Flowchart:"}, "usageHint": "h3"}}}, {"id": "step1", "component": {"Text": {"text": {"literalString": "1. Verify wp-config.php Credentials\n   - Access your site via FTP/SFTP or File Manager.\n   - Open wp-config.php and check these four lines:\n     DB_NAME (Database Name)\n     DB_USER (Username)\n     DB_PASSWORD (Password)\n     DB_HOST (Usually 'localhost', but sometimes an IP provided by the host)"}, "usageHint": "body"}}}, {"id": "step2", "component": {"Text": {"text": {"literalString": "2. Test Database Connection with a Script\n   - Create a file named testdb.php in your root directory with a simple PHP mysqli_connect script. If it fails, the credentials in Step 1 are definitely wrong."}, "usageHint": "body"}}}, {"id": "step3", "component": {"Text": {"text": {"literalString": "3. Check MySQL Service Status\n   - If you have access to the server (VPS/Dedicated), run: service mysql status or service mariadb status.\n   - If it is stopped, run: sudo service mysql start."}, "usageHint": "body"}}}, {"id": "step4", "component": {"Text": {"text": {"literalString": "4. Repair the Database\n   - Add define('WP_ALLOW_REPAIR', true); to your wp-config.php file.\n   - Visit: yoursite.com/wp-admin/maint/repair.php."}, "usageHint": "body"}}}, {"id": "step5", "component": {"Text": {"text": {"literalString": "5. Contact Hosting Provider\n   - If steps 1-4 fail, the database server may be down or your account may have hit its resource limits."}, "usageHint": "body"}}}, {"id": "divider2", "component": {"Divider": {}}}, {"id": "quickActionsTitle", "component": {"Text": {"text": {"literalString": "Quick Actions:"}, "usageHint": "h3"}}}, {"id": "debugButton", "component": {"Button": {"child": "debugButtonText", "action": {"name": "openUrl", "context": [{"key": "url", "value": {"literalString": "https://wordpress.org/documentation/article/debugging-in-wordpress/"}}]}, "primary": true}}}, {"id": "debugButtonText", "component": {"Text": {"text": {"literalString": "WordPress Debugging Guide"}, "usageHint": "body"}}}]}}];
      window.__GenUICraft_RESET__ = true;
      window.__GenUICraft_QUEUE = [];

    <script type="module">
      const container = document.getElementById("surfaces");
      const assetBase = new URL("../../../../renderer/lit/", window.location.href).href;

      function setStatus(message) {
        container.innerHTML = "";
        const note = document.createElement("div");
        note.textContent = message;
        note.style.padding = "16px";
        note.style.color = "#b00020";
        note.style.fontSize = "14px";
        container.appendChild(note);
      }

      function parseMessages(payload) {
        return typeof payload === "string" ? JSON.parse(payload) : payload;
      }

      function createDefaultTheme() {
        const empty = {};
        const emptyList = [];
        return {
          components: {
            AudioPlayer: empty,
            Button: empty,
            Card: empty,
            Column: empty,
            CheckBox: { container: empty, element: empty, label: empty },
            DateTimeInput: { container: empty, element: empty, label: empty },
            Divider: empty,
            Image: {
              all: empty,
              icon: empty,
              avatar: empty,
              smallFeature: empty,
              mediumFeature: empty,
              largeFeature: empty,
              header: empty
            },
            Icon: empty,
            List: empty,
            Modal: { backdrop: empty, element: empty },
            MultipleChoice: { container: empty, element: empty, label: empty },
            Row: empty,
            Slider: { container: empty, element: empty, label: empty },
            Tabs: { container: empty, element: empty, controls: { all: empty, selected: empty } },
            Text: {
              all: empty,
              h1: empty,
              h2: empty,
              h3: empty,
              h4: empty,
              h5: empty,
              caption: empty,
              body: empty
            },
            TextField: { container: empty, element: empty, label: empty },
            Video: empty
          },
          elements: {
            a: empty,
            audio: empty,
            body: empty,
            button: empty,
            h1: empty,
            h2: empty,
            h3: empty,
            h4: empty,
            h5: empty,
            iframe: empty,
            input: empty,
            p: empty,
            pre: empty,
            textarea: empty,
            video: empty
          },
          markdown: {
            p: emptyList,
            h1: emptyList,
            h2: emptyList,
            h3: emptyList,
            h4: emptyList,
            h5: emptyList,
            ul: emptyList,
            ol: emptyList,
            li: emptyList,
            a: emptyList,
            strong: emptyList,
            em: emptyList
          }
        };
      }

      async function init() {
        try {
          const libUrl = new URL("vendor/a2ui/index.js", assetBase);
          const uiUrl = new URL("vendor/a2ui/0.8/ui/ui.js", assetBase);
          const { v0_8 } = await import(libUrl.href);
          await import(uiUrl.href);
          const theme = createDefaultTheme();
          window.addEventListener("context-request", (event) => {
            const contextKey = event.context ?? event.detail?.context;
            if (
              contextKey !== v0_8.UI.Context.themeContext &&
              contextKey !== "GenUICraftTheme"
            ) {
              return;
            }
            event.stopPropagation();
            const callback = event.callback ?? event.detail?.callback;
            if (typeof callback === "function") {
              callback(theme);
            }
          });

          const processor = v0_8.Data.createSignalA2uiMessageProcessor
            ? v0_8.Data.createSignalA2uiMessageProcessor()
            : new v0_8.Data.A2uiMessageProcessor();

          function renderSurfaces() {
            container.innerHTML = "";
            for (const [surfaceId, surface] of processor.getSurfaces()) {
              const el = document.createElement("a2ui-surface");
              el.surfaceId = surfaceId;
              el.surface = surface;
              el.processor = processor;
              container.appendChild(el);
            }
          }

          function renderMessages(payload, reset) {
            const messages = parseMessages(payload);
            if (!Array.isArray(messages)) {
              console.warn("GenUICraft payload was not an array", messages);
              return;
            }
            if (reset) {
              processor.clearSurfaces();
            }
            processor.processMessages(messages);
            renderSurfaces();
            window.__GenUICraft_RENDER_DONE = true;
          }

          window.renderA2uiMessages = renderMessages;
          window.GenUICraft_READY = true;

          const queued = window.__GenUICraft_QUEUE || [];
          window.__GenUICraft_QUEUE = [];
          queued.forEach((item) => renderMessages(item.payload, item.reset));

          if (window.__GenUICraft_MESSAGES__) {
            renderMessages(window.__GenUICraft_MESSAGES__, window.__GenUICraft_RESET__);
          }
        } catch (err) {
          console.error("Failed to load GenUICraft Lit renderer", err);
          setStatus("Lit renderer failed to load.");
        }
      }

      init();
    </script>
  </body>
</html>

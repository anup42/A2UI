    <script>
      window.__GenUICraft_MESSAGES__ = [{"beginRendering": {"root": "root", "surfaceId": "philipsHueResetGuide"}}, {"surfaceUpdate": {"surfaceId": "philipsHueResetGuide", "components": [{"id": "root", "component": {"Column": {"children": {"explicitList": ["title", "summary", "resetProcedureTitle", "resetProcedureList", "consequencesTitle", "consequencesList"]}}}}, {"id": "title", "component": {"Text": {"text": {"literalString": "Philips Hue Bridge Factory Reset Guide"}, "usageHint": "h2"}}}, {"id": "summary", "component": {"Text": {"text": {"literalString": "A factory reset of the Philips Hue Bridge is a destructive action used to clear all settings and start fresh. It is typically a last resort for connectivity issues."}, "usageHint": "body"}}}, {"id": "resetProcedureTitle", "component": {"Text": {"text": {"literalString": "Reset Procedure"}, "usageHint": "h3"}}}, {"id": "resetProcedureList", "component": {"List": {"children": {"explicitList": ["step1", "step2", "step3", "step4", "step5"]}, "direction": "vertical"}}}, {"id": "step1", "component": {"Text": {"text": {"literalString": "1. Locate the Philips Hue Bridge (2nd Gen is the square model)."}, "usageHint": "body"}}}, {"id": "step2", "component": {"Text": {"text": {"literalString": "2. Keep the Bridge powered on."}, "usageHint": "body"}}}, {"id": "step3", "component": {"Text": {"text": {"literalString": "3. Turn the Bridge over to find the Restore Factory Settings button (a small pinhole on the back)."}, "usageHint": "body"}}}, {"id": "step4", "component": {"Text": {"text": {"literalString": "4. Use a paperclip or similar tool to press and hold the button for 5 seconds."}, "usageHint": "body"}}}, {"id": "step5", "component": {"Text": {"text": {"literalString": "5. The LED lights on the front will blink, indicating the reset is in progress."}, "usageHint": "body"}}}, {"id": "consequencesTitle", "component": {"Text": {"text": {"literalString": "Consequences of Resetting"}, "usageHint": "h3"}}}, {"id": "consequencesList", "component": {"List": {"children": {"explicitList": ["consequence1", "consequence2", "consequence3", "consequence4"]}, "direction": "vertical"}}}, {"id": "consequence1", "component": {"Text": {"text": {"literalString": "- Connected Bulbs: All bulbs will be disconnected and must be manually re-added. You may need the 6-digit serial number on each bulb if they aren't found automatically."}, "usageHint": "body"}}}, {"id": "consequence2", "component": {"Text": {"text": {"literalString": "- Scenes and Routines: All custom scenes, timers, and automated routines will be permanently deleted."}, "usageHint": "body"}}}, {"id": "consequence3", "component": {"Text": {"text": {"literalString": "- Third-Party Integrations: Connections to Apple HomeKit, Google Home, and Amazon Alexa will be broken. You must set up the HomeKit code (found on the bottom of the Bridge) again."}, "usageHint": "body"}}}, {"id": "consequence4", "component": {"Text": {"text": {"literalString": "- User Accounts: The Bridge will be unlinked from your Philips Hue account."}, "usageHint": "body"}}}]}}];
      window.__GenUICraft_RESET__ = true;
      window.__GenUICraft_QUEUE = [];

    <script type="module">
      const container = document.getElementById("surfaces");
      const assetBase = new URL("../../../../renderer/lit/", window.location.href).href;

      function setStatus(message) {
        container.innerHTML = "";
        const note = document.createElement("div");
        note.textContent = message;
        note.style.padding = "16px";
        note.style.color = "#b00020";
        note.style.fontSize = "14px";
        container.appendChild(note);
      }

      function parseMessages(payload) {
        return typeof payload === "string" ? JSON.parse(payload) : payload;
      }

      function createDefaultTheme() {
        const empty = {};
        const emptyList = [];
        return {
          components: {
            AudioPlayer: empty,
            Button: empty,
            Card: empty,
            Column: empty,
            CheckBox: { container: empty, element: empty, label: empty },
            DateTimeInput: { container: empty, element: empty, label: empty },
            Divider: empty,
            Image: {
              all: empty,
              icon: empty,
              avatar: empty,
              smallFeature: empty,
              mediumFeature: empty,
              largeFeature: empty,
              header: empty
            },
            Icon: empty,
            List: empty,
            Modal: { backdrop: empty, element: empty },
            MultipleChoice: { container: empty, element: empty, label: empty },
            Row: empty,
            Slider: { container: empty, element: empty, label: empty },
            Tabs: { container: empty, element: empty, controls: { all: empty, selected: empty } },
            Text: {
              all: empty,
              h1: empty,
              h2: empty,
              h3: empty,
              h4: empty,
              h5: empty,
              caption: empty,
              body: empty
            },
            TextField: { container: empty, element: empty, label: empty },
            Video: empty
          },
          elements: {
            a: empty,
            audio: empty,
            body: empty,
            button: empty,
            h1: empty,
            h2: empty,
            h3: empty,
            h4: empty,
            h5: empty,
            iframe: empty,
            input: empty,
            p: empty,
            pre: empty,
            textarea: empty,
            video: empty
          },
          markdown: {
            p: emptyList,
            h1: emptyList,
            h2: emptyList,
            h3: emptyList,
            h4: emptyList,
            h5: emptyList,
            ul: emptyList,
            ol: emptyList,
            li: emptyList,
            a: emptyList,
            strong: emptyList,
            em: emptyList
          }
        };
      }

      async function init() {
        try {
          const libUrl = new URL("vendor/a2ui/index.js", assetBase);
          const uiUrl = new URL("vendor/a2ui/0.8/ui/ui.js", assetBase);
          const { v0_8 } = await import(libUrl.href);
          await import(uiUrl.href);
          const theme = createDefaultTheme();
          window.addEventListener("context-request", (event) => {
            const contextKey = event.context ?? event.detail?.context;
            if (
              contextKey !== v0_8.UI.Context.themeContext &&
              contextKey !== "GenUICraftTheme"
            ) {
              return;
            }
            event.stopPropagation();
            const callback = event.callback ?? event.detail?.callback;
            if (typeof callback === "function") {
              callback(theme);
            }
          });

          const processor = v0_8.Data.createSignalA2uiMessageProcessor
            ? v0_8.Data.createSignalA2uiMessageProcessor()
            : new v0_8.Data.A2uiMessageProcessor();

          function renderSurfaces() {
            container.innerHTML = "";
            for (const [surfaceId, surface] of processor.getSurfaces()) {
              const el = document.createElement("a2ui-surface");
              el.surfaceId = surfaceId;
              el.surface = surface;
              el.processor = processor;
              container.appendChild(el);
            }
          }

          function renderMessages(payload, reset) {
            const messages = parseMessages(payload);
            if (!Array.isArray(messages)) {
              console.warn("GenUICraft payload was not an array", messages);
              return;
            }
            if (reset) {
              processor.clearSurfaces();
            }
            processor.processMessages(messages);
            renderSurfaces();
            window.__GenUICraft_RENDER_DONE = true;
          }

          window.renderA2uiMessages = renderMessages;
          window.GenUICraft_READY = true;

          const queued = window.__GenUICraft_QUEUE || [];
          window.__GenUICraft_QUEUE = [];
          queued.forEach((item) => renderMessages(item.payload, item.reset));

          if (window.__GenUICraft_MESSAGES__) {
            renderMessages(window.__GenUICraft_MESSAGES__, window.__GenUICraft_RESET__);
          }
        } catch (err) {
          console.error("Failed to load GenUICraft Lit renderer", err);
          setStatus("Lit renderer failed to load.");
        }
      }

      init();
    </script>

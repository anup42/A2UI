eticHeader", "ghostLinkText"]}}}}, {"id": "cyberneticHeader", "component": {"Text": {"text": {"literalString": "UNIQUE CYBERNETIC ENHANCEMENT"}, "usageHint": "h3"}}}, {"id": "ghostLinkText", "component": {"Text": {"text": {"literalString": "- The Ghost-Link Drive: A custom-built, internal solid-state storage array fused directly to the spinal column. It allows Jax to encrypt and store up to 500 Petabytes of data within his own nervous system, making the data undetectable by external scanners but causing severe neurological strain during transfers."}, "usageHint": "body"}}}, {"id": "backstorySection", "component": {"Column": {"children": {"explicitList": ["backstoryHeader", "backstoryText"]}}}}, {"id": "backstoryHeader", "component": {"Text": {"text": {"literalString": "BACKSTORY"}, "usageHint": "h3"}}}, {"id": "backstoryText", "component": {"Text": {"text": {"literalString": "Jax Thorne did not come to Neo-Tokyo to be a thief; he came to be a programmer. However, in a city where the air is owned by corporations and the light is a subscription service, talent is rarely enough. Three years ago, Jax's younger sister, Miri, contracted 'Circuit-Fever,' a degenerative neural decay caused by low-grade ocular implants. The cost for the specialized nanites required to save her was more than a lifetime of coding could provide. Desperate, Jax approached the Kuro-Hana Syndicate, a brutal organization that controls the flow of illicit tech in the undercity.\n\nThey gave him the credits, but the interest rates were designed to be inescapable. When Miri recovered, the Syndicate came to collect. Unable to pay, Jax was forced into their service as a 'mule'—a data courier. To maximize his efficiency, the Syndicate forcibly installed the Ghost-Link Drive, a prototype that turns his very consciousness into a hard drive. Every gigabit he carries burns a little more of his memory away, a slow erosion of his identity.\n\nCurrently, Jax owes the Syndicate 1.2 million credits. He lives in a     <script type="module">
      const container = document.getElementById("surfaces");
      const assetBase = new URL("../../../../renderer/lit/", window.location.href).href;

      function setStatus(message) {
        container.innerHTML = "";
        const note = document.createElement("div");
        note.textContent = message;
        note.style.padding = "16px";
        note.style.color = "#b00020";
        note.style.fontSize = "14px";
        container.appendChild(note);
      }

      function parseMessages(payload) {
        return typeof payload === "string" ? JSON.parse(payload) : payload;
      }

      function createDefaultTheme() {
        const empty = {};
        const emptyList = [];
        return {
          components: {
            AudioPlayer: empty,
            Button: empty,
            Card: empty,
            Column: empty,
            CheckBox: { container: empty, element: empty, label: empty },
            DateTimeInput: { container: empty, element: empty, label: empty },
            Divider: empty,
            Image: {
              all: empty,
              icon: empty,
              avatar: empty,
              smallFeature: empty,
              mediumFeature: empty,
              largeFeature: empty,
              header: empty
            },
            Icon: empty,
            List: empty,
            Modal: { backdrop: empty, element: empty },
            MultipleChoice: { container: empty, element: empty, label: empty },
            Row: empty,
            Slider: { container: empty, element: empty, label: empty },
            Tabs: { container: empty, element: empty, controls: { all: empty, selected: empty } },
            Text: {
              all: empty,
              h1: empty,
              h2: empty,
              h3: empty,
              h4: empty,
              h5: empty,
              caption: empty,
              body: empty
            },
            TextField: { container: empty, element: empty, label: empty },
            Video: empty
          },
          elements: {
            a: empty,
            audio: empty,
            body: empty,
            button: empty,
            h1: empty,
            h2: empty,
            h3: empty,
            h4: empty,
            h5: empty,
            iframe: empty,
            input: empty,
            p: empty,
            pre: empty,
            textarea: empty,
            video: empty
          },
          markdown: {
            p: emptyList,
            h1: emptyList,
            h2: emptyList,
            h3: emptyList,
            h4: emptyList,
            h5: emptyList,
            ul: emptyList,
            ol: emptyList,
            li: emptyList,
            a: emptyList,
            strong: emptyList,
            em: emptyList
          }
        };
      }

      async function init() {
        try {
          const libUrl = new URL("vendor/a2ui/index.js", assetBase);
          const uiUrl = new URL("vendor/a2ui/0.8/ui/ui.js", assetBase);
          const { v0_8 } = await import(libUrl.href);
          await import(uiUrl.href);
          const theme = createDefaultTheme();
          window.addEventListener("context-request", (event) => {
            const contextKey = event.context ?? event.detail?.context;
            if (
              contextKey !== v0_8.UI.Context.themeContext &&
              contextKey !== "GenUICraftTheme"
            ) {
              return;
            }
            event.stopPropagation();
            const callback = event.callback ?? event.detail?.callback;
            if (typeof callback === "function") {
              callback(theme);
            }
          });

          const processor = v0_8.Data.createSignalA2uiMessageProcessor
            ? v0_8.Data.createSignalA2uiMessageProcessor()
            : new v0_8.Data.A2uiMessageProcessor();

          function renderSurfaces() {
            container.innerHTML = "";
            for (const [surfaceId, surface] of processor.getSurfaces()) {
              const el = document.createElement("a2ui-surface");
              el.surfaceId = surfaceId;
              el.surface = surface;
              el.processor = processor;
              container.appendChild(el);
            }
          }

          function renderMessages(payload, reset) {
            const messages = parseMessages(payload);
            if (!Array.isArray(messages)) {
              console.warn("GenUICraft payload was not an array", messages);
              return;
            }
            if (reset) {
              processor.clearSurfaces();
            }
            processor.processMessages(messages);
            renderSurfaces();
            window.__GenUICraft_RENDER_DONE = true;
          }

          window.renderA2uiMessages = renderMessages;
          window.GenUICraft_READY = true;

          const queued = window.__GenUICraft_QUEUE || [];
          window.__GenUICraft_QUEUE = [];
          queued.forEach((item) => renderMessages(item.payload, item.reset));

          if (window.__GenUICraft_MESSAGES__) {
            renderMessages(window.__GenUICraft_MESSAGES__, window.__GenUICraft_RESET__);
          }
        } catch (err) {
          console.error("Failed to load GenUICraft Lit renderer", err);
          setStatus("Lit renderer failed to load.");
        }
      }

      init();
    </script>

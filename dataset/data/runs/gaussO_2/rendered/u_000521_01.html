    <script>
      window.__GenUICraft_MESSAGES__ = [{"beginRendering": {"root": "root", "surfaceId": "performanceSummary"}}, {"surfaceUpdate": {"surfaceId": "performanceSummary", "components": [{"id": "root", "component": {"Column": {"children": {"explicitList": ["title", "assetTable", "volatilityFindings", "marketCrashes", "quickActions"]}}}}, {"id": "title", "component": {"Text": {"text": {"literalString": "Summary of Performance (Jan 1, 2000 - Dec 31, 2020)"}, "usageHint": "h2"}}}, {"id": "assetTable", "component": {"Column": {"children": {"explicitList": ["assetTableTitle", "assetTableContent"]}}}}, {"id": "assetTableTitle", "component": {"Text": {"text": {"literalString": "Asset Comparison Table"}, "usageHint": "h3"}}}, {"id": "assetTableContent", "component": {"Text": {"text": {"literalString": "Asset | Total Growth (%) | Annualized Return (Approx) | Volatility Level\nS&P 500 | ~200% to 230% | ~6% - 7% | High (Market Cycles)\nGold | ~500% to 550% | ~9% - 10% | Very High (Speculative/Safe Haven)\n\nAssumptions: Growth calculations assume price appreciation (Gold) and total return including dividends (S&P 500)."}, "usageHint": "body"}}}, {"id": "volatilityFindings", "component": {"Column": {"children": {"explicitList": ["volatilityFindingsTitle", "volatilityFindingsContent"]}}}}, {"id": "volatilityFindingsTitle", "component": {"Text": {"text": {"literalString": "Key Findings on Volatility"}, "usageHint": "h3"}}}, {"id": "volatilityFindingsContent", "component": {"Text": {"text": {"literalString": "Gold exhibited higher price volatility during this specific timeframe, characterized by massive surges during economic uncertainty (2008-2011) and significant multi-year drawdowns (2012-2015). While the S&P 500 had sharp crashes, its recovery phases were more consistent in the latter half of the period."}, "usageHint": "body"}}}, {"id": "marketCrashes", "component": {"Column": {"children": {"explicitList": ["marketCrashesTitle", "marketCrashesContent"]}}}}, {"id": "marketCrashesTitle", "component": {"Text": {"text": {"literalString": "Significant Market Crashes (2000-2020)"}, "usageHint": "h3"}}}, {"id": "marketCrashesContent", "component": {"Text": {"text": {"literalString": "1. The Dot-Com Bubble (2000-2002): A massive sell-off in technology stocks leading to a multi-year bear market.\n2. The Global Financial Crisis (2008-2009): Triggered by the subprime mortgage collapse, leading to the S&P 500's worst performance since the Great Depression.\n3. The COVID-19 Crash (March 2020): The fastest 30% decline in S&P 500 history due to global lockdowns, followed by a rapid recovery."}, "usageHint": "body"}}}, {"id": "quickActions", "component": {"Column": {"children": {"explicitList": ["quickActionsTitle", "quickActionsButtons"]}}}}, {"id": "quickActionsTitle", "component": {"Text": {"text": {"literalString": "Quick Actions"}, "usageHint": "h3"}}}, {"id": "quickActionsButtons", "component": {"Row": {"children": {"explicitList": ["viewSP500ChartButton", "viewGoldPriceHistoryButton"]}}}}, {"id": "viewSP500ChartButton", "component": {"Button": {"child": "viewSP500ChartButtonText", "action": {"name": "openUrl", "context": [{"key": "url", "value": {"literalString": "https://www.macrotrends.net/2324/sp-500-historical-chart-data"}}]}}}}, {"id": "viewSP500ChartButtonText", "component": {"Text": {"text": {"literalString": "View Historical S&P 500 Chart"}, "usageHint": "body"}}}, {"id": "viewGoldPriceHistoryButton", "component": {"Button": {"child": "viewGoldPriceHistoryButtonText", "action": {"name": "openUrl", "context": [{"key": "url", "value": {"literalString": "https://www.gold.org/goldhub/data/gold-prices"}}]}}}}, {"id": "viewGoldPriceHistoryButtonText", "component": {"Text": {"text": {"literalString": "View Gold Price History"}, "usageHint": "body"}}}]}}];
      window.__GenUICraft_RESET__ = true;

    <script type="module">
      const container = document.getElementById("surfaces");
      const assetBase = new URL("../../../../renderer/lit/", window.location.href).href;

      function setStatus(message) {
        container.innerHTML = "";
        const note = document.createElement("div");
        note.textContent = message;
        note.style.padding = "16px";
        note.style.color = "#b00020";
        note.style.fontSize = "14px";
        container.appendChild(note);
      }

      function parseMessages(payload) {
        return typeof payload === "string" ? JSON.parse(payload) : payload;
      }

      function createDefaultTheme() {
        const empty = {};
        const emptyList = [];
        const textBase = {
          "font-family":
            '"SamsungOne", "SamsungOneKorean", "Segoe UI", Roboto, system-ui, sans-serif',
          color: "var(--oneui-color-on-surface)"
        };
        return {
          components: {
            AudioPlayer: empty,
            Button: empty,
            Card: empty,
            Column: empty,
            CheckBox: { container: empty, element: empty, label: empty },
            DateTimeInput: { container: empty, element: empty, label: empty },
            Divider: empty,
            Image: {
              all: empty,
              icon: empty,
              avatar: empty,
              smallFeature: empty,
              mediumFeature: empty,
              largeFeature: empty,
              header: empty
            },
            Icon: empty,
            List: empty,
            Modal: { backdrop: empty, element: empty },
            MultipleChoice: { container: empty, element: empty, label: empty },
            Row: empty,
            Slider: { container: empty, element: empty, label: empty },
            Tabs: { container: empty, element: empty, controls: { all: empty, selected: empty } },
            Text: {
              all: empty,
              h1: empty,
              h2: empty,
              h3: empty,
              h4: empty,
              h5: empty,
              caption: empty,
              body: empty
            },
            TextField: { container: empty, element: empty, label: empty },
            Video: empty
          },
          elements: {
            a: empty,
            audio: empty,
            body: empty,
            button: empty,
            h1: empty,
            h2: empty,
            h3: empty,
            h4: empty,
            h5: empty,
            iframe: empty,
            input: empty,
            p: empty,
            pre: empty,
            textarea: empty,
            video: empty
          },
          markdown: {
            p: emptyList,
            h1: emptyList,
            h2: emptyList,
            h3: emptyList,
            h4: emptyList,
            h5: emptyList,
            ul: emptyList,
            ol: emptyList,
            li: emptyList,
            a: emptyList,
            strong: emptyList,
            em: emptyList
          },
          additionalStyles: {
            Column: {
              gap: "14px"
            },
            Row: {
              gap: "12px",
              "align-items": "center",
              "flex-wrap": "wrap"
            },
            List: {
              gap: "12px"
            },
            Card: {
              background: "linear-gradient(180deg, var(--oneui-color-surface), var(--oneui-color-surface-alt))",
              border: "1px solid var(--oneui-color-outline)",
              "border-radius": "24px",
              padding: "20px",
              "box-shadow": "0 10px 26px rgba(20, 24, 35, 0.09)"
            },
            Button: {
              background: "linear-gradient(180deg, #2d7df0, var(--oneui-color-primary))",
              color: "#ffffff",
              border: "none",
              "border-radius": "22px",
              "min-height": "44px",
              padding: "11px 20px",
              "font-weight": "700",
              "letter-spacing": "0.01em",
              "box-shadow": "0 6px 16px rgba(11, 87, 208, 0.28)"
            },
            Divider: {
              "border-color": "var(--oneui-color-outline-variant)",
              margin: "8px 0"
            },
            Image: {
              "border-radius": "16px",
              "object-fit": "cover"
            },
            Icon: {
              color: "var(--oneui-color-primary)"
            },
            Text: {
              h1: {
                ...textBase,
                "font-size": "2rem",
                "line-height": "2.4rem",
                "font-weight": "800"
              },
              h2: {
                ...textBase,
                "font-size": "1.5rem",
                "line-height": "2rem",
                "font-weight": "700"
              },
              h3: {
                ...textBase,
                "font-size": "1.25rem",
                "line-height": "1.8rem",
                "font-weight": "700"
              },
              h4: {
                ...textBase,
                "font-size": "1.05rem",
                "line-height": "1.5rem",
                "font-weight": "700"
              },
              h5: {
                ...textBase,
                "font-size": "0.95rem",
                "line-height": "1.35rem",
                "font-weight": "700"
              },
              h6: {
                ...textBase,
                "font-size": "0.875rem",
                "line-height": "1.25rem",
                "font-weight": "700"
              },
              caption: {
                ...textBase,
                "font-size": "0.8rem",
                "line-height": "1.2rem",
                color: "var(--oneui-color-on-surface-variant)"
              },
              body: {
                ...textBase,
                "font-size": "0.97rem",
                "line-height": "1.45rem"
              }
            }
          }
        };
      }

      async function init() {
        try {
          const libUrl = new URL("vendor/a2ui/index.js", assetBase);
          const uiUrl = new URL("vendor/a2ui/0.8/ui/ui.js", assetBase);
          const { v0_8 } = await import(libUrl.href);
          await import(uiUrl.href);
          const theme = createDefaultTheme();
          window.addEventListener("context-request", (event) => {
            const contextKey = event.context ?? event.detail?.context;
            if (
              contextKey !== v0_8.UI.Context.themeContext &&
              contextKey !== "GenUICraftTheme"
            ) {
              return;
            }
            event.stopPropagation();
            const callback = event.callback ?? event.detail?.callback;
            if (typeof callback === "function") {
              callback(theme);
            }
          });

          const processor = v0_8.Data.createSignalA2uiMessageProcessor
            ? v0_8.Data.createSignalA2uiMessageProcessor()
            : new v0_8.Data.A2uiMessageProcessor();

          function renderSurfaces() {
            container.innerHTML = "";
            for (const [surfaceId, surface] of processor.getSurfaces()) {
              const el = document.createElement("a2ui-surface");
              el.surfaceId = surfaceId;
              el.surface = surface;
              el.processor = processor;
              container.appendChild(el);
            }
          }

          function renderMessages(payload, reset) {
            const messages = parseMessages(payload);
            if (!Array.isArray(messages)) {
              console.warn("GenUICraft payload was not an array", messages);
              return;
            }
            if (reset) {
              processor.clearSurfaces();
            }
            processor.processMessages(messages);
            renderSurfaces();
            window.__GenUICraft_RENDER_DONE = true;
          }

          window.renderA2uiMessages = renderMessages;
          window.GenUICraft_READY = true;

          const queued = window.__GenUICraft_QUEUE || [];
          window.__GenUICraft_QUEUE = [];
          queued.forEach((item) => renderMessages(item.payload, item.reset));

          if (window.__GenUICraft_MESSAGES__) {
            renderMessages(window.__GenUICraft_MESSAGES__, window.__GenUICraft_RESET__);
          }
        } catch (err) {
          console.error("Failed to load GenUICraft Lit renderer", err);
          setStatus("Lit renderer failed to load.");
        }
      }

      init();
    </script>

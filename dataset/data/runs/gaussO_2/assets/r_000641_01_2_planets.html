F8CsVTWYVnwxbFB/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/WEFZVD8F8CsVTWYVnwxbFB/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/WEFZVD8F8CsVTWYVnwxbFB/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/WEFZVD8F8CsVTWYVnwxbFB/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/WEFZVD8F8CsVTWYVnwxbFB/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/WEFZVD8F8CsVTWYVnwxbFB/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/WEFZVD8F8CsVTWYVnwxbFB/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/WEFZVD8F8CsVTWYVnwxbFB/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/collecting-forest-planets/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">Catching and Collecting Extinct Forest</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">An educational project based on the concept of Catch, Collect, Research, in which people use their bodies to explore, discover, gather knowledge, and expand their curiosity. Explore with your smartphone, catch various animals, research them, and create your very own collection book.<br />There are various extinct animals that live in this Extinct Forest. When you move close to the animals or touch them, they will run away or turn to face you.<br />When you use the smartphone's camera to look at an animal moving in the space, and release a Research Eye at the animal in the camera’s view, the eye flies out from the phone into the real space. When the Research Eye reaches the animal, it disappears from the space and is added to the smartphone collection. Information about the animals you catch will be stored in the app’s collection book. When you swipe a captured animal towards a location you can see in the app’s camera, the animal is released and returns to that location.<br />You can also throw a Research Net at your feet to catch animals. Work together with those around you, use your body to drive animals into the Research Net to capture them, and watch as they disappear from the space and, at the same time, appear in your collection book. Swipe the captured animals away to release them at your feet.<br />The more you capture the same animal, the more detailed information you can record in your collection book.<br /><br /></div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div></div></div></div><div class="ExhibitionTheme_exhibition-theme__GkeQj ExhibitionTheme_-background__648SJ" id="theme6"><div class="ExhibitionTheme_background__zBCXb"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/pRF5hyJS7jYnNS6YQ4Fh2J/width=640,quality=80 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/pRF5hyJS7jYnNS6YQ4Fh2J/width=750,quality=80 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/pRF5hyJS7jYnNS6YQ4Fh2J/width=828,quality=80 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/pRF5hyJS7jYnNS6YQ4Fh2J/width=1080,quality=80 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/pRF5hyJS7jYnNS6YQ4Fh2J/width=1200,quality=80 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/pRF5hyJS7jYnNS6YQ4Fh2J/width=1920,quality=80 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/pRF5hyJS7jYnNS6YQ4Fh2J/width=2048,quality=80 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/pRF5hyJS7jYnNS6YQ4Fh2J/width=3840,quality=80 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/pRF5hyJS7jYnNS6YQ4Fh2J/width=3840,quality=80"/></div></div></div><div class="ExhibitionTheme_header__UXSP6 ExhibitionTheme_-background__648SJ"><p class="ExhibitionTheme_title__FgRGq">Open-Air</p></div><div class="ExhibitionTheme_cards__Pyre2"><div class="DefaultThemes_default-themes__Gwuh4"><div class="DefaultThemeCard_default-theme-card__Op9Qn"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/XWNWPDDVKTut3pg7pEKTQN/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/XWNWPDDVKTut3pg7pEKTQN/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/XWNWPDDVKTut3pg7pEKTQN/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/XWNWPDDVKTut3pg7pEKTQN/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/XWNWPDDVKTut3pg7pEKTQN/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/XWNWPDDVKTut3pg7pEKTQN/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/XWNWPDDVKTut3pg7pEKTQN/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/XWNWPDDVKTut3pg7pEKTQN/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/XWNWPDDVKTut3pg7pEKTQN/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/universe_fireparticles_falling/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">Universe of Fire Particles Haunting the Sky and Earth</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">When people stand on the work, a black absolute presence is created, and the shape of the flames change. The work is affected by people, and is in a state of perpetual, continuous change.<br /><br />Flames are a phenomenon of light and heat generated by combustion; it is a vaporized substance in a flow, a decomposed substance. It is our sensory experience of seeing what is in between phenomenon and substance.<br /><br />Lines are drawn in relation to the flow of combusting gas, and the flames are created by the accumulation of those lines in three-dimensions. The lines are then “flattened” using what teamLab considers to be Ultrasubjective Space to represent the flames.<br /><br />teamLab is exploring the concept of Distributed Art.<br />If you launch the Distributed Fire smartphone application and approach this artwork, the flame will ignite and you can take the artwork home with you. When you bring that flame close to another person's smartphone, a flame will alight. As you connect the flame, and they connect that flame with someone else, the flame will spread all over the world. The flames that are spread are displayed on the Map of The Flame.<br /><br />Distributed Art duplicates itself, or a part of an artwork is distributed among people. Then, once in the hands of the people, the artwork is further actively distributed, and also makes copies of itself. The artworks will be distributed and exist on people's networks and become decentralized. When the artwork exists on the network, it continues to exist even if the original disappears.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn DefaultThemeCard_-reverse__xDXFw"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/1219d3e6-4d47-4224-55a4-2d2c48517e00/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/1219d3e6-4d47-4224-55a4-2d2c48517e00/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/1219d3e6-4d47-4224-55a4-2d2c48517e00/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/1219d3e6-4d47-4224-55a4-2d2c48517e00/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/1219d3e6-4d47-4224-55a4-2d2c48517e00/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/1219d3e6-4d47-4224-55a4-2d2c48517e00/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/1219d3e6-4d47-4224-55a4-2d2c48517e00/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/1219d3e6-4d47-4224-55a4-2d2c48517e00/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/1219d3e6-4d47-4224-55a4-2d2c48517e00/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/nurserylamps-planets/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">Nursery Lamps in Spontaneous Order</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">* Location: Inside Glass House<br /><br />The orchids from Floating Flower Garden whose flowers have fallen come to this space and are nurtured in the lamps. The lamps contain light and water necessary for the growth of the orchids.<br />Each lamp glows to its own rhythm. Over time, nearby lamps and Tea and Sake in Spontaneous Order cause a spontaneous order phenomenon, and they influence each other.<br /><br />A spontaneous order phenomenon occurs when different rhythms influence each other and synchronize. Examples include when the pendulums of two clocks gradually begin to swing together; when many fireflies gather in one tree and all start blinking at the same time, creating a larger light as a whole; or when the cells that make up the heart synchronize and tremble simultaneously to create the pulse of the heart. This can be seen in various systems, from physical phenomena, neurophysiology, to ecosystems. Although the individual parts do not have the ability to observe the whole, the phenomenon of self-organization is the creation of an ordered and larger structure, resulting from the autonomous behavior of each individual part influencing each other. This phenomenon is also known as spontaneous order. </div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/4DKjxZ82aSMA52am5QTskQ/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/4DKjxZ82aSMA52am5QTskQ/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/4DKjxZ82aSMA52am5QTskQ/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/4DKjxZ82aSMA52am5QTskQ/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/4DKjxZ82aSMA52am5QTskQ/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/4DKjxZ82aSMA52am5QTskQ/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/4DKjxZ82aSMA52am5QTskQ/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/4DKjxZ82aSMA52am5QTskQ/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/4DKjxZ82aSMA52am5QTskQ/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/tea-spontaneousorder-planets/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">Tea and Sake in Spontaneous Order - Dynamic Steady State Color</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">* Location: Inside Orchid Glass House<br /><br />When a cup of tea or sake is poured, the tea or sake begins to glow with its own unique rhythm and produce a tone.A spontaneous order phenomenon occurs between the teas, sake or the lamps of Nursery Lamps in Spontaneous Order. As they influence each other, gradually the rhythms of light and color of the teas or sake synchronize. You drink a part of that order.The artwork is born only when there is tea or sake. When you finish drinking the tea or sake, the work will no longer exist and will no longer affect its surroundings.<br />The light color of the tea or sake is Dynamic Equilibrium Color, a new color concept by teamLab. When a person sees the tea or sake in the cup from a distance, taking in its entirety, the color of the light does not appear to change; but when they look closely, observing the miniscule, the color of the light is actually continuously changing, and creating a new sense of time.<br />A spontaneous order phenomenon occurs when different rhythms influence each other and become aligned. Examples include when the pendulums of two clocks gradually begin to swing together, when many fireflies gather in one tree and all start flashing at the same time, creating a larger light phenomenon, or when the cells that make up the heart synchronize and tremble simultaneously to create the beating of the heart. The phenomenon of self-organization is the creation of a large structure with order resulting from the autonomous behavior of each individual, even though each individual does not have the ability to observe the whole. This can also be called a self-organization phenomenon.<br />It is believed that entropy (a measurement of the lack of order in a system) in the universe will steadily increase (the law of increasing entropy) and that entities with form eventually collapse. However, the reason why the universe, life, nature, and society are able to exist in spite of this may be because order is born by itself through the common phenomenon of self-organization in the midst of disorder. In other words, the universe and our own existence are a continuous order created by the same phenomenon.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn DefaultThemeCard_-reverse__xDXFw"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/H4PuNd9mRvFnPPqk85EtVo/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/H4PuNd9mRvFnPPqk85EtVo/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/H4PuNd9mRvFnPPqk85EtVo/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/H4PuNd9mRvFnPPqk85EtVo/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/H4PuNd9mRvFnPPqk85EtVo/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/H4PuNd9mRvFnPPqk85EtVo/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/H4PuNd9mRvFnPPqk85EtVo/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/H4PuNd9mRvFnPPqk85EtVo/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/H4PuNd9mRvFnPPqk85EtVo/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/reversiblerotation-blackemptiness-planets/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">Reversible Rotation in the Black Emptiness</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">* Location: Inside Emptiness Table<br /><br />In Black Emptiness, because it is empty, infinite possibilities open up where anything can enter it.<br />When you sit down, Spatial Calligraphy is drawn in front of you. The Spatial Calligraphy in this artwork space rotates in the same direction, but because of the characteristics of Ultrasubjective Space, visually, the clockwise and counterclockwise rotation are equivalent. Hence, the work can appear to be rotating in either direction depending on how the viewer chooses to see it.Spatial Calligraphy is a form of calligraphy drawn in space that teamLab has been exploring since it was founded. The artwork reconstructs calligraphy in three-dimensional space to express the depth, speed and power of the brush stroke, and that calligraphy is then flattened using the logical structure of space that teamLab calls Ultrasubjective Space. The calligraphy shifts between two and three dimensions.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn"><div class="DefaultThemeCard_wrapper__aEiVb DefaultThemeCard_-image__ptVhz"><div class="DefaultThemeCard_card__i37fL"><img alt="展示テーマ画像" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="(max-width: 740px) 80vw , 50vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/TcxmkFNk3GoyoNxGnDkqM5/width=384,quality=100 384w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/TcxmkFNk3GoyoNxGnDkqM5/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/TcxmkFNk3GoyoNxGnDkqM5/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/TcxmkFNk3GoyoNxGnDkqM5/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/TcxmkFNk3GoyoNxGnDkqM5/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/TcxmkFNk3GoyoNxGnDkqM5/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/TcxmkFNk3GoyoNxGnDkqM5/width=1920,quality=100 1920w, https://assets.team-la ill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="(max-width: 740px) 80vw , 50vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/UfA5rP8G6McnQJmTjMvxgF/width=384,quality=100 384w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/UfA5rP8G6McnQJmTjMvxgF/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/UfA5rP8G6McnQJmTjMvxgF/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/UfA5rP8G6McnQJmTjMvxgF/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/UfA5rP8G6McnQJmTjMvxgF/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/UfA5rP8G6McnQJmTjMvxgF/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/UfA5rP8G6McnQJmTjMvxgF/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/UfA5rP8G6McnQJmTjMvxgF/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/UfA5rP8G6McnQJmTjMvxgF/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/UfA5rP8G6McnQJmTjMvxgF/width=3840,quality=100"/></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/vortexsea-planets/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">Vortex Sea: Waves and Whirlpools</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">* Location: Vegan Ramen UZU<br />The Seigaiha (blue sea waves) pattern is a traditional Japanese motif that represents "the infinitely spreading gentle waves, symbolizing gratitude for the blessings brought by the vast sea and a wish for a peaceful life that continues eternally." The Seigaiha pattern is believed to have originated during the Sassanian Persia Empire (226-651 AD), spread along the Silk Road, and eventually reached Japan during the Asuka period (593-710 AD).<br />On the other hand, the spiral motif is said to be one of the most widely distributed patterns in the world, beloved by almost all prehistoric cultures.<br />People draw waves from a side view, while they draw spirals as seen from above..<br />Reinterpreting this in three dimensions, here the spirals are drawn on a sphere, and a series of spheres in a state of free rotation are arranged in an orderly fashion. The collection of spirals on these spheres is then flattened into a two-dimensional space using Ultra hyper-subjective space, which creates the right panel.<br />The same spheres are arranged in a more chaotic manner, and the collection of spirals on those spheres is again flattened using the same Ultrahyper-subjective space to form the left panel.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div></div></div></div><div class="ExhibitionTheme_exhibition-theme__GkeQj ExhibitionTheme_-background__648SJ" id="theme7"><div class="ExhibitionTheme_background__zBCXb"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/HaQh6iFWxD282unfiZRRmY/width=640,quality=80 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/HaQh6iFWxD282unfiZRRmY/width=750,quality=80 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/HaQh6iFWxD282unfiZRRmY/width=828,quality=80 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/HaQh6iFWxD282unfiZRRmY/width=1080,quality=80 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/HaQh6iFWxD282unfiZRRmY/width=1200,quality=80 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/HaQh6iFWxD282unfiZRRmY/width=1920,quality=80 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/HaQh6iFWxD282unfiZRRmY/width=2048,quality=80 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/HaQh6iFWxD282unfiZRRmY/width=3840,quality=80 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/HaQh6iFWxD282unfiZRRmY/width=3840,quality=80"/></div></div></div><div class="ExhibitionTheme_header__UXSP6 ExhibitionTheme_-background__648SJ"><p class="ExhibitionTheme_title__FgRGq">Factory &amp; Store</p><div class="ExhibitionTheme_description__9puJd" dir="auto" style="white-space:normal;text-align:unset"><div></div></div></div><div class="ExhibitionTheme_cards__Pyre2"><div class="DefaultThemes_default-themes__Gwuh4"><div class="DefaultThemeCard_default-theme-card__Op9Qn"><div class="DefaultThemeCard_wrapper__aEiVb DefaultThemeCard_-image__ptVhz"><div class="DefaultThemeCard_card__i37fL"><img alt="展示テーマ画像" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="(max-width: 740px) 80vw , 50vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/KVNU7UhRJZnbCeLLBQFxTj/width=384,quality=100 384w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/KVNU7UhRJZnbCeLLBQFxTj/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/KVNU7UhRJZnbCeLLBQFxTj/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/KVNU7UhRJZnbCeLLBQFxTj/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/KVNU7UhRJZnbCeLLBQFxTj/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/KVNU7UhRJZnbCeLLBQFxTj/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/KVNU7UhRJZnbCeLLBQFxTj/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/KVNU7UhRJZnbCeLLBQFxTj/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/KVNU7UhRJZnbCeLLBQFxTj/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/KVNU7UhRJZnbCeLLBQFxTj/width=3840,quality=100"/></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/solidifiedspark-planets/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">Cognitive Solidified Spark</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">* Location: Inside Sketch Factory<br /><br />We do not perceive the world we see, we see the world we perceive.<br />Spheres made of accumulated rays of light.The light radiates from the center in infinite fine rays, creating its spherical shape. The light source remains motionless, yet the countless lines emitting from it wriggle continuously.<br />The spheres have no surface boundary, and the perception of the boundary between the artwork and the body is ambiguous. When you try to touch a sphere, your hand goes into the sphere as it does not have a physical boundary. <br />What is this sphere? Why do the rays of lines wriggle?Our world is within us.<br />And if we perceive these spheres made of accumulated lines, the world we perceive will expand, and we may see the spheres of accumulated lines in our daily lives. As the world you perceive changes, the way you see the world goes on to change.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn DefaultThemeCard_-reverse__xDXFw"><div class="DefaultThemeCard_wrapper__aEiVb DefaultThemeCard_-image__ptVhz"><div class="DefaultThemeCard_card__i37fL"><img alt="展示テーマ画像" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="(max-width: 740px) 80vw , 50vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/SyWgTRQAeR6CJqF3r3BqNK/width=384,quality=100 384w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/SyWgTRQAeR6CJqF3r3BqNK/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/SyWgTRQAeR6CJqF3r3BqNK/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/SyWgTRQAeR6CJqF3r3BqNK/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/SyWgTRQAeR6CJqF3r3BqNK/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/SyWgTRQAeR6CJqF3r3BqNK/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/SyWgTRQAeR6CJqF3r3BqNK/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/SyWgTRQAeR6CJqF3r3BqNK/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/SyWgTRQAeR6CJqF3r3BqNK/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/SyWgTRQAeR6CJqF3r3BqNK/width=3840,quality=100"/></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/openenvironmenteternity-planets/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">Open Environment Eternity</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">* Location: Living Art Store<br /><br />This orchid originally grows on rocks or tree trunks without soil. This orchid can live forever when there is wind, sunlight, and appropriate amounts of rain and water. This work possesses eternity in an open environment continuous with the outside world.<br />On the other hand, classical painting seeks to embody eternity in a closed environment, where there is no wind, no sunlight, and no water.<br />For this work, the presence of appropriate wind, sunlight, rain, and water means a specific environment, or an environment maintained by humans. However, an environment without wind, sunlight, and water is also an artificial environment created and maintained by humans.<br />Is eternity in a closed environment or eternity in an open, continuous environment the true eternity of existence? In the first place, a completely closed environment does not actually exist.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn"><div class="DefaultThemeCard_wrapper__aEiVb DefaultThemeCard_-image__ptVhz"><div class="DefaultThemeCard_card__i37fL"><img alt="展示テーマ画像" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="(max-width: 740px) 80vw , 50vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/Mxt2fMAqRvXGsEAJQgzAaS/width=384,quality=100 384w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/Mxt2fMAqRvXGsEAJQgzAaS/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/Mxt2fMAqRvXGsEAJQgzAaS/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/Mxt2fMAqRvXGsEAJQgzAaS/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/Mxt2fMAqRvXGsEAJQgzAaS/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/Mxt2fMAqRvXGsEAJQgzAaS/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/Mxt2fMAqRvXGsEAJQgzAaS/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/Mxt2fMAqRvXGsEAJQgzAaS/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/Mxt2fMAqRvXGsEAJQgzAaS/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/Mxt2fMAqRvXGsEAJQgzAaS/width=3840,quality=100"/></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/openenvironment-planets/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">Open Environment Eternal Existence</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">* Location: Living Art Store<br /><br />This orchid originally grows by attaching itself to rocks or tree trunks without soil. This orchid can live forever when there is wind, sunlight, and an appropriate amount of rain or water. This artwork possesses eternity in an open environment that is continuous with the outside.<br />On the other hand, classical art seeks to hold eternity in a closed environment, where there is no wind, no sunlight, and no water.<br />For this artwork, the presence of the appropriate wind, sunlight, rain, and water means a specific environment, or an environment maintained by humans. However, an environment without wind, sunlight, or water is also an artificial environment created and maintained by humans.<br />Is eternity found in a closed environment, or in an open, continuous environment? What is the eternity of existence?In the first place, a completely closed environment does not actually exist.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div></div></div></div></div></section><section class="_slug__exhibition-artist__aDw5Z" id="artist"><div class="SectionArtist_section-artist__QwN_F"><div class="SectionArtist_title__xQDMx">About teamLab</div><div class="ArtistCard_artist-card__uZ553"><div class="ArtistCard_content__eR9Af"><div class="ArtistCard_text__zC3_G" dir="auto" style="white-space:pre-wrap;text-align:unset">teamLab (f. 2001) is an international art collective. Their collaborative practice seeks to navigate the confluence of art, science, technology, and the natural world. Through art, the interdisciplinary group of specialists, including artists, programmers, engineers, CG animators, mathematicians, and architects, aims to explore the relationship between the self and the world, and new forms of perception.

In order to understand the world around them, people separate it into independent entities with perceived boundaries between them. teamLab seeks to transcend these boundaries in our perceptions of the world, of the relationship between the self and the world, and of the continuity of time. Everything exists in a long, fragile yet miraculous, borderless continuity.

teamLab’s works are in the permanent collection of the National Gallery of Victoria, Melbourne; Art Gallery of New South Wales, Sydney; Art Gallery of South Australia, Adelaide; National Gallery of Australia, Canberra;  Amos Rex, Helsinki; Museum of Contemporary Art, Los Angeles; Asian Art Museum, San Francisco; Borusan Contemporary Art Collection, Istanbul; and Asia Society Museum, New York, among others.

<p class="exhibition__app__item__inr__subttl">Catch the Animals</p><p class="exhibition__app__item__inr__description">
Using the app's camera, aim at the animals on the wall and release a Research Eye at them, or set light nets around their feet to capture them.</p><br />

<p class="exhibition__app__item__inr__subttl">Research the Animals</p><p class="exhibition__app__item__inr__description">
The captured animals disappear from the space and enter the smartphone app's collection book. Catch various animals, study them, and create your own collection book.</p><br />

<br /><br />
You can control the plane, butterfly, hawk, or dolphin with the APP and see the world from their perspectives on the screen.
<br /><br />

<p class="exhibition__app__item__inr__subttl">Share the Flame</p><p class="exhibition__app__item__inr__description">If you approach other people with the app, you can share your flame with them.</p><br />

div></div><div class="TicketDetails_list__1UdSZ"><div class="TicketDetails_wrap__mFdC0"><div class="TicketDetails_title__Gq_TA" dir="auto" style="white-space:normal;text-align:unset">Premium Pass</div><div class="TicketDetails_text__kP0T4" dir="auto" style="white-space:pre-wrap;text-align:unset">* Admission time not specified. Priority entry.</div></div><div class="TicketDetails_ticket-segments__3O8R4"><div class="TicketDetails_segment__UcVQt"><div class="TicketDetails_title__Gq_TA" dir="auto" style="white-space:normal;text-align:unset">Adults / Children</div><div class="TicketDetails_sub__fuChz" dir="auto" style="white-space:normal;text-align:unset">4 Years and above</div></div><p class="TicketDetails_fee__AdEbw">JPY 12,000</p></div></div></div><div class="TicketDetails_ticket-list__yQeFy"><p class="TicketDetails_sub__fuChz">Tickets</p><div class="TicketLinkItem_ticket-link-item__fNVPe"><div class="TicketLinkItem_list__h4cmf"><div class="TicketLinkItem_text__r_EeK" dir="auto" style="white-space:normal;text-align:unset">Official Ticket Store<span id="notice"></span></div><a class="TicketLinkItem_link__TMX6w" target="_blank" href="https://teamlabplanets.dmm.com/en/ticket">Buy Tickets</a></div></div></div></div></div><div class="InformationList_notes__1pBtP" id="notes"><div class="InformationNotes_information-notes__nR0Fc"><p class="InformationNotes_title__fWAgz">Notes</p><div class="InformationNotes_notes__euF5l" dir="auto" style="white-space:normal;text-align:unset"><p><strong>[Notes on purchasing tickets]</strong></p><p>・Price includes tax.</p><p>・You may have to wait 30 to 60 minutes to be admitted to the venue.</p><p>・Tickets cannot be cancelled or refunded once purchased.</p><p>・We can ask you to present your ID if you bought ”Junior high school students / High school students” ticket.</p><p>・Resale of tickets is prohibited, and visitors cannot enter with a ticket purchased through resale. The museum will not be held responsible in such cases.</p><p><br /></p><p><strong>[Important]</strong></p><p><strong>Tickets and admission</strong></p><p>・Please arrive at the venue and line up in the entrance line in time within the time stated on the ticket.</p><p>・The time stated on the ticket is not the staying time in the venue.</p><p>・Tickets purchased through the teamLab Planets TOKYO Ticket Store can be changed up to 3 times, no later than 2 hours before the admission time.</p><p>Example: For tickets from 10:00-10:30 → changes can be made until 8:00</p><p>For tickets from 19:30-20:00 → changes can be made until 17:30</p><p>・If you must leave the queue please make sure that someone in your party stays behind.</p><p>If you came alone and must leave the queue please notify a nearby member of our staff.</p><p>・Leave your stroller in the place provided before entering.</p><p>・Children under 13 years of age cannot be admitted without a parent or guardian over 18 years old. Please ensure that children enter together with their parent/guardian.</p><p>・There must be one accompanying adult for every three children, including children eligible for free entry.</p><p>・For safety reasons pregnant women are not permitted in some areas.</p><p>・Re-entry is not permitted. Please note that your ticket cannot be refunded once you have entered.</p><p><br /></p><p><strong>About the site</strong></p><p>・In the Water, you will experience the artwork barefoot. Please remove your shoes when entering the locker area.</p><p>・Some artworks involve water. Please remove socks or stockings in the locker area.</p><p>・There is water in certain areas. Water levels can rise to knee height even for adults.<br />・In artworks that use water, sodium hypochlorite is used, and chlorine levels are adjusted to meet appropriate standards.</p><p>・We recommend that small children wear clothes that they don't mind getting wet, or to bring a change of clothes for them.</p><p>・If your clothing gets wet, our staff will ask you to change. For safety reasons, we cannot allow entry into the next artwork with wet clothes. If you do not have a change of clothes, we have towels available to rent. Please wipe off your wet clothes before entering the next artwork.</p><p>* Please note that the water area is not for swimming purposes.</p><p>・Certain areas have mirrored floors. If necessary, please use the rental shorts or wraps provided.</p><p>・Shorts may be rented for free. Please inform the staff in the museum if you require a pair and return the shorts on your way out. Sizes run from XS to 6L.</p><p id="isPasted">・Some artworks cannot be experienced while wearing sandals without heel support or high-heeled footwear. Complimentary rental shoes are available.</p><p>・The site features an area with strong stimulating lights, and a dark area.</p><p>・For visitors with children, please make sure not to let go of their hand as doing so could be dangerous.</p><p>・There are detour routes for visitors, including those with disabilities and those with children, that would like to skip certain artworks. If you wish to do so, please inform the staff nearby.</p><p>・Visitors with infants may enter with a (front) baby carrier.</p><p>・There are diaper tables available at the bathrooms in the museum. If you would like to breastfeed or rest, there is a first aid room in the museum. Please feel free to inform the staff if you wish to use it.</p><p>・During rush hours, customers who have been in the same room for a long time may be asked to move forward by staff.</p><p><br /></p><p id="isPasted"><strong>About " Drawing on the Water Surface Created by the Dance of Koi and People - Infinity "</strong></p><p>・For safety and hygiene reasons, guests with an inseam of less than 40 cm cannot experience this artwork. However, they may participate if accompanied by a guardian (18 years or older) using a baby carrier or by being carried."</p><p><br /></p><p><span><strong>About "Moss Garden of Resonating Microcosms - Solidified Light Color, Dusk to Dawn"</strong><br />・In the event of light rain, the artwork will remain open to the public. In the event of typhoon-level winds or heavy rain, the artwork will not be viewable.</span></p><p><br /></p><p><strong>About baggage</strong></p><p>・There are dark areas between artworks, unstable flooring, and artworks that involve walking through water in this venue. For safety and hygiene reasons, bringing personal belongings into the artwork spaces is prohibited. If you need to carry necessary items with you for any reason, please consult with our staff.</p><p>・Free lockers are provided. After you pass the entrance gate, you can put your baggage in the locker.</p><p>23cm wide x 34cm deep x 37cm high</p><p>・Please understand beforehand that suitcases with sizes exceeding the above size will be managed with a wire lock in the stroller storage area.</p><p><br /></p><p id="isPasted"><strong>Regarding filming</strong></p><p>・Taking photos and videos are allowed but please be careful not to cause inconvenience to other visitors.</p><p>・Please refrain from using flash.</p><p>・Use of equipment such as monopods, tripods, selfie sticks, etc photographic aids of 30 cm or more is prohibited.</p><p id="isPasted">・Please note that video or photo coverage of the site may be performed without prior notice.</p><p>If you do not agree to be featured in the coverage, regardless of its application, please inform our staff.</p><p>・Filming or photography for commercial purposes is not permitted without prior consent.</p><p><br /></p><p id="isPasted"><strong>For Visitors with Disabilities</strong></p><p>・Guests using wheelchairs are requested to transfer to the museum's in-house wheelchair upon entry. Please note that these are standard-sized wheelchairs without any special fixtures.</p><p>* Please be aware that the number of in-house wheelchairs is limited.</p><p>* For safety reasons and to prevent accidents, guests using senior carts with handles or electric wheelchairs that cannot be controlled below 2 km/h are required to transfer to an in-house wheelchair to ensure the safety of guests, facilities, and artworks.</p><p>・If you wish to use your own wheelchair, tire covers must be attached.</p><p>・For artworks with mirrored floors, guests with a total weight exceeding 250 kg may be asked to refrain from entering. Our staff will guide you and determine entry availability based on floor conditions.</p><p>・For safety reasons, guests using wheelchairs may be required to take a detour route or view certain artworks only from designated areas. Please refer to "<a href="https://teamlabplanets.dmm.com/en/help#category07_711"><u>Frequently Asked Questions about Wheelchair Use</u></a>" for details.</p><p>・Entry with canes or prosthetic limbs is permitted. However, depending on the guest’s condition and the nature of each artwork, some areas may not be accessible. Before entry, our staff will explain the appropriate routes and usage guidelines according to each situation.</p><p>・For safety reasons, guests who require mobility assistance are asked to visit with a companion.</p><p>・Guests accompanied by assistance dogs will be asked to leave them in a provided cage before entering the museum.</p><p><br /></p><p><strong>Those who experience the following should use caution on the site</strong></p><p>・Those who experience muscle cramps or loss of consciousness caused by light stimulation.</p><p>・Those who experience extreme fear in confined, dark, or high places.</p><p>・Those with palpitations and shortness breath.</p><p>・Those who are pregnant or may be pregnant.</p><p>・Those carrying children in their arms.</p><p>・Others who are concerned about their physical fitness or condition.</p><p><br /></p><p><strong>The following is prohibited</strong></p><p>・Being drunk or rude.</p><p>・Eating, drinking, or smoking on site.</p><p>・Dangerous items or any items judged inappropriate by our management staff.</p><p>・Re-entry after passing through the exit.</p><p>・Bringing animals other than assistance dogs.</p><p><br /></p><p id="isPasted"><strong>Other</strong></p><p>・This facility cannot be held liable for any visitor's personal injury, loss, or other problems occurring here.</p><p>・We are not responsible for lost or stolen valuables.</p><p>・The location may not be accessible at all time due to unforeseen circumstances. We kindly ask for your understanding.</p><p><br /></p><p>* Please note that we will be unable to issue a refund to any person who were expulsed from the premises by management for failure to comply with the above.</p></div><button type="button" class="InformationNotes_read-more__bJ4Wv">View More</button></div></div></div></div></div></section><section class="_slug__related-news__QgCbb" id="news"><div class="SectionRelatedNews_section-related-news__1A7n3"><h2 class="SectionRelatedNews_title__ffAdc">News</h2><div class="SectionRelatedNews_cards__4A18c"><article class="NewsCard_news-card__yifQO" style="opacity:0"><a target="_blank" class="NewsCard_link__WI4PO" href="https://prtimes.jp/main/html/rd/p/000001119.000007339.html"><div class="NewsCard_header__HH40w"><p>Featured on PR TIMES, Oct 17, 2025</p></div><div dir="auto" class="NewsCard_body__i74oM"><h3 class="NewsCard_title__x1CDS">teamLab Planets Welcomes a Total of 10 Million Visitors: Reaching 5 Million International Visitors, and Becoming a Primary Destination in Tokyo.</h3><p class="NewsCard_text__pcQ__">teamLab Planets welcomed over 10 million visitors from more than 211 countries and regions as of October 12 September 22, 2025, just 7 years and 3 months after opening.*1
Of the total visitors, approximately 5 million were international tourists. Many came from far-reaching countries such as the United States, Australia, China/Hong Kong, Canada, the United Kingdom, and Germany, and more than 70% of visitors purchased tickets before arriving in Japan, indicating that visiting the museum was one of the reasons for their trip to Tokyo.*2

*1 According to ticket purchase data from the official teamLab Planets website (survey period: July 7, 2018 - October 12, 2025).
*2 According to visitor survey data conducted by teamLab Planets (survey period: January 1, 2025 - September 30, 2025).</p></div></a></article><article class="NewsCard_news-card__yifQO" style="opacity:0"><a target="_blank" class="NewsCard_link__WI4PO" href="https://www.worldtravelawards.com/award-asias-leading-tourist-attraction-2025"><div class="NewsCard_header__HH40w"><p>Featured on World Travel Awards, Oct 13, 2025</p></div><div dir="auto" class="NewsCard_body__i74oM"><h3 class="NewsCard_title__x1CDS">teamLab Planets Wins the World Travel Award as “Asia’s Leading Tourist Attraction”, Alongside Nominees Including the Great Wall of China and Angkor Wat: Second Award Since 2023.</h3><p class="NewsCard_text__pcQ__">teamLab Planets TOKYO DMM in Toyosu, Tokyo was announced as the winner of the World Travel Awards for Asia’s Leading Tourist Attraction 2025. This is the second time teamLab Planets has won the said award, following its first in 2023.

The World Travel Awards is one of the most prestigious honors in the travel industry, selected based on votes from travel industry professionals and the general public across more than 200 countries worldwide.

“Asia's Leading Tourist Attraction 2025” is the Asia category of the “World's Leading Tourist Attraction 2025,” which honors the world’s most outstanding travel destinations. Nominees included sites such as the Great Wall of China, the Taj Mahal, and Angkor Wat.
The nominees for Asia’s Leading Tourist Attraction 2025 were as follows (in alphabetical order):

Angkor Temples (Cambodia)
Borobudur (Indonesia)
Great Wall of China
Ha Long Bay (Vietnam)
Intramuros (Philippines)
Sengan-en and Shoko Shuseikan Museum (Kagoshima, Japan)
Taj Mahal (India)
teamLab SuperNature Macao (China)
Terracotta Warriors (China)
The Forbidden City (China)
Tokyo Imperial Palace (Japan)
Victoria Peak (Hong Kong)

World Travel Awards Official Website:
https://www.worldtravelawards.com/award-asias-leading-tourist-attraction-2025</p></div></a></article><article class="NewsCard_news-card__yifQO" style="opacity:0"><a target="_blank" class="NewsCard_link__WI4PO" href="https://honichi.com/news/2025/09/11/202509_inboundranking_tokyo/"><div class="NewsCard_header__HH40w"><p>Featured on 訪日ラボ, Sep 11, 2025</p></div><div dir="auto" class="NewsCard_body__i74oM"><h3 class="NewsCard_title__x1CDS">teamLab Planets TOKYO Ranked No. 1 for Three Consecutive Years in the “Inbound Popular Tourist Spot Ranking (Tokyo)”, Joined by Iconic Sites like Senso-ji and Tokyo Tower.</h3><p class="NewsCard_text__pcQ__">teamLab Planets was ranked first in the “2025 Inbound Popular Tourist Spot Ranking (Tokyo)” conducted by Honichi Lab, one of the largest research organizations targeting international visitors to Japan. This marks the third consecutive year that the museum has secured the first spot.

The ranking analyzed 13,671 reviews (5,701 in foreign languages) posted on Google Maps for 2,531 tourist spots within Tokyo.

【Top 10 Ranking】
1st: teamLab Planets TOKYO DMM.com
2nd: Sensō-ji Temple
3rd: Tokyo Tower
4th: Tokyo Skytree
5th: Shibuya Scramble Crossing
6th: Meiji Jingu
7th: teamLab Borderless: MORI Building DIGITAL ART MUSEUM
8th: SHIBUYA SKY
9th: Warner Bros. Studio Tour Tokyo - The Making of Harry Potter
10th: Hachiko Memorial Statue 

【Source】Honichi Lab / Kuchikomicom, “Inbound Popular Tourist Spot Ranking (Tokyo),” published September 11, 2025</p></div></a></article></div><div class="SectionRelatedNews_button__98_ud"><button type="button" class="ViewMoreButton_view-more-button__H9fVS">View More</button></div></div></section><section class="_slug__section-about___BR2j"><div class="SectionAbout_section-about__Z1NdG"><div class="SectionAbout_event__e4v0Q"><div class="InformationEvent_information-event__lNoMo"><div class="InformationEvent_table__akD60"><p class="InformationEvent_head__Iedtv">Organizers</p><div class="InformationEvent_text__k_SXA" dir="auto" style="white-space:normal;text-align:unset">PLANETS Co., Ltd</div></div><div class="InformationEvent_table__akD60"><p class="InformationEvent_head__Iedtv">Founding Partner</p><div class="InformationEvent_text__k_SXA" dir="auto" style="white-space:normal;text-align:unset">DMM.com</div></div></div></div></div></section><section class="_slug__recommend-exhibitions__3Chv3"><div class="SectionRecommendExhibitions_section-recommend-exhibitions__ppQx7"><h2 class="SectionRecommendExhibitions_title__OdBCc">Recommended Exhibitions</h2><div class="SectionRecommendExhibitions_list__3JZ_U"><a class="NearbyCard_nearby-card__nOPgi" target="" style="opacity:0" href="/e/kyoto/"><div class="NearbyCard_wrapper__HjEKJ"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="近くの展示画像" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="66.666vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/f82b4be6-d76a-41c1-deff-a5efc81ce900/width=16,quality=80 16w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/f82b4be6-d76a-41c1-deff-a5efc81ce900/width=32,quality=80 32w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/f82b4be6-d76a-41c1-deff-a5efc81ce900/width=48,q e":null,"placeCity":"Toyosu","placePrefecture":"Tokyo","type":"","snsTag":"teamLabPlanets","snsSubTag":null,"note":{"text":"","href":""},"caution":"Tickets for May will be available starting late-February.\u003cbr\u003e\u003ca href=\"#information\" style=\"color:#ffffff; font-weight:bold; text-decoration:underline;\"\u003eNotice Regarding Transportation Methods\u003c/a\u003e","sponserLogos":[],"highlight":{"title":"With Your Entire Body, Immerse, Perceive, and Become One with the Art","text":"\u003ci\u003eteamLab Planets\u003c/i\u003e is a museum where you walk through water, created by art collective teamLab.\n\u003cbr /\u003e\u003cbr /\u003e\nThe artworks change depending on the presence of people, and the existence of the artworks is continuous with your body and with others. Immerse yourself physically in the massive artwork spaces, perceive them with your body, and become one with the art."},"mainVisualUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/89JNH3JuCgHZcGbACeD2vU/public","mainVisualUrlSp":null,"mainPcVideoId":"ddJzsSS5vo0","pcMovieThumbnail":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/dYiEowjNNtPvNknTcxrQmW/public","spMovieThumbnail":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/dYiEowjNNtPvNknTcxrQmW/public","subGalleries":[{"imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/5qi5k2eUrpALhx2ZN9fbDj/public","caption":null,"isWide":false},{"imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/Y55Z4PFRQ5RKjv7BMHiVvc/public","caption":null,"isWide":false},{"imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/WW2CPsaB6LJYsYeKo5zApA/public","caption":null,"isWide":false},{"imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/kEYdnsfnNXvdKXp4vX3LW3/public","caption":null,"isWide":false},{"imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/LKZkjVrazTetfFLo6H33Bm/public","caption":null,"isWide":false},{"imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/ZKd3MQs4sevy9of7dhtLFA/p

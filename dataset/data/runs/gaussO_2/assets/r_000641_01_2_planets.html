g_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fhiw4GWA5aqKHGQT72DUS7/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fhiw4GWA5aqKHGQT72DUS7/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fhiw4GWA5aqKHGQT72DUS7/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fhiw4GWA5aqKHGQT72DUS7/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fhiw4GWA5aqKHGQT72DUS7/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fhiw4GWA5aqKHGQT72DUS7/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fhiw4GWA5aqKHGQT72DUS7/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fhiw4GWA5aqKHGQT72DUS7/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fhiw4GWA5aqKHGQT72DUS7/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/koi_and_people/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">Drawing on the Water Surface Created by the Dance of Koi and People - Infinity</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">Koi swim on the surface of water that stretches out into infinity. People can walk into the water. <br />The movement of the koi is influenced by the presence of people in the water and also other koi. When the fish collide with people they turn into flowers and scatter. Throughout a year, the flowers that bloom will change along with the seasons.<br />The trajectory of the koi is determined by the presence of people and these trajectories trace lines on the surface of the water.<br />The work is rendered in real time by a computer program. It is neither prerecorded nor on loop. The interaction between the viewer and the installation causes continuous change in the artwork. Previous visual states can never be replicated, and will never reoccur.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn DefaultThemeCard_-reverse__xDXFw"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/C8XSqFJPgzRGrZ4x3Pmsy/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/C8XSqFJPgzRGrZ4x3Pmsy/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/C8XSqFJPgzRGrZ4x3Pmsy/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/C8XSqFJPgzRGrZ4x3Pmsy/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/C8XSqFJPgzRGrZ4x3Pmsy/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/C8XSqFJPgzRGrZ4x3Pmsy/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/C8XSqFJPgzRGrZ4x3Pmsy/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/C8XSqFJPgzRGrZ4x3Pmsy/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/C8XSqFJPgzRGrZ4x3Pmsy/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/infinite_crystaluniverse/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">The Infinite Crystal Universe</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">Pointillism uses an accumulation of distinct dots of color to create a picture. Here, light points are used to create three-dimensional objects. The light sculpture extends infinitely in all directions. People use their smartphones to select stars to throw into The Infinite Crystal Universe. These stars are reborn in three dimensions, creating the artwork. The presence of people and their location within the work affect these three-dimensional stars, which in turn influence and are influenced by other stars in the space.<br />This artwork is forever evolving, changing from moment to moment due to the people in the space.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/P4sUNVi9wt3bd8wXy5msn7/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/P4sUNVi9wt3bd8wXy5msn7/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/P4sUNVi9wt3bd8wXy5msn7/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/P4sUNVi9wt3bd8wXy5msn7/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/P4sUNVi9wt3bd8wXy5msn7/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/P4sUNVi9wt3bd8wXy5msn7/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/P4sUNVi9wt3bd8wXy5msn7/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/P4sUNVi9wt3bd8wXy5msn7/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/P4sUNVi9wt3bd8wXy5msn7/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/fitfuof/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">Floating in the Falling Universe of Flowers</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">A seasonal year of flowers bloom and change with time, life spreads out into the universe.<br />Lie down or sit still in the space and eventually your body floats and you dissolve into the artwork world.<br /><br />Flowers grow, bud, bloom, and in time, the petals fall, and the flowers wither and die. The cycle of birth and death continues for perpetuity.<br />The artwork is not a pre-recorded image that is played back; it is created by a computer program that continuously renders the artwork in real time. As a whole, it is continuously changing, and previous visual states are never replicated. The universe at this moment in time can never be seen again.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn DefaultThemeCard_-reverse__xDXFw"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/8frmXUFJvNL6TG7ZuCCFnk/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/8frmXUFJvNL6TG7ZuCCFnk/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/8frmXUFJvNL6TG7ZuCCFnk/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/8frmXUFJvNL6TG7ZuCCFnk/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/8frmXUFJvNL6TG7ZuCCFnk/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/8frmXUFJvNL6TG7ZuCCFnk/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/8frmXUFJvNL6TG7ZuCCFnk/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/8frmXUFJvNL6TG7ZuCCFnk/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/8frmXUFJvNL6TG7ZuCCFnk/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/transformingspace_planets/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">Expanding Three-dimensional Existence in Transforming Space - Flattening 3 Colors and 9 Blurred Colors</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">The space is filled with spheres of light. People move through the spheres and enter the space. When the spheres change color, the space itself shifts between a collection of spheres forming a three-dimensional space and a flat color wall.<br />When people move through or push them, the spheres change color, and emit a tone specific to that color. The surrounding spheres respond one after another, resonating and emitting the same tone and light color.<br />Wherever the sphere is, the behavior of light is maintained across the whole of the space (a three-dimensional image in which one sphere is regarded as one dot). Therefore, the light behaves as a group and can be thought of as one three-dimensional existing space. At this time, the light spreads spherically around the impacted sphere.<br />Since the spheres are freely positioned within the collection of sphere elements that make up the three-dimensional space, people recognize it as existing three-dimensionally and part the spheres entering into the three-dimensional existing space.<br />The shape of the space is determined by the collection of spheres and changes according to people’s actions (pushing or colliding).<br />Before the modern era in Japan, complex colors born from the characteristics of silk were given names evocative of the four seasons. Such colors were called Kasane no Irome (nuances of layered colors), and were created by the combination of the lining and exterior fabric (silk was thin at the time so the color of the lining showed through the exterior fabric), gradations from overlapping colors, and blending of warp and weft. Since the sphere colors are produced by light, it is possible to create nine blurred colors, (light in water, sunlight on water plants, morning glow, morning sky, sky at twilight, peach, plum, iris, spring maple), as well as three colors that flatten the space (blue, red, and green), producing a total of 12 colors.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/JjgA4MxV65mSGZBeoHRWK5/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/JjgA4MxV65mSGZBeoHRWK5/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/JjgA4MxV65mSGZBeoHRWK5/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/JjgA4MxV65mSGZBeoHRWK5/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/JjgA4MxV65mSGZBeoHRWK5/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/JjgA4MxV65mSGZBeoHRWK5/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/JjgA4MxV65mSGZBeoHRWK5/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/JjgA4MxV65mSGZBeoHRWK5/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/JjgA4MxV65mSGZBeoHRWK5/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/ephemeral_solidifiedlight_planets/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">Ephemeral Crystallized Light</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">Innumerable masses of light float in the air, each one composed of multiple colors. The boundaries of each color are clearly separated as though they are solid.<br />The seemingly solid color separation of the masses of light is not seen in the natural world, and is caused by extreme synchronization. Through self-organization over time, this synchronization phenomenon creates a large ordered structure.<br /><br />When you touch a solidified light, you realize that the visible part is part of something that continues to flow without interruption.<br />Life is a phenomenon like crystals of ephemeral light, miraculously solidified into a continuum of energy that continues to flow without interruption from a past whose beginning is unknown.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn DefaultThemeCard_-reverse__xDXFw"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/A5e3rMCURnPWvutk5KhWmT/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/A5e3rMCURnPWvutk5KhWmT/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/A5e3rMCURnPWvutk5KhWmT/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/A5e3rMCURnPWvutk5KhWmT/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/A5e3rMCURnPWvutk5KhWmT/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/A5e3rMCURnPWvutk5KhWmT/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/A5e3rMCURnPWvutk5KhWmT/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/A5e3rMCURnPWvutk5KhWmT/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/A5e3rMCURnPWvutk5KhWmT/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/lightparticles/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">Waterfall of Light Particles at the Top of an Incline</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">This artwork is based on an earlier work on a natural waterfall in the mountains of Shikoku, Waterfall of Light Particles - Deep in the Mountains of Shikoku (2016-2017).<br />Light only reflects off the particles of water that make up the waterfall. The shining particles cascade down creating a waterfall of light particles. The light of the shining waterfall illuminates the surrounding area.In the darkness, the shining particles leave a light trail afterimage that appears to draw lines in space. From the combination of these afterimage light traces, the waterfall of light is born.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/qNB4LAsBRESKWQ3fZr68nV/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/qNB4LAsBRESKWQ3fZr68nV/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/qNB4LAsBRESKWQ3fZr68nV/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/qNB4LAsBRESKWQ3fZr68nV/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/qNB4LAsBRESKWQ3fZr68nV/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/qNB4LAsBRESKWQ3fZr68nV/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/qNB4LAsBRESKWQ3fZr68nV/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/qNB4LAsBRESKWQ3fZr68nV/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/qNB4LAsBRESKWQ3fZr68nV/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/soft_black_hole/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">Soft Black Hole - Your Body Becomes a Space that Influences Another Body</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">Trying to walk, the foot sinks. The space itself is affected and changed by the weight of people's bodies. And the people's bodies are affected by the changing space. People interact with each other through space. Your body changes the space, and that space changes the body of others.<br /><br />In modern life we are surrounded by flat hard surfaces, so that in our daily lives we have lost consciousness of our bodies, we have forgotten them. In natural forests flat ground does not exist. This installation is a space to remind us of the body that we have forgotten in everyday life, and to make us more conscious of our body mass.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div></div></div></div><div class="ExhibitionTheme_exhibition-theme__GkeQj ExhibitionTheme_-background__648SJ" id="theme2"><div class="ExhibitionTheme_background__zBCXb"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/taeAAEjJYLyMvAWHZoo5ne/width=640,quality=80 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/taeAAEjJYLyMvAWHZoo5ne/width=750,quality=80 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/taeAAEjJYLyMvAWHZoo5ne/width=828,quality=80 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/taeAAEjJYLyMvAWHZoo5ne/width=1080,quality=80 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/taeAAEjJYLyMvAWHZoo5ne/width=1200,quality=80 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/taeAAEjJYLyMvAWHZoo5ne/width=1920,quality=80 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/taeAAEjJYLyMvAWHZoo5ne/width=2048,quality=80 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/taeAAEjJYLyMvAWHZoo5ne/width=3840,quality=80 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/taeAAEjJYLyMvAWHZoo5ne/width=3840,quality=80"/></div></div></div><div class="ExhibitionTheme_header__UXSP6 ExhibitionTheme_-background__648SJ"><p class="ExhibitionTheme_title__FgRGq">Garden</p></div><div class="ExhibitionTheme_cards__Pyre2"><div class="DefaultThemes_default-themes__Gwuh4"><div class="DefaultThemeCard_default-theme-card__Op9Qn"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/89JNH3JuCgHZcGbACeD2vU/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/89JNH3JuCgHZcGbACeD2vU/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/89JNH3JuCgHZcGbACeD2vU/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/89JNH3JuCgHZcGbACeD2vU/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/89JNH3JuCgHZcGbACeD2vU/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/89JNH3JuCgHZcGbACeD2vU/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/89JNH3JuCgHZcGbACeD2vU/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/89JNH3JuCgHZcGbACeD2vU/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/89JNH3JuCgHZcGbACeD2vU/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/ffgarden_planets/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">Floating Flower Garden: Flowers and I are of the Same Root, the Garden and I are One</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">This floating flower garden consists of a three-dimensional mass of flowers.The artwork space is completely filled with flowers, but as the flowers float up above people, open spaces are created. Because of this, people are able to freely wander around the flower mass space. If you encounter other people within the artwork, your space will connect with theirs and become one single space.<br />Zen gardens are said to have been created as a place for groups of Zen priests to carry out training in order to become one with nature. There is a Zen kōan (a question or story that is part of Zen priests’ theological training) called “Nansen’s Flower”. Someone asked the monk Nansen about the famous saying, “Heaven and I are of the same root. All things and I are of the same substance”, remarking on how wonderful it was. Nansen, pointing to a flower in the garden, said, “People these days see this flower as if they were in a dream”.In this work, people immerse themselves in flowers, becoming one with the garden. When someone continues to look at a flower closely, the flower looks back. At that moment, they become one with the flower and may truly see flowers for the first time.<br />The flowers in this artwork are orchids. Most orchids are able to grow without soil by absorbing water from the air. The flowers in this artwork are alive, growing, and blooming with each passing day. It could be said that they are growing in mid-air. Although flowering plants were the last of the plant species to appear on earth, at least 220,000 of the 250,000 terrestrial plant species are flowering plants. Evolution has favored diversity, and it can be said that flowers were born to produce diversity. Orchids were flowering plants that most enjoyed diversity, and it is said that approximately 10% of all plant species belong to the orchid family. Because of their diversity, many orchids evolved to become most adapted to live on rocks and trees instead of land with soil where other plants grew abundantly. In an area without soil, in other words, traditionally a least favorable environment for plants, orchids evolved to be most adapted for a world without competition. They are thought to have appeared at a later stage of evolution compared to other plants, and continue to diversify to this day, making us wonder what evolution chose to favor.<br />Orchids are known to have co-evolved with certain pollen-carrying insects. The flowers’ aromas become stronger at the time of day when the partner insects are active. Because of this, the scent of the artwork space changes each moment between morning, day, evening, and night. Since many of the orchids in this work are partnered with nocturnal insects, the tightly-packed orchids produce a powerful fragrance at night.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn DefaultThemeCard_-reverse__xDXFw"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/2koqWMtuBSwiHExSLDGrHd/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/2koqWMtuBSwiHExSLDGrHd/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/2koqWMtuBSwiHExSLDGrHd/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/2koqWMtuBSwiHExSLDGrHd/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/2koqWMtuBSwiHExSLDGrHd/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/2koqWMtuBSwiHExSLDGrHd/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/2koqWMtuBSwiHExSLDGrHd/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/2koqWMtuBSwiHExSLDGrHd/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/2koqWMtuBSwiHExSLDGrHd/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/resonating_microcosms_mossgarden_planets/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">Moss Garden of Resonating Microcosms - Solidified Light Color, Dusk to Dawn</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">* Today's sunset is at 17:09
* The content of the work changes between daytime and after sunset. The artwork will glow after sunset.<br />* In the event of light rain, the artwork will remain open to the public. In the event of typhoon-level winds or heavy rain, the artwork will not be viewable.<br /><br />Ovoids that change appearance with the sunrise and sunset are laid out in the moss garden.<br /><br />With sunrise, the ovoids begin to reflect the world around them. When pushed down by a person or blown by the wind, the ovoid falls back and then rises, releasing a resonating tone. The ovoids around it also respond one after another, continuing to resonate with the same tone.<br /><br />As the sun sets, the ovoids shine by themselves. When an ovoid is pushed by a person or blown by the wind, it shines brightly and emits a sound tone, as it rights itself. The ovoids around it also respond one after another, emitting the same light color and sound tone that continues to resonate out.<br /><br />The space of the work is interactively transformed under the influence of the wind, rain, and the behavior of the people in the space, making the environment and the people a part of the work. When the wind is quiet and people are still, the ovoids begin to flicker slowly.<br /><br />teamLab is experimenting with the concept of color. The ovoids can change into a total of 61 newly-defined Solidified Light Colors.<br /><br />It is said that mosses were the first terrestrial organisms to appear in a world of rocks and sand, where there was no life on land yet. As mosses and ferns appeared and forests were created, a variety of animals became able to live on land.<br />Since water inside cells is essential for living things, if the body lacks water, it will die. Mosses, on the other hand, are poikilohydric, meaning the water content in the cells change according to surrounding humidity levels. So moss will not die during long dry periods, and they come back to life when given water. Because mosses are poikilohydric, their color and shape change dramatically when the air is dry versus when it is wet, such as when there is rain or fog.<br />Tardigrades, which live in moss, also go into a non-metabolic state of dormancy when the surrounding environment becomes dry, but they revive and become active when there is water. The state that tardigrades enter, when they are neither living nor dead, is called cryptobiosis. This may cause us to consider what it means to be alive.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div></div></div></div><div class="ExhibitionTheme_exhibition-theme__GkeQj ExhibitionTheme_-background__648SJ" id="theme3"><div class="ExhibitionTheme_background__zBCXb"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/EtNV9qNwXzugdvoSMeQ9KK/width=640,quality=80 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/EtNV9qNwXzugdvoSMeQ9KK/width=750,quality=80 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/EtNV9qNwXzugdvoSMeQ9KK/width=828,quality=80 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/EtNV9qNwXzugdvoSMeQ9KK/width=1080,quality=80 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/EtNV9qNwXzugdvoSMeQ9KK/width=1200,quality=80 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/EtNV9qNwXzugdvoSMeQ9KK/width=1920,quality=80 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/EtNV9qNwXzugdvoSMeQ9KK/width=2048,quality=80 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/EtNV9qNwXzugdvoSMeQ9KK/width=3840,quality=80 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/EtNV9qNwXzugdvoSMeQ9KK/width=3840,quality=80"/></div></div></div><div class="ExhibitionTheme_header__UXSP6 ExhibitionTheme_-background__648SJ"><p class="ExhibitionTheme_title__FgRGq">Athletics Forest</p><div class="ExhibitionTheme_description__9puJd" dir="auto" style="white-space:normal;text-align:unset"><div><div><div><div><div><div><div><div><p>A high-dimensional thinking athletics space based on the concept of perceiving the world with your body and thinking about it high-dimensionally. In a complex and challenging space, you will be immersed in a physically challenging four-dimensional world where time changes with the presence of your body.</p></div></div></div></div></div></div></div></div></div><div class="ExhibitionTheme_concept__FZBxg ExhibitionTheme_-background__648SJ"><a class="ExhibitionTheme_button__wVG5w" target="_blank" href="/concept/athleticsforest/planets/">View More</a></div></div><div class="ExhibitionTheme_cards__Pyre2"><div class="DefaultThemes_default-themes__Gwuh4"><div class="DefaultThemeCard_default-theme-card__Op9Qn"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/iS7XcMxD5wNevrfeT8Rcb8/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/iS7XcMxD5wNevrfeT8Rcb8/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/iS7XcMxD5wNevrfeT8Rcb8/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/iS7XcMxD5wNevrfeT8Rcb8/width=1080,quality=100 1080w, ht ding_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/9489NUy39TGCkfRbHuVpaM/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/9489NUy39TGCkfRbHuVpaM/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/9489NUy39TGCkfRbHuVpaM/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/9489NUy39TGCkfRbHuVpaM/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/9489NUy39TGCkfRbHuVpaM/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/9489NUy39TGCkfRbHuVpaM/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/9489NUy39TGCkfRbHuVpaM/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/9489NUy39TGCkfRbHuVpaM/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/9489NUy39TGCkfRbHuVpaM/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/multijumpinguniverse-planets/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">Multi Jumping Universe</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">* This experience is available for guests aged 20 and under only.<br /><br />Multi Jumping is a flexible surface that people can jump on, and sink or jump higher than usual. <br />When you stand on Multi Jumping, the surface beneath your feet sinks, creating warps in space and time. This distortion attracts stardust from the universe and births new stars. If you jump on top of a star, it begins to move, and if you continue to jump on the star it will grow and you will be able to experience the entire life cycle of the star. When the life of the star ends, it returns to stardust and becomes the building blocks of new stars.A gigantic and heavy star will eventually become a black hole that swallows up all the surrounding stars and stardust.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/AzUgz6U6eQRPXfjZzhipgi/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/AzUgz6U6eQRPXfjZzhipgi/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/AzUgz6U6eQRPXfjZzhipgi/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/AzUgz6U6eQRPXfjZzhipgi/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/AzUgz6U6eQRPXfjZzhipgi/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/AzUgz6U6eQRPXfjZzhipgi/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/AzUgz6U6eQRPXfjZzhipgi/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/AzUgz6U6eQRPXfjZzhipgi/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/AzUgz6U6eQRPXfjZzhipgi/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/coloredbirds-planets/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">Aerial Climbing through a Flock of Colored Birds</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">Aerial Climbing is a space where horizontal bars of varying colors are suspended by ropes and float three-dimensionally in the air. People use these bars to navigate the space in mid-air through three dimensions, trying not to fall. As the bars are linked, the movement caused on a bar by a person will affect the bars on which other people are standing. The arrangement of the bars vary depending on the selected route, so people’s experiences will differ depending on the various ways the bars are linked.When people climb onto the bars, they shine brightly and produce a sound specific to its color. The more people climb onto bars of different colors, the more sounds will be played at the same time.<br />Flocks of birds fly around freely in this space. When they fly near the people in the space, they take on the color of the bars on which the people stand.<br />The movement of thousands of birds is beautiful and mysterious, appearing like a single giant life form. The flock has neither a leader nor mutual consensus, but it is said that the birds move on the simple basis of; if my neighbor moves, then I move too. However, the biological mechanism that causes hundreds of birds to move at the same time remains a mystery. It seems there is a universal principle that humans have yet to understand. Likewise, the arrangement of color of the flock is not predetermined. Influenced by people, the birds move, based on a primitive rule unknown to humankind, which in turn creates a complex and beautiful coloration in the space.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn DefaultThemeCard_-reverse__xDXFw"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fVaigaQcaHy4aGVy2XrL6c/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fVaigaQcaHy4aGVy2XrL6c/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fVaigaQcaHy4aGVy2XrL6c/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fVaigaQcaHy4aGVy2XrL6c/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fVaigaQcaHy4aGVy2XrL6c/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fVaigaQcaHy4aGVy2XrL6c/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fVaigaQcaHy4aGVy2XrL6c/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fVaigaQcaHy4aGVy2XrL6c/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fVaigaQcaHy4aGVy2XrL6c/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/balancesteppingstones-planets/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">Balance Stepping Stones in the Invisible World</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">Balance Stepping Stones are stepping stones that interactively change when a person steps on them, emitting a color and tone that affect the space. When a person steps on a stone, it wobbles in various ways.<br /><br />While jumping across the Balance Stepping Stones, people cross over into the normally invisible world of microorganisms. When a person steps on a Balance Stepping Stone, that stone’s color is transmitted to the microscopic life.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/dkbiBVbLMaAZoA8VG9gJx3/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/dkbiBVbLMaAZoA8VG9gJx3/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/dkbiBVbLMaAZoA8VG9gJx3/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/dkbiBVbLMaAZoA8VG9gJx3/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/dkbiBVbLMaAZoA8VG9gJx3/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/dkbiBVbLMaAZoA8VG9gJx3/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/dkbiBVbLMaAZoA8VG9gJx3/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/dkbiBVbLMaAZoA8VG9gJx3/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/dkbiBVbLMaAZoA8VG9gJx3/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/graffitinature-planets/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">Graffiti Nature</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">Graffiti Nature is an ecosystem of creatures drawn by people.<br />Color in a creature on the paper provided, and see the picture you have drawn come to life and move in front of you.Living things eat and and are eaten by other living things in one shared ecosystem. The creatures you draw will multiply if they eat other living things, but they will die and disappear if they do not eat enough, or if they are eaten by other creatures.<br />The salamanders eat the snakes, the snakes eat the lizards, the lizards eat the frogs, and the frogs eat the butterflies, each one propagating as a result. Likewise, the butterflies multiply in places where flowers grow. Although flowers will bloom if people stay still, their petals will scatter if people walk around and step on them. The salamanders will die if people step on them too much. Living creatures spread throughout the world, increasing and decreasing in number. The creatures you have drawn may be increasing somewhere.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn DefaultThemeCard_-reverse__xDXFw"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="Youtub t bounces like a ball, but when people use their entire body to gather and collect the droplets, they act like water.<br />A water molecule on its own is not liquid. In order for water to be a liquid, many water molecules must come together.Because water molecules act like magnets, they stick to each other, forming a group of water molecules (a water cluster). Water clusters have an extremely short lifespan and are thought to be constantly being created and broken apart. They have a very dynamic structure and because of that, water can change into various forms.<br />Most living things and objects in this world, through properties that are more than the simple sum of the properties of their parts, appear as a whole.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn"><div class="DefaultThemeCard_wrapper__aEiVb DefaultThemeCard_-image__ptVhz"><div class="DefaultThemeCard_card__i37fL"><img alt="展示テーマ画像" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="(max-width: 740px) 80vw , 50vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/DTZ3ykpahiDhWem72EqdGk/width=384,quality=100 384w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/DTZ3ykpahiDhWem72EqdGk/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/DTZ3ykpahiDhWem72EqdGk/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/DTZ3ykpahiDhWem72EqdGk/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/DTZ3ykpahiDhWem72EqdGk/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/DTZ3ykpahiDhWem72EqdGk/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/DTZ3ykpahiDhWem72EqdGk/width=1920,quality=100 1920w, https://assets.team  />Because water molecules act like magnets, they stick to each other, forming a group of water molecules (a water cluster). Water clusters have an extremely short lifespan and are thought to be constantly being created and broken apart. They have a very dynamic structure and because of that, water can change into various forms.<br /><br />Most living things and objects in this world, through properties that are more than the simple sum of the properties of their parts, appear as a whole.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn DefaultThemeCard_-reverse__xDXFw"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/RKUP4jCoFw2vbkpovfrjt8/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/RKUP4jCoFw2vbkpovfrjt8/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/RKUP4jCoFw2vbkpovfrjt8/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/RKUP4jCoFw2vbkpovfrjt8/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/RKUP4jCoFw2vbkpovfrjt8/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/RKUP4jCoFw2vbkpovfrjt8/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/RKUP4jCoFw2vbkpovfrjt8/width=2048,quality=100 2048w,  https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/SSvFvTkW74zf22EVqeEWZk/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/SSvFvTkW74zf22EVqeEWZk/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/SSvFvTkW74zf22EVqeEWZk/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/SSvFvTkW74zf22EVqeEWZk/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/SSvFvTkW74zf22EVqeEWZk/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/autonomousabstraction-planets/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">Autonomous Abstraction</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">Autonomous abstraction.The dots of light blink and change color in cycles unique to each dot. A spontaneous order phenomenon occurs between dots that are close to each other, and their hues and the rhythm at which they blink gradually synchronize. When people touch them, the rhythm of the blinking hues change and are randomized, but the dots close to each other once again cause a spontaneous order phenomenon between them.The dots of lights emit a tone each time they blink. The tones can be heard continuously throughout the space; what sounds like music is solely created by the continuous tones produced by the blinking lights.<br />A spontaneous order phenomenon occurs when different rhythms influence each other and synchronize. Examples include when the pendulums of two clocks gradually begin to swing together; when many fireflies gather in one tree and all start blinking at the same time, creating a larger light as a whole; or when the cells that make up the heart synchronize and tremble simultaneously to create the pulse of the heart. This can be seen in various systems, from physical phenomena, neurophysiology, to ecosystems. Although the individual parts do not have the ability to observe the whole, the phenomenon of self-organization is the creation of an ordered and larger structure, resulting from the autonomous behavior of each individual part influencing each other. This phenomenon is also known as spontaneous order.<br />It is believed that entropy (a measurement of the lack of order in a system) in the universe will steadily increase (the law of increasing entropy) and that entities with form eventually collapse. Despite that, it is a wonder that the sun was created and the planets were born, that life was formed and societies exist. However, the reason why the universe, life, nature, and society continue to be maintained in spite of this may be because order is continuously formed on its own through the shared phenomenon of self-organization in the midst of disorder. In other words, the universe and our own existence are a continuous order created by the same phenomenon.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn DefaultThemeCard_-reverse__xDXFw"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/ibunvWwjAWnRGMe3Y8BrwE/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/ibunvWwjAWnRGMe3Y8BrwE/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/ibunvWwjAWnRGMe3Y8BrwE/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/ibunvWwjAWnRGMe3Y8BrwE/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/ibunvWwjAWnRGMe3Y8BrwE/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/ibunvWwjAWnRGMe3Y8BrwE/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/ibunvWwjAWnRGMe3Y8BrwE/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/ibunvWwjAWnRGMe3Y8BrwE/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/ibunvWwjAWnRGMe3Y8BrwE/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/existence-flow-vortices-planets/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">Existence in the Flow Creates Vortices</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">Vortices are created behind people as they climb against the flow.<br /><br />Although a vortex is steady, it is constantly moving and swelling like a powerful life-form.<br />Despite the existence of the vortex being maintained, the water particles that form it change from moment to moment. The vortex that is being seen now is created by completely different water from the same vortex seen a few minutes ago. The vortex, unlike a rock, cannot maintain a stable structure on its own; rather, it is created and sustained by the energy of water that continuously flows inwards and outwards.<br />A vortex looks like a life-form because life similarly consumes external energy and matter and discharges it, sustaining its ordered structure within that flow. Life is a miraculous vortex that emerges from a flow of energy in a continuous world.<br /><br />Water is depicted as a continuum of countless water particles, and the interactions between the particles are calculated to create a three-dimensional simulation of their movement. The vortices create lines from the trails of these particles. The collection of three-dimensional lines are then cut out using what teamLab calls Ultrasubjective Space. In contrast to space that is created through, or cut out by, lenses and perspective, Ultrasubjective Space does not fix the viewer’s viewpoint and in turn frees their body. The floor and walls that the vortices are seen on do not become a boundary between the viewer and the artwork, and the artwork space becomes continuous with the space in which the viewer’s body exists.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div></div></div></div><div class="ExhibitionTheme_exhibition-theme__GkeQj ExhibitionTheme_-background__648SJ" id="theme4"><div class="ExhibitionTheme_background__zBCXb"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/7VaMWEeifVgknqvSMoXJn5/width=640,quality=80 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/7VaMWEeifVgknqvSMoXJn5/width=750,quality=80 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/7VaMWEeifVgknqvSMoXJn5/width=828,quality=80 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/7VaMWEeifVgknqvSMoXJn5/width=1080,quality=80 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/7VaMWEeifVgknqvSMoXJn5/width=1200,quality=80 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/7VaMWEeifVgknqvSMoXJn5/width=1920,quality=80 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/7VaMWEeifVgknqvSMoXJn5/width=2048,quality=80 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/7VaMWEeifVgknqvSMoXJn5/width=3840,quality=80 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/7VaMWEeifVgknqvSMoXJn5/width=3840,quality=80"/></div></div></div><div class="ExhibitionTheme_header__UXSP6 ExhibitionTheme_-background__648SJ"><p class="ExhibitionTheme_title__FgRGq">Future Park</p><div class="ExhibitionTheme_description__9puJd" dir="auto" style="white-space:normal;text-align:unset"><div><p>An educational project based on the concept of collaborative creativity. Freely create the world together with others.</p></div></div><div class="ExhibitionTheme_concept__FZBxg ExhibitionTheme_-background__648SJ"><a class="ExhibitionTheme_button__wVG5w" target="_blank" href="/concept/co-creation/planets/">View More</a></div></div><div class="ExhibitionTheme_cards__Pyre2"><div class="DefaultThemes_default-themes__Gwuh4"><div class="DefaultThemeCard_default-theme-card__Op9Qn"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fAtYvpFemLZy3ZpjhqoBMK/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fAtYvpFemLZy3ZpjhqoBMK/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fAtYvpFemLZy3ZpjhqoBMK/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fAtYvpFemLZy3ZpjhqoBMK/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fAtYvpFemLZy3ZpjhqoBMK/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fAtYvpFemLZy3ZpjhqoBMK/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fAtYvpFemLZy3ZpjhqoBMK/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fAtYvpFemLZy3ZpjhqoBMK/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fAtYvpFemLZy3ZpjhqoBMK/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/sketchumwelt-planets/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">Sketch Umwelt World</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">Color in an airplane, dolphin, hawk, or butterfly on the paper provided and see the picture you have drawn appear three-dimensionally, flying through the artwork world. If you touch them, they speed up or fly away.You can control the plane, dolphin, hawk, or butterfly with your smartphone and see the world from their perspectives on the screen.<br />Each living creature understands the world only through their own perception, so the world looks different depending on the creature. Such worlds constructed upon each creature’s unique perceptual experiences are called umwelt. Here, you control the airplane through a lens like a pilot. However, if a living creature is chosen, you can control them and see the world in a completely different way.<br />Dolphins emit sounds and perceive the world through the echoes. Just as the sound of striking metal differs from that of plastic, they can even recognize differences in materials. While fresh flowers and artificial flowers may appear the same to humans, dolphins perceive them as entirely different. Since dolphins' eyes do not recognize the color of light, the world they experience may be a world of colors completely different from that of humans.<br />Hawks can see two things clearly at once. When a person focuses on one thing, it is difficult to see the surrounding elements. However, hawks can observe small creatures on the ground while looking ahead of them as they fly. Tap an area you want to zoom in on the smartphone, and that area will appear bigger on the screen.<br />Butterflies have a 344-degree horizontal field of vision, and almost a 360-degree vertical field of vision. With the smartphone, you can see the world not only in front of you, but on both sides and behind you as well.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn DefaultThemeCard_-reverse__xDXFw"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/niRaXmLM8j3xkxK5bBpqiR/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/niRaXmLM8j3xkxK5bBpqiR/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/niRaXmLM8j3xkxK5bBpqiR/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/niRaXmLM8j3xkxK5bBpqiR/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/niRaXmLM8j3xkxK5bBpqiR/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/niRaXmLM8j3xkxK5bBpqiR/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/niRaXmLM8j3xkxK5bBpqiR/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/niRaXmLM8j3xkxK5bBpqiR/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/niRaXmLM8j3xkxK5bBpqiR/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/littlepeople-table-planets/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">A Table where Little People Live</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">This is a table where little people live.<br />If you put something, such as your hand, on top of the table, the little people will jump on to it. Depending on the shape of the objects you place on the table, the little people will slide, jump, or climb. Place many objects on the table and see the little people’s world transform into a completely new world.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/UmAca6bNXthDK24iTEvw5e/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/UmAca6bNXthDK24iTEvw5e/  More</div></div></a></div><div class="DefaultThemeCard_default-theme-card__Op9Qn DefaultThemeCard_-reverse__xDXFw"><div class="DefaultThemeCard_wrapper__aEiVb"><div class="DefaultThemeCard_card__i37fL"><div class="YoutubeVideo_youtube-video__Ys_RL YoutubeVideo_-theme__4DmhW"><div class="YoutubeVideo_wrapper__yrKZW"><div class="YoutubeVideo_card__Lyj2H"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/QLfewZUfZU9hDM5zsN35MT/width=640,quality=100 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/QLfewZUfZU9hDM5zsN35MT/width=750,quality=100 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/QLfewZUfZU9hDM5zsN35MT/width=828,quality=100 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/QLfewZUfZU9hDM5zsN35MT/width=1080,quality=100 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/QLfewZUfZU9hDM5zsN35MT/width=1200,quality=100 1200w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/QLfewZUfZU9hDM5zsN35MT/width=1920,quality=100 1920w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/QLfewZUfZU9hDM5zsN35MT/width=2048,quality=100 2048w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/QLfewZUfZU9hDM5zsN35MT/width=3840,quality=100 3840w" src="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/QLfewZUfZU9hDM5zsN35MT/width=3840,quality=100"/></div></div></div><div class="YoutubeVideo_icon__AEc7M"></div></div></div></div></div><a class="DefaultThemeCard_content__wdFNB" target="_blank" href="/ew/littlepeople-universe-planets/planets/"><p dir="auto" class="DefaultThemeCard_title__Dh9iJ">A Window to the Universe where Little People Live</p><div class="DefaultThemeCard_description__YiX3R" dir="auto" style="white-space:pre-wrap;text-align:unset">This is a window into the universe where little people live.<br />You can create a picture by drawing lines with a light pen or creating shapes with a light stamp. Each line has a special power depending on its color, and influences the little people’s world. The shapes created by the light stamps appear in the little people’s world and start to move.<br />Yellow lines make the little people bounce and fly.Blue lines speed up the little people, making them run faster.Pink lines make the little people bounce like on a rubber band, and the reverberations are transferred along the line.Purple lines have gravity and attract the little people to them.Green lines form shapes and they start to move.<br />Draw a big picture and try lots of stamps together with those around you. Create a new world in the little people’s universe, give them various powers and watch their world transform into a new world.</div><div class="DefaultThemeCard_button__A5Sue"><div class="DefaultThemeCard_view-more-link__DVjH2">View More</div></div></a></div></div></div></div><div class="ExhibitionTheme_exhibition-theme__GkeQj ExhibitionTheme_-background__648SJ" id="theme5"><div class="ExhibitionTheme_background__zBCXb"><div class="ImageWithLoading_image-wrapper__XYPcK ImageWithLoading_-loading__12YU0"><div class="ImageWithLoading_image__VIoaF"><img alt="" loading="lazy" decoding="async" data-nimg="fill" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;object-fit:cover;color:transparent" sizes="80vw" srcSet="https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/WEFZVD8F8CsVTWYVnwxbFB/width=640,quality=80 640w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/WEFZVD8F8CsVTWYVnwxbFB/width=750,quality=80 750w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/WEFZVD8F8CsVTWYVnwxbFB/width=828,quality=80 828w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/WEFZVD8F8CsVTWYVnwxbFB/width=1080,quality=80 1080w, https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/

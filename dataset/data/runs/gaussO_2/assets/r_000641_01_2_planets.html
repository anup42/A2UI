:null,"subSegment":null,"fee":null,"isFeeFluctuation":false},{"segment":null,"subSegment":null,"fee":null,"isFeeFluctuation":false}]}],"ticketLinks":[{"linkTitle":"Official Ticket Store\u003cspan id=\"notice\"\u003e\u003c/span\u003e","linkUrl":"https://teamlabplanets.dmm.com/en/ticket","wechatImageUrl":null}],"accessMajor":[{"title":"By Train","description":"1 minute on foot from North exit of Shin-Toyosu Station\n(Tokyo Waterfront New Transit Waterfront Line Yurikamome Line)\n5 minutes on foot from Shijoumae Station and Toyosu Market\n(Tokyo Waterfront New Transit Waterfront Line Yurikamome Line)\n10 minutes on foot from Exit 7 of Toyosu Station\n(Tokyo Metro Yurakucho Line)"},{"title":"By Taxi","description":"* Disembarking near the front entrance of the facility is very dangerous. Please exit the taxi following the security guard's instructions.\n\n10 minutes by taxi from Ginza\n- Go straight on Harumi Street in the direction of Ariake and turn left at the traffic light of [Harumi Ohashi Minamizume].\n- Turn left and you will see teamLab Planets TOKYO on your left.\n\n15 minutes by taxi from Tokyo Station\n- Sotobori-dori → [Kurehata] → Eiyo-dori → [Nihonbashi] → Chuo-dori → [Ginza 4-chome] → Harumi-dori\n- Go straight on Harumi Street in the direction of Ariake and turn left at the traffic light of [Harumi Ohashi Minamizume].\n- Turn left and you will see teamLab Planets TOKYO on your left.\n\n15 minutes by highway from Haneda Airport\n- Metropolitan Expressway Wangan Line → [Shinonome JCT] → Metropolitan Expressway 10 Harumi Line → [Toyosu] Exit\n- Go straight from [Toyosu] Exit and turn right at the traffic light of [Harumi Ohashi Minamizume].\n- Turn right and you will see teamLab Planets TOKYO on your left."},{"title":"Shuttle Bus (with a fee)","description":"Dedicated Shuttle Buses (with a fee) are available between GINZA SIX and teamLab Planets.\nClick \u003ca href=\"https://www.klook.com/en-US/activity/121902-teamlab-planets-tokyo-tokyo-station-bus-terminal-yaesu-ginza-six-shuttle-bus-ticket/\" target=\"_blank\"\u003ehere\u003c/a\u003e for details.\n* Currently, there is significant congestion on the public buses from Tokyo Station, Ginza, and Tsukiji towards Shin-Toyosu.\nPlease consider using other public transportation methods to visit."},{"title":"Parking","description":"\u003cstrong\u003e[Weekdays only] Free 1-Hour Parking Ticket at LaLaport Toyosu\u003c/strong\u003e\nIf you present your same-day ticket for teamLab Planets TOKYO at Urban dock LaLaport TOYOSU, you will be granted one hour of free parking.\n\nParking service location *The reception location varies depending on where you purchased your ticket from.: \n- teamLab Planets Official Tickets (Tickets purchased from the facility's vending machine and tickets purchased on the official website), tickets purchased at convenience stores (LAWSON Ticket, Seven Ticket).: \n\u0026#9656; Urban dock LaLaport TOYOSU 1 3F Card Desk\n\n- Other tickets (Ctirp, HIS GO, KLOOK, etc.):\n\u0026#9656; Urban Dock LaLaport Toyosu1 1F General Information Center\n\nUrban Dock LaLaport Toyosu\nPlease show your parking ticket when entering the parking lot.\n\nReception Hours: 11:00 - 19:00\n* This will not be available February 4, 2026.\n\n* The Parking lot of Toyosu Bayside Cross Tower is not included in the service.\n* Please note that conditions and prices are subject to change without advance notice.\n* Parking service tickets will be marked upon entry.\n* The parking service ticket is only valid on day of entry.\n* Lost parking service tickets will not be reissued.\n* Please note that there may be a wait at times of high traffic.\n\u003ca href=\"https://mitsui-shopping-park.com/lalaport/toyosu/campaign/pdf/teamlab.pdf\" taget=\"_blank\"\u003eFor more information\u0026gt;\u0026gt;\u003c/a\u003e\n\n\u003cspan style=\"color:#cc0000;\"\u003eThis venue does not have any parking.\u003c/span\u003e"}],"notes":"\u003cp\u003e\u003cstrong\u003e[Notes on purchasing tickets]\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e・Price includes tax.\u003c/p\u003e\u003cp\u003e・You may have to wait 30 to 60 minutes to be admitted to the venue.\u003c/p\u003e\u003cp\u003e・Tickets cannot be cancelled or refunded once purchased.\u003c/p\u003e\u003cp\u003e・We can ask you to present your ID if you bought ”Junior high school students / High school students” ticket.\u003c/p\u003e\u003cp\u003e・Resale of tickets is prohibited, and visitors cannot enter with a ticket purchased through resale. The museum will not be held responsible in such cases.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003e[Important]\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eTickets and admission\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e・Please arrive at the venue and line up in the entrance line in time within the time stated on the ticket.\u003c/p\u003e\u003cp\u003e・The time stated on the ticket is not the staying time in the venue.\u003c/p\u003e\u003cp\u003e・Tickets purchased through the teamLab Planets TOKYO Ticket Store can be changed up to 3 times, no later than 2 hours before the admission time.\u003c/p\u003e\u003cp\u003eExample: For tickets from 10:00-10:30 → changes can be made until 8:00\u003c/p\u003e\u003cp\u003eFor tickets from 19:30-20:00 → changes can be made until 17:30\u003c/p\u003e\u003cp\u003e・If you must leave the queue please make sure that someone in your party stays behind.\u003c/p\u003e\u003cp\u003eIf you came alone and must leave the queue please notify a nearby member of our staff.\u003c/p\u003e\u003cp\u003e・Leave your stroller in the place provided before entering.\u003c/p\u003e\u003cp\u003e・Children under 13 years of age cannot be admitted without a parent or guardian over 18 years old. Please ensure that children enter together with their parent/guardian.\u003c/p\u003e\u003cp\u003e・There must be one accompanying adult for every three children, including children eligible for free entry.\u003c/p\u003e\u003cp\u003e・For safety reasons pregnant women are not permitted in some areas.\u003c/p\u003e\u003cp\u003e・Re-entry is not permitted. Please note that your ticket cannot be refunded once you have entered.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eAbout the site\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e・In the Water, you will experience the artwork barefoot. Please remove your shoes when entering the locker area.\u003c/p\u003e\u003cp\u003e・Some artworks involve water. Please remove socks or stockings in the locker area.\u003c/p\u003e\u003cp\u003e・There is water in certain areas. Water levels can rise to knee height even for adults.\u003cbr\u003e・In artworks that use water, sodium hypochlorite is used, and chlorine levels are adjusted to meet appropriate standards.\u003c/p\u003e\u003cp\u003e・We recommend that small children wear clothes that they don't mind getting wet, or to bring a change of clothes for them.\u003c/p\u003e\u003cp\u003e・If your clothing gets wet, our staff will ask you to change. For safety reasons, we cannot allow entry into the next artwork with wet clothes. If you do not have a change of clothes, we have towels available to rent. Please wipe off your wet clothes before entering the next artwork.\u003c/p\u003e\u003cp\u003e* Please note that the water area is not for swimming purposes.\u003c/p\u003e\u003cp\u003e・Certain areas have mirrored floors. If necessary, please use the rental shorts or wraps provided.\u003c/p\u003e\u003cp\u003e・Shorts may be rented for free. Please inform the staff in the museum if you require a pair and return the shorts on your way out. Sizes run from XS to 6L.\u003c/p\u003e\u003cp id=\"isPasted\"\u003e・Some artworks cannot be experienced while wearing sandals without heel support or high-heeled footwear. Complimentary rental shoes are available.\u003c/p\u003e\u003cp\u003e・The site features an area with strong stimulating lights, and a dark area.\u003c/p\u003e\u003cp\u003e・For visitors with children, please make sure not to let go of their hand as doing so could be dangerous.\u003c/p\u003e\u003cp\u003e・There are detour routes for visitors, including those with disabilities and those with children, that would like to skip certain artworks. If you wish to do so, please inform the staff nearby.\u003c/p\u003e\u003cp\u003e・Visitors with infants may enter with a (front) baby carrier.\u003c/p\u003e\u003cp\u003e・There are diaper tables available at the bathrooms in the museum. If you would like to breastfeed or rest, there is a first aid room in the museum. Please feel free to inform the staff if you wish to use it.\u003c/p\u003e\u003cp\u003e・During rush hours, customers who have been in the same room for a long time may be asked to move forward by staff.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp id=\"isPasted\"\u003e\u003cstrong\u003eAbout \" Drawing on the Water Surface Created by the Dance of Koi and People - Infinity \"\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e・For safety and hygiene reasons, guests with an inseam of less than 40 cm cannot experience this artwork. However, they may participate if accompanied by a guardian (18 years or older) using a baby carrier or by being carried.\"\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cspan data-sheets-userformat='{\"2\":7043,\"3\":{\"1\":0},\"4\":[null,2,16776960],\"10\":0,\"11\":4,\"12\":0,\"14\":[null,2,0],\"15\":\"arial,sans,sans-serif\"}' data-sheets-value='{\"1\":2,\"2\":\"About \\\"Moss Garden of Resonating Microcosms - Solidified Light Color, Sunrise and Sunset\\\"\\n・In the event of light rain, the artwork will remain open to the public. In the event of typhoon-level winds or heavy rain, the artwork will not be viewable.\"}'\u003e\u003cstrong\u003eAbout \"Moss Garden of Resonating Microcosms - Solidified Light Color, Dusk to Dawn\"\u003c/strong\u003e\u003cbr\u003e・In the event of light rain, the artwork will remain open to the public. In the event of typhoon-level winds or heavy rain, the artwork will not be viewable.\u003c/span\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eAbout baggage\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e・There are dark areas between artworks, unstable flooring, and artworks that involve walking through water in this venue. For safety and hygiene reasons, bringing personal belongings into the artwork spaces is prohibited. If you need to carry necessary items with you for any reason, please consult with our staff.\u003c/p\u003e\u003cp\u003e・Free lockers are provided. After you pass the entrance gate, you can put your baggage in the locker.\u003c/p\u003e\u003cp\u003e23cm wide x 34cm deep x 37cm high\u003c/p\u003e\u003cp\u003e・Please understand beforehand that suitcases with sizes exceeding the above size will be managed with a wire lock in the stroller storage area.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp id=\"isPasted\"\u003e\u003cstrong\u003eRegarding filming\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e・Taking photos and videos are allowed but please be careful not to cause inconvenience to other visitors.\u003c/p\u003e\u003cp\u003e・Please refrain from using flash.\u003c/p\u003e\u003cp\u003e・Use of equipment such as monopods, tripods, selfie sticks, etc photographic aids of 30 cm or more is prohibited.\u003c/p\u003e\u003cp id=\"isPasted\"\u003e・Please note that video or photo coverage of the site may be performed without prior notice.\u003c/p\u003e\u003cp\u003eIf you do not agree to be featured in the coverage, regardless of its application, please inform our staff.\u003c/p\u003e\u003cp\u003e・Filming or photography for commercial purposes is not permitted without prior consent.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp id=\"isPasted\"\u003e\u003cstrong\u003eFor Visitors with Disabilities\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e・Guests using wheelchairs are requested to transfer to the museum's in-house wheelchair upon entry. Please note that these are standard-sized wheelchairs without any special fixtures.\u003c/p\u003e\u003cp\u003e* Please be aware that the number of in-house wheelchairs is limited.\u003c/p\u003e\u003cp\u003e* For safety reasons and to prevent accidents, guests using senior carts with handles or electric wheelchairs that cannot be controlled below 2 km/h are required to transfer to an in-house wheelchair to ensure the safety of guests, facilities, and artworks.\u003c/p\u003e\u003cp\u003e・If you wish to use your own wheelchair, tire covers must be attached.\u003c/p\u003e\u003cp\u003e・For artworks with mirrored floors, guests with a total weight exceeding 250 kg may be asked to refrain from entering. Our staff will guide you and determine entry availability based on floor conditions.\u003c/p\u003e\u003cp\u003e・For safety reasons, guests using wheelchairs may be required to take a detour route or view certain artworks only from designated areas. Please refer to \"\u003ca href=\"https://teamlabplanets.dmm.com/en/help#category07_711\"\u003e\u003cu\u003eFrequently Asked Questions about Wheelchair Use\u003c/u\u003e\u003c/a\u003e\" for details.\u003c/p\u003e\u003cp\u003e・Entry with canes or prosthetic limbs is permitted. However, depending on the guest’s condition and the nature of each artwork, some areas may not be accessible. Before entry, our staff will explain the appropriate routes and usage guidelines according to each situation.\u003c/p\u003e\u003cp\u003e・For safety reasons, guests who require mobility assistance are asked to visit with a companion.\u003c/p\u003e\u003cp\u003e・Guests accompanied by assistance dogs will be asked to leave them in a provided cage before entering the museum.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eThose who experience the following should use caution on the site\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e・Those who experience muscle cramps or loss of consciousness caused by light stimulation.\u003c/p\u003e\u003cp\u003e・Those who experience extreme fear in confined, dark, or high places.\u003c/p\u003e\u003cp\u003e・Those with palpitations and shortness breath.\u003c/p\u003e\u003cp\u003e・Those who are pregnant or may be pregnant.\u003c/p\u003e\u003cp\u003e・Those carrying children in their arms.\u003c/p\u003e\u003cp\u003e・Others who are concerned about their physical fitness or condition.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cstrong\u003eThe following is prohibited\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e・Being drunk or rude.\u003c/p\u003e\u003cp\u003e・Eating, drinking, or smoking on site.\u003c/p\u003e\u003cp\u003e・Dangerous items or any items judged inappropriate by our management staff.\u003c/p\u003e\u003cp\u003e・Re-entry after passing through the exit.\u003c/p\u003e\u003cp\u003e・Bringing animals other than assistance dogs.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp id=\"isPasted\"\u003e\u003cstrong\u003eOther\u003c/strong\u003e\u003c/p\u003e\u003cp\u003e・This facility cannot be held liable for any visitor's personal injury, loss, or other problems occurring here.\u003c/p\u003e\u003cp\u003e・We are not responsible for lost or stolen valuables.\u003c/p\u003e\u003cp\u003e・The location may not be accessible at all time due to unforeseen circumstances. We kindly ask for your understanding.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e* Please note that we will be unable to issue a refund to any person who were expulsed from the premises by management for failure to comply with the above.\u003c/p\u003e","freeSection":[],"faq":{"faqList":[{"title":"Regarding entry","slug":"planets_faq1","faqBox":[{"question":"\u003ca name=\"faq_01\"\u003e\u003c/a\u003eI will be late for the admission time.","answer":"You can still enter teamLab Planets Tokyo if you arrive on site within the same day during open hours. Please ask a nearby staff at the venue.\r\n* Last admission is 1 hour before closing."}]},{"title":"About Tickets","slug":"planets_faq_new2","faqBox":[{"question":"Are tickets available at the entrance or ticket machines on-site?","answer":"Tickets are not sold on-site."},{"question":"Can I change the admission date and time after purchasing tickets from the Ticket Store?","answer":"Tickets purchased through the teamLab Planets TOKYO Ticket Store can be changed up to 3 times, no later than 2 hours before the admission time.\nExample: For tickets from 10:00-10:30 → changes can be made until 8:00\nFor tickets from 19:30-20:00 → changes can be made until 17:30\n\n※ For tickets purchased through travel agencies, convenience stores, etc., please contact the respective sales outlets.\n\nTo change the admission date and time, please use the \"Change Admission Date and Time\" button displayed on My Tickets.\n\n【Tickets that cannot be changed】\n・Partial changes for multiple tickets purchased in one transaction\n・Tickets not fully reclaimed after being distributed\n・Tickets purchased with a coupon\n・Sold-out tickets for the desired new date and time\n・Tickets for dates and times outside the sales period"},{"question":"I bought tickets at the Ticket Store, but am unable to go, I would like my tickets cancelled/refunded","answer":"Tickets cannot be cancelled or refunded once purchased.\n\nHowever, if you bought your tickets through our website, you can change the date and time of entry no later than 2 hours before the admission time.\nPlease use the Change Admission Date and Time feature to change the time to your convenient time.\nSee \u003ca href=\"https://teamlabplanets.dmm.com/en/help#category03_307\" style=\"text-decoration: underline;\" target=\"_blank\"\u003ehere\u003c/a\u003e for changes to the admission time and date"},{"question":"What payment methods are available at the Ticket Store?","answer":"The following payment methods are available when using teamLab Planets TOKYO Ticket Store.\n\n\u003cstrong\u003eWhen Purchasing as a DMM Member\u003c/strong\u003e\n・Credit Card (Visa/JCB/American Express/Diners)\n\u003cspan style=\"font-size:13px;color:#999;\"\u003e*Cannot be paid for with DMM points.\u003c/span\u003e\n\n\u003cstrong\u003eWhen Purchasing as a Guest (Not Logged in as a DMM Member)\u003c/strong\u003e\n・Credit Card (Visa/Master/JCB/American Express/Diners)\n・PayPay\n・UnionPay Card\n\u003cspan style=\"font-size:13px;color:#999;\"\u003e*The UnionPay card is the generic term for credit cards and debit cards that can use the inter-bank payment network run by China UnionPay (UnionPay, official name China UnionPay).\nWhen using UnionPay, you will be required to enter your UnionPay Card number on the UnionPay payment page.\nSee \u003ca href=\"https://www.unionpayintl.com/en/\" target=\"_blank\" style=\"text-decoration: underline;\"\u003ehere\u003c/a\u003e for the UnionPay official site\u003c/span\u003e\n\nWe do not support paying in installments with credit or UnionPay cards.\nOne-time payments accepted only."}]},{"title":"Other","slug":"planets_faq3","faqBox":[]}],"exhibitionSlug":"planets"},"isEndedExhibition":false},"artistData":{"text":"teamLab (f. 2001) is an international art collective. Their collaborative practice seeks to navigate the confluence of art, science, technology, and the natural world. Through art, the interdisciplinary group of specialists, including artists, programmers, engineers, CG animators, mathematicians, and architects, aims to explore the relationship between the self and the world, and new forms of perception.\n\nIn order to understand the world around them, people separate it into independent entities with perceived boundaries between them. teamLab seeks to transcend these boundaries in our perceptions of the world, of the relationship between the self and the world, and of the continuity of time. Everything exists in a long, fragile yet miraculous, borderless continuity.\n\nteamLab’s works are in the permanent collection of the National Gallery of Victoria, Melbourne; Art Gallery of New South Wales, Sydney; Art Gallery of South Australia, Adelaide; National Gallery of Australia, Canberra;  Amos Rex, Helsinki; Museum of Contemporary Art, Los Angeles; Asian Art Museum, San Francisco; Borusan Contemporary Art Collection, Istanbul; and Asia Society Museum, New York, among others.\n\n\u003ca href=\"https://www.teamlab.art/\" target=\"_blank\" class=\"exhibition__artist-textLink\"\u003eteamlab.art\u003c/a\u003e\n\n\u003ca href=\"https://docs.google.com/document/d/1Qd56p--mrG413Fhn9B86beEqCpxBDsvVxSR8fi71lfQ/edit?usp=sharing\" target=\"_blank\" class=\"exhibition__artist-textLink\"\u003eBiographical Documents\u003c/a\u003e\n\nteamLab is represented by \u003ca href=\"https://www.pacegallery.com/artists/teamlab/\" target=\"_blank\" class=\"exhibition__artist-textLink\"\u003ePace Gallery\u003c/a\u003e, \u003ca href=\"https://martinbrownecontemporary.com/teamlab/\" target=\"_blank\" class=\"exhibition__artist-textLink\"\u003eMartin Browne Contemporary\u003c/a\u003e and \u003ca href=\"https://ikkanart.com/en/\" target=\"_blank\" class=\"exhibition__artist-textLink\"\u003eIkkan Art\u003c/a\u003e."},"aboutData":[],"event":{"organizers":"PLANETS Co., Ltd","coOrganizers":null,"specialSponsors":null,"sponsors":null,"supporters":null,"additionalEvents":[{"title":"Founding Partner","text":"DMM.com","titleImageUrl":null}]},"news":[{"title":"teamLab Planets Welcomes a Total of 10 Million Visitors: Reaching 5 Million International Visitors, and Becoming a Primary Destination in Tokyo.","slug":"prtimes251017","externalUrl":null,"mediaPublishedAt":"Oct 17, 2025","mediaTitle":"PR TIMES","externalMediaUrl":"https://prtimes.jp/main/html/rd/p/000001119.000007339.html","text":"teamLab Planets welcomed over 10 million visitors from more than 211 countries and regions as of October 12 September 22, 2025, just 7 years and 3 months after opening.*1\u003cbr /\u003e\nOf the total visitors, approximately 5 million were international tourists. Many came from far-reaching countries such as the United States, Australia, China/Hong Kong, Canada, the United Kingdom, and Germany, and more than 70% of visitors purchased tickets before arriving in Japan, indicating that visiting the museum was one of the reasons for their trip to Tokyo.*2\u003cbr /\u003e\u003cbr /\u003e\n\n*1 According to ticket purchase data from the official teamLab Planets website (survey period: July 7, 2018 - October 12, 2025).\u003cbr /\u003e\n*2 According to visitor survey data conducted by teamLab Planets (survey period: January 1, 2025 - September 30, 2025)."},{"title":"teamLab Planets Wins the World Travel Award as “Asia’s Leading Tourist Attraction”, Alongside Nominees Including the Great Wall of China and Angkor Wat: Second Award Since 2023.","slug":"worldtravelawards251013","externalUrl":null,"mediaPublishedAt":"Oct 13, 2025","mediaTitle":"World Travel Awards","externalMediaUrl":"https://www.worldtravelawards.com/award-asias-leading-tourist-attraction-2025","text":"teamLab Planets TOKYO DMM in Toyosu, Tokyo was announced as the winner of the World Travel Awards for Asia’s Leading Tourist Attraction 2025. This is the second time teamLab Planets has won the said award, following its first in 2023.\u003cbr /\u003e\u003cbr /\u003e\n\nThe World Travel Awards is one of the most prestigious honors in the travel industry, selected based on votes from travel industry professionals and the general public across more than 200 countries worldwide.\u003cbr /\u003e\u003cbr /\u003e\n\n“Asia's Leading Tourist Attraction 2025” is the Asia category of the “World's Leading Tourist Attraction 2025,” which honors the world’s most outstanding travel destinations. Nominees included sites such as the Great Wall of China, the Taj Mahal, and Angkor Wat.\u003cbr /\u003e\nThe nominees for Asia’s Leading Tourist Attraction 2025 were as follows (in alphabetical order):\u003cbr /\u003e\u003cbr /\u003e\n\nAngkor Temples (Cambodia)\u003cbr /\u003e\nBorobudur (Indonesia)\u003cbr /\u003e\nGreat Wall of China\u003cbr /\u003e\nHa Long Bay (Vietnam)\u003cbr /\u003e\nIntramuros (Philippines)\u003cbr /\u003e\nSengan-en and Shoko Shuseikan Museum (Kagoshima, Japan)\u003cbr /\u003e\nTaj Mahal (India)\u003cbr /\u003e\nteamLab SuperNature Macao (China)\u003cbr /\u003e\nTerracotta Warriors (China)\u003cbr /\u003e\nThe Forbidden City (China)\u003cbr /\u003e\nTokyo Imperial Palace (Japan)\u003cbr /\u003e\nVictoria Peak (Hong Kong)\u003cbr /\u003e\u003cbr /\u003e\n\nWorld Travel Awards Official Website:\n\u003ca href=\"https://www.worldtravelawards.com/award-asias-leading-tourist-attraction-2025\" target=\"_blank\"\u003ehttps://www.worldtravelawards.com/award-asias-leading-tourist-attraction-2025\u003c/a\u003e"},{"title":"teamLab Planets TOKYO Ranked No. 1 for Three Consecutive Years in the “Inbound Popular Tourist Spot Ranking (Tokyo)”, Joined by Iconic Sites like Senso-ji and Tokyo Tower.","slug":"honichi250911","externalUrl":null,"mediaPublishedAt":"Sep 11, 2025","mediaTitle":"訪日ラボ","externalMediaUrl":"https://honichi.com/news/2025/09/11/202509_inboundranking_tokyo/","text":"teamLab Planets was ranked first in the “2025 Inbound Popular Tourist Spot Ranking (Tokyo)” conducted by Honichi Lab, one of the largest research organizations targeting international visitors to Japan. This marks the third consecutive year that the museum has secured the first spot.\u003cbr /\u003e\u003cbr /\u003e\n\nThe ranking analyzed 13,671 reviews (5,701 in foreign languages) posted on Google Maps for 2,531 tourist spots within Tokyo.\u003cbr /\u003e\n\n【Top 10 Ranking】\u003cbr /\u003e\n1st: teamLab Planets TOKYO DMM.com\u003cbr /\u003e\n2nd: Sensō-ji Temple\u003cbr /\u003e\n3rd: Tokyo Tower\u003cbr /\u003e\n4th: Tokyo Skytree\u003cbr /\u003e\n5th: Shibuya Scramble Crossing\u003cbr /\u003e\n6th: Meiji Jingu\u003cbr /\u003e\n7th: teamLab Borderless: MORI Building DIGITAL ART MUSEUM\u003cbr /\u003e\n8th: SHIBUYA SKY\u003cbr /\u003e\n9th: Warner Bros. Studio Tour Tokyo - The Making of Harry Potter\u003cbr /\u003e\n10th: Hachiko Memorial Statue \u003cbr /\u003e\u003cbr /\u003e\n\n【Source】\u003ca href=\"https://honichi.com/news/2025/09/11/202509_inboundranking_tokyo/\" target=\"_blank\"\u003eHonichi Lab / Kuchikomicom, “Inbound Popular Tourist Spot Ranking (Tokyo),”\u003c/a\u003e published September 11, 2025"},{"title":"Step into the most mind-bending, sense-scrambling arts happening in the world","slug":"ft240506","externalUrl":null,"mediaPublishedAt":"May 6, 2024","mediaTitle":"Financial Times","externalMediaUrl":"https://www.ft.com/content/d1d90fe5-b93e-4135-857d-cb50957d6506","text":"A trip (and it is a trip) to teamLab Planets Tokyo, the showstopper exhibition that ingeniously dissolves the boundaries between real and virtual"},{"title":"These Were the Most Popular Museums in the World, According to Google’s ‘Year in Search’","slug":"artnet240209","externalUrl":null,"mediaPublishedAt":"Dec 19, 2023","mediaTitle":"Artnet News","externalMediaUrl":"https://news.artnet.com/art-world/google-trends-top-museums-teamlab-ark-encounter-2411845","text":"Turning first to the “Global” results, the Year in Search offers up a ranking of the most-popular museums in the world, as measured by Google Maps interest. They are:\u003cbr\u003e\n\u003cbr\u003e\n1. Louvre Museum, Paris, France\u003cbr\u003e\n2. The British Museum, London, United Kingdom\u003cbr\u003e\n3. Musée d’Orsay, Paris, France\u003cbr\u003e\n4. Natural History Museum, London, United Kingdom\u003cbr\u003e\n5. teamLab Planets, Tokyo, Japan\u003cbr\u003e\n\u003cbr\u003e\nThe big outlier, clearly, is teamLab Planets. The immersive-art extravaganza in Tokyo is a juggernaut, and a particular hit with foreign tourists according to reports. The museum claims that 1 in 10 foreign tourists to Japan buy tickets to check out teamLab’s interactive experience, which features a digital Koi pond where animated fish explode into flowers as visitors touch them, an environment where you walk among glowing spheres, and an area where you can interact with “solidified light.”"},{"title":"These Were the Most Popular Museums in the World, According to Google’s ‘Year in Search’","slug":"artnet231220","externalUrl":"","mediaPublishedAt":"Dec 20,2023","mediaTitle":"artnet","externalMediaUrl":"https://news.artnet.com/art-world/google-trends-top-museums-teamlab-ark-encounter-2411845","text":"The big outlier, clearly, is teamLab Planets. The immersive-art extravaganza in Tokyo is a juggernaut, and a particular hit with foreign tourists according to reports. (Excerpt from the text)"},{"title":"How digital art is transforming the museum experience","slug":"cnnbusiness230915","externalUrl":"","mediaPublishedAt":"Sep 15, 2023","mediaTitle":"CNN Business","externalMediaUrl":"https://edition.cnn.com/videos/business/2023/09/15/digital-art-rahel-solomon-pkg-09096aseg1-cnni-business.cnn","text":"From floating orchids to an infinite crystal universe, award-winning art collective teamLab continues to push the boundaries of immersive art. (Excerpt from the text)\r\n"},{"title":"designboom visits teamLab's Planets TOKYO new additions to their body-immersive museum","slug":"designboom230819","externalUrl":"","mediaPublishedAt":"August 19, 2023","mediaTitle":"designboom","externalMediaUrl":"https://www.designboom.com/art/designboom-visits-teamlab-planets-tokyo-latest-additions-body-immersive-museum-08-19-2023/","text":"teamLab Planets Tokyo is the digital art museum founded by the international art collective teamLab, located in Toyosu, Tokyo. The concept behind Planets is body-immersive: interactive installations that bring people physically inside the imagination of teamLab. Art has always privileged sight over other senses, and through the various installations in Planets, teamLab aims to transform art from something to be experienced visually to something to be experienced with the entire body. Visitors can expect to walk through knee-high water and lie beneath a sky of digital flowers.(Excerpt from the text)"},{"title":"teamLab Planets TOKYO Is a Phenomenon. But What Is It?","slug":"ocula230809","externalUrl":"","mediaPublishedAt":"August 09, 2023","mediaTitle":"OCULA","externalMediaUrl":"https://ocula.com/magazine/features/teamlab-planets-tokyo-is-a-phenomenon-what-is-it/","text":"The wildly popular attraction is hard to categorise, wavering between an art museum and a theme park. In that respect, it reflects the people behind it. teamLab describe themselves as an art collective, but what makes them most interesting is the ways in which they overflow that identity.(Excerpt from the text)"},{"title":"teamLab Planets: A Sense of Connection","slug":"aesthetica230509","externalUrl":"","mediaPublishedAt":"May 9, 2023","mediaTitle":"Aesthetica","externalMediaUrl":"https://aestheticamagazine.com/teamlab-planetsa-sense-of-connection/","text":"Photographs of teamLab’s art installations are plentiful. On Instagram, the various hashtags – #teamlab, #teamlabborderless, #teamlabplanets – have amassed over one million posts. And rightly so: they are colourful and captivating, glimmering dreamlands that exude excitement and wanderlust. As a result, the international art collective’s Planets is high on many Tokyo “must-see” lists. The reality of visiting is likely to exceed expectations. It is as mesmerising as it looks online. Crucially, though, it reaches beyond social media likes and shares, encouraging audiences to think about their place in the world. Visitors are prompted to not only take pictures but to reconnect with their bodies, nature and other human beings. (Excerpt from the text)"},{"title":"A Locals’ Guide to Tokyo: The Must-See Stops Most Tourists Miss","slug":"thewallstreetjournal230301","externalUrl":"","mediaPublishedAt":"Mar 01, 2023","mediaTitle":"THE WALL STREET JOURNAL.","externalMediaUrl":"https://www.wsj.com/articles/tokyo-travel-guide-local-stops-most-tourists-miss-b04ccc0d","text":"The Visionary: Toshiyuki Inoko\u003cbr\u003e\r\nFounder of art collective TeamLab\u003cbr\u003e\u003cbr\u003e\r\nTokyo National Museum: They have a great collection of Japanese and Oriental classical art; TeamLab’s alternative museum offers interactive fun. (Excerpt from the text)"},{"title":"teamLab Planets TOKYO DMM","slug":"goodlucktrip230201","externalUrl":"","mediaPublishedAt":"Feb 1, 2023","mediaTitle":"good Luck Trip","externalMediaUrl":"https://www.gltjp.com/en/directory/item/14157/","text":"teamLab, an international art collective, uses digital technology to create experiential works that allow visitors to participate and become a part of the artwork spaces. Opened in 2018, their museum teamLab Planets TOKYO offers a full lineup of works that bring viewers and art together.(Excerpt from the text)"},{"title":"HERE'S A LOOK AT TEAMLAB PLANETS TOKYO'S NEWEST IMMERSIVE ARTWORKS","slug":"hypebae221210","externalUrl":"","mediaPublishedAt":"Dec 10,2022","mediaTitle":"hypebae","externalMediaUrl":"https://hypebae.com/2022/12/teamlab-planets-tokyo-museum-new-areas-opened-images-details","text":"Art collective, teamLab, opened a series of new visitor areas at teamLab Planets Tokyo during the Covid pandemic, which visitors from abroad are now finally able to experience, given that Japan’s travel ban was recently lifted.(Excerpt from the text)"},{"title":"В мечтания дигитален свят на teamLab","slug":"bloombergtv221128","externalUrl":"","mediaPublishedAt":"Nov 28, 2022","mediaTitle":"Bloomberg TV Bulgaria","externalMediaUrl":"https://www.bloombergtv.bg/a/35-bloomberg-world/112936-v-mechtaniya-digitalen-svyat-na-teamlab","text":"Тези експерти варират от художници и архитекти до програмисти и математици, които се опитват да се ориентират към сближаването на изкуството, науката, технологиите и природния свят. Един от най-закътаните и тайни музеи може да се намери в гора в Южна Япония. Дигитализираната природа на teamLab изследва как цифровите технологии могат да превърнат природата в изкуство, без да я увреждат.(Excerpt from the text)"},{"title":"15 amazing reasons you should visit Tokyo now","slug":"timeout220930","externalUrl":"","mediaPublishedAt":"Sep 30, 2022","mediaTitle":"Time Out","externalMediaUrl":"https://www.timeout.com/tokyo/things-to-do/amazing-reasons-you-should-visit-tokyo-right-now?itm_source=parsely-api","text":"6. teamLab Borderless is gone, but teamLab Planets is still around\u003cbr\u003e\u003cbr\u003e\r\nWe bid farewell to teamLab Borderless at the end of August, but not all is lost. Thankfully teamLab Planets has extended its stay and will now be around until the end of 2023. At Planets, teamLab's immersive digital art installations are bigger, set in spacious rooms for a more immersive experience. Plus, it’s got a brand new garden area as well as a jaw-dropping vegan ramen restaurant that’s just out of this world. (Excerpt from the text)"}],"exhibitionLogoUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/4vLecE2pSUDgLbwQPdHHA7/public","meta":{"title":"[Official] teamLab Planets TOKYO, Toyosu","description":"teamLab Planets is a museum where you walk through water, created by art collective teamLab.\nThe artworks change depending on the presence of people, and the existence of the artworks is continuous with your body and with others.\nImmerse yourself physically in the massive artwork spaces, perceive them with your body, and become one with the art.","ogImage":null,"ogTitle":"[Official] teamLab Planets TOKYO, Toyosu","ogDescription":"teamLab Planets is a museum where you walk through water, created by art collective teamLab.\nThe artworks change depending on the presence of people, and the existence of the artworks is continuous with your body and with others.\nImmerse yourself physically in the massive artwork spaces, perceive them with your body, and become one with the art."},"recommendExhibitions":[{"title":"teamLab Biovortex Kyoto","url":"/e/kyoto/","term":"Oct 07, 2025 - Permanent","address":"Kyoto","imageUrl":"https://assets.team-lab. :"/e/tokyo/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/Yt5eET5oZzm6FBicauQUSY/public","term":"Feb 09, 2024 - Permanent","label":"teamLab Museum","address":"Azabudai Hills, Tokyo","lpUrl":null},{"title":"Continuous Life in Cubes of Light - Copper","url":"/e/mirailabpalette/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/GKNr6ShsZK2sz554cWtAnF/public","term":"Jan 14, 2020 - Permanent","address":"MIRAI LAB PALETTE, Tokyo","lpUrl":null}],"parsedOtherExhibitionList":[{"title":"teamLab Biovortex Kyoto","url":"/e/kyoto/","term":"Oct 07, 2025 - Permanent","address":"Kyoto","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/f82b4be6-d76a-41c1-deff-a5efc81ce900/public","status":"onView","type":"teamLab Museum","start":"2025-10-07T00:00:00+09:00","pickup":true,"priority":96,"articleId":13114,"isShowStatus":true,"isShowType":true},{"title":"teamLab Phenomena Abu Dhabi","url":"/e/phenomena/","term":"Apr 18, 2025 - Permanent","address":"Saadiyat Cultural District, Abu Dhabi","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/01077cf4-1be4-4180-60d4-76452e700c00/public","status":"onView","type":"teamLab Museum","start":"2025-04-18T01:30:00+09:00","pickup":true,"priority":95,"articleId":12289,"isShowStatus":true,"isShowType":true},{"title":"teamLab Borderless: MORI Building DIGITAL ART MUSEUM","url":"/e/tokyo/","term":"Feb 09, 2024 - Permanent","address":"Azabudai Hills, Tokyo","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/Yt5eET5oZzm6FBicauQUSY/public","status":"onView","type":"teamLab Museum","start":"2024-02-09T09:00:00+09:00","pickup":true,"priority":94,"articleId":13570,"isShowStatus":true,"isShowType":true}],"displayLogoInFirstView":true,"faqList":[{"title":"Regarding entry","slug":"planets_faq1","faqBox":[{"question":"\u003ca name=\"faq_01\"\u003e\u003c/a\u003eI will be late for the admission time.","answer":"You can still enter teamLab Planets Tokyo if you arrive on site within the same day during open hours. Please ask a nearby staff at the venue.\r\n* Last admission is 1 hour before closing."}]},{"title":"About Tickets","slug":"planets_faq_new2","faqBox":[{"question":"Are tickets available at the entrance or ticket machines on-site?","answer":"Tickets are not sold on-site."},{"question":"Can I change the admission date and time after purchasing tickets from the Ticket Store?","answer":"Tickets purchased through the teamLab Planets TOKYO Ticket Store can be changed up to 3 times, no later than 2 hours before the admission time.\nExample: For tickets from 10:00-10:30 → changes can be made until 8:00\nFor tickets from 19:30-20:00 → changes can be made until 17:30\n\n※ For tickets purchased through travel agencies, convenience stores, etc., please contact the respective sales outlets.\n\nTo change the admission date and time, please use the \"Change Admission Date and Time\" button displayed on My Tickets.\n\n【Tickets that cannot be changed】\n・Partial changes for multiple tickets purchased in one transaction\n・Tickets not fully reclaimed after being distributed\n・Tickets purchased with a coupon\n・Sold-out tickets for the desired new date and time\n・Tickets for dates and times outside the sales period"},{"question":"I bought tickets at the Ticket Store, but am unable to go, I would like my tickets cancelled/refunded","answer":"Tickets cannot be cancelled or refunded once purchased.\n\nHowever, if you bought your tickets through our website, you can change the date and time of entry no later than 2 hours before the admission time.\nPlease use the Change Admission Date and Time feature to change the time to your convenient time.\nSee \u003ca href=\"https://teamlabplanets.dmm.com/en/help#category03_307\" style=\"text-decoration: underline;\" target=\"_blank\"\u003ehere\u003c/a\u003e for changes to the admission time and date"},{"question":"What payment methods are available at the Ticket Store?","answer":"The following payment methods are available when using teamLab Planets TOKYO Ticket Store.\n\n\u003cstrong\u003eWhen Purchasing as a DMM Member\u003c/strong\u003e\n・Credit Card (Visa/JCB/American Express/Diners)\n\u003cspan style=\"font-size:13px;color:#999;\"\u003e*Cannot be paid for with DMM points.\u003c/span\u003e\n\n\u003cstrong\u003eWhen Purchasing as a Guest (Not Logged in as a DMM Member)\u003c/strong\u003e\n・Credit Card (Visa/Master/JCB/American Express/Diners)\n・PayPay\n・UnionPay Card\n\u003cspan style=\"font-size:13px;color:#999;\"\u003e*The UnionPay card is the generic term for credit cards and debit cards that can use the inter-bank payment network run by China UnionPay (UnionPay, official name China UnionPay).\nWhen using UnionPay, you will be required to enter your UnionPay Card number on the UnionPay payment page.\nSee \u003ca href=\"https://www.unionpayintl.com/en/\" target=\"_blank\" style=\"text-decoration: underline;\"\u003ehere\u003c/a\u003e for the UnionPay official site\u003c/span\u003e\n\nWe do not support paying in installments with credit or UnionPay cards.\nOne-time payments accepted only."}]},{"title":"Other","slug":"planets_faq3","faqBox":[]}],"exhibitionSlug":"planets","isFlowerShop":false,"structuredData":[{"@context":"https://schema.org/","@type":"ImageObject","contentUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/89JNH3JuCgHZcGbACeD2vU/width=640","creditText":"teamLab"},{"@context":"https://schema.org/","@type":"Event","name":"[Official] teamLab Planets TOKYO, Toyosu","description":"teamLab Planets is a museum where you walk through water, created by art collective teamLab.\nThe artworks change depending on the presence of people, and the existence of the artworks is continuous with your body and with others.\nImmerse yourself physically in the massive artwork spaces, perceive them with your body, and become one with the art.","image":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/89JNH3JuCgHZcGbACeD2vU/width=640","url":"https://www.teamlab.art/e/planets","startDate":"","endD

"displayType":1,"cards":[{"title":"Drawing on the Water Surface Created by the Dance of Koi and People - Infinity","url":"/ew/koi_and_people/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fhiw4GWA5aqKHGQT72DUS7/public","description":"\u003cp dir=\"ltr\"\u003eKoi swim on the surface of water that stretches out into infinity. People can walk into the water.\u0026nbsp;\u003c/p\u003e\u003cbr\u003e\u003cp dir=\"ltr\"\u003eThe movement of the koi is influenced by the presence of people in the water and also other koi. When the fish collide with people they turn into flowers and scatter. Throughout a year, the flowers that bloom will change along with the seasons.\u003c/p\u003e\u003cbr\u003e\u003cp dir=\"ltr\"\u003eThe trajectory of the koi is determined by the presence of people and these trajectories trace lines on the surface of the water.\u003c/p\u003e\u003cbr\u003e\u003cp dir=\"ltr\"\u003eThe work is rendered in real time by a computer program. It is neither prerecorded nor on loop. The interaction between the viewer and the installation causes continuous change in the artwork. Previous visual states can never be replicated, and will never reoccur.\u003c/p\u003e","label":"","term":"","videoId":"qAebQICA-fE","isLong":false,"isWide":false},{"title":"The Infinite Crystal Universe","url":"/ew/infinite_crystaluniverse/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/C8XSqFJPgzRGrZ4x3Pmsy/public","description":"\u003cp dir=\"ltr\"\u003ePointillism uses an accumulation of distinct dots of color to create a picture. Here, light points are used to create three-dimensional objects. The light sculpture extends infinitely in all directions.\u003c/p\u003e\u003cp dir=\"ltr\"\u003e\u0026nbsp;\u003c/p\u003e\u003cp dir=\"ltr\"\u003ePeople use their smartphones to select stars to throw into \u003cem\u003eThe Infinite Crystal Universe\u003c/em\u003e. These stars are reborn in three dimensions, creating the artwork. The presence of people and their location within the work affect these three-dimensional stars, which in turn influence and are influenced by other stars in the space.\u003c/p\u003e\u003cbr\u003e\u003cp dir=\"ltr\"\u003eThis artwork is forever evolving, changing from moment to moment due to the people in the space.\u003c/p\u003e","label":"","term":"","videoId":"3LFegfRrwtg","isLong":false,"isWide":false},{"title":"Floating in the Falling Universe of Flowers","url":"/ew/fitfuof/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/P4sUNVi9wt3bd8wXy5msn7/public","description":"A seasonal year of flowers bloom and change with time, life spreads out into the universe.\u003cbr\u003eLie down or sit still in the space and eventually your body floats and you dissolve into the artwork world.\u003cbr\u003e\u003cbr\u003eFlowers grow, bud, bloom, and in time, the petals fall, and the flowers wither and die. The cycle of birth and death continues for perpetuity.\u003cbr\u003eThe artwork is not a pre-recorded image that is played back; it is created by a computer program that continuously renders the artwork in real time. As a whole, it is continuously changing, and previous visual states are never replicated. The universe at this moment in time can never be seen again.","label":"","term":"","videoId":"ZCFsCHLGFlM","isLong":false,"isWide":false},{"title":"Expanding Three-dimensional Existence in Transforming Space - Flattening 3 Colors and 9 Blurred Colors","url":"/ew/transformingspace_planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/8frmXUFJvNL6TG7ZuCCFnk/public","description":"\u003cp dir=\"ltr\"\u003eThe space is filled with spheres of light. People move through the spheres and enter the space. When the spheres change color, the space itself shifts between a collection of spheres forming a three-dimensional space and a flat color wall.\u003c/p\u003e\u003cbr\u003e\u003cp dir=\"ltr\"\u003eWhen people move through or push them, the spheres change color, and emit a tone specific to that color. The surrounding spheres respond one after another, resonating and emitting the same tone and light color.\u003c/p\u003e\u003cbr\u003e\u003cp dir=\"ltr\"\u003eWherever the sphere is, the behavior of light is maintained across the whole of the space (a three-dimensional image in which one sphere is regarded as one dot). Therefore, the light behaves as a group and can be thought of as one three-dimensional existing space. At this time, the light spreads spherically around the impacted sphere.\u003c/p\u003e\u003cbr\u003e\u003cp dir=\"ltr\"\u003eSince the spheres are freely positioned within the collection of sphere elements that make up the three-dimensional space, people recognize it as existing three-dimensionally and part the spheres entering into the three-dimensional existing space.\u003c/p\u003e\u003cbr\u003e\u003cp dir=\"ltr\"\u003eThe shape of the space is determined by the collection of spheres and changes according to people\u0026rsquo;s actions (pushing or colliding).\u003c/p\u003e\u003cbr\u003e\u003cp dir=\"ltr\"\u003eBefore the modern era in Japan, complex colors born from the characteristics of silk were given names evocative of the four seasons. Such colors were called Kasane no Irome (nuances of layered colors), and were created by the combination of the lining and exterior fabric (silk was thin at the time so the color of the lining showed through the exterior fabric), gradations from overlapping colors, and blending of warp and weft. Since the sphere colors are produced by light, it is possible to create nine blurred colors, (light in water, sunlight on water plants, morning glow, morning sky, sky at twilight, peach, plum, iris, spring maple), as well as three colors that flatten the space (blue, red, and green), producing a total of 12 colors.\u003c/p\u003e","label":"","term":"","videoId":"tezpQUZsQyE","isLong":false,"isWide":false},{"title":"Ephemeral Crystallized Light","url":"/ew/ephemeral_solidifiedlight_planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/JjgA4MxV65mSGZBeoHRWK5/public","description":"Innumerable masses of light float in the air, each one composed of multiple colors. The boundaries of each color are clearly separated as though they are solid.\u003cbr\u003eThe seemingly solid color separation of the masses of light is not seen in the natural world, and is caused by extreme synchronization. Through self-organization over time, this synchronization phenomenon creates a large ordered structure.\u003cbr\u003e\u003cbr\u003eWhen you touch a solidified light, you realize that the visible part is part of something that continues to flow without interruption.\u003cbr\u003eLife is a phenomenon like crystals of ephemeral light, miraculously solidified into a continuum of energy that continues to flow without interruption from a past whose beginning is unknown.","label":"","term":"","videoId":"th997skTvME","isLong":false,"isWide":false},{"title":"Waterfall of Light Particles at the Top of an Incline","url":"/ew/lightparticles/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/A5e3rMCURnPWvutk5KhWmT/public","description":"\u003cp\u003eThis artwork is based on an earlier work on a natural waterfall in the mountains of Shikoku, \u003ca href=\"https://www.teamlab.art/w/waterfall-of-light-particles/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003cem\u003eWaterfall of Light Particles - Deep in the Mountains of Shikoku\u003c/em\u003e\u003c/a\u003e (2016-2017).\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eLight only reflects off the particles of water that make up the waterfall. The shining particles cascade down creating a waterfall of light particles. The light of the shining waterfall illuminates the surrounding area.\u003c/p\u003e\u003cp\u003eIn the darkness, the shining particles leave a light trail afterimage that appears to draw lines in space. From the combination of these afterimage light traces, the waterfall of light is born.\u003c/p\u003e","label":"","term":"","videoId":"6s_FZng6Om8","isLong":false,"isWide":false},{"title":"Soft Black Hole - Your Body Becomes a Space that Influences Another Body","url":"/ew/soft_black_hole/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/qNB4LAsBRESKWQ3fZr68nV/public","description":"\u003cp dir=\"ltr\"\u003eTrying to walk, the foot sinks. The space itself is affected and changed by the weight of people\u0026apos;s bodies. And the people\u0026apos;s bodies are affected by the changing space. People interact with each other through space. Your body changes the space, and that space changes the body of others.\u003cbr\u003e\u003cbr\u003eIn modern life we are surrounded by flat hard surfaces, so that in our daily lives we have lost consciousness of our bodies, we have forgotten them. In natural forests flat ground does not exist. This installation is a space to remind us of the body that we have forgotten in everyday life, and to make us more conscious of our body mass.\u003c/p\u003e","label":"","term":"","videoId":"PD4HdutTzHI","isLong":false,"isWide":false}],"conceptMovies":[]},{"concept":{"url":"","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/taeAAEjJYLyMvAWHZoo5ne/public","buttonName":null,"isExternal":false},"title":"Garden","description":null,"displayType":1,"cards":[{"title":"Floating Flower Garden: Flowers and I are of the Same Root, the Garden and I are One","url":"/ew/ffgarden_planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/89JNH3JuCgHZcGbACeD2vU/public","description":"\u003cp dir=\"ltr\"\u003eThis floating flower garden consists of a three-dimensional mass of flowers.\u003c/p\u003e\u003cp dir=\"ltr\"\u003eThe artwork space is completely filled with flowers, but as the flowers float up above people, open spaces are created. Because of this, people are able to freely wander around the flower mass space. If you encounter other people within the artwork, your space will connect with theirs and become one single space.\u003c/p\u003e\u003cbr\u003e\u003cp dir=\"ltr\"\u003eZen gardens are said to have been created as a place for groups of Zen priests to carry out training in order to become one with nature.\u0026nbsp;\u003c/p\u003e\u003cp dir=\"ltr\"\u003eThere is a Zen \u003cem\u003ekōan\u003c/em\u003e (a question or story that is part of Zen priests\u0026rsquo; theological training) called \u0026ldquo;Nansen\u0026rsquo;s Flower\u0026rdquo;. Someone asked the monk Nansen about the famous saying, \u0026ldquo;Heaven and I are of the same root. All things and I are of the same substance\u0026rdquo;, remarking on how wonderful it was. Nansen, pointing to a flower in the garden, said, \u0026ldquo;People these days see this flower as if they were in a dream\u0026rdquo;.\u003c/p\u003e\u003cp dir=\"ltr\"\u003eIn this work, people immerse themselves in flowers, becoming one with the garden. When someone continues to look at a flower closely, the flower looks back. At that moment, they become one with the flower and may truly see flowers for the first time.\u003c/p\u003e\u003cbr\u003e\u003cp dir=\"ltr\"\u003eThe flowers in this artwork are orchids. Most orchids are able to grow without soil by absorbing water from the air. The flowers in this artwork are alive, growing, and blooming with each passing day. It could be said that they are growing in mid-air.\u0026nbsp;\u003c/p\u003e\u003cp dir=\"ltr\"\u003eAlthough flowering plants were the last of the plant species to appear on earth, at least 220,000 of the 250,000 terrestrial plant species are flowering plants. Evolution has favored diversity, and it can be said that flowers were born to produce diversity. Orchids were flowering plants that most enjoyed diversity, and it is said that approximately 10% of all plant species belong to the orchid family. Because of their diversity, many orchids evolved to become most adapted to live on rocks and trees instead of land with soil where other plants grew abundantly. In an area without soil, in other words, traditionally a least favorable environment for plants, orchids evolved to be most adapted for a world without competition. They are thought to have appeared at a later stage of evolution compared to other plants, and continue to diversify to this day, making us wonder what evolution chose to favor.\u003c/p\u003e\u003cbr\u003e\u003cp dir=\"ltr\"\u003eOrchids are known to have co-evolved with certain pollen-carrying insects. The flowers\u0026rsquo; aromas become stronger at the time of day when the partner insects are active. Because of this, the scent of the artwork space changes each moment between morning, day, evening, and night. Since many of the orchids in this work are partnered with nocturnal insects, the tightly-packed orchids produce a powerful fragrance at night.\u003c/p\u003e","label":"","term":"","videoId":"atWwHZHGkLE","isLong":false,"isWide":false},{"title":"Moss Garden of Resonating Microcosms - Solidified Light Color, Dusk to Dawn","url":"/ew/resonating_microcosms_mossgarden_planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/2koqWMtuBSwiHExSLDGrHd/public","description":"* The content of the work changes between daytime and after sunset. The artwork will glow after sunset.\u003cbr\u003e* In the event of light rain, the artwork will remain open to the public. In the event of typhoon-level winds or heavy rain, the artwork will not be viewable.\u003cbr\u003e\u003cbr\u003eOvoids that change appearance with the sunrise and sunset are laid out in the moss garden.\u003cbr\u003e\u003cbr\u003eWith sunrise, the ovoids begin to reflect the world around them. When pushed down by a person or blown by the wind, the ovoid falls back and then rises, releasing a resonating tone. The ovoids around it also respond one after another, continuing to resonate with the same tone.\u003cbr\u003e\u003cbr\u003eAs the sun sets, the ovoids shine by themselves. When an ovoid is pushed by a person or blown by the wind, it shines brightly and emits a sound tone, as it rights itself. The ovoids around it also respond one after another, emitting the same light color and sound tone that continues to resonate out.\u003cbr\u003e\u003cbr\u003eThe space of the work is interactively transformed under the influence of the wind, rain, and the behavior of the people in the space, making the environment and the people a part of the work. When the wind is quiet and people are still, the ovoids begin to flicker slowly.\u003cbr\u003e\u003cbr\u003eteamLab is experimenting with the concept of color. The ovoids can change into a total of 61 newly-defined Solidified Light Colors.\u003cbr\u003e\u003cbr\u003eIt is said that mosses were the first terrestrial organisms to appear in a world of rocks and sand, where there was no life on land yet. As mosses and ferns appeared and forests were created, a variety of animals became able to live on land.\u003cbr\u003eSince water inside cells is essential for living things, if the body lacks water, it will die. Mosses, on the other hand, are poikilohydric, meaning the water content in the cells change according to surrounding humidity levels. So moss will not die during long dry periods, and they come back to life when given water. Because mosses are poikilohydric, their color and shape change dramatically when the air is dry versus when it is wet, such as when there is rain or fog.\u003cbr\u003eTardigrades, which live in moss, also go into a non-metabolic state of dormancy when the surrounding environment becomes dry, but they revive and become active when there is water. The state that tardigrades enter, when they are neither living nor dead, is called cryptobiosis. This may cause us to consider what it means to be alive.","label":"","term":"","videoId":"uzLHCg6h_Yg","isLong":false,"sunsetTime":"17:09","isWide":false}],"conceptMovies":[]},{"concept":{"url":"/concept/athleticsforest/planets","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/EtNV9qNwXzugdvoSMeQ9KK/public","buttonName":"View More","isExternal":true},"title":"Athletics Forest","description":"\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cp\u003eA high-dimensional thinking athletics space based on the concept of perceiving the world with your body and thinking about it high-dimensionally. In a complex and challenging space, you will be immersed in a physically challenging four-dimensional world where time changes with the presence of your body.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e","displayType":null,"cards":[{"title":"Rapidly Rotating Bouncing Spheres in the Caterpillar House","url":"/ew/rapidlyrotating-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/iS7XcMxD5wNevrfeT8Rcb8/public","description":"\u003cp dir=\"ltr\"\u003eRapidly Rotating Bouncing Sphere is a space made up of spheres that people can jump on. The spheres rotate at high speed, but when people approach them, they stop rotating and become easier to step on.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp dir=\"ltr\"\u003eIf they bounce on spheres of the same color in succession, the spheres will pop and particles of light spread out into the space. If people bounce on more spheres of the same color in succession, caterpillars are born, and if they keep jumping on the same colored spheres in succession until the end, all the spheres of the same color will pop, and many caterpillars will be born.\u003c/p\u003e","label":"","term":"","videoId":"ilEF-d18iQk","isLong":false,"isWide":false},{"title":"Multi Jumping Universe","url":"/ew/multijumpinguniverse-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/9489NUy39TGCkfRbHuVpaM/public","description":"\u003cp id=\"isPasted\"\u003e* This experience is available for guests aged 20 and under only.\u003cbr\u003e\u003cbr\u003eMulti Jumping is a flexible surface that people can jump on, and sink or jump higher than usual.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen you stand on Multi Jumping, the surface beneath your feet sinks, creating warps in space and time. This distortion attracts stardust from the universe and births new stars. If you jump on top of a star, it begins to move, and if you continue to jump on the star it will grow and you will be able to experience the entire life cycle of the star. When the life of the star ends, it returns to stardust and becomes the building blocks of new stars.\u003c/p\u003e\u003cp\u003eA gigantic and heavy star will eventually become a black hole that swallows up all the surrounding stars and stardust.\u003c/p\u003e","label":"","term":"","videoId":"mIHzhOxOb3w","isLong":false,"isWide":false},{"title":"Aerial Climbing through a Flock of Colored Birds","url":"/ew/coloredbirds-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/AzUgz6U6eQRPXfjZzhipgi/public","description":"\u003cdiv\u003e\u003cdiv\u003e\u003cp id=\"isPasted\"\u003eAerial Climbing is a space where horizontal bars of varying colors are suspended by ropes and float three-dimensionally in the air. People use these bars to navigate the space in mid-air through three dimensions, trying not to fall. As the bars are linked, the movement caused on a bar by a person will affect the bars on which other people are standing. The arrangement of the bars vary depending on the selected route, so people’s experiences will differ depending on the various ways the bars are linked.\u003c/p\u003e\u003cp\u003eWhen people climb onto the bars, they shine brightly and produce a sound specific to its color. The more people climb onto bars of different colors, the more sounds will be played at the same time.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFlocks of birds fly around freely in this space. When they fly near the people in the space, they take on the color of the bars on which the people stand.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThe movement of thousands of birds is beautiful and mysterious, appearing like a single giant life form. The flock has neither a leader nor mutual consensus, but it is said that the birds move on the simple basis of; if my neighbor moves, then I move too. However, the biological mechanism that causes hundreds of birds to move at the same time remains a mystery. It seems there is a universal principle that humans have yet to understand. Likewise, the arrangement of color of the flock is not predetermined. Influenced by people, the birds move, based on a primitive rule unknown to humankind, which in turn creates a complex and beautiful coloration in the space.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e","label":"","term":"","videoId":"FGpI-VagkRE","isLong":false,"isWide":false},{"title":"Balance Stepping Stones in the Invisible World","url":"/ew/balancesteppingstones-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fVaigaQcaHy4aGVy2XrL6c/public","description":"Balance Stepping Stones are stepping stones that interactively change when a person steps on them, emitting a color and tone that affect the space. When a person steps on a stone, it wobbles in various ways.\u003cbr\u003e\u003cbr\u003eWhile jumping across the Balance Stepping Stones, people cross over into the normally invisible world of microorganisms. When a person steps on a Balance Stepping Stone, that stone\u0026rsquo;s color is transmitted to the microscopic life.","label":"","term":"","videoId":"Igdg3OxhYEk","isLong":false,"isWide":false},{"title":"Graffiti Nature","url":"/ew/graffitinature-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/dkbiBVbLMaAZoA8VG9gJx3/public","description":"\u003cp id=\"isPasted\"\u003eGraffiti Nature is an ecosystem of creatures drawn by people.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eColor in a creature on the paper provided, and see the picture you have drawn come to life and move in front of you.\u003c/p\u003e\u003cp\u003eLiving things eat and and are eaten by other living things in one shared ecosystem.\u0026nbsp;\u003c/p\u003e\u003cp\u003eThe creatures you draw will multiply if they eat other living things, but they will die and disappear if they do not eat enough, or if they are eaten by other creatures.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThe salamanders eat the snakes, the snakes eat the lizards, the lizards eat the frogs, and the frogs eat the butterflies, each one propagating as a result. Likewise, the butterflies multiply in places where flowers grow. Although flowers will bloom if people stay still, their petals will scatter if people walk around and step on them. The salamanders will die if people step on them too much. Living creatures spread throughout the world, increasing and decreasing in number. The creatures you have drawn may be increasing somewhere.\u003c/p\u003e","label":"","term":"","videoId":"9OmFzbXPTf4","isLong":false,"isWide":false},{"title":"Sketch Waterfall Droplets","url":"/ew/droplets-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/3QYVS8Ma92wHxBqkiDG3oB/public","description":"\u003cdiv\u003e\u003cp id=\"isPasted\"\u003eThis waterfall is created from the droplets drawn by people.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eColor in a droplet on the paper provided. See the picture you have drawn become one of the many droplets that make up the waterfall in front of you. Before long, your droplet will mix with those drawn by other people and will flow down along the terrain.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen just one droplet splashes it bounces like a ball, but when people use their entire body to gather and collect the droplets, they act like water.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA water molecule on its own is not liquid. In order for water to be a liquid, many water molecules must come together.\u003c/p\u003e\u003cp\u003eBecause water molecules act like magnets, they stick to each other, forming a group of water molecules (a water cluster). Water clusters have an extremely short lifespan and are thought to be constantly being created and broken apart. They have a very dynamic structure and because of that, water can change into various forms.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eMost living things and objects in this world, through properties that are more than the simple sum of the properties of their parts, appear as a whole.\u003c/p\u003e\u003c/div\u003e","label":"","term":"","videoId":"XmsAIvRWXNc","isLong":false,"isWide":false},{"title":"Beating Earth","url":"/ew/beating-earth-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/DTZ3ykpahiDhWem72EqdGk/public","description":"\u003cdiv\u003e\u003cdiv\u003e\u003cp id=\"isPasted\"\u003eDue to the complex and three-dimensional space, perception based on knowledge and experience, visual perception, and bodily perception become separated, and the space undulates and shifts.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e","label":"","term":"","isLong":false,"isWide":false},{"title":"Sliding through the Fruit Field","url":"/ew/fruitfield-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/hXELLwZNLdWJ9StQRruqX/public","description":"\u003cdiv\u003e\u003cp id=\"isPasted\"\u003eThis is a slide where fruit grows.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eYou become the sunlight and slide down the slope. When your body collides with the water balls and honey bee balls, your energy will be transferred to them, and they will go flying off in all directions. When the balls collide with the fruit, the fruit will begin to grow.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eEach ball has a different role depending on its color.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA light blue ball represents water: when this ball hits the seeds, they sprout, bud, and blossom. When a yellow honey bee ball hits the flowers, they are pollinated, and the flowers become fruit.\u0026nbsp;\u003c/p\u003e\u003cp\u003eWhen the fruit is hit by a ball, new seeds are sown, leading to new life.\u003c/p\u003e\u003c/div\u003e","label":"","term":"","videoId":"mWTf44WNjog","isLong":false,"isWide":false},{"title":"Waterfall Droplets, Flowing Down a Slope","url":"/ew/waterfall-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/WU8jc7kBz4PMTUMzHrzJyY/public","description":"Many water droplets flow down a slope.\u003cbr\u003eA single droplet bounces like a ball, but when many are gathered together, they behave like water. When they break apart, they behave like a ball again.\u003cbr\u003eWhen people climb the steps up the hill, the droplets near the step receive energy and break apart.\u003cbr\u003e\u003cbr\u003eA water molecule on its own is not liquid. In order for water to be a liquid, many water molecules must come together.\u003cbr\u003eBecause water molecules act like magnets, they stick to each other, forming a group of water molecules (a water cluster). Water clusters have an extremely short lifespan and are thought to be constantly being created and broken apart. They have a very dynamic structure and because of that, water can change into various forms.\u003cbr\u003e\u003cbr\u003eMost living things and objects in this world, through properties that are more than the simple sum of the properties of their parts, appear as a whole.","label":"","term":"","videoId":"SsLtFf8enZA","isLong":false,"isWide":false},{"title":"Flutter of Butterflies from the Caterpillar House","url":"/ew/butterflies-caterpillarhouse-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/RKUP4jCoFw2vbkpovfrjt8/public","description":"\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cp id=\"isPasted\"\u003eCaterpillars born from the \u003cspan style=\"font-style: italic;\"\u003e\u003ca href=\"https://www.teamlab.art/ew/rapidlyrotating-planets/planets/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eRapidly Rotating Bouncing Spheres in the Caterpillar House\u003c/a\u003e\u003c/span\u003e, emerge and transform into butterflies which gather into groups.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen people touch the butterflies, they scatter and die.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e","label":"","term":"","videoId":"7uW7QqXhcio","isLong":false,"isWide":false},{"title":"Autonomous Abstraction","url":"/ew/autonomousabstraction-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/SSvFvTkW74zf22EVqeEWZk/public","description":"\u003cp\u003eAutonomous abstraction.\u003c/p\u003e\u003cp\u003eThe dots of light blink and change color in cycles unique to each dot. A spontaneous order phenomenon occurs between dots that are close to each other, and their hues and the rhythm at which they blink gradually synchronize. When people touch them, the rhythm of the blinking hues change and are randomized, but the dots close to each other once again cause a spontaneous order phenomenon between them.\u003c/p\u003e\u003cp\u003eThe dots of lights emit a tone each time they blink. The tones can be heard continuously throughout the space; what sounds like music is solely created by the continuous tones produced by the blinking lights.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA spontaneous order phenomenon occurs when different rhythms influence each other and synchronize. Examples include when the pendulums of two clocks gradually begin to swing together; when many fireflies gather in one tree and all start blinking at the same time, creating a larger light as a whole; or when the cells that make up the heart synchronize and tremble simultaneously to create the pulse of the heart. This can be seen in various systems, from physical phenomena, neurophysiology, to ecosystems. Although the individual parts do not have the ability to observe the whole, the phenomenon of self-organization is the creation of an ordered and larger structure, resulting from the autonomous behavior of each individual part influencing each other. This phenomenon is also known as spontaneous order.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIt is believed that entropy (a measurement of the lack of order in a system) in the universe will steadily increase (the law of increasing entropy) and that entities with form eventually collapse. Despite that, it is a wonder that the sun was created and the planets were born, that life was formed and societies exist. However, the reason why the universe, life, nature, and society continue to be maintained in spite of this may be because order is continuously formed on its own through the shared phenomenon of self-organization in the midst of disorder. In other words, the universe and our own existence are a continuous order created by the same phenomenon.\u003c/p\u003e","label":"","term":"","videoId":"aQvCAADj7s0","isLong":false,"isWide":false},{"title":"Existence in the Flow Creates Vortices","url":"/ew/existence-flow-vortices-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/ibunvWwjAWnRGMe3Y8BrwE/public","description":"Vortices are created behind people as they climb against the flow.\u003cbr\u003e\u003cbr\u003eAlthough a vortex is steady, it is constantly moving and swelling like a powerful life-form.\u003cbr\u003eDespite the existence of the vortex being maintained, the water particles that form it change from moment to moment. The vortex that is being seen now is created by completely different water from the same vortex seen a few minutes ago. The vortex, unlike a rock, cannot maintain a stable structure on its own; rather, it is created and sustained by the energy of water that continuously flows inwards and outwards.\u003cbr\u003eA vortex looks like a life-form because life similarly consumes external energy and matter and discharges it, sustaining its ordered structure within that flow. Life is a miraculous vortex that emerges from a flow of energy in a continuous world.\u003cbr\u003e\u003cbr\u003eWater is depicted as a continuum of countless water particles, and the interactions between the particles are calculated to create a three-dimensional simulation of their movement. The vortices create lines from the trails of these particles. The collection of three-dimensional lines are then cut out using what teamLab calls Ultrasubjective Space. In contrast to space that is created through, or cut out by, lenses and perspective, Ultrasubjective Space does not fix the viewer\u0026rsquo;s viewpoint and in turn frees their body. The floor and walls that the vortices are seen on do not become a boundary between the viewer and the artwork, and the artwork space becomes continuous with the space in which the viewer\u0026rsquo;s body exists.","label":"","term":"","videoId":"6RcXDK6F4HE","isLong":false,"isWide":false}],"conceptMovies":[]},{"concept":{"url":"/concept/co-creation/planets","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/7VaMWEeifVgknqvSMoXJn5/public","buttonName":"View More","isExternal":true},"title":"Future Park","description":"\u003cdiv\u003e\u003cp\u003eAn educational project based on the concept of collaborative creativity. Freely create the world together with others.\u003c/p\u003e\u003c/div\u003e","displayType":null,"cards":[{"title":"Sketch Umwelt World","url":"/ew/sketchumwelt-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fAtYvpFemLZy3ZpjhqoBMK/public","description":"\u003cdiv\u003e\u003cdiv id=\"isPasted\"\u003e\u003cp id=\"isPasted\"\u003eColor in an airplane, dolphin, hawk, or butterfly on the paper provided and see the picture you have drawn appear three-dimensionally, flying through the artwork world. If you touch them, they speed up or fly away.\u003c/p\u003e\u003cp\u003eYou can control the plane, dolphin, hawk, or butterfly with your smartphone and see the world from their perspectives on the screen.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eEach living creature understands the world only through their own perception, so the world looks different depending on the creature. Such worlds constructed upon each creature’s unique perceptual experiences are called umwelt. Here, you control the airplane through a lens like a pilot. However, if a living creature is chosen, you can control them and see the world in a completely different way.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDolphins emit sounds and perceive the world through the echoes. Just as the sound of striking metal differs from that of plastic, they can even recognize differences in materials. While fresh flowers and artificial flowers may appear the same to humans, dolphins perceive them as entirely different. Since dolphins' eyes do not recognize the color of light, the world they experience may be a world of colors completely different from that of humans.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eHawks can see two things clearly at once. When a person focuses on one thing, it is difficult to see the surrounding elements. However, hawks can observe small creatures on the ground while looking ahead of them as they fly. Tap an area you want to zoom in on the smartphone, and that area will appear bigger on the screen.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eButterflies have a 344-degree horizontal field of vision, and almost a 360-degree vertical field of vision. With the smartphone, you can see the world not only in front of you, but on both sides and behind you as well.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e","label":"","term":"","videoId":"AxqNnbemAkE","isLong":false,"isWide":false},{"title":"A Table where Little People Live","url":"/ew/littlepeople-table-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/niRaXmLM8j3xkxK5bBpqiR/public","description":"\u003cdiv\u003e\u003cp dir=\"ltr\"\u003eThis is a table where little people live.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp id=\"isPasted\"\u003eIf you put something, such as your hand, on top of the table, the little people will jump on to it. Depending on the shape of the objects you place on the table, the little people will slide, jump, or climb. Place many objects on the table and see the little people’s world transform into a completely new world.\u003c/p\u003e\u003c/div\u003e","label":"","term":"","videoId":"a8StjRIYkpU","isLong":false,"isWide":false},{"title":"A Musical Wall where Little People Live","url":"/ew/littlepeople-wall-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/UmAca6bNXthDK24iTEvw5e/public","description":"\u003cdiv\u003e\u003cp id=\"isPasted\"\u003eThis is a musical wall where little people live.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen stamps of various shapes such as mushrooms, sheep barns, or long sticks of ice are attached to the wall, these objects appear in the world of the little people.\u0026nbsp;\u003c/p\u003e\u003cp\u003eDepending on the stamp, the little people will slide, jump, or climb on top of them. If the stamp is removed, the stamp in the world of the little people will remain for a moment longer before disappearing.\u003c/p\u003e\u003cp\u003eAttach various stamps to the wall, and see the little people’s world transform into a completely new world.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSeeds with smiley faces come falling down from above. When the seeds hit the stamps, various notes in different pitches play depending on the type and position of the stamp they hit, eventually creating music.\u003c/p\u003e\u003c/div\u003e","label":"","term":"","videoId":"w9LLkQfO0ZM","isLong":false,"isWide":false},{"title":"A Window to the Universe where Little People Live","url":"/ew/littlepeople-universe-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/QLfewZUfZU9hDM5zsN35MT/public","description":"\u003cdiv\u003e\u003cp id=\"isPasted\"\u003eThis is a window into the universe where little people live.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eYou can create a picture by drawing lines with a light pen or creating shapes with a light stamp. Each line has a special power depending on its color, and influences the little people’s world. The shapes created by the light stamps appear in the little people’s world and start to move.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eYellow lines make the little people bounce and fly.\u003c/p\u003e\u003cp\u003eBlue lines speed up the little people, making them run faster.\u003c/p\u003e\u003cp\u003ePink lines make the little people bounce like on a rubber band, and the reverberations are transferred along the line.\u003c/p\u003e\u003cp\u003ePurple lines have gravity and attract the little people to them.\u003c/p\u003e\u003cp\u003eGreen lines form shapes and they start to move.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eDraw a big picture and try lots of stamps together with those around you. Create a new world in the little people’s universe, give them various powers and watch their world transform into a new world.\u003c/p\u003e\u003c/div\u003e","label":"","term":"","videoId":"C2DNFYqKuA0","isLong":false,"isWide":false}],"conceptMovies":[]},{"concept":{"url":"/concept/catching/planets","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/WEFZVD8F8CsVTWYVnwxbFB/public","buttonName":"View More","isExternal":true},"title":"Catching and Collecting Forest","description":"\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cp\u003eBased on the concept of Catch, Collect, Research, people use their bodies to explore, discover, gather knowledge, and expand their curiosity.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e","displayType":null,"cards":[{"title":"Catching and Collecting Extinct Forest","url":"/ew/collecting-forest-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/WEFZVD8F8CsVTWYVnwxbFB/public","description":"\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cp id=\"isPasted\"\u003eAn educational project based on the concept of Catch, Collect, Research, in which people use their bodies to explore, discover, gather knowledge, and expand their curiosity. Explore with your smartphone, catch various animals, research them, and create your very own collection book.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp id=\"isPasted\"\u003eThere are various extinct animals that live in this Extinct Forest. When you move close to the animals or touch them, they will run away or turn to face you.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen you use the smartphone's camera to look at an animal moving in the space, and release a Research Eye at the animal in the camera’s view, the eye flies out from the phone into the real space. When the Research Eye reaches the animal, it disappears from the space and is added to the smartphone collection. Information about the animals you catch will be stored in the app’s collection book. When you swipe a captured animal towards a location you can see in the app’s camera, the animal is released and returns to that location.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eYou can also throw a Research Net at your feet to catch animals. Work together with those around you, use your body to drive animals into the Research Net to capture them, and watch as they disappear from the space and, at the same time, appear in your collection book. Swipe the captured animals away to release them at your feet.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThe more you capture the same animal, the more detailed information you can record in your collection book.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e","label":"","term":"","videoId":"LHKSOsIrjM8","isLong":false,"isWide":false}],"conceptMovies":[]},{"concept":{"url":"","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/pRF5hyJS7jYnNS6YQ4Fh2J/public","buttonName":null,"isExternal":false},"title":"Open-Air","description":null,"displayType":1,"cards":[{"title":"Universe of Fire Particles Haunting the Sky and Earth","url":"/ew/universe_fireparticles_falling/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/XWNWPDDVKTut3pg7pEKTQN/public","description":"When people stand on the work, a black absolute presence is created, and the shape of the flames change. The work is affected by people, and is in a state of perpetual, continuous change.\u003cbr\u003e\u003cbr\u003eFlames are a phenomenon of light and heat generated by combustion; it is a vaporized substance in a flow, a decomposed substance. It is our sensory experience of seeing what is in between phenomenon and substance.\u003cbr\u003e\u003cbr\u003eLines are drawn in relation to the flow of combusting gas, and the flames are created by the accumulation of those lines in three-dimensions. The lines are then \u0026ldquo;flattened\u0026rdquo; using what teamLab considers to be Ultrasubjective Space to represent the flames.\u003cbr\u003e\u003cbr\u003eteamLab is exploring the concept of Distributed Art.\u003cbr\u003eIf you launch the \u003ca href=\"https://planets.teamlab.art/tokyo/#fire\" target=\"_blank\"\u003e\u003cspan style=\"text-decoration: underline;\"\u003eDistributed Fire\u003c/span\u003e\u003c/a\u003e smartphone application and approach this artwork, the flame will ignite and you can take the artwork home with you. When you bring that flame close to another person\u0026apos;s smartphone, a flame will alight. As you connect the flame, and they connect that flame with someone else, the flame will spread all over the world. The flames that are spread are displayed on the Map of The Flame.\u003cbr\u003e\u003cbr\u003eDistributed Art duplicates itself, or a part of an artwork is distributed among people. Then, once in the hands of the people, the artwork is further actively distributed, and also makes copies of itself. The artworks will be distributed and exist on people\u0026apos;s networks and become decentralized. When the artwork exists on the network, it continues to exist even if the original disappears.","label":"","term":"","videoId":"UdKfehqXZc0","isLong":false,"isWide":false},{"title":"Nursery Lamps in Spontaneous Order","url":"/ew/nurserylamps-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/1219d3e6-4d47-4224-55a4-2d2c48517e00/public","description":"\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cp\u003e* Location: Inside\u0026nbsp;\u003ca href=\"/ew/glasshouse/planets/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eGlass House\u003c/a\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp id=\"isPasted\"\u003eThe orchids from \u003ca href=\"/ew/ffgarden_planets/planets/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003cem\u003eFloating Flower Garden\u003c/em\u003e\u003c/a\u003e whose flowers have fallen come to this space and are nurtured in the lamps. The lamps contain light and water necessary for the growth of the orchids.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eEach lamp glows to its own rhythm. Over time, nearby lamps and\u0026nbsp;\u003ca href=\"/ew/tea-spontaneousorder-planets/planets/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003cem\u003eTea and Sake in Spontaneous Order\u003c/em\u003e\u003c/a\u003e cause a spontaneous order phenomenon, and they influence each other.\u003cbr\u003e\u003cbr\u003eA spontaneous order phenomenon occurs when different rhythms influence each other and synchronize. Examples include when the pendulums of two clocks gradually begin to swing together; when many fireflies gather in one tree and all start blinking at the same time, creating a larger light as a whole; or when the cells that make up the heart synchronize and tremble simultaneously to create the pulse of the heart. This can be seen in various systems, from physical phenomena, neurophysiology, to ecosystems. Although the individual parts do not have the ability to observe the whole, the phenomenon of self-organization is the creation of an ordered and larger structure, resulting from the autonomous behavior of each individual part influencing each other. This phenomenon is also known as spontaneous order.\u0026nbsp;\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e","label":"","term":"","videoId":"tn2KxWX0k5U","isLong":false,"isWide":false},{"title":"Tea and Sake in Spontaneous Order - Dynamic Steady State Color","url":"/ew/tea-spontaneousorder-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/4DKjxZ82aSMA52am5QTskQ/public","description":"\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cp id=\"isPasted\"\u003e* Location: Inside\u0026nbsp;\u003ca href=\"/ew/orchidglasshouse/planets/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eOrchid Glass House\u003c/a\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp id=\"isPasted\"\u003eWhen a cup of tea or sake is poured, the tea or sake begins to glow with its own unique rhythm and produce a tone.\u003c/p\u003e\u003cp\u003eA spontaneous order phenomenon occurs between the teas, sake or the lamps of \u003ca href=\"/ew/nurserylamps-planets/planets/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003e\u003cem\u003eNursery Lamps in Spontaneous Order\u003c/em\u003e\u003c/a\u003e. As they influence each other, gradually the rhythms of light and color of the teas or sake synchronize. You drink a part of that order.\u003c/p\u003e\u003cp\u003eThe artwork is born only when there is tea or sake. When you finish drinking the tea or sake, the work will no longer exist and will no longer affect its surroundings.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp id=\"isPasted\"\u003eThe light color of the tea or sake is Dynamic Equilibrium Color, a new color concept by teamLab. When a person sees the tea or sake in the cup from a distance, taking in its entirety, the color of the light does not appear to change; but when they look closely, observing the miniscule, the color of the light is actually continuously changing, and creating a new sense of time.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eA spontaneous order phenomenon occurs when different rhythms influence each other and become aligned. Examples include when the pendulums of two clocks gradually begin to swing together, when many fireflies gather in one tree and all start flashing at the same time, creating a larger light phenomenon, or when the cells that make up the heart synchronize and tremble simultaneously to create the beating of the heart. The phenomenon of self-organization is the creation of a large structure with order resulting from the autonomous behavior of each individual, even though each individual does not have the ability to observe the whole. This can also be called a self-organization phenomenon.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIt is believed that entropy (a measurement of the lack of order in a system) in the universe will steadily increase (the law of increasing entropy) and that entities with form eventually collapse. However, the reason why the universe, life, nature, and society are able to exist in spite of this may be because order is born by itself through the common phenomenon of self-organization in the midst of disorder. In other words, the universe and our own existence are a continuous order created by the same phenomenon.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e","label":"","term":"","videoId":"tn2KxWX0k5U","isLong":false,"isWide":false},{"title":"Reversible Rotation in the Black Emptiness","url":"/ew/reversiblerotation-blackemptiness-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/H4PuNd9mRvFnPPqk85EtVo/public","description":"\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cp\u003e* Location: Inside\u0026nbsp;\u003ca href=\"/ew/emptinesstable/planets/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eEmptiness Table\u003c/a\u003e\u003cbr\u003e\u003cbr\u003e\u003c/p\u003e\u003cp id=\"isPasted\"\u003eIn Black Emptiness, because it is empty, infinite possibilities open up where anything can enter it.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhen you sit down, Spatial Calligraphy is drawn in front of you. The Spatial Calligraphy in this artwork space rotates in the same direction, but because of the characteristics of Ultrasubjective Space, visually, the clockwise and counterclockwise rotation are equivalent. Hence, the work can appear to be rotating in either direction depending on how the viewer chooses to see it.\u003c/p\u003e\u003cp\u003eSpatial Calligraphy is a form of calligraphy drawn in space that teamLab has been exploring since it was founded. The artwork reconstructs calligraphy in three-dimensional space to express the depth, speed and power of the brush stroke, and that calligraphy is then flattened using the logical structure of space that teamLab calls Ultrasubjective Space. The calligraphy shifts between two and three dimensions.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e","label":"","term":"","videoId":"q3IkIq7PJMM","isLong":false,"isWide":false},{"title":"Pocket Gardens in the City Cracks","url":"/ew/pocketgardens-cracksofthecity-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/TcxmkFNk3GoyoNxGnDkqM5/public","description":"\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cp id=\"isPasted\"\u003eA crack was made in the city, connecting it to the earth. The crack connected to the earth was transformed into a pocket garden.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWithin this group of pocket gardens, there is a single, continuous \u003ca href=\"/ew/onestrokebench_planets/planets/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eOne Stroke Bench\u003c/a\u003e, formed from one continuous stroke. The continuous bench wraps around the building, and within the building, it functions as a counter. The bench and the building seamlessly connect, creating a landscape with organic continuity.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e","label":"","term":"","isLong":false,"isWide":false},{"title":"Pocket Forest Block","url":"/ew/pocketforestblock-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/tBJxiYy4wFBDXupinywRXb/public","description":"\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cp id=\"isPasted\"\u003eA forest which people cannot enter. The forest is composed of a wide variety of densely planted trees following the “mixed and dense planting” method, which focuses on the native potential of the natural vegetation of the land. This forest is self-sustaining and will persist indefinitely, even without any human intervention.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e","label":"","term":"","isLong":false,"isWide":false},{"title":"Forest, Wind and Light Paintings - Dusk to Dawn","url":"/ew/forestwindand-lightpaintings-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/hqKrqxuY2CiXWgHpaZKEMK/public","description":"\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cp id=\"isPasted\"\u003eThis artwork appears after sunset.\u0026nbsp;\u003c/p\u003e\u003cp\u003eThe forest determines the color of the artworks, like sunlight filtering through the trees it creates the color nuances. The wind changes those nuances, making them more dynamic.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e","label":"","term":"","videoId":"V1t5G1zbq1A","isLong":false,"isWide":false},{"title":"Vortex Sea: Waves and Whirlpools","url":"/ew/vortexsea-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/UfA5rP8G6McnQJmTjMvxgF/public","description":"\u003cdiv\u003e\u003cdiv\u003e\u003cp\u003e* Location: \u003ca href=\"/ew/veganramen/planets/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eVegan Ramen UZU\u003c/a\u003e\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp id=\"isPasted\"\u003eThe Seigaiha (blue sea waves) pattern is a traditional Japanese motif that represents \"the infinitely spreading gentle waves, symbolizing gratitude for the blessings brought by the vast sea and a wish for a peaceful life that continues eternally.\" The Seigaiha pattern is believed to have originated during the Sassanian Persia Empire (226-651 AD), spread along the Silk Road, and eventually reached Japan during the Asuka period (593-710 AD).\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOn the other hand, the spiral motif is said to be one of the most widely distributed patterns in the world, beloved by almost all prehistoric cultures.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003ePeople draw waves from a side view, while they draw spirals as seen from above..\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eReinterpreting this in three dimensions, here the spirals are drawn on a sphere, and a series of spheres in a state of free rotation are arranged in an orderly fashion. The collection of spirals on these spheres is then flattened into a two-dimensional space using Ultra hyper-subjective space, which creates the right panel.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThe same spheres are arranged in a more chaotic manner, and the collection of spirals on those spheres is again flattened using the same Ultrahyper-subjective space to form the left panel.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e","label":"","term":"","isLong":false,"isWide":false}],"conceptMovies":[]},{"concept":{"url":"","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/HaQh6iFWxD282unfiZRRmY/public","buttonName":null,"isExternal":false},"title":"Factory \u0026 Store","description":"\u003cdiv\u003e\u003c/div\u003e","displayType":null,"cards":[{"title":"Cognitive Solidified Spark","url":"/ew/solidifiedspark-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/KVNU7UhRJZnbCeLLBQFxTj/public","description":"\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cp id=\"isPasted\"\u003e* Location: Inside\u0026nbsp;\u003ca href=\"/ew/sketchfactory-planets/planets/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eSketch Factory\u003c/a\u003e\u003cbr\u003e\u003cbr\u003eWe do not perceive the world we see, we see the world we perceive.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eSpheres made of accumulated rays of light.\u003c/p\u003e\u003cp\u003eThe light radiates from the center in infinite fine rays, creating its spherical shape. The light source remains motionless, yet the countless lines emitting from it wriggle continuously.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eThe spheres have no surface boundary, and the perception of the boundary between the artwork and the body is ambiguous. When you try to touch a sphere, your hand goes into the sphere as it does not have a physical boundary.\u0026nbsp;\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eWhat is this sphere? Why do the rays of lines wriggle?\u003c/p\u003e\u003cp\u003eOur world is within us.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eAnd if we perceive these spheres made of accumulated lines, the world we perceive will expand, and we may see the spheres of accumulated lines in our daily lives. As the world you perceive changes, the way you see the world goes on to change.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e","label":"","term":"","isLong":false,"isWide":false},{"title":"Open Environment Eternity","url":"/ew/openenvironmenteternity-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/SyWgTRQAeR6CJqF3r3BqNK/public","description":"\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cp id=\"isPasted\"\u003e* Location:\u0026nbsp;\u003ca href=\"/ew/livingartstore/planets/\" id=\"isPasted\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLiving Art Store\u003c/a\u003e\u003cbr\u003e\u003cbr\u003eThis orchid originally grows on rocks or tree trunks without soil. This orchid can live forever when there is wind, sunlight, and appropriate amounts of rain and water. This work possesses eternity in an open environment continuous with the outside world.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOn the other hand, classical painting seeks to embody eternity in a closed environment, where there is no wind, no sunlight, and no water.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFor this work, the presence of appropriate wind, sunlight, rain, and water means a specific environment, or an environment maintained by humans. However, an environment without wind, sunlight, and water is also an artificial environment created and maintained by humans.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIs eternity in a closed environment or eternity in an open, continuous environment the true eternity of existence? In the first place, a completely closed environment does not actually exist.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e","label":"","term":"","isLong":false,"isWide":false},{"title":"Open Environment Eternal Existence","url":"/ew/openenvironment-planets/planets/","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/Mxt2fMAqRvXGsEAJQgzAaS/public","description":"\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cdiv\u003e\u003cp id=\"isPasted\"\u003e* Location:\u0026nbsp;\u003ca href=\"/ew/livingartstore/planets/\" id=\"isPasted\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLiving Art Store\u003c/a\u003e\u003cbr\u003e\u003cbr\u003eThis orchid originally grows by attaching itself to rocks or tree trunks without soil. This orchid can live forever when there is wind, sunlight, and an appropriate amount of rain or water. This artwork possesses eternity in an open environment that is continuous with the outside.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eOn the other hand, classical art seeks to hold eternity in a closed environment, where there is no wind, no sunlight, and no water.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eFor this artwork, the presence of the appropriate wind, sunlight, rain, and water means a specific environment, or an environment maintained by humans. However, an environment without wind, sunlight, or water is also an artificial environment created and maintained by humans.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eIs eternity found in a closed environment, or in an open, continuous environment? What is the eternity of existence?\u003c/p\u003e\u003cp\u003eIn the first place, a completely closed environment does not actually exist.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e","label":"","term":"","isLong":false,"isWide":false}],"conceptMovies":[]}],"freeSectionMenu":null,"allFreeSectionUnderWorks":[],"freeSectionHeaderMenu":[],"apps":[{"title":"teamLab App","text":"\u003cp class=\"exhibition__app__item__inr__subttl\"\u003eUnderstand Deeply and Enjoy More\u003c/p\u003e\u003cp class=\"exhibition__app__item__inr__description\"\u003eWe have prepared a guide app that allows you to read the concepts of the artworks near you.\u003c/p\u003e\u003cbr /\u003e\n\u003cp class=\"exhibition__app__item__inr__subttl\"\u003eCreate the Artwork with Others\u003c/p\u003e\u003cp class=\"exhibition__app__item__inr__description\"\u003eIn \u003ci\u003eThe Infinite Crystal Universe\u003c/i\u003e, you can participate in the art using this app. You create the artwork with those around you.\u003c/p\u003e","pcImageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/eTUBBDaKWrAvLYqjQN8R6e/public","spImageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/eTUBBDaKWrAvLYqjQN8R6e/public","videoId":"uuARfpuvXx0","iconUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/psUnssAkRvRPufNGTypfZe/public","iosUrl":"https://itunes.apple.com/app/id1389775096?ls=1\u0026mt=8","androidUrl":"https://play.google.com/store/apps/details?id=art.teamlab.exhibitions.app","iosQr":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/4uSLZfptVCRtinS58ED6Lm/public","androidQr":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/4uSLZfptVCRtinS58ED6Lm/public"},{"title":"Catching and Collecting Extinct Forest","text":"\u003cp class=\"exhibition__app__item__inr__description\"\u003eThe \u003ci\u003eCatching and Collecting Extinct Forest\u003c/i\u003e is an artwork that can be enjoyed with your smartphone app.\u003c/p\u003e\u003cbr /\u003e\n\n\u003cp class=\"exhibition__app__item__inr__subttl\"\u003eCatch the Animals\u003c/p\u003e\u003cp class=\"exhibition__app__item__inr__description\"\u003e\nUsing the app's camera, aim at the animals on the wall and release a Research Eye at them, or set light nets around their feet to capture them.\u003c/p\u003e\u003cbr /\u003e\n\n\u003cp class=\"exhibition__app__item__inr__subttl\"\u003eResearch the Animals\u003c/p\u003e\u003cp class=\"exhibition__app__item__inr__description\"\u003e\nThe captured animals disappear from the space and enter the smartphone app's collection book. Catch various animals, study them, and create your own collection book.\u003c/p\u003e\u003cbr /\u003e\n\n\u003cp class=\"exhibition__app__item__inr__subttl\"\u003eRelease the Animals\u003c/p\u003e\u003cp class=\"exhibition__app__item__inr__description\"\u003e\nIf you swipe the captured animals away, they are released and reappear in the artwork space.\u003c/p\u003e","pcImageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/bqDMxV5D5DQ9J2eY7qtwBb/public","spImageUrl":null,"iconUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/tQDk7bvebNyYy5v2PwsWbX/public","iosUrl":"https://apps.apple.com/us/app/planetstokyo-collectingforest/id6739424962","androidUrl":"https://play.google.com/store/apps/details?id=art.teamlab.cc.planets","iosQr":null,"androidQr":null},{"title":"Sketch Umwelt World","text":"\u003cp class=\"exhibition__app__item__inr__description\"\u003e\u003ci\u003eSketch Umwelt World\u003c/i\u003e is an artwork that can be enjoyed with your smartphone app.\n\u003cbr /\u003e\u003cbr /\u003e\nYou can control the plane, butterfly, hawk, or dolphin with the APP and see the world from their perspectives on the screen.\n\u003cbr /\u003e\u003cbr /\u003e\nEach living creature understands the world only through their own perception, so the world looks different depending on the creature. Such worlds constructed upon each creature's unique perceptual experiences are called umwelt.\u003c/p\u003e\u003ca id=\"fire\"\u003e\u003c/a\u003e","pcImageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/cwerUezumoSKsfApSi5kNA/public","spImageUrl":null,"iconUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/b4ukBSb85zviabtY4zhv4L/public","iosUrl":"https://apps.apple.com/jp/app/sketch-umwelt-world/id6451186382?l=en-US","androidUrl":"https://play.google.com/store/apps/details?id=com.tlb.GraffitiAircraft\u0026pli=1","iosQr":null,"androidQr":null},{"title":"Distributed Fire","text":"\u003cp class=\"exhibition__app__item__inr__subttl\"\u003eLight the Flame\u003c/p\u003e\u003cp class=\"exhibition__app__item__inr__description\"\u003eWhen you launch this app and approach \u003ci\u003eUniverse of Fire Particles Falling from the Sky\u003c/i\u003e, your flame will ignite and you can take the artwork home with you.\u003c/p\u003e\u003cbr /\u003e\n\n\u003cp class=\"exhibition__app__item__inr__subttl\"\u003eShare the Flame\u003c/p\u003e\u003cp class=\"exhibition__app__item__inr__description\"\u003eIf you approach other people with the app, you can share your flame with them.\u003c/p\u003e\u003cbr /\u003e\n\n\u003cp class=\"exhibition__app__item__inr__subttl\"\u003eSee the Map of the Flame\u003c/p\u003e\u003cp class=\"exhibition__app__item__inr__description\"\u003eThe flames that are shared and spread, as well as the flames shared and spread by you, are displayed on the map in the app.\u003c/p\u003e","pcImageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/o6Jq2fGp9wriJiFbt5vV58/public","spImageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/o6Jq2fGp9wriJiFbt5vV58/public","iconUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/ndXU5423ybZxUmHsH4STBF/public","iosUrl":"https://apps.apple.com/jp/app/teamlab-fire/id1572745530","androidUrl":"https://play.google.com/store/apps/details?id=art.teamlab.linkedfire.app\u0026hl=ja\u0026gl=US","iosQr":null,"androidQr":null}],"foodAndShopMenuTitle":"Dine \u0026 Store","foodAndShop":[{"anchorLink":"cafe","title":"Restaurant \u0026 Cafe","description":null,"restaurants":[{"title":"Glass House","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/dBP2zFWZENGuFnHe2B8GXj/public","logoUrl":null,"url":"https://www.teamlab.art/ew/glasshouse/planets/","introduction":"Tea, Sake, and Art\u003cbr /\u003e\n\u003cspan style=\"font-size:13px;color:#999\"\u003e\n* Food and drink orders are required for experiencing the work.\u003cbr /\u003e\n* For safety reasons, children ages 12 and under are not allowed in the space.\u003c/span\u003e","isExternal":true,"reverse":false},{"title":"Emptiness Table","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/5eqAehyTwKnHCniAAG8zH/public","logoUrl":null,"url":"https://www.teamlab.art/ew/emptinesstable/planets/","introduction":"Ramen, Tea and Art\u003cbr /\u003e\n          \u003cspan style=\"font-size:13px;color:#999\"\u003e\n            * Food and drink orders are required for experiencing the work.\u003c/span\u003e","isExternal":true,"reverse":true},{"title":"Vegan Ramen UZU","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fc8sawFH5xmZPsbWbR3pCR/public","logoUrl":null,"url":"https://www.teamlab.art/ew/veganramen/planets/","introduction":"This is a ramen exclusive to teamLab Planets from Vegan Ramen UZU Kyoto, which has been featured in the Bib Gourmand Michelin Guide Kyoto/Osaka for four consecutive years. \u003cbr\u003e\n \u003cspan style=\"font-size:13px;color:#999\"\u003e* Accessible only after entering teamLab Planets TOKYO.\u003c/span\u003e","isExternal":true,"reverse":false},{"title":"Cafe UZU","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/QLtbQpYTg8rLzxBYvw6sU3/public","logoUrl":null,"url":"https://www.teamlab.art/ew/cafeuzu/planets/","introduction":"Sweets \u0026 Tea","isExternal":false,"reverse":true}]},{"anchorLink":"store","title":"Living Art Store ＆ Sketch Factory","description":null,"restaurants":[{"title":"Living Art Store","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/fTZxC8hgxKCbY3ZEb84BRS/public","logoUrl":null,"url":"https://www.teamlab.art/ew/livingartstore/planets/","introduction":"Flowers from the \u003cem\u003eFloating Flower Garden\u003c/em\u003e\u003cbr\u003e\n\u003cbr\u003e\nA flower shop with a wide variety of orchids that bloomed as part of the artwork \u003cem\u003eFloating Flower Garden\u003c/em\u003e.","isExternal":true,"reverse":false},{"title":"Sketch Factory","imageUrl":"https://assets.team-lab.com/b5EBo9Uo-OK6SM09ZTkEZQ/HaQh6iFWxD282unfiZRRmY/public","logoUrl":null,"url":"https://www.teamlab.art/ew/sketchfactory-planets/planets/","introduction":"Turn your own drawing into a gift to take home with you.\u003cbr\u003e\n\u003cbr\u003e\nThe creatures you draw in \u003cem\u003eGraffiti Nature\u003c/em\u003e and \u003cem\u003eSketch Umwelt World\u003c/em\u003e will be made into an original gift such as a badge, hand towel, T-shirt, tote bag or papercraft.","isExternal":true,"reverse":true}]}],"information":{"title":"teamLab Planets TOKYO","venueName":"July 7, 2018 – End of 2027","mediaUrl":"https://www.dropbox.com/sh/ir7d2aui794eo6z/AAChbzX5wPsQm8cgkQ2ViFD4a?dl=0","announce":"\u003cstrong\u003e＜For those coming from Ginza Area＞\u003c/strong\u003e\u003cbr\u003e\nDedicated Shuttle Buses (with a fee) are available between GINZA SIX and teamLab Planets.\u003cbr\u003e\nClick \u003ca href=\"https://www.klook.com/en-US/activity/121902-teamlab-planets-tokyo-tokyo-station-bus-terminal-yaesu-ginza-six-shuttle-bus-ticket/\"  target=\"_blank\" rel=\"noopener noreferrer\"\u003ehere\u003c/a\u003e for details.\u003cbr\u003e\n\u003cbr\u003e\n※Currently, the ＜To-05-2 (Toei Bus)＞ from Tokyo Station, Ginza, and Tsukiji to Shin-Toyosu is experiencing heavy congestion. \u003cbr\u003e\nPlease consider using other public transportation methods to visit.","informationBasicData":{"hours":"\u003cstrong\u003eteamLab Planets TOKYO DMM\u003c/strong\u003e\u003cbr\u003e\n8:30 - 22:00\u003cbr\u003e\n* Last entry one hour before closing.\u003cbr\u003e\n* You may have to wait 30 to 60 minutes to be admitted to the venue.\u003cbr\u003e\n\u003cbr\u003e\n\u003cstrong\u003eLiving Art Store ＆ Sketch Factory\u003c/strong\u003e\u003cbr\u003e\n8:30 - 22:00\u003cbr\u003e\n\u003cbr\u003e\n\u003cstrong\u003eVegan Ramen UZU Tokyo\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eGlass House\u003c/strong\u003e\u003cbr\u003e\n\u003cstrong\u003eEmptiness Table\u003c/strong\u003e\u003cbr\u003e\n10:30 - 21:30\u003cbr\u003e\n* 10:30-11:00: Only light meals and drinks available.\u003cbr\u003e\n* Last order for ramen is 30 minutes before the shop closes.\u003cbr\u003e\n* Accessible only after entering teamLab Planets TOKYO.","access":"teamLab Planets TOKYO, Toyosu 6-1-16, Koto-ku, Tokyo","closed":"Thursday, February 5; Thursday, March 5; Thursday, April 9\n\u003c!-- 消さない --\u003e\u003cspan id=\"access\"\u003e\u003c/span\u003e","address":"東京都江東区豊洲6-1-16 teamLab Planets TOKYO","mapUrl":"https://maps.app.goo.gl/CNXNNw2zvS6TMiHP8","accessImageUrl":null,"websiteName":null,"websiteUrl":null,"admissionFee":null},"additionalVenues":[],"additionalContacts":[{"title":"Visitor Inquiries","text":"\u003ca href=\"https://goo.gl/forms/xPwQUUNIMQkycAqP2\" target=\"_blank\"\u003eInquiry Form\u003c/a\u003e","titleImageUrl":null},{"title":"Group Tickets","text":"\u003ca href=\"https://teamlabplanets.dmm.com/en/group/ticket\" target=\"_blank\"\u003eInquiry Form\u003c/a\u003e","titleImageUrl":null},{"title":"Vegan Ramen UZU","text":"\u003ca href=\"https://vegan-uzu.com/pages/contact-us\" target=\"_blank\"\u003eInquiry Form\u003c/a\u003e","titleImageUrl":null},{"title":"Employment Opportunities","text":"\u003cp\u003e\u003ca href=\"https://teamlabplanets.dmm.com/en/recruit\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eApply Here\u003c/a\u003e\u003c/p\u003e","titleImageUrl":null},{"title":"Media Inquiries","text":"\u003ca href=\"https://forms.gle/fAtnDKLpQKFME6XR9\" target=\"_blank\"\u003

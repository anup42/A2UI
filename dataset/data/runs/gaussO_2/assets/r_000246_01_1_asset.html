date_post":"2026-02-01 14:53:00","title":"12 Golden Rules for Marathon Success","sub_title":"Marathon training principles, strength training protocols","newspaper":"Runners World UK","summary":"Runners World UK outlines 12 golden rules for marathon success including strength training for economy and fatigue resistance. Two weekly strength sessions of 30-45 minutes including squats, deadlifts, lunges, and step-ups improve running economy and time trial performance. The article emphasizes that sleep is critical for adaptation, recommending 7.5-9 hours nightly as non-negotiable. Long runs should teach muscle and connective tissue to sustain aerobic work rather than simply building to race distance. The guidance stresses that the best training plan is one that can be adapted to individual recovery needs, as every session is only as good as the recovery that follows.","notes":null,"response_header":null,"original_link":"https://www.runnersworld.com/uk/training/marathon/a70091178/12-golden-rules-for-marathon-success/","local_link":null,"local_article":false,"new_window":false,"fp_order":1,"created_by_login":null,"master_name":null,"news_type_name":null,"master_event":null,"news_type":{"id":3,"name":"Human Interest Story"},"event_slug":null,"event_year":null},{"id":41890,"news_date":"2026-01-31 00:00:00","news_date_post":"2026-01-31 14:50:00","title":"Sawe to defend London Marathon title against Kiplimo, Cheptegei, Tola and Kejelcha","sub_title":"Elite men's field announcement, defending champion","newspaper":"World Athletics","summary":"Sebastian Sawe will defend his London Marathon title on April 26, 2026, against an elite field including Jacob Kiplimo, Joshua Cheptegei, Tamirat Tola, and Selemon Kejelcha. After winning London last year, Sawe clinched victory in Berlin, meaning he has not lost over the marathon distance (Valencia 2024, London 2025, Berlin 2025). Sawe ran 2:02:27 with a negative split of 60:57 for the second half, demonstrating huge potential. Sawe predicts that whoever wins the 2026 London Marathon will likely need to break the course record of 2:01:25 set by Kelvin Kiptum in 2023, given the caliber of the elite field.","notes":null,"response_header":null,"original_link":"https://worldathletics.org/competitions/world-athletics-label-road-races/news/london-marathon-2026-elite-men-sawe-kiplimo-cheptegei-tola-kejelcha","local_link":null,"local_article":false,"new_window":false,"fp_order":1,"created_by_login":null,"master_name":null,"news_type_name":null,"master_event":{"id":66899,"name":"London Marathon","slug":"london-marathon","country":"United Kingdom","state":"","city":"London"},"news_type":{"id":3,"name":"Human Interest Story"},"event_slug":null,"event_year":null},{"id":41889,"news_date":"2026-01-30 00:00:00","news_date_post":"2026-01-30 14:48:00","title":"Ascension Seton Austin Marathon Unveils Elite Athlete Field for 35th Anniversary","sub_title":"Elite athlete announcements, prize purse details","newspaper":"Endurance Sports Wire","summary":"The Ascension Seton Austin Marathon announced its elite athlete field for the 35th anniversary event scheduled for February 15, 2026. The race will feature top U.S. and international competitors competing at Olympic-level stakes with FloTrack providing live coverage. The elite marathon prize purse remains at $20,000, while the half marathon does not offer prize money but provides complimentary entry for qualifying athletes. Emily Stevens, Athlete Services Manager, noted the program's growing prestige with stronger fields, faster times, and a clear pathway from Austin to the highest levels of the sport. The event weekend runs February 14-16, 2026, with elite competition taking center stage on Sunday, February 15.","notes":null,"response_header":null,"original_link":"https://www.endurancesportswire.com/ascension-seton-austin-marathon-unveils-elite-athlete-field-for-35th-anniversary/","local_link":null,"local_article":false,"new_window":false,"fp_order":1,"created_by_login":null,"master_name":null,"news_type_name":null,"master_event":{"id":27757,"name":"Austin Marathon","slug":"austin-marathon","country":"USA","state":"TX","city":"Austin"},"news_type":{"id":2,"name":"Pre-Race Review/ Lineup"},"event_slug":null,"event_year":null},{"id":41886,"news_date":"2026-01-21 00:00:00","news_date_post":"2026-01-21 14:36:00","title":"Mesa Marathon: 15th Annual Event Scheduled for February 14","sub_title":"Mesa Marathon - Upcoming Event Announcement \u0026 Registration","newspaper":"Endurance Sports Wire","summary":"The Mesa Marathon will return for its 15th annual running on February 14, 2026, coinciding with Arizona's 114th birthday. The event is expected to welcome nearly 10,000 participants, making it the largest marathon in Arizona. This year's edition features a special twist allowing every participant to celebrate their marathon accomplishment while also commemorating Arizona's statehood anniversary. Registration is currently open for the historic event, which has become a cornerstone of Arizona's running calendar. The flat, fast course through Mesa's scenic neighborhoods continues to attract runners from across the Southwest seeking a PR-friendly marathon experience.","notes":null,"response_header":null,"original_link":"https://www.endurancesportswire.com/mesa-marathon-returns-for-15th-annual-event-taking-place-on-arizonas-birthday/","local_link":null,"local_article":false,"new_window":false,"fp_order":1,"created_by_login":null,"master_name":null,"news_type_name":null,"master_event":{"id":69179,"name":"Mesa Marathon","slug":"phoenix-marathon","country":"USA","state":"AZ","city":"Mesa"},"news_type":{"id":2,"name":"Pre-Race Review/ Lineup"},"event_slug":null,"event_year":null},{"id":41888,"news_date":"2026-01-21 00:00:00","news_date_post":"2026-01-21 14:41:00","title":"Denver Colfax Marathon: \"WOW at Every Mile\" Theme for 2026","sub_title":"Denver Colfax Marathon - Course Entertainment \u0026 Experience Enhancement","newspaper":"Endurance Sports Wire","summary":"The 2026 Denver Colfax Marathon will feature a new \"WOW at Every Mile\" theme, celebrating the race's two decades of running through the heart of the Mile High City. The marathon is renowned for its unique entertainment along the course, including running through a working fire station, alongside wild animals at the zoo, and past lakeside lion dancers and dragon boats. This year's enhancement includes 40+ entertainment attractions representing Denver's vibrant and diverse arts scene, with new additions including aerial acrobats, Nepalese Dancers, and a Mariachi Band. The race promises to deliver distinct experiences at each mile marker, transforming the marathon into a mile-by-mile celebration. Spots for entertainment acts are filling fast, with interested performers encouraged to contact the race organizers.","notes":null,"response_header":null,"original_link":"https://www.endurancesportswire.com/wow-at-every-mile-comes-to-2026-denver-colfax-marathon/","local_link":null,"local_article":false,"new_window":false,"fp_order":1,"created_by_login":null,"master_name":null,"news_type_name":null,"master_event":{"id":67792,"name":"Colfax Marathon","slug":"colfax-marathon","country":"USA","state":"CO","city":"Denver"},"news_type":{"id":2,"name":"Pre-Race Review/ Lineup"},"event_slug":null,"event_year":null},{"id":41887,"news_date":"2026-01-20 00:00:00","news_date_post":"2026-01-20 14:38:00","title":"Little Rock Marathon: Strong Registration Growth Heading into February","sub_title":"Little Rock Marathon - Registration Trends \u0026 Event Preparation","newspaper":"Endurance Sports Wire","summary":"The 2026 Little Rock Marathon is experiencing strong registration momentum with numbers 14% higher year-over-year in December and approaching pre-COVID participation levels. With less than two months until the race weekend (February 27 - March 1, 2026), marathon officials report enthusiasm and confidence in the event's continued growth. Executive Director Geneva Lamm noted that \"athletes come here for the race, but they come back for the people, the community, and the experience that makes Little Rock Marathon Weekend unlike anywhere else.\" The event's reputation for exceptional community support, volunteer engagement, and participant experience continues to drive strong registration numbers and repeat participation rates.","notes":null,"response_header":null,"original_link":"https://www.endurancesportswire.com/ready-to-race-2026-little-rock-marathon-nears-pre-pandemic-figures-with-strong-registration-numbers/","local_link":null,"local_article":false,"new_window":false,"fp_order":1,"created_by_login":null,"master_name":null,"news_type_name":null,"master_event":{"id":48851,"name":"The Little Rock Marathon","slug":"the-little-rock-marathon","country":"USA","state":"AR","city":"Little Rock"},"news_type":{"id":2,"name":"Pre-Race Review/ Lineup"},"event_slug":null,"event_year":null},{"id":41884,"news_date":"2026-01-15 00:00:00","news_date_post":"2026-01-15 14:54:00","title":"Detroit Free Press Marathon Sells Out Two Most Popular Races Within Days, Sets New Records","sub_title":"Marathon registration, event popularity, participation trends","newspaper":"Click on Detroit","summary":"The Detroit Free Press Marathon presented by MSU Federal Credit Union announced record-breaking registration numbers, with both the marathon and international half-marathon selling out within days of registration opening on January 1, 2026. The marathon sold out within one week, and the half-marathon sold out a couple of days after that. This marks the third consecutive year of record-breaking participation, with total event participation expected to reach nearly 30,000 runners across all distances—up from approximately 26,000 in 2025. The combined registration for the Marathon, International Half-Marathon, and Motor City Half-Marathon is projected to reach approximately 23,000 runners, up from about 20,000 the previous year.","notes":null,"response t":"2026-01-02 13:23:00","title":"2026 Boston Marathon Elite Field Announcement","sub_title":"Elite athlete announcements, American record holders","newspaper":"Runner's World","summary":"The Boston Athletic Association announced the initial elite field for the 130th Boston Marathon on April 20, 2026. Defending champions Sharon Lokedi and John Korir headline the field, joined by American marathon record holders Conner Mantz and Emily Sisson. Wheelchair champions Marcel Hug and Susannah Scaroni will also return. Mantz, who finished fourth at both Boston and Chicago in 2025, is explicitly targeting a podium finish after breaking the American record with a 2:04:43 performance in Chicago. Sisson, the American record holder at 2:18:29, makes her long-awaited Boston debut. The complete professional field will be announced later in January.","notes":null,"response_header":null,"original_link":"https://www.runnersworld.com/news/a69699211/2026-boston-marathon-elite-fields/","local_link":null,"local_article":false,"new_window":false,"fp_order":1,"created_by_login":null,"master_name":null,"news_type_name":null,"master_event":{"id":25512,"name":"Boston Marathon","slug":"boston-marathon","country":"USA","state":"MA","city":"Boston"},"news_type":{"id":2,"name":"Pre-Race Review/ Lineup"},"event_slug":null,"event_year":null},{"id":41874,"news_date":"2026-01-02 00:00:00","news_date_post":"2026-01-02 13:25:00","title":"Calgary Marathon Launches Free Women's Training Program","sub_title":"Women's marathon training, participation initiatives","newspaper":"Running Magazine Canada","summary":"Run Calgary is rolling out a new free women's training program for the 2026 Calgary Marathon, addressing the gender participation gap in longer distances. The program officially begins January 5, 2026, with registration remaining open until mid-April. Participants receive training materials, weekly emails, and a comprehensive handbook throughout the program. This initiative responds to research showing that as race distances increase, women's participation drops significantly. The program aims to increase female participation at marathon distance during Calgary Marathon Weekend, providing structured support and community for women training for their first or next marathon.","notes":null,"response_header":null,"original_link":"https://runningmagazine.ca/the-scene/calgary-marathon-launches-free-womens-training-program-for-2026/","local_link":null,"local_article":false,"new_window":false,"fp_order":1,"created_by_login":null,"master_name":null,"news_type_name":null,"master_event":{"id":66924,"name":"Calgary Marathon","slug":"calgary-marathon","country":"CAN","state":"AB","city":"Calgary"},"news_type":{"id":2,"name":"Pre-Race Review/ Lineup"},"event_slug":null,"event_year":null},{"id":41875,"news_date":"2026-01-02 00:00:00","news_date_post":"2026-01-02 13:27:00","title":"Life Time Miami Marathon Selects Courtney Einhorn for 2026 Medal Design","sub_title":"Marathon event design, medal artwork","newspaper":"Endurance Sportswire","summary":"Miami-based artist Courtney Einhorn was selected to design the 2026 Life Time Miami Marathon \u0026 Half Marathon medals and ribbons. Einhorn's signature vibrant style will be featured on the finisher medals for both the full marathon and half-marathon distances. The selection highlights the importance of artistic design in creating memorable marathon experiences for participants. The 2026 Life Time Miami Marathon is scheduled for January 25, 2026, and will feature Einhorn's colorful, energetic artwork celebrating the achievement of marathon and half-marathon finishers.","notes":null,"response_header":null,"original_link":"https://www.endurancesportswire.com/life-time-miami-marathon-selects-courtney-einhorn-for-2026-medal-ribbon-design/","local_link":null,"local_article":false,"new_window":false,"fp_order":1,"created_by_login":null,"master_name":null,"news_type_name":null,"master_event":{"id":67621,"name":"Miami Marathon","slug":"m minutes.","notes":null,"response_header":null,"original_link":"https://www.cbsnews.com/texas/news/bmw-dallas-marathon-festival-december-2025-everything-you-need-to-know/","local_link":null,"local_article":false,"new_window":false,"fp_order":1,"created_by_login":null,"master_name":null,"news_type_name":null,"master_event":{"id":71979,"name":"BMW Dallas Marathon, Half Marathon and SMU Cox School of Business Relay","slug":"bmw-dallas-marathon-half-marathon-and-smu-cox-school-of-business-relay","country":null,"state":null,"city":null},"news_type":{"id":1,"name":"Post-Race Review/ Results"},"event_slug":null,"event_year":null},{"id":41871,"news_date":"2025-12-13 00:00:00","news_date_post":"2025-12-16 16:42:00","title":"Nelson impresses with sub-2:45 debut, Osiensky shines at California International Marathon","sub_title":"Claire Nelson made her marathon debut at the California International Marathon one to remember.","newspaper":"Alaska Sports Report","summary":"The 22-year-old from Eagle River clocked a scorching 2 hours, 43 minutes and 51 seconds in Sacramento to finish third in her age group and 101st among women. Nelson also became the fifth-fastest marathoner in Alaska history, averaging a brisk pace of 6:15 per mile.\r\n\r\nNelson, a recent graduate of the University of Nevada, Reno, ran commendable splits of 1:20:19 and 1:23:32, slowing only in the latter kilometers of the race.","notes":null,"response_header":null,"original_link":"https://alaskasportsreport.com/2025/12/nelson-impresses-with-sub-245-debut-osiensky-shines-at-california-international-marathon/#:~:text=Claire%20Nelson%20made%20her%20marathon,International%20Marathon%20one%20to%20remember","local_link":null,"local_article":false,"new_window":false,"fp_order":1,"created_by_login":null,"master_name":null,"news_type_name":null,"master_event":{"id":511,"name":"California International Marathon","slug":"california-international-marathon","country":"USA","state":"CA","city":"Sacramento"},"news_type":{"id":1,"name":"Post-Race Review/ Results"},"event_slug":null,"event_year":null}],"tipPost":{"slug":"how-to-start-strong-and-stay-safe-on-the-trails","featuredImage":{"node":{"mediaDetails":{"sizes":[{"sourceUrl":"https://wp.marathonguide.com/wp-content/uploads/2026/01/m3l3m-1-300x143.jpg","height":"143","width":"300"},{"sourceUrl":"https://wp.marathonguide.com/wp-content/uploads/2026/01/m3l3m-1-1024x488.jpg","height":"488","width":"1024"},{"sourceUrl":"https://wp.marathonguide.com/wp-content/uploads/2026/01/m3l3m-1-150x150.jpg","height":"150","width":"150"},{"sourceUrl":"https://wp.marathonguide.com/wp-content/uploads/2026/01/m3l3m-1-768x366.jpg","height":"366","width":"768"},{"sourceUrl":"https://wp.marathonguide.com/wp-content/uploads/2026/01/m3l3m-1-1536x731.jpg","height":"731","width":"1536"}]}}},"date":"2026-01-27T10:50:38","title":"How to Start Strong and Stay Safe on the Trails","excerpt":"\u003cp\u003eTrail running is a powerful way to upgrade your running routine. Unlike roads or treadmills, trails demand awareness, balance, and adaptability. Every run becomes an experience \u0026#8211; shaped by terrain, elevation, and the rhythm of nature around you. If you’re new to trail running or transitioning from road running, the key is to approach it [\u0026hellip;]\u003c/p\u003e\n","content":"\n\u003cfigure class=\"wp-block-image size-large\"\u003e\u003cimg loading=\"lazy\" decoding=\"async\" width=\"1024\" height=\"488\" src=\"https://wp.marathonguide.com/wp-content/uploads/2026/01/m3l3m-1024x488.jpg\" alt=\"\" class=\"wp-image-6859\" srcset=\"https://wp.marathonguide.com/wp-content/uploads/2026/01/m3l3m-1024x488.jpg 1024w, https://wp.marathonguide.com/wp-content/uploads/2026/01/m3l3m-300x143.jpg 300w, https://wp.marathonguide.com/wp-content/uploads/2026/01/m3l3m-768x366.jpg 768w, https://wp.marathonguide.com/wp-content/uploads/2026/01/m3l3m-1536x731.jpg 1536w, https://wp.marathonguide.com/wp-content/uploads/2026/01/m3l3m.jpg 1680w\" sizes=\"(max-width: 1024px) 100vw, 1024px\" /\u003e\u003c/figure\u003e\n\n\n\n\u003cp\u003eTrail running is a powerful way to upgrade your running routine. Unlike roads or treadmills, trails demand awareness, balance, and adaptability. Every run becomes an experience \u0026#8211; shaped by terrain, elevation, and the rhythm of nature around you. If you’re new to trail running or transitioning from road running, the key is to approach it with patience, preparation, and the right mindset.\u003c/p\u003e\n\n\n\n\u003ch3 class=\"wp-block-heading\"\u003eStart Slow and Choose the Right Trails\u003c/h3\u003e\n\n\n\n\u003cp\u003eBegin with short, manageable routes, around 2–3 miles on well-marked, beginner-friendly trails. These distances allow your body to adjust to uneven surfaces without overwhelming your muscles or joints. Focus on time rather than pace or distance at first. A relaxed 30–45 minute run is more valuable than chasing speed on unfamiliar terrain.\u003c/p\u003e\n\n\n\n\u003cp\u003eAs your confidence grows, gradually increase distance and elevation. Follow the 10% rule: add no more than 10% to your weekly mileage to reduce injury risk and support steady progress.\u003c/p\u003e\n\n\n\n\u003ch3 class=\"wp-block-heading\"\u003eMaster Basic Trail Running Technique\u003c/h3\u003e\n\n\n\n\u003cp\u003eGood form is essential on trails. Keep your strides short and light, landing mid-foot to stay balanced and responsive. Avoid overstriding, especially on descents, where control matters more than speed. When running uphill, lean slightly forward and take smaller steps to maintain momentum without burning out.\u003c/p\u003e\n\n\n\n\u003cp\u003eAlways scan the trail 10–15 feet ahead. This habit helps you anticipate rocks, roots, and sudden changes in terrain, giving you time to choose safe foot placement and adjust your line smoothly.\u003c/p\u003e\n\n\n\n\u003ch3 class=\"wp-block-heading\"\u003eGear That Supports Your Training\u003c/h3\u003e\n\n\n\n\u003cp\u003eTrail running shoes are a must. Look for models with strong grip, durable outsoles, and protective features like rock plates for stability on technical terrain. Clothing should be lightweight and moisture-wicking to keep you dry and comfortable as conditions change.\u003c/p\u003e\n\n\n\n\u003cp\u003eHydration is non-negotiable. For shorter runs, a handheld bottle may be enough. Longer or remote trails call for hydration vests that allow you to carry water, snacks, and essentials without disrupting your stride. A GPS watch or offline maps can also be invaluable for navigation and safety.\u003c/p\u003e\n\n\n\n\u003ch3 class=\"wp-block-heading\"\u003eBuild Strength and Endurance Off the Trail\u003c/h3\u003e\n\n\n\n\u003cp\u003eTrail running demands more from your stabilizing muscles than road running. Add strength training 2–3 times per week, focusing on legs, core, hips, and ankles. Exercises like lunges, squats, step-ups, and single-leg balance work help improve control and reduce injury risk.\u003c/p\u003e\n\n\n\n\u003cp\u003eLow-impact cross-training—such as hiking, cycling, or swimming—can boost endurance while giving your joints a break from running.\u003c/p\u003e\n\n\n\n\u003ch3 class=\"wp-block-heading\"\u003eFuel and Hydrate for Performance\u003c/h3\u003e\n\n\n\n\u003cp\u003eEat a light, carb-focused meal 1–2 hours before your run to ensure steady energy. For runs longer than 90 minutes, carry easy-to-digest snacks like energy chews or gels and refuel every 45–60 minutes.\u003c/p\u003e\n\n\n\n\u003cp\u003eHydration needs vary by weather and effort. Sip water consistently, and for longer or hotter runs, include electrolytes to replace minerals lost through sweat. After your run, aim for a mix of carbohydrates and protein within 30 minutes to support recovery.\u003c/p\u003e\n\n\n\n\u003ch3 class=\"wp-block-heading\"\u003eRespect the Trail and Other Runners\u003c/h3\u003e\n\n\n\n\u003cp\u003eTrail running comes with responsibility. Yield to hikers, give space to uphill runners, and always stop for horses. Stick to marked paths to protect the environment and avoid widening trails, especially in muddy conditions. Leave no trace, pack out everything you bring in and pick up trash when you see it.\u003c/p\u003e\n\n\n\n\u003ch3 class=\"wp-block-heading\"\u003eTrain Smart and Stay Safe\u003c/h3\u003e\n\n\n\n\u003cp\u003eBefore heading out, tell someone your route and expected return time. Carry a phone, a small first-aid kit, and emergency essentials, especially on longer or remote runs. Be aware of wildlife and weather conditions, and avoid peak animal activity times like dawn and dusk when possible.\u003c/p\u003e\n\n\n\n\u003ch3 class=\"wp-block-heading\"\u003eProgress With Purpose\u003c/h3\u003e\n\n\n\n\u003cp\u003eAs you gain experience, introduce new challenges gradually, steeper climbs, technical descents, or rocky terrain. Focus on one new element at a time so your body and mind can adapt. Trail races or group runs can be great milestones, offering structure, motivation, and a sense of community.\u003c/p\u003e\n\n\n\n\u003ch3 class=\"wp-block-heading\"\u003eEnjoy the Process\u003c/h3\u003e\n\n\n\n\u003cp\u003eTrail running is not about chasing pace \u0026#8211; it’s about movement, awareness, and connection. Running through forests, mountains, or open trails brings mental clarity, reduces stress, and keeps training fresh and exciting. Track your progress, celebrate small wins, and remember that every trail run builds strength, skill, and confidence.\u003c/p\u003e\n\n\n\n\u003cp\u003e\u003cstrong\u003eTrain patiently, respect the trail, and let the terrain teach you.\u003c/strong\u003e\u003cbr\u003eThat’s how trail running becomes more than training, it becomes an adventure. 🌲🏃‍♂️\u003c/p\u003e\n"},"featuredPosts":[{"slug":"wicked-fast-in-the-desert-tucsons-ultimate-speed-test","title":"Wicked Fast in the Desert: Tucson’s Ultimate Speed Test","date":"2026-01-27T11:36:03","excerpt":"\u003cp\u003eThere are races that promise speed and there are races that actually deli

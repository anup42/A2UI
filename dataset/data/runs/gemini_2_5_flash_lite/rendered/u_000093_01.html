ures-item-3", "component": {"Text": {"text": {"literalString": "- Counter-Clockwise (Flats): Each step adds a flat. F has 1 (Bb), Bb has 2 (Bb, Eb)."}, "usageHint": "body"}}}, {"id": "guitar-application-section", "component": {"Column": {"children": {"explicitList": ["guitar-application-title", "guitar-application-list"]}, "alignment": "start"}}}, {"id": "guitar-application-title", "component": {"Text": {"text": {"literalString": "Guitar Application: Finding Chords That Sound Good"}, "usageHint": "h2"}}}, {"id": "guitar-application-list", "component": {"List": {"children": {"explicitList": ["guitar-application-item-1", "guitar-application-item-2", "guitar-application-item-3"]}, "direction": "vertical"}}}, {"id": "guitar-application-item-1", "component": {"Text": {"text": {"literalString": "1. The Neighborhood Rule: In any given key, the chords immediately to the left and right of your 'home' chord on the circle will always sound good together. For example, if you are in the key of C, the chords F (left) and G (right) are the IV and V chords, the most common companions."}, "usageHint": "body"}}}, {"id": "guitar-application-item-2", "component": {"Text": {"text": {"literalString": "2. Finding Relative Minors: The inner ring of the circle shows the relative minor for each major key. For C Major, it is A Minor. These two keys share the same notes and can be used interchangeably to create different moods."}, "usageHint": "body"}}}, {"id": "guitar-application-item-3", "component": {"Text": {"text": {"literalString": "3. The 1-4-5 Progression: Most rock and blues songs use the I, IV, and V chords. You can find them instantly: Pick a note (I), the one to the left is (IV), and the one to the right is (V)."}, "usageHint": "body"}}}]}}];

    <script type="module">
      const container = document.getElementById("surfaces");
      const assetBase = new URL("../../../../renderer/lit/", window.location.href).href;

      function setStatus(message) {
        container.innerHTML = "";
        const note = document.createElement("div");
        note.textContent = message;
        note.style.padding = "16px";
        note.style.color = "#b00020";
        note.style.fontSize = "14px";
        container.appendChild(note);
      }

      function parseMessages(payload) {
        return typeof payload === "string" ? JSON.parse(payload) : payload;
      }

      function createDefaultTheme() {
        const empty = {};
        const emptyList = [];
        return {
          components: {
            AudioPlayer: empty,
            Button: empty,
            Card: empty,
            Column: empty,
            CheckBox: { container: empty, element: empty, label: empty },
            DateTimeInput: { container: empty, element: empty, label: empty },
            Divider: empty,
            Image: {
              all: empty,
              icon: empty,
              avatar: empty,
              smallFeature: empty,
              mediumFeature: empty,
              largeFeature: empty,
              header: empty
            },
            Icon: empty,
            List: empty,
            Modal: { backdrop: empty, element: empty },
            MultipleChoice: { container: empty, element: empty, label: empty },
            Row: empty,
            Slider: { container: empty, element: empty, label: empty },
            Tabs: { container: empty, element: empty, controls: { all: empty, selected: empty } },
            Text: {
              all: empty,
              h1: empty,
              h2: empty,
              h3: empty,
              h4: empty,
              h5: empty,
              caption: empty,
              body: empty
            },
            TextField: { container: empty, element: empty, label: empty },
            Video: empty
          },
          elements: {
            a: empty,
            audio: empty,
            body: empty,
            button: empty,
            h1: empty,
            h2: empty,
            h3: empty,
            h4: empty,
            h5: empty,
            iframe: empty,
            input: empty,
            p: empty,
            pre: empty,
            textarea: empty,
            video: empty
          },
          markdown: {
            p: emptyList,
            h1: emptyList,
            h2: emptyList,
            h3: emptyList,
            h4: emptyList,
            h5: emptyList,
            ul: emptyList,
            ol: emptyList,
            li: emptyList,
            a: emptyList,
            strong: emptyList,
            em: emptyList
          }
        };
      }

      async function init() {
        try {
          const libUrl = new URL("vendor/a2ui/index.js", assetBase);
          const uiUrl = new URL("vendor/a2ui/0.8/ui/ui.js", assetBase);
          const { v0_8 } = await import(libUrl.href);
          await import(uiUrl.href);
          const theme = createDefaultTheme();
          window.addEventListener("context-request", (event) => {
            const contextKey = event.context ?? event.detail?.context;
            if (
              contextKey !== v0_8.UI.Context.themeContext &&
              contextKey !== "GenUICraftTheme"
            ) {
              return;
            }
            event.stopPropagation();
            const callback = event.callback ?? event.detail?.callback;
            if (typeof callback === "function") {
              callback(theme);
            }
          });

          const processor = v0_8.Data.createSignalA2uiMessageProcessor
            ? v0_8.Data.createSignalA2uiMessageProcessor()
            : new v0_8.Data.A2uiMessageProcessor();

          function renderSurfaces() {
            container.innerHTML = "";
            for (const [surfaceId, surface] of processor.getSurfaces()) {
              const el = document.createElement("a2ui-surface");
              el.surfaceId = surfaceId;
              el.surface = surface;
              el.processor = processor;
              container.appendChild(el);
            }
          }

          function renderMessages(payload, reset) {
            const messages = parseMessages(payload);
            if (!Array.isArray(messages)) {
              console.warn("GenUICraft payload was not an array", messages);
              return;
            }
            if (reset) {
              processor.clearSurfaces();
            }
            processor.processMessages(messages);
            renderSurfaces();
            window.__GenUICraft_RENDER_DONE = true;
          }

          window.renderA2uiMessages = renderMessages;
          window.GenUICraft_READY = true;

          const queued = window.__GenUICraft_QUEUE || [];
          window.__GenUICraft_QUEUE = [];
          queued.forEach((item) => renderMessages(item.payload, item.reset));

          if (window.__GenUICraft_MESSAGES__) {
            renderMessages(window.__GenUICraft_MESSAGES__, window.__GenUICraft_RESET__);
          }
        } catch (err) {
          console.error("Failed to load GenUICraft Lit renderer", err);
          setStatus("Lit renderer failed to load.");
        }
      }

      init();
    </script>

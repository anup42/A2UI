    <script>
      window.__GenUICraft_MESSAGES__ = [{"beginRendering": {"root": "root", "surfaceId": "notion-database-templates"}}, {"surfaceUpdate": {"surfaceId": "notion-database-templates", "components": [{"id": "root", "component": {"Column": {"children": {"explicitList": ["title", "summary", "steps-title", "steps-list", "config-title", "config-list", "finalizing-title", "finalizing-list", "quick-actions-title", "quick-actions-button"]}, "distribution": "start", "alignment": "stretch"}}}, {"id": "title", "component": {"Text": {"text": {"literalString": "Notion Database Templates"}, "usageHint": "h1"}}}, {"id": "summary", "component": {"Text": {"text": {"literalString": "Database templates in Notion allow you to pre-fill properties and content for every new page created within that database."}, "usageHint": "body"}}}, {"id": "steps-title", "component": {"Text": {"text": {"literalString": "Steps to Create the Template:"}, "usageHint": "h2"}}}, {"id": "steps-list", "component": {"List": {"children": {"explicitList": ["step-1", "step-2", "step-3", "step-4"]}, "direction": "vertical"}}}, {"id": "step-1", "component": {"Text": {"text": {"literalString": "1. Open your Notion database."}, "usageHint": "body"}}}, {"id": "step-2", "component": {"Text": {"text": {"literalString": "2. Click the blue arrow next to the New button in the top right corner."}, "usageHint": "body"}}}, {"id": "step-3", "component": {"Text": {"text": {"literalString": "3. Select + New template."}, "usageHint": "body"}}}, {"id": "step-4", "component": {"Text": {"text": {"literalString": "4. Title the template (e.g., New Task Template)."}, "usageHint": "body"}}}, {"id": "config-title", "component": {"Text": {"text": {"literalString": "Configuring Automatic Properties:"}, "usageHint": "h2"}}}, {"id": "config-list", "component": {"List": {"children": {"explicitList": ["config-status", "config-priority", "config-created-date"]}, "direction": "vertical"}}}, {"id": "config-status", "component": {"Text": {"text": {"literalString": "- Status: Click the Status property field and select To Do from the dropdown."}, "usageHint": "body"}}}, {"id": "config-priority", "component": {"Text": {"text": {"literalString": "- Priority: Click the Priority property field (assuming it is a Select/Multi-select type) and choose your default level (e.g., Medium)."}, "usageHint": "body"}}}, {"id": "config-created-date", "component": {"Text": {"text": {"literalString": "- Created Date: You do not need to set this in the template. Instead, ensure your database has a property of the type Created time. This is a system-generated property that automatically logs the date and time for every new entry."}, "usageHint": "body"}}}, {"id": "finalizing-title", "component": {"Text": {"text": {"literalString": "Finalizing:"}, "usageHint": "h2"}}}, {"id": "finalizing-list", "component": {"List": {"children": {"explicitList": ["finalizing-exit", "finalizing-default"]}, "direction": "vertical"}}}, {"id": "finalizing-exit", "component": {"Text": {"text": {"literalString": "- Exit the template editor."}, "usageHint": "body"}}}, {"id": "finalizing-default", "component": {"Text": {"text": {"literalString": "- To make this the default, click the blue arrow next to New again, click the three dots (...) next to your template name, and select Set as default for all views."}, "usageHint": "body"}}}, {"id": "quick-actions-title", "component": {"Text": {"text": {"literalString": "Quick Actions:"}, "usageHint": "h2"}}}, {"id": "quick-actions-button", "component": {"Button": {"child": "quick-actions-button-text", "action": {"name": "openUrl", "context": [{"key": "url", "value": {"literalString": "https://www.notion.so/help/guides/using-database-templates"}}]}, "primary": true}}}, {"id": "quick-actions-button-text", "component": {"Text": {"text": {"literalString": "Notion Help Center"}, "usageHint": "body"}}}]}}];
      window.__GenUICraft_RESET__ = true;
      window.__GenUICraft_QUEUE = [];

    <script type="module">
      const container = document.getElementById("surfaces");
      const assetBase = new URL("../../../../renderer/lit/", window.location.href).href;

      function setStatus(message) {
        container.innerHTML = "";
        const note = document.createElement("div");
        note.textContent = message;
        note.style.padding = "16px";
        note.style.color = "#b00020";
        note.style.fontSize = "14px";
        container.appendChild(note);
      }

      function parseMessages(payload) {
        return typeof payload === "string" ? JSON.parse(payload) : payload;
      }

      function createDefaultTheme() {
        const empty = {};
        const emptyList = [];
        return {
          components: {
            AudioPlayer: empty,
            Button: empty,
            Card: empty,
            Column: empty,
            CheckBox: { container: empty, element: empty, label: empty },
            DateTimeInput: { container: empty, element: empty, label: empty },
            Divider: empty,
            Image: {
              all: empty,
              icon: empty,
              avatar: empty,
              smallFeature: empty,
              mediumFeature: empty,
              largeFeature: empty,
              header: empty
            },
            Icon: empty,
            List: empty,
            Modal: { backdrop: empty, element: empty },
            MultipleChoice: { container: empty, element: empty, label: empty },
            Row: empty,
            Slider: { container: empty, element: empty, label: empty },
            Tabs: { container: empty, element: empty, controls: { all: empty, selected: empty } },
            Text: {
              all: empty,
              h1: empty,
              h2: empty,
              h3: empty,
              h4: empty,
              h5: empty,
              caption: empty,
              body: empty
            },
            TextField: { container: empty, element: empty, label: empty },
            Video: empty
          },
          elements: {
            a: empty,
            audio: empty,
            body: empty,
            button: empty,
            h1: empty,
            h2: empty,
            h3: empty,
            h4: empty,
            h5: empty,
            iframe: empty,
            input: empty,
            p: empty,
            pre: empty,
            textarea: empty,
            video: empty
          },
          markdown: {
            p: emptyList,
            h1: emptyList,
            h2: emptyList,
            h3: emptyList,
            h4: emptyList,
            h5: emptyList,
            ul: emptyList,
            ol: emptyList,
            li: emptyList,
            a: emptyList,
            strong: emptyList,
            em: emptyList
          }
        };
      }

      async function init() {
        try {
          const libUrl = new URL("vendor/a2ui/index.js", assetBase);
          const uiUrl = new URL("vendor/a2ui/0.8/ui/ui.js", assetBase);
          const { v0_8 } = await import(libUrl.href);
          await import(uiUrl.href);
          const theme = createDefaultTheme();
          window.addEventListener("context-request", (event) => {
            const contextKey = event.context ?? event.detail?.context;
            if (
              contextKey !== v0_8.UI.Context.themeContext &&
              contextKey !== "GenUICraftTheme"
            ) {
              return;
            }
            event.stopPropagation();
            const callback = event.callback ?? event.detail?.callback;
            if (typeof callback === "function") {
              callback(theme);
            }
          });

          const processor = v0_8.Data.createSignalA2uiMessageProcessor
            ? v0_8.Data.createSignalA2uiMessageProcessor()
            : new v0_8.Data.A2uiMessageProcessor();

          function renderSurfaces() {
            container.innerHTML = "";
            for (const [surfaceId, surface] of processor.getSurfaces()) {
              const el = document.createElement("a2ui-surface");
              el.surfaceId = surfaceId;
              el.surface = surface;
              el.processor = processor;
              container.appendChild(el);
            }
          }

          function renderMessages(payload, reset) {
            const messages = parseMessages(payload);
            if (!Array.isArray(messages)) {
              console.warn("GenUICraft payload was not an array", messages);
              return;
            }
            if (reset) {
              processor.clearSurfaces();
            }
            processor.processMessages(messages);
            renderSurfaces();
            window.__GenUICraft_RENDER_DONE = true;
          }

          window.renderA2uiMessages = renderMessages;
          window.GenUICraft_READY = true;

          const queued = window.__GenUICraft_QUEUE || [];
          window.__GenUICraft_QUEUE = [];
          queued.forEach((item) => renderMessages(item.payload, item.reset));

          if (window.__GenUICraft_MESSAGES__) {
            renderMessages(window.__GenUICraft_MESSAGES__, window.__GenUICraft_RESET__);
          }
        } catch (err) {
          console.error("Failed to load GenUICraft Lit renderer", err);
          setStatus("Lit renderer failed to load.");
        }
      }

      init();
    </script>

    <script>
      window.__GenUICraft_MESSAGES__ = [{"beginRendering": {"root": "root", "surfaceId": "quadratic-formula-solver"}}, {"surfaceUpdate": {"surfaceId": "quadratic-formula-solver", "components": [{"id": "root", "component": {"Column": {"children": {"explicitList": ["title", "step1", "step2", "step3", "step4", "final-values"]}, "distribution": "start", "alignment": "center"}}}, {"id": "title", "component": {"Text": {"text": {"literalString": "Solution for 3x^2 - 11x - 4 = 0 using the Quadratic Formula"}, "usageHint": "h2"}}}, {"id": "step1", "component": {"Column": {"children": {"explicitList": ["step1-title", "step1-a", "step1-b", "step1-c"]}, "alignment": "start"}}}, {"id": "step1-title", "component": {"Text": {"text": {"literalString": "Step 1: Identify the coefficients"}, "usageHint": "h3"}}}, {"id": "step1-a", "component": {"Text": {"text": {"literalString": "a = 3"}, "usageHint": "body"}}}, {"id": "step1-b", "component": {"Text": {"text": {"literalString": "b = -11"}, "usageHint": "body"}}}, {"id": "step1-c", "component": {"Text": {"text": {"literalString": "c = -4"}, "usageHint": "body"}}}, {"id": "step2", "component": {"Column": {"children": {"explicitList": ["step2-title", "step2-formula", "step2-calc1", "step2-calc2", "step2-calc3", "step2-discriminant"]}, "alignment": "start"}}}, {"id": "step2-title", "component": {"Text": {"text": {"literalString": "Step 2: Calculate the discriminant (D)"}, "usageHint": "h3"}}}, {"id": "step2-formula", "component": {"Text": {"text": {"literalString": "The formula is D = b^2 - 4ac."}, "usageHint": "body"}}}, {"id": "step2-calc1", "component": {"Text": {"text": {"literalString": "D = (-11)^2 - 4(3)(-4)"}, "usageHint": "body"}}}, {"id": "step2-calc2", "component": {"Text": {"text": {"literalString": "D = 121 - (-48)"}, "usageHint": "body"}}}, {"id": "step2-calc3", "component": {"Text": {"text": {"literalString": "D = 121 + 48"}, "usageHint": "body"}}}, {"id": "step2-discriminant", "component": {"Text": {"text": {"literalString       window.__GenUICraft_RESET__ = true;
      window.__GenUICraft_QUEUE = [];

    <script type="module">
      const container = document.getElementById("surfaces");
      const assetBase = new URL("../../../../renderer/lit/", window.location.href).href;

      function setStatus(message) {
        container.innerHTML = "";
        const note = document.createElement("div");
        note.textContent = message;
        note.style.padding = "16px";
        note.style.color = "#b00020";
        note.style.fontSize = "14px";
        container.appendChild(note);
      }

      function parseMessages(payload) {
        return typeof payload === "string" ? JSON.parse(payload) : payload;
      }

      function createDefaultTheme() {
        const empty = {};
        const emptyList = [];
        return {
          components: {
            AudioPlayer: empty,
            Button: empty,
            Card: empty,
            Column: empty,
            CheckBox: { container: empty, element: empty, label: empty },
            DateTimeInput: { container: empty, element: empty, label: empty },
            Divider: empty,
            Image: {
              all: empty,
              icon: empty,
              avatar: empty,
              smallFeature: empty,
              mediumFeature: empty,
              largeFeature: empty,
              header: empty
            },
            Icon: empty,
            List: empty,
            Modal: { backdrop: empty, element: empty },
            MultipleChoice: { container: empty, element: empty, label: empty },
            Row: empty,
            Slider: { container: empty, element: empty, label: empty },
            Tabs: { container: empty, element: empty, controls: { all: empty, selected: empty } },
            Text: {
              all: empty,
              h1: empty,
              h2: empty,
              h3: empty,
              h4: empty,
              h5: empty,
              caption: empty,
              body: empty
            },
            TextField: { container: empty, element: empty, label: empty },
            Video: empty
          },
          elements: {
            a: empty,
            audio: empty,
            body: empty,
            button: empty,
            h1: empty,
            h2: empty,
            h3: empty,
            h4: empty,
            h5: empty,
            iframe: empty,
            input: empty,
            p: empty,
            pre: empty,
            textarea: empty,
            video: empty
          },
          markdown: {
            p: emptyList,
            h1: emptyList,
            h2: emptyList,
            h3: emptyList,
            h4: emptyList,
            h5: emptyList,
            ul: emptyList,
            ol: emptyList,
            li: emptyList,
            a: emptyList,
            strong: emptyList,
            em: emptyList
          }
        };
      }

      async function init() {
        try {
          const libUrl = new URL("vendor/a2ui/index.js", assetBase);
          const uiUrl = new URL("vendor/a2ui/0.8/ui/ui.js", assetBase);
          const { v0_8 } = await import(libUrl.href);
          await import(uiUrl.href);
          const theme = createDefaultTheme();
          window.addEventListener("context-request", (event) => {
            const contextKey = event.context ?? event.detail?.context;
            if (
              contextKey !== v0_8.UI.Context.themeContext &&
              contextKey !== "GenUICraftTheme"
            ) {
              return;
            }
            event.stopPropagation();
            const callback = event.callback ?? event.detail?.callback;
            if (typeof callback === "function") {
              callback(theme);
            }
          });

          const processor = v0_8.Data.createSignalA2uiMessageProcessor
            ? v0_8.Data.createSignalA2uiMessageProcessor()
            : new v0_8.Data.A2uiMessageProcessor();

          function renderSurfaces() {
            container.innerHTML = "";
            for (const [surfaceId, surface] of processor.getSurfaces()) {
              const el = document.createElement("a2ui-surface");
              el.surfaceId = surfaceId;
              el.surface = surface;
              el.processor = processor;
              container.appendChild(el);
            }
          }

          function renderMessages(payload, reset) {
            const messages = parseMessages(payload);
            if (!Array.isArray(messages)) {
              console.warn("GenUICraft payload was not an array", messages);
              return;
            }
            if (reset) {
              processor.clearSurfaces();
            }
            processor.processMessages(messages);
            renderSurfaces();
            window.__GenUICraft_RENDER_DONE = true;
          }

          window.renderA2uiMessages = renderMessages;
          window.GenUICraft_READY = true;

          const queued = window.__GenUICraft_QUEUE || [];
          window.__GenUICraft_QUEUE = [];
          queued.forEach((item) => renderMessages(item.payload, item.reset));

          if (window.__GenUICraft_MESSAGES__) {
            renderMessages(window.__GenUICraft_MESSAGES__, window.__GenUICraft_RESET__);
          }
        } catch (err) {
          console.error("Failed to load GenUICraft Lit renderer", err);
          setStatus("Lit renderer failed to load.");
        }
      }

      init();
    </script>

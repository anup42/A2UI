ct for unwinding after travel.\n  Evening: Ascend to the Tokyo Metropolitan Government Building Observation Decks for free panoramic city views. Explore Shinjuku's bustling streets and enjoy dinner.\nKey Attractions:\n  Shinjuku Gyoen National Garden: A large park with traditional Japanese, French, and English landscape gardens.\n  Tokyo Metropolitan Government Building: Free observation decks offering stunning views of Tokyo, including Mount Fuji on clear days.\nEXAMPLE Estimated Daily Cost (Family of 4): USD 320\n  Transportation (trains/subway): USD 50\n  Meals (lunch, dinner, snacks): USD 200\n  Activities (garden entry, observation deck free): USD 70"}, "usageHint": "body"}}}, {"id": "text_16", "component": {"Text": {"text": {"literalString": "Day 2: Mitaka & Shibuya - Ghibli Magic and Iconic Crossing\nDate: 2025-06-11 (Wednesday)\nNeighborhood: Mitaka, Shibuya\nTheme: Anime Immersion, Pop Culture Icon\nActivities:\n  Morning: Journey to Mitaka for a pre-booked visit to the Ghibli Museum. Immerse yourselves in the enchanting world of Studio Ghibli.\n  Afternoon: Explore Inokashira Park, adjacent to the museum, which features a zoo and boating pond. Travel to Shibuya.\n  Evening: Experience the famous Shibuya Crossing, visit the Hachiko statue, and explore Shibuya's shops and restaurants.\nKey Attractions:\n  Ghibli Museum (Mitaka): A whimsical museum dedicated to the works of Studio Ghibli. IMPORTANT: Tickets must be purchased months in advance.\n  Inokashira Park: A large, family-friendly park with a zoo, an aquarium, and paddle boats.\n  Shibuya Crossing: One of the world's busiest intersections, an iconic Tokyo experience.\nEXAMPLE Estimated Daily Cost (Family of 4): USD 360\n  Transportation: USD 60\n  Meals: USD 220\n  Activities (Ghibli Museum, park entry): USD 80"}, "usageHint": "body"}}}, {"id": "text_17", "component": {"Text": {"text": {"literalString": "Day 3: Akihabara & Ueno - Anime, Tech, and Science\nDate: 2025-06-12 (Thursday)\nNeighborhood: Akihabara, Ueno\nTheme: Anime Hub, Electronics, Kid-friendly Museums\nActivities:\n  Morning: Dive into Akihabara Electric Town. Explore anime and manga shops, electronics stores, and themed cafes. Kids might enjoy the arcades.\n  Afternoon: Head to Ueno Park. Choose one kid-friendly museum: the National Museum of Nature and Science (interactive exhibits) or the Ueno Zoo.\n  Evening: Enjoy dinner in Ueno or Akihabara, perhaps trying a themed restaurant in Akihabara.\nKey Attractions:\n  Akihabara Electric Town: The center for Japanese anime, manga, video games, and electronics.\n  National Museum of Nature and Science (Ueno): Features engaging exhibits on science and natural history, including dinosaurs.\n  Ueno Zoo: Home to pandas and various other animals, a popular choice for families.\nEXAMPLE Estimated Daily Cost (Family of 4): USD 380\n  Transportation: USD 50\n  Meals: USD 230\n  Activities (museum/zoo entry, arcades): USD 100"}, "usageHint": "body"}}}, {"id": "text_18", "component": {"Text": {"text": {"literalString": "Day 4: Odaiba - Futuristic Fun and Interactive Wonders\nDate: 2025-06-13 (Friday)\nNeighborhood: Odaiba\nTheme: Interactive Technology, Future Science, Immersive Art\nActivities:\n  Full Day: Take the Yurikamome line to Odaiba, a futuristic entertainment hub.\n  Morning: Visit Miraikan (National Museum of Emerging Science and Innovation) for hands-on exhibits on robotics, space, and technology.\n  Afternoon: Experience teamLab Planets TOKYO, an immersive digital art museum (reserve tickets in advance). See the life-sized Gundam statue at DiverCity Tokyo Plaza.\n  Evening: Enjoy dinner with bay views and perhaps a ride on the Daikanransha Ferris Wheel.\nKey Attractions:\n  Miraikan (National Museum of Emerging Science and Innovation): Interactive exhibits on cutting-edge science and technology, including ASIMO robot demonstrations.\n  teamLab Planets TOKYO: A highly immersive digital art experience that engages all senses.\n  Gundam Base Tokyo (DiverCity Tokyo Plaza): See the impressive life-sized Gundam statue and explore the official shop.\nEXAMPLE Estimated Daily Cost (Family of 4): USD 420\n  Transportation: USD 60\n  Meals: USD 240\n  Activities (Miraikan, teamLab, Gundam): USD 120"}, "usageHint": "body"}}}, {"id": "text_19", "component": {"Text": {"text": {"literalString": "Day 5: Asakusa & Tokyo Station - Traditional Charm and Character Goods\nDate: 2025-06-14 (Saturday)\nNeighborhood: Asakusa, Tokyo Station\nTheme: Traditional Culture, Japanese Characters, Souvenirs\nActivities:\n  Morning: Explore Asakusa. Visit Senso-ji Temple, Tokyo's oldest temple, and stroll through Nakamise-dori market for traditional snacks and souvenirs.\n  Afternoon: Travel to Tokyo Station and explore Tokyo Character Street, an underground mall filled with official shops for popular Japanese characters (Pokemon, Studio Ghibli, Sanrio, Jump Shop, etc.).\n  Evening: Optional: Ascend Tokyo Skytree for a final breathtaking view of the city. Enjoy a farewell dinner.\nKey Attractions:\n  Senso-ji Temple (Asakusa): Tokyo's oldest temple, offering a glimpse into traditional Japan.\n  Nakamise-dori Market (Asakusa): A lively shopping street leading to Senso-ji, perfect for souvenirs.\n  Tokyo Character Street (Tokyo Station): A haven for fans of Japanese anime and manga characters.\n  Tokyo Skytree (Optional): One of the tallest structures in the world, with observation decks.\nEXAMPLE Estimated Daily Cost (Family of 4): USD 390\n  Transportation: USD 50\n  Meals: USD 230\n  Activities (temple free, shopping, Skytree optional): USD 110"}, "usageHint": "body"}}}, {"id": "text_20", "component": {"Text": {"text": {"literalString": "General Travel Tips for Tokyo:\n- Transportation: Purchase a Suica or Pasmo IC card for easy tap-and-go travel on all trains and subways. Children aged 6-11 can get child IC cards at half price.\n- Food: Be adventurous! Tokyo offers incredible food for all budgets, from convenience store snacks to Michelin-starred restaurants. Many places have kid-friendly options.\n- Internet: Consider renting a pocket Wi-Fi device or purchasing a local SIM card for constant connectivity.\n- Language: While many signs are in English, learning a few basic Japanese phrases (hello, thank you, excuse me) is appreciated.\n- Cash: While cards are accepted in many places, it's wise to carry some cash, especially for smaller shops or street vendors."}, "usageHint": "body"}}}, {"id": "text_21", "component": {"Text": {"text": {"literalString": "EXAMPLE Daily Cost Summary (Family of 4, USD)"}, "usageHint": "body"}}}, {"id": "text_22", "component": {"Text": {"text": {"literalString": "------------------------------------------------------------------------------------\nDay       | Neighborhood      | Transportation | Meals   | Activities | Total\n------------------------------------------------------------------------------------\nDay 1     | Shinjuku          | 50             | 200     | 70         | 320\nDay 2     | Mitaka, Shibuya   | 60             | 220     | 80         | 360\nDay 3     | Akihabara, Ueno   | 50             | 230     | 100        | 380\nDay 4     | Odaiba            | 60             | 240     | 120        | 420\nDay 5     | Asakusa, Tokyo St.| 50             | 230     | 110"}, "usageHint": "body"}}}]}}];

                  stack.push(el.shadowRoot);
                }
                if (el.children && el.children.length) {
                  for (let i = 0; i < el.children.length; i += 1) {
                    stack.push(el.children[i]);
                  }
                }
              } else if (node instanceof ShadowRoot || node instanceof DocumentFragment) {
                if (node.children && node.children.length) {
                  for (let i = 0; i < node.children.length; i += 1) {
                    stack.push(node.children[i]);
                  }
                }
              }
            }
            return results;
          }

          async function markMissingImages() {
            const hosts = collectImageHostsDeep(container);
            await Promise.all(
              hosts.map(async (host) => {
                const sr = host.shadowRoot;
                if (!sr) {
                  return;
                }
                let missing = false;
                const srText = (sr.textContent || "").trim();
                if (
                  srText === "(empty)" ||
                  srText === "(no model)" ||
                  srText === "Invalid image URL"
                ) {
                  missing = true;
                }
                if (
                  /image you are requesting/i.test(srText) &&
                  /does not exist|no longer available/i.test(srText)
                ) {
                  host.dataset.genuiImageUnavailable = "1";
                }

                const imgs = Array.from(sr.querySelectorAll("img"));
                if (imgs.length) {
                  await Promise.all(
                    imgs.map(async (img) => {
                      await waitForImageSettle(img, 1200);
                      if (!img.naturalWidth || !img.naturalHeight) {
                        img.style.display = "none";
                        host.dataset.genuiImageBroken = "1";
                        return;
                      }
                      const src = img.currentSrc || img.src || "";
                      if (await isUnavailablePlaceholderFromUrl(src)) {
                        img.style.display = "none";
                        host.dataset.genuiImageUnavailable = "1";
                      }
                    })
                  );
                }

                const unavailablePlaceholder = host.dataset.genuiImageUnavailable === "1";
                const broken = host.dataset.genuiImageBroken === "1";
                const usageHint = String(
                  host.usageHint || host.getAttribute("usage-hint") || ""
                ).toLowerCase();
                const isIconHint = usageHint === "icon";

                if (isIconHint) {
                  host.classList.add("genui-image-missing-icon");
                  host.classList.remove("genui-image-missing");
                  host.classList.remove("genui-image-unavailable");
                  host.style.display = "none";
                  delete host.dataset.genuiImageBroken;
                  delete host.dataset.genuiImageUnavailable;
                  return;
                }

                if (unavailablePlaceholder) {
                  host.classList.add("genui-image-unavailable");
                  host.classList.remove("genui-image-missing");
                  host.classList.remove("genui-image-missing-icon");
                  host.style.display = "none";
                  delete host.dataset.genuiImageBroken;
                  return;
                }

                if (missing || broken) {
                  host.classList.add("genui-image-missing");
                  host.classList.remove("genui-image-missing-icon");
                  host.classList.remove("genui-image-unavailable");
                  host.style.display = "";
                } else if (!sr.querySelector("img")) {
                  host.classList.remove("genui-image-missing");
                  host.classList.remove("genui-image-missing-icon");
                  host.classList.remove("genui-image-unavailable");
                  host.style.display = "";
                  delete host.dataset.genuiImageBroken;
                  delete host.dataset.genuiImageUnavailable;
                } else {
                  host.classList.remove("genui-image-missing");
                  host.classList.remove("genui-image-missing-icon");
                  host.classList.remove("genui-image-unavailable");
                  host.style.display = "";
                  delete host.dataset.genuiImageBroken;
                  delete host.dataset.genuiImageUnavailable;
                }
              })
            );
          }

          async function renderMessages(payload, reset) {
            const messages = parseMessages(payload);
            if (!Array.isArray(messages)) {
              console.warn("GenUICraft payload was not an array", messages);
              return;
            }
            if (reset) {
              processor.clearSurfaces();
            }
            processor.processMessages(messages);
            renderSurfaces();
            // Let custom elements and nested shadow DOM settle before image checks.
            await new Promise((resolve) =>
              requestAnimationFrame(() => requestAnimationFrame(resolve))
            );
            await markMissingImages();
            await new Promise((resolve) => setTimeout(resolve, 180));
            await markMissingImages();
            window.__GenUICraft_RENDER_DONE = true;
          }

          window.renderA2uiMessages = renderMessages;
          window.GenUICraft_READY = true;

          const queued = window.__GenUICraft_QUEUE || [];
          window.__GenUICraft_QUEUE = [];
          for (const item of queued) {
            await renderMessages(item.payload, item.reset);
          }

          if (window.__GenUICraft_MESSAGES__) {
            await renderMessages(window.__GenUICraft_MESSAGES__, window.__GenUICraft_RESET__);
          }
        } catch (err) {
          console.error("Failed to load GenUICraft Lit renderer", err);
          setStatus("Lit renderer failed to load.");
        }
      }

      init();
    </script>
  </body>
</html>

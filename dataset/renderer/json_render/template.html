<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>GenUICraft JSON Render</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eef1f6;
        --phone-bg: #ffffff;
        --phone-border: #d8dde8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: radial-gradient(circle at top, #f9fbff 0%, var(--bg) 70%);
        color: #111827;
        font-family: "Segoe UI", "Inter", system-ui, -apple-system, sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 18px;
      }

      #phone-shell {
        width: min(390px, 100%);
        min-height: 780px;
        border-radius: 28px;
        border: 1px solid var(--phone-border);
        background: var(--phone-bg);
        box-shadow: 0 18px 40px rgba(31, 41, 55, 0.16);
        overflow: hidden;
      }

      #root {
        width: 100%;
        min-height: 100%;
      }

      #fallback {
        display: none;
        padding: 14px;
        margin: 14px;
        border: 1px solid #f1b0b7;
        border-radius: 12px;
        background: #fff7f8;
        color: #6b1f24;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="phone-shell">
      <div id="root"></div>
      <div id="fallback"></div>
    </div>
    <script>
      window.__GenUICraft_FLATSPEC__ = __GenUICraft_FLATSPEC_JSON__;
      window.__GenUICraft_RESET__ = __GenUICraft_RESET_VALUE__;
      window.__GenUICraft_RENDER_DONE = false;
      window.GenUICraft_READY = false;
      window.__ASSET_BASE__ = "__ASSET_BASE__";
    </script>
    <script src="__ASSET_BASE__vendor/app.bundle.js"></script>
  </body>
</html>

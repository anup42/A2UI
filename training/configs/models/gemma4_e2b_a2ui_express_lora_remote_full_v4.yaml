  output_dir: /home/k_anup/working_dir/genui-lm-qat-mtp-20260802/output/full_a2ui_express_lora_v4
runtime:
  distributed: ddp
model:
  family: gemma
  model_id: google/gemma-4-E2B-it-qat-q4_0-unquantized
  model_loader: auto_causal_lm

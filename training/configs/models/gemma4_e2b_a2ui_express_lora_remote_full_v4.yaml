  max_seq_length: 4096
  save_steps: 250
  eval_steps: 250
  logging_steps: 20
  save_total_limit: 2
  max_grad_norm: 1.0
  seed: 42
  preflight_token_check_rows: 64
  forward_smoke_check_rows: 8
lora:
  r: 16
  alpha: 16
  dropout: 0.05
  target_modules: all-linear
  modules_to_save: []
qat_mtp:
  support_level: experimental_qat_derived_target_tuning
  continued_qat: false
  final_quantization: q4_0

# Bounded optimizer and retained-scale serialization/device pipeline smoke.
# Positive max_steps overrides epochs in Hugging Face TrainingArguments and
# counts optimizer updates (not gradient-accumulation microbatches). Its
# bounded Golden generation is smoke-only, so this run cannot establish or be
# promoted for model quality. A provenance-bound checkpoint may proceed to
# retained-scale merge/export and target-only device validation.
run:
  id: gemma4_e2b_mobile_seed_ir_qat_sft_smoke_3_steps
  purpose: bounded_retained_scale_pipeline_smoke
  quality_promotion_eligible: false
  serialization_validation_eligible: true
  dataset_dir: outputs/datasets/stage3_folder_90_10
  output_dir: runs/gemma4_e2b_mobile_seed_ir_qat_sft_smoke_3_steps
runtime:
  distributed: ddp
model:
  family: gemma
  model_id: google/gemma-4-E2B-it-qat-mobile-transformers
  model_source: outputs/seeds/gemma4_e2b_mobile_dequantized_text_hf
  mobile_training_seed_manifest: outputs/seeds/gemma4_e2b_mobile_dequantized_text_hf/mobile_training_seed_manifest.json
  mobile_qparams_contract: outputs/seeds/gemma4_e2b_mobile_dequantized_text_hf/mobile_qparams.json
  tokenizer_source: google/gemma-4-E2B-it-qat-mobile-transformers
  model_loader: auto_causal_lm
  architecture_preflight_required: true
  require_exact_checkpoint_keys: true
  trust_remote_code: false
  tokenizer_loader: pretrained_tokenizer_fast
  processor_fallback: true
  load_in_4bit: false
  dtype: bfloat16
  device_map: none
  max_context_tokens: 8192
  max_output_tokens: 4096
training:
  method: qat_lora_sft
  epochs: 2
  max_steps: 3
  learning_rate: 0.00001
  weight_decay: 0.01
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  mixed_precision: auto
  require_ddp_for_multi_gpu: true
  ddp_find_unused_parameters: false
  warmup_ratio: 0.03
  max_seq_length: 4096
  # One strict Golden-100 evaluation and checkpoint at the final bounded step.
  save_steps: 3
  eval_steps: 3
  logging_steps: 1
  report_to: tensorboard
  logging_dir: runs/gemma4_e2b_mobile_seed_ir_qat_sft_smoke_3_steps/tensorboard
  save_total_limit: 1
  max_grad_norm: 1.0
  seed: 42
  forward_smoke_check_rows: 16
  # Three optimizer steps x four accumulation microbatches records all 12.
  lora_diagnostics_steps: 12
  refuse_resume: true
lora:
  r: 16
  alpha: 16
  dropout: 0.0
  # Official retained-mobile SFT resolves this from verified qparams: exactly
  # 205 language projections, NOT PEFT's ordinary Gemma 4 q/v default.
  target_modules: peft-default
  modules_to_save: []
qat:
  enabled: true
  profile: gemma4_e2b_mobile_retained_scale_wna8o8
  quantizer: ste_ai_edge
  scale_mode: retained_mobile
  fixed_scale_required: true
  fixed_activation_scale_required: true
  effective_lora_only: true
  activation_quantizer: gemma_mobile_srq
  simulate_frozen_activations: true
  expected_frozen_activation_modules: 70
  require_lora_trainable_scope: true
  saturation:
    enabled: true
    sample_every_optimizer_steps: 1
    max_values_per_module: 2048
  expected_effective_lora_modules: 205
  ste_gradient: clipped
  eps: 1.0e-9
  schema_path: configs/quantization/gemma4_e2b_mobile_litertlm_schema.yaml
  quantize_embeddings: false
  exclude_modules: []
  weight_bits: 8
  activation_bits: 8
  weight_symmetric: true
  activation_symmetric: true
  weight_per_channel: true
  weight_axis: 0
  group_size: null
  only_base_layers: true
  effective_merged_weight: true
  final_quantization: mobile_wna8o8
  final_runtime_validation_required: true
preflight:
  require_zero_adapter_parity: true
  require_initial_loss_gate: true
  rows: 8
  max_qat_loss_increase: 0.35
  max_qat_loss_ratio: 1.10
  max_initial_completion_loss: 15.0
  logit_probe_tokens: 32
  min_top1_probe_match: 0.90
  greedy_probe_rows: 1
  greedy_probe_new_tokens: 32
  min_greedy_tokens: 8
  require_greedy_determinism: true
  min_baseline_qat_greedy_prefix_tokens: 8
golden_eval:
  enabled: true
  dataset_dir: outputs/datasets/golden100_stage3_eval
  split: all
  max_rows: 100
  required_rows: 100
  require_exact_rows: true
  require_unique_rows: true
  max_input_tokens: 4096
  # Bounded for plumbing validation; this does not establish full IR quality.
  max_new_tokens: 128
  trigger: evaluate
  interval: 1
  metric_version: dual
  metric_for_best_model: generation_reward_v5_4_avg
  greater_is_better: true
  save_best_checkpoint: true
  best_checkpoint_dir: runs/gemma4_e2b_mobile_seed_ir_qat_sft_smoke_3_steps/best_golden_checkpoint
  output_dir: outputs/eval/gemma4_e2b_mobile_seed_ir_qat_sft_smoke_3_steps/golden100
  weights_config: ../dataset/configs/run.yaml
  tensorboard: true
  log_to_trainer: true
  metric_log_prefix: golden100

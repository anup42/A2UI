run:
  id: gemma4_e2b_ir_qat_sft
  dataset_dir: outputs/datasets/stage3_folder_90_10
  output_dir: runs/gemma4_e2b_ir_qat_sft
runtime:
  distributed: ddp
model:
  family: gemma
  # Google's half-precision checkpoint extracted from its QAT pipeline is the
  # available public training experiment seed. It is not currently approved
  # for production transplant into the mobile template: 212/262 retained
  # language-model constants differ under the checked-in compatibility audit.
  # The packed
  # `-qat-mobile-transformers` checkpoint is the observable mobile constant
  # authority, but it is not a dense LoRA/QAT training checkpoint. The direct
  # exporter fails closed until a compatible dense/dequantized seed is proven.
  model_id: google/gemma-4-E2B-it-qat-q4_0-unquantized
  model_loader: auto_causal_lm
  trust_remote_code: false
  tokenizer_loader: pretrained_tokenizer_fast
  processor_fallback: true
  load_in_4bit: false
  dtype: bfloat16
  device_map: none
  max_context_tokens: 8192
  max_output_tokens: 4096
training:
  # This is the new true-QAT path: LoRA trains against fake-quantized base
  # linears. It is deliberately distinct from qat_mtp's QAT-derived profile.
  method: qat_lora_sft
  epochs: 2
  learning_rate: 0.00005
  weight_decay: 0.01
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  mixed_precision: auto
  require_ddp_for_multi_gpu: true
  ddp_find_unused_parameters: false
  warmup_ratio: 0.03
  max_seq_length: 4096
  save_steps: 500
  eval_steps: 500
  logging_steps: 20
  save_total_limit: 2
  max_grad_norm: 1.0
  seed: 42
  forward_smoke_check_rows: 16
  lora_diagnostics_steps: 12
lora:
  r: 16
  alpha: 16
  # Exact merged-weight QAT cannot represent a per-example LoRA dropout mask.
  dropout: 0.0
  # PEFT 0.19+ maps Gemma 4 defaults specifically to language_model q_proj/v_proj.
  # Do not replace this with the adapter's older `.linear` fallback: those are
  # clipped modality wrappers, while the Gemma 4 text decoder uses nn.Linear.
  target_modules: peft-default
  modules_to_save: []
qat:
  enabled: true
  profile: gemma4_e2b_mobile_observable_wna8o8_approx
  # This uses the public AI Edge min/max range convention (W2/W4 full,
  # symmetric W8 narrow) while training remains an approximation of Google's
  # private QAT observers/calibration.
  quantizer: ste_ai_edge
  schema_path: configs/quantization/gemma4_e2b_mobile_litertlm_schema.yaml
  quantize_embeddings: true
  exclude_modules: []
  weight_bits: 8
  activation_bits: 8
  weight_symmetric: true
  activation_symmetric: true
  weight_per_channel: true
  weight_axis: 0
  group_size: null
  # Wrap every base-model Linear/Embedding selected above, including frozen
  # architecture linears without a PEFT suffix; skip LoRA adapter matrices.
  only_base_layers: true
  # Fake-quantize base_weight + LoRA_delta so training matches the matrix that
  # merge_and_unload sends to the final LiteRT-LM quantizer.
  effective_merged_weight: true
  # Google's exact mobile wNa8o8 converter recipe remains the final export
  # authority; this training profile provides the STE accuracy adaptation.
  final_quantization: mobile_wna8o8
  final_runtime_validation_required: true
golden_eval:
  enabled: true
  dataset_dir: outputs/datasets/golden50_stage3_eval
  split: all
  max_rows: 50
  max_input_tokens: 4096
  max_new_tokens: 4096
  trigger: evaluate
  interval: 1
  metric_for_best_model: overall_score
  greater_is_better: true
  save_best_checkpoint: true
  best_checkpoint_dir: runs/gemma4_e2b_ir_qat_sft/best_golden_checkpoint
  output_dir: outputs/eval/gemma4_e2b_ir_qat_sft/golden50
  weights_config: ../dataset/configs/run.yaml

run:
  id: gemma3_270m_a2ui_express_multiformat
  dataset_dir: outputs/datasets/stage3_folder_90_10
  output_dir: runs/gemma3_270m_a2ui_express_multiformat

model:
  family: gemma
  model_id: google/gemma-3-270m-it
  model_loader: auto_causal_lm
  trust_remote_code: false
  tokenizer_loader: auto_tokenizer
  load_in_4bit: false
  dtype: bfloat16
  device_map: none
  max_context_tokens: 32768
  max_output_tokens: 4096

training:
  # One W8-QAT adapter is trained, selected on Golden-32, then merged once.
  # W32/W16/W8/W4 below are post-merge deployment comparisons; only W8 is
  # precision-aligned with this training objective.
  method: qat_lora_sft
  epochs: 3
  learning_rate: 0.00005
  weight_decay: 0.01
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  mixed_precision: auto
  warmup_ratio: 0.03
  max_seq_length: 4096
  save_steps: 500
  eval_steps: 500
  logging_steps: 20
  report_to: tensorboard
  # Shared final-evaluation logger resolves this from the repository root and
  # honors A2UI_TENSORBOARD_ROOT (for example /tensorboard on MLP hosts).
  tensorboard_root: tensorboard
  tensorboard_subdir: training
  # Backward-compatible fallback. tensorboard_root below is authoritative and
  # redirects this run when A2UI_TENSORBOARD_ROOT=/tensorboard is set on MLP.
  logging_dir: ../tensorboard/gemma3_270m_a2ui_express_multiformat/training
  save_total_limit: 2
  max_grad_norm: 1.0
  seed: 42
  forward_smoke_check_rows: 16

lora:
  r: 16
  alpha: 16
  # Effective merged-weight QAT cannot represent a per-example dropout mask.
  dropout: 0.0
  target_modules: auto
  modules_to_save: []

qat:
  enabled: true
  # Matches the public/official Gemma 3 270M Q8 contract: per-row INT8
  # weights, including embeddings, and FLOAT32 activation edges.
  profile: gemma3_270m_wi8_afp32
  quantizer: ste_ai_edge
  eps: 1.0e-9
  quantize_embeddings: true
  exclude_modules: []
  weight_bits: 8
  activation_bits: 32
  weight_symmetric: true
  activation_symmetric: true
  weight_per_channel: true
  weight_axis: 0
  group_size: null
  only_base_layers: true
  effective_merged_weight: true
  final_quantization: dynamic_wi8_afp32
  final_runtime_validation_required: true

golden_eval:
  enabled: true
  # Generated by configs/datasets/golden32_20260903_eval.yaml from the exact
  # 32 strict-valid records in the supplied 2026-09-03 run.
  dataset_dir: outputs/datasets/golden32_20260903_eval
  split: all
  max_rows: 32
  required_rows: 32
  require_exact_rows: true
  require_unique_rows: true
  max_input_tokens: 3072
  max_new_tokens: 1024
  # Re-evaluate at every ordinary Trainer evaluation boundary and write the
  # scalar Golden metrics through Trainer into the root TensorBoard run.
  trigger: evaluate
  interval: 1
  metric_version: dual
  metric_for_best_model: generation_reward_v5_4_avg
  greater_is_better: true
  save_best_checkpoint: true
  best_checkpoint_dir: runs/gemma3_270m_a2ui_express_multiformat/best_golden_checkpoint
  output_dir: outputs/eval/gemma3_270m_a2ui_express_multiformat/during_training
  weights_config: ../dataset/configs/run.yaml
  tensorboard: true
  log_to_trainer: true
  metric_log_prefix: golden32

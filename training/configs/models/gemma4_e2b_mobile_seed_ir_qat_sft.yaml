run:
  id: gemma4_e2b_mobile_seed_ir_qat_sft
  dataset_dir: outputs/datasets/stage3_folder_90_10
  output_dir: runs/gemma4_e2b_mobile_seed_ir_qat_sft
runtime:
  distributed: ddp
model:
  family: gemma
  # Keep the public mobile release as the canonical identity. The explicit
  # local source is the text-only BF16 reconstruction produced from that exact
  # packed checkpoint; it is never silently replaced by a Hub download.
  model_id: google/gemma-4-E2B-it-qat-mobile-transformers
  model_source: outputs/seeds/gemma4_e2b_mobile_dequantized_text_hf
  mobile_training_seed_manifest: outputs/seeds/gemma4_e2b_mobile_dequantized_text_hf/mobile_training_seed_manifest.json
  # Generated beside the dense seed. Its SHA-256 and all 278 published F32
  # scale tensors are verified before model loading.
  mobile_qparams_contract: outputs/seeds/gemma4_e2b_mobile_dequantized_text_hf/mobile_qparams.json
  # Tokenizer assets can be loaded from the canonical release even when the
  # reconstructed directory contains only model shards and config.json.
  tokenizer_source: google/gemma-4-E2B-it-qat-mobile-transformers
  model_loader: auto_causal_lm
  architecture_preflight_required: true
  require_exact_checkpoint_keys: true
  trust_remote_code: false
  tokenizer_loader: pretrained_tokenizer_fast
  processor_fallback: true
  load_in_4bit: false
  dtype: bfloat16
  device_map: none
  max_context_tokens: 8192
  max_output_tokens: 4096
training:
  method: qat_lora_sft
  epochs: 2
  # Fresh run only. The earlier 5e-5 dynamic-scale run was numerically invalid;
  # start conservatively and select by Golden-100 v5.4, never by loss alone.
  learning_rate: 0.00001
  weight_decay: 0.01
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  mixed_precision: auto
  require_ddp_for_multi_gpu: true
  ddp_find_unused_parameters: false
  warmup_ratio: 0.03
  max_seq_length: 4096
  save_steps: 500
  eval_steps: 500
  logging_steps: 20
  report_to: tensorboard
  logging_dir: runs/gemma4_e2b_mobile_seed_ir_qat_sft/tensorboard
  save_total_limit: 2
  max_grad_norm: 1.0
  seed: 42
  forward_smoke_check_rows: 16
  lora_diagnostics_steps: 12
  refuse_resume: true
lora:
  r: 16
  alpha: 16
  dropout: 0.0
  # Official retained-mobile SFT resolves this from verified qparams: exactly
  # 205 language projections, NOT PEFT's ordinary Gemma 4 q/v default.
  target_modules: peft-default
  modules_to_save: []
qat:
  enabled: true
  profile: gemma4_e2b_mobile_retained_scale_wna8o8
  # This is the public AI Edge range convention and official observed bit map,
  # not a claim that Google's private observer/calibration recipe was released.
  quantizer: ste_ai_edge
  # Do not recompute abs-max scales from dequantized BF16 centers. W2/W4 use
  # the exact published scale sidecar and static A8 input/output scales.
  scale_mode: retained_mobile
  fixed_scale_required: true
  fixed_activation_scale_required: true
  effective_lora_only: true
  # Explicit v2 activation contract; old saved configs keep legacy arithmetic.
  activation_quantizer: gemma_mobile_srq
  simulate_frozen_activations: true
  expected_frozen_activation_modules: 70
  require_lora_trainable_scope: true
  saturation:
    enabled: true
    sample_every_optimizer_steps: 20
    max_values_per_module: 2048
  # 35 layers: q/k/v/o in layers 0-14, q/o in shared-KV layers 15-34,
  # plus gate/up/down in all layers = exactly 205 merged projections.
  expected_effective_lora_modules: 205
  ste_gradient: clipped
  # ai-edge-quantizer 0.8.0 tensor_zp_scale_from_min_max floor.
  eps: 1.0e-9
  schema_path: configs/quantization/gemma4_e2b_mobile_litertlm_schema.yaml
  # Frozen embeddings are already the dequantized published cell centers. QAT
  # applies only to effective base+LoRA projections whose scales are retained.
  quantize_embeddings: false
  exclude_modules: []
  weight_bits: 8
  activation_bits: 8
  weight_symmetric: true
  activation_symmetric: true
  weight_per_channel: true
  weight_axis: 0
  # Projection weights use per-output-channel scales. The schema overrides
  # only embed_tokens_per_layer with its observed 256-column grouping.
  group_size: null
  only_base_layers: true
  effective_merged_weight: true
  final_quantization: mobile_wna8o8
  final_runtime_validation_required: true
preflight:
  # These gates run before Trainer.train. QAT-on zero-adapter completion loss
  # must remain close to the reconstructed seed and finite on fixed rows.
  require_zero_adapter_parity: true
  require_initial_loss_gate: true
  rows: 8
  max_qat_loss_increase: 0.35
  max_qat_loss_ratio: 1.10
  max_initial_completion_loss: 15.0
  logit_probe_tokens: 32
  min_top1_probe_match: 0.90
  # Greedy generation is repeated with zero-adapter QAT before Trainer or an
  # optimizer exists. It must be deterministic and produce a nontrivial prefix.
  greedy_probe_rows: 1
  greedy_probe_new_tokens: 32
  min_greedy_tokens: 8
  require_greedy_determinism: true
  # Autoregressive divergence can amplify a later boundary change, so require
  # a stable prefix instead of falsely demanding all 32 generated tokens match.
  min_baseline_qat_greedy_prefix_tokens: 8
golden_eval:
  enabled: true
  # This directory must contain one immutable all.jsonl with exactly 100
  # unique held-out rows. Training fails before step 1 if that contract is not met.
  dataset_dir: outputs/datasets/golden100_stage3_eval
  split: all
  max_rows: 100
  required_rows: 100
  require_exact_rows: true
  require_unique_rows: true
  max_input_tokens: 4096
  max_new_tokens: 4096
  trigger: evaluate
  interval: 1
  metric_version: dual
  metric_for_best_model: generation_reward_v5_4_avg
  greater_is_better: true
  save_best_checkpoint: true
  best_checkpoint_dir: runs/gemma4_e2b_mobile_seed_ir_qat_sft/best_golden_checkpoint
  output_dir: outputs/eval/gemma4_e2b_mobile_seed_ir_qat_sft/golden100
  weights_config: ../dataset/configs/run.yaml
  tensorboard: true
  log_to_trainer: true
  metric_log_prefix: golden100

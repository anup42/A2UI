run:
  id: gemma4_e2b_ir_qat_lora
  dataset_dir: outputs/datasets/stage3_folder_90_10
  output_dir: runs/gemma4_e2b_ir_qat_lora
runtime:
  distributed: ddp
model:
  family: gemma
  # BF16 weights extracted from Google's Q4_0 QAT pipeline. This is not packed INT4.
  model_id: google/gemma-4-E2B-it-qat-q4_0-unquantized
  model_loader: auto_causal_lm
  trust_remote_code: false
  tokenizer_loader: auto_processor
  processor_fallback: true
  load_in_4bit: false
  dtype: bfloat16
  device_map: none
  max_context_tokens: 8192
  max_output_tokens: 4096
  chat_template_kwargs:
    enable_thinking: false
training:
  # Target-only PEFT. This is QAT-derived LoRA, not continued QAT.
  method: lora_sft
  epochs: 2
  learning_rate: 0.0001
  weight_decay: 0.01
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  mixed_precision: auto
  require_ddp_for_multi_gpu: true
  ddp_find_unused_parameters: false
  warmup_ratio: 0.03
  max_seq_length: 4096
  save_steps: 500
  eval_steps: 500
  logging_steps: 20
  save_total_limit: 2
  max_grad_norm: 1.0
  seed: 42
  forward_smoke_check_rows: 16
  lora_diagnostics_steps: 12
lora:
  r: 16
  alpha: 16
  dropout: 0.05
  # Transformers >=5.10.1 and PEFT >=0.19 provide Gemma 4 LM-layer defaults.
  target_modules: peft-default
  # Keep vocabulary weights frozen because this task does not add tokenizer tokens.
  modules_to_save: []
qat_mtp:
  support_level: experimental_qat_derived_target_tuning
  continued_qat: false
  final_quantization: q4_0
  assistant_model_id: google/gemma-4-E2B-it-qat-q4_0-unquantized-assistant
  train_assistant: false
  require_matching_precision: true
  final_runtime_validation_required: true
  merge_adapter_dir: runs/gemma4_e2b_ir_qat_lora/best_golden_checkpoint
  merged_model_dir: runs/gemma4_e2b_ir_qat_lora/merged_hf
golden_eval:
  enabled: true
  dataset_dir: outputs/datasets/golden50_stage3_eval
  split: all
  max_rows: 50
  max_input_tokens: 4096
  max_new_tokens: 4096
  trigger: evaluate
  interval: 1
  metric_for_best_model: overall_score
  greater_is_better: true
  save_best_checkpoint: true
  best_checkpoint_dir: runs/gemma4_e2b_ir_qat_lora/best_golden_checkpoint
  output_dir: outputs/eval/gemma4_e2b_ir_qat_lora/golden50
  weights_config: ../dataset/configs/run.yaml

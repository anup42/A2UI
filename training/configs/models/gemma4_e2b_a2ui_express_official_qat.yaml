run:
  id: gemma4_e2b_a2ui_express_official_qat
  dataset_dir: outputs/datasets/stage3_folder_90_10
  output_dir: runs/gemma4_e2b_a2ui_express_official_qat
  purpose: production_a2ui_express_retained_scale_qat
  quality_promotion_eligible: true
  serialization_validation_eligible: true
runtime:
  distributed: ddp
model:
  family: gemma
  # Canonical identity for the released packed mobile QAT checkpoint. The
  # trainable source is reconstructed locally from that exact artifact.
  model_id: google/gemma-4-E2B-it-qat-mobile-transformers
  model_source: outputs/seeds/gemma4_e2b_mobile_dequantized_text_hf
  mobile_training_seed_manifest: outputs/seeds/gemma4_e2b_mobile_dequantized_text_hf/mobile_training_seed_manifest.json
  mobile_qparams_contract: outputs/seeds/gemma4_e2b_mobile_dequantized_text_hf/mobile_qparams.json
  tokenizer_source: google/gemma-4-E2B-it-qat-mobile-transformers
  model_loader: auto_causal_lm
  architecture_preflight_required: true
  require_exact_checkpoint_keys: true
  trust_remote_code: false
  tokenizer_loader: pretrained_tokenizer_fast
  processor_fallback: true
  load_in_4bit: false
  dtype: bfloat16
  device_map: none
  max_context_tokens: 8192
  max_output_tokens: 2048
training:
  method: qat_lora_sft
  epochs: 2
  learning_rate: 0.00001
  weight_decay: 0.01
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  mixed_precision: auto
  require_ddp_for_multi_gpu: true
  ddp_find_unused_parameters: false
  warmup_ratio: 0.03
  max_seq_length: 4096
  save_steps: 500
  eval_steps: 500
  logging_steps: 20
  report_to: tensorboard
  # The portable launcher expands this repo-relative root to
  # <repo>/tensorboard/<unique-run-id>/training.
  tensorboard_root: tensorboard
  tensorboard_subdir: training
  logging_dir: ../tensorboard/gemma4_e2b_a2ui_express_official_qat/training
  save_total_limit: 2
  max_grad_norm: 1.0
  seed: 42
  forward_smoke_check_rows: 16
  lora_diagnostics_steps: 12
  refuse_resume: true
lora:
  r: 16
  alpha: 16
  dropout: 0.0
  target_modules: peft-default
  modules_to_save: []
qat:
  enabled: true
  profile: gemma4_e2b_mobile_retained_scale_wna8o8
  quantizer: ste_ai_edge
  scale_mode: retained_mobile
  fixed_scale_required: true
  fixed_activation_scale_required: true
  effective_lora_only: true
  expected_effective_lora_modules: 205
  ste_gradient: clipped
  eps: 1.0e-9
  schema_path: configs/quantization/gemma4_e2b_mobile_litertlm_schema.yaml
  quantize_embeddings: false
  exclude_modules: []
  weight_bits: 8
  activation_bits: 8
  weight_symmetric: true
  activation_symmetric: true
  weight_per_channel: true
  weight_axis: 0
  group_size: null
  only_base_layers: true
  effective_merged_weight: true
  final_quantization: mobile_wna8o8
  final_runtime_validation_required: true
preflight:
  require_zero_adapter_parity: true
  require_initial_loss_gate: true
  rows: 8
  max_qat_loss_increase: 0.35
  max_qat_loss_ratio: 1.10
  max_initial_completion_loss: 15.0
  logit_probe_tokens: 32
  min_top1_probe_match: 0.90
  greedy_probe_rows: 1
  greedy_probe_new_tokens: 32
  min_greedy_tokens: 8
  require_greedy_determinism: true
  min_baseline_qat_greedy_prefix_tokens: 8
golden_eval:
  enabled: true
  # This is the user-provided 2026-09-03 set. The portable launch plan binds
  # the prepared all.jsonl bytes and rejects a non-exact or duplicate set.
  dataset_config: configs/datasets/golden32_20260903_eval.yaml
  dataset_dir: outputs/datasets/golden32_20260903_eval_prompt_v2
  split: all
  source_genui_sha256: 596f56a15a63d904423970c9768797ba795ff0528a04da37dddcba280a4f4e17
  source_responses_sha256: 27406fa78d486ded4e9fcb2a78e987aa54d9f2ee8fe5db926874a1b2ff827089
  max_rows: 32
  required_rows: 32
  require_exact_rows: true
  require_unique_rows: true
  max_input_tokens: 4096
  max_new_tokens: 2048
  trigger: evaluate
  interval: 2
  evaluate_at_end: true
  use_cache: true
  metric_version: dual
  metric_for_best_model: generation_reward_v5_4_avg
  greater_is_better: true
  save_best_checkpoint: true
  best_checkpoint_dir: runs/gemma4_e2b_a2ui_express_official_qat/best_golden_checkpoint
  output_dir: outputs/eval/gemma4_e2b_a2ui_express_official_qat/golden32
  weights_config: ../dataset/configs/run.yaml
  tensorboard: true
  log_to_trainer: true
  metric_log_prefix: golden32

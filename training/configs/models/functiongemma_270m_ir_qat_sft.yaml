run:
  id: functiongemma_270m_ir_qat_sft
  dataset_dir: outputs/datasets/stage3_folder_90_10
  output_dir: runs/functiongemma_270m_ir_qat_sft
model:
  family: gemma
  model_id: google/functiongemma-270m-it
  model_loader: auto_causal_lm
  trust_remote_code: false
  tokenizer_loader: auto_tokenizer
  load_in_4bit: false
  dtype: bfloat16
  device_map: none
  max_context_tokens: 32768
  max_output_tokens: 4096
training:
  method: qat_lora_sft
  epochs: 3
  learning_rate: 0.00005
  weight_decay: 0.01
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  mixed_precision: auto
  warmup_ratio: 0.03
  max_seq_length: 4096
  save_steps: 500
  eval_steps: 500
  logging_steps: 20
  report_to: tensorboard
  logging_dir: runs/functiongemma_270m_ir_qat_sft/tensorboard
  save_total_limit: 2
  max_grad_norm: 1.0
  seed: 42
  forward_smoke_check_rows: 16
lora:
  r: 16
  alpha: 16
  # Exact merged-weight QAT cannot represent a per-example LoRA dropout mask.
  dropout: 0.0
  target_modules: auto
  modules_to_save: []
qat:
  enabled: true
  profile: functiongemma_270m_int8
  quantizer: ste_absmax
  weight_bits: 8
  activation_bits: 8
  weight_symmetric: true
  activation_symmetric: true
  weight_per_channel: true
  weight_axis: 0
  group_size: null
  only_base_layers: true
  effective_merged_weight: true
  final_quantization: dynamic_int8
  final_runtime_validation_required: true
golden_eval:
  enabled: true
  # This directory must contain one immutable all.jsonl with exactly 100
  # unique held-out rows. Training fails before step 1 if that contract is not met.
  dataset_dir: outputs/datasets/golden100_stage3_eval
  split: all
  max_rows: 100
  required_rows: 100
  require_exact_rows: true
  require_unique_rows: true
  max_input_tokens: 3072
  max_new_tokens: 1024
  trigger: evaluate
  interval: 1
  metric_version: dual
  metric_for_best_model: generation_reward_v5_4_avg
  greater_is_better: true
  save_best_checkpoint: true
  best_checkpoint_dir: runs/functiongemma_270m_ir_qat_sft/best_golden_checkpoint
  output_dir: outputs/eval/functiongemma_270m_ir_qat_sft/golden100
  weights_config: ../dataset/configs/run.yaml
  tensorboard: true
  log_to_trainer: true
  metric_log_prefix: golden100

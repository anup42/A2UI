run:
  id: gemma4_ir_lora
  dataset_dir: outputs/datasets/stage3_folder_90_10
  output_dir: runs/gemma4_ir_lora
model:
  family: gemma
  model_id: google/gemma-4-E4B-it
  trust_remote_code: false
  load_in_4bit: true
  dtype: bfloat16
  max_context_tokens: 8192
  max_output_tokens: 2048
training:
  method: qlora_sft
  epochs: 2
  learning_rate: 0.0002
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  warmup_ratio: 0.03
  max_seq_length: 4096
  save_steps: 500
  eval_steps: 500
  logging_steps: 20
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: auto
golden_eval:
  enabled: true
  dataset_dir: outputs/datasets/golden35_stage3_eval
  split: all
  max_rows: 35
  required_rows: 35
  require_exact_rows: true
  require_unique_rows: true
  max_new_tokens: 2048
  output_dir: outputs/eval/gemma4_ir_lora/golden35
  weights_config: ../dataset/configs/run.yaml

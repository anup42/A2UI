run:
  id: gemma4_e2b_ir_lora
  dataset_dir: outputs/datasets/stage3_folder_90_10
  output_dir: runs/gemma4_e2b_ir_lora
runtime:
  distributed: ddp
model:
  family: gemma
  model_id: google/gemma-4-E2B-it
  trust_remote_code: false
  tokenizer_loader: pretrained_tokenizer_fast
  processor_fallback: true
  load_in_4bit: false
  dtype: float16
  device_map: none
  max_context_tokens: 8192
  max_output_tokens: 2048
training:
  method: lora_sft
  epochs: 2
  learning_rate: 0.0002
  weight_decay: 0.01
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  mixed_precision: none
  require_ddp_for_multi_gpu: true
  ddp_find_unused_parameters: false
  warmup_ratio: 0.03
  max_seq_length: 4096
  save_steps: 500
  eval_steps: 500
  logging_steps: 20
  save_total_limit: 2
  max_grad_norm: 1.0
  seed: 42
  forward_smoke_check_rows: 16
  lora_diagnostics_steps: 12
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # Matches the supplied working Gemma 4 trainer while remaining overrideable.
  target_modules: all-linear
golden_eval:
  enabled: true
  dataset_dir: outputs/datasets/golden35_stage3_eval
  split: all
  max_rows: 35
  required_rows: 35
  require_exact_rows: true
  require_unique_rows: true
  max_input_tokens: 4096
  max_new_tokens: 2048
  trigger: evaluate
  interval: 1
  metric_for_best_model: overall_score
  greater_is_better: true
  save_best_checkpoint: true
  output_dir: outputs/eval/gemma4_e2b_ir_lora/golden35
  weights_config: ../dataset/configs/run.yaml

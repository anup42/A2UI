      lm_head_weight_bits: 2
      per_layer_model_projection_weight_bits: 8
    language_layers:
      mlp:
        "0-14": 4
        "15-34": 2
      self_attention: 4
      per_layer_embedding_gate_and_projection: 8
  tf_lite_mtp_drafter:
    token_embedding_weight_bits: 4
    mlp: 4
    self_attention: 8
    projections: 8
  tf_lite_audio_encoder_hw:
    default_weight_bits: 2
    lconv1d_linear_start_weight_bits: 4
  tf_lite_vision_encoder:

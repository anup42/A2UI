pipeline:
  id: gemma4_e2b_mobile_mtp
  # Existing true-QAT + LoRA SFT config. Its golden_eval callback writes the
  # best checkpoint used by this pipeline.
  training_config: configs/models/gemma4_e2b_ir_qat_sft.yaml
  output_dir: outputs/pipelines/gemma4_e2b_mobile_mtp

  source:
    # Fill this with the released official Gemma 4 E2B mobile .litertlm. It
    # must contain tf_lite_mtp_drafter and the target section below.
    base_litertlm: ""
    # Exactly one target source is required for --compose. A target_litertlm
    # is a candidate package containing the fine-tuned target section; a
    # target_section is a raw TFLite TFL3 section from a compatible mobile
    # exporter. The public litert-torch exporter is not assumed compatible.
    target_litertlm: ""
    target_section: ""
    merged_model_dir: outputs/pipelines/gemma4_e2b_mobile_mtp/merged_best_hf

  mtp:
    enabled: true
    model_type: tf_lite_mtp_drafter
    target_model_type: tf_lite_prefill_decode
    # official preserves the released section byte-for-byte (recommended first).
    # trained injects only 23 trained matrices into the official MTP graph.
    weight_source: official
    assistant_model_id: google/gemma-4-E2B-it-qat-q4_0-unquantized-assistant
    train_assistant: false
    preserve_official_section: true
    training_config: configs/models/gemma4_e2b_mtp_drafter_qat.yaml
    trained_checkpoint: runs/gemma4_e2b_mtp_drafter_qat/best_checkpoint
    target_intermediate_litertlm: outputs/pipelines/gemma4_e2b_mobile_mtp/gemma4_e2b_target_with_official_mtp.litertlm
    exact_topology_output_dir: outputs/pipelines/gemma4_e2b_mobile_mtp/exact_topology_export/drafter

  public_export:
    # Keep false by default. Setting true enables a standalone public
    # litert-torch export candidate; it does not make that export Google's
    # private mobile wNa8o8 recipe. Use --execute-public-export explicitly.
    enabled: false
    config: configs/export/edge_gallery_gemma4_e2b.yaml
    output_dir: outputs/pipelines/gemma4_e2b_mobile_mtp/public_export

  exact_topology:
    # Preferred deployment path. The released package is the graph/template
    # authority; only checkpoint-derived FC weights and their per-axis scales
    # are replaced. This target stage always retains the default MTP drafter
    # byte-for-byte. With weight_source=trained, the separately gated second
    # stage then replaces only the 23 mapped drafter matrices.
    enabled: true
    # This binds merge provenance to the public dense QAT training seed. The
    # released mobile package remains the graph and packed-constant authority.
    official_base_model_id: google/gemma-4-E2B-it-qat-q4_0-unquantized
    official_artifact_sha256: 181938105e0eefd105961417e8da75903eacda102c4fce9ce90f50b97139a63c
    output_dir: outputs/pipelines/gemma4_e2b_mobile_mtp/exact_topology_export
    calibration_samples: 2
    threads: 1
    converter_batch_size: 8
    retain_intermediates: false
    runtime_allocate: true
    runtime_threads: 2
    runtime_without_default_delegates: true

  android:
    mtp: true
    delegate: gpu
    # The pipeline runs two mandatory reports: target-only isolates graph/GPU
    # throughput; MTP-on separately gates draft acceptance and speculative speed.
    device_validation_required: target_only_and_mtp_on
    output_dir: outputs/pipelines/gemma4_e2b_mobile_mtp/android_gpu_parity
    max_num_tokens: 2048
    output_tokens: 64
    warm_runs: 1
    prompt: "Write exactly one hundred numbered words."
    top_k: 1
    top_p: 1.0
    temperature: 0.0
    seed: 42
    max_throughput_regression_percent: 10.0
    max_mtp_success_rate_drop: 0.10
    # The official verifier consumes four draft positions. LiteRT-LM checks
    # the output cap after a speculative batch, so its benchmark count can be
    # up to four tokens above output_tokens without being an early-stop sample.
    mtp_max_decode_overshoot: 4

pipeline:
  id: gemma4_e2b_mobile_mtp
  # True-QAT + LoRA SFT over the text-only BF16 seed reconstructed from the
  # exact public packed mobile checkpoint. The config fail-closes until its
  # materialized seed manifest and every output shard hash verify.
  training_config: configs/models/gemma4_e2b_mobile_seed_ir_qat_sft.yaml
  output_dir: outputs/pipelines/gemma4_e2b_mobile_mtp

  source:
    # Fill this with the released official Gemma 4 E2B mobile .litertlm. It
    # must contain tf_lite_mtp_drafter and the target section below.
    base_litertlm: ""
    # Retained-mobile deployment never consumes a separately exported target
    # or raw section. Both legacy fields must stay empty.
    target_litertlm: ""
    target_section: ""
    merged_model_dir: outputs/pipelines/gemma4_e2b_mobile_mtp/merged_best_hf

  mtp:
    # Set false for a target-only deployment/runtime gate. The exact-topology
    # package still retains the released drafter section byte-for-byte so its
    # structure stays official and MTP can be enabled later without repacking.
    enabled: true
    model_type: tf_lite_mtp_drafter
    target_model_type: tf_lite_prefill_decode
    # official preserves the released section byte-for-byte (recommended first).
    # trained injects only 23 trained matrices into the official MTP graph.
    weight_source: official
    # Used only when weight_source=trained. weight_source=official preserves
    # the released package's drafter bytes and does not download this model.
    assistant_model_id: google/gemma-4-E2B-it-qat-q4_0-unquantized-assistant
    train_assistant: false
    preserve_official_section: true
    training_config: configs/models/gemma4_e2b_mtp_drafter_qat.yaml
    trained_checkpoint: runs/gemma4_e2b_mtp_drafter_qat/best_checkpoint
    target_intermediate_litertlm: outputs/pipelines/gemma4_e2b_mobile_mtp/retained_scale_export/gemma4_e2b_target_with_official_mtp.litertlm
    exact_topology_output_dir: outputs/pipelines/gemma4_e2b_mobile_mtp/exact_topology_export/drafter

  public_export:
    # Must stay false. The generic LiteRT Torch path recomputes scales and is
    # blocked for qat.scale_mode=retained_mobile.
    enabled: false
    config: configs/export/edge_gallery_gemma4_e2b.yaml
    output_dir: outputs/pipelines/gemma4_e2b_mobile_mtp/public_export

  retained_scale_export:
    # The only target deployment path for this profile. It patches integer
    # codes for exactly 205 trained projections while retaining the released
    # W2/W4/W8 and A8 scales, graph/layout, 72 frozen constants and MTP bytes.
    enabled: true
    mode: retained_scale_code_only_v1
    official_artifact_sha256: 181938105e0eefd105961417e8da75903eacda102c4fce9ce90f50b97139a63c
    output_dir: outputs/pipelines/gemma4_e2b_mobile_mtp/retained_scale_export
    report: outputs/pipelines/gemma4_e2b_mobile_mtp/retained_scale_export/gemma4_retained_scale_code_only_report.json

  android:
    delegate: gpu
    # Target-only always isolates graph/GPU throughput. When mtp.enabled=true,
    # the pipeline additionally requires MTP acceptance and speculative speed.
    output_dir: outputs/pipelines/gemma4_e2b_mobile_mtp/android_gpu_parity
    max_num_tokens: 2048
    output_tokens: 64
    # Schema-v5 promotion compares the median of three alternating-order warm
    # probes and fails if any sample misses full delegation or the decode cap.
    warm_runs: 3
    prompt: "Write exactly one hundred numbered words."
    top_k: 1
    top_p: 1.0
    temperature: 0.0
    seed: 42
    max_throughput_regression_percent: 10.0
    max_mtp_success_rate_drop: 0.10
    # The official verifier consumes four draft positions. LiteRT-LM checks
    # the output cap after a speculative batch, so its benchmark count can be
    # up to four tokens above output_tokens without being an early-stop sample.
    mtp_max_decode_overshoot: 4

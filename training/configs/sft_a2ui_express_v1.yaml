# Production SFT profile. The model is trained to emit only A2UI Express v1.
run:
  id: sft_a2ui_express_v1
  dataset_dir: outputs/datasets/dataset_v1_stage3
  output_dir: runs/sft_a2ui_express_v1
  target_format: a2ui_express_v1
  prompt_version: genui_gen_mobile_a2ui_express_v1
  schema_path: ../dataset/schema/genuicraft_a2ui_express_profile_v1.json
model:
  family: gemma
  model_id: google/gemma-4-E2B-it
  tokenizer_loader: pretrained_tokenizer_fast
  max_context_tokens: 8192
  max_output_tokens: 8192
training:
  method: lora_sft
  epochs: 2
  learning_rate: 0.0002
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  max_seq_length: 4096
  seed: 42
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear
contract:
  production_target_format: a2ui_express_v1
  legacy_inputs: [flat_spec_v1]
  forbidden_targets: [compact_ir_v2, gci2]

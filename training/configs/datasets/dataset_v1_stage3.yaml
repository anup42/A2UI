run:
  id: dataset_v1_stage3
  seed: 42
  source_run_dir: ../dataset/data/runs/dataset_v1
  output_dir: outputs/datasets/dataset_v1_stage3
  target_format: compact_ir_v2
  prompt_version: genui_gen_mobile_compact_ir_v2
  schema_path: ../dataset/schema/genui_compact_ir_v2.schema.json
  system_prompt: |
    You convert response text into Compact IR v2 for the Android GenUI renderer.
    Return JSON only with v, r, optional s, and e.
    Keep tables compact as Table props plus state rows. Do not output markdown fences or prose.
filters:
  require_strict_flat_spec: true
  max_input_chars: 60000
  max_output_chars: 60000
  deduplicate: true
split:
  train: 0.96
  val: 0.02
  test: 0.02
  stratify_by: intent_bucket

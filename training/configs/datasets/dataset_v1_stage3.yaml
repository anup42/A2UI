run:
  id: dataset_v1_stage3
  seed: 42
  source_run_dir: ../dataset/data/runs/dataset_v1
  output_dir: outputs/datasets/dataset_v1_stage3
  target_format: a2ui_express_v1
  prompt_version: genui_gen_mobile_a2ui_express_v1
  schema_path: ../dataset/schema/genuicraft_a2ui_express_profile_v1.json
  system_prompt: |
    You convert response text into A2UI Express v1 for the Android GenUI renderer.
    Return exactly one <a2ui>...</a2ui> block and no prose or markdown fences.
    Use explicit named properties and action calls; opaque metadata bags are forbidden.
filters:
  require_strict_flat_spec: true # validates the canonical graph after legacy import
  max_input_chars: 60000
  max_output_chars: 60000
  deduplicate: true
split:
  train: 0.96
  val: 0.02
  test: 0.02
  stratify_by: intent_bucket

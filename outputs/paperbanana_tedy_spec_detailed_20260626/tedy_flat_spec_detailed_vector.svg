<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1200" viewBox="0 0 2600 1200">
  <defs>
    <style>
      .bg{fill:#ffffff}.panel{fill:#f7fbff;stroke:#1f6f8b;stroke-width:3;rx:28}.panel2{fill:#f4fff9;stroke:#168a6b;stroke-width:3;rx:28}.panel3{fill:#fffaf0;stroke:#c47c14;stroke-width:3;rx:28}.panel4{fill:#faf7ff;stroke:#6e52a3;stroke-width:3;rx:28}.title{font:700 36px 'Segoe UI',Arial,sans-serif;fill:#102030}.subtitle{font:600 26px 'Segoe UI',Arial,sans-serif;fill:#183246}.text{font:24px 'Segoe UI',Arial,sans-serif;fill:#203040}.small{font:20px 'Segoe UI',Arial,sans-serif;fill:#30465a}.mono{font:22px 'Cascadia Mono','Consolas',monospace;fill:#17324d}.chip{fill:#e9f4ff;stroke:#6aa7d9;stroke-width:2;rx:18}.chipText{font:600 20px 'Segoe UI',Arial,sans-serif;fill:#17324d}.arrow{stroke:#168a9f;stroke-width:7;fill:none;marker-end:url(#arrow)}.thin{stroke:#9bb4c6;stroke-width:2;fill:none;stroke-dasharray:8 8}.check{fill:#16a085}.warn{fill:#c47c14}.card{fill:#ffffff;stroke:#b9cfdd;stroke-width:2;rx:18}.phone{fill:#f6f9fb;stroke:#26333d;stroke-width:12;rx:54}.screen{fill:#ffffff;stroke:#d0dde6;stroke-width:3;rx:28}.shadow{filter:url(#shadow)}
    </style>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="20" refY="11" orient="auto"><path d="M0,2 L22,11 L0,20 z" fill="#168a9f"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.16"/></filter>
  </defs>
  <rect class="bg" width="2200" height="1200"/>
  <text x="70" y="70" class="title">TEDY Flat-Spec IR: Compact, Validatable, Renderer-Friendly UI Contract</text>
  <text x="70" y="112" class="small">A three-field JSON object separates reusable data from semantic UI nodes so LLM output stays compact while native renderers choose adaptive mobile presentations.</text>

  <!-- Top-level contract -->
  <rect x="55" y="160" width="430" height="760" class="panel shadow"/>
  <text x="95" y="220" class="subtitle">1. Top-Level JSON Contract</text>
  <rect x="95" y="255" width="350" height="145" class="card"/>
  <text x="130" y="300" class="mono">"root": "main"</text>
  <text x="130" y="340" class="small">Root element id; must exist in elements.</text>
  <circle cx="408" cy="308" r="25" fill="#dff3ff" stroke="#1f6f8b" stroke-width="3"/><text x="398" y="317" class="text">K</text>
  <rect x="95" y="430" width="350" height="170" class="card"/>
  <text x="130" y="475" class="mono">"state": {...}</text>
  <text x="130" y="515" class="small">Reusable arrays, table rows, scalar values, and entity data.</text>
  <rect x="355" y="463" width="54" height="70" rx="10" fill="#e6fff5" stroke="#168a6b" stroke-width="3"/>
  <line x1="365" y1="485" x2="399" y2="485" stroke="#168a6b" stroke-width="3"/><line x1="365" y1="508" x2="399" y2="508" stroke="#168a6b" stroke-width="3"/>
  <rect x="95" y="630" width="350" height="210" class="card"/>
  <text x="130" y="675" class="mono">"elements": {...}</text>
  <text x="130" y="715" class="small">Flat map: element id -> node.</text>
  <text x="130" y="750" class="small">No nested JSON tree expansion needed.</text>
  <circle cx="365" cy="720" r="13" fill="#e9f4ff" stroke="#1f6f8b" stroke-width="3"/><line x1="365" y1="733" x2="365" y2="775" stroke="#1f6f8b" stroke-width="3"/><circle cx="330" cy="790" r="12" fill="#e9f4ff" stroke="#1f6f8b" stroke-width="3"/><circle cx="365" cy="790" r="12" fill="#e9f4ff" stroke="#1f6f8b" stroke-width="3"/><circle cx="400" cy="790" r="12" fill="#e9f4ff" stroke="#1f6f8b" stroke-width="3"/><line x1="330" y1="778" x2="400" y2="778" stroke="#1f6f8b" stroke-width="3"/>

  <!-- Element grammar -->
  <rect x="545" y="160" width="520" height="760" class="panel2 shadow"/>
  <text x="585" y="220" class="subtitle">2. Element Node Grammar</text>
  <rect x="585" y="255" width="440" height="105" class="card"/><text x="620" y="300" class="mono">type</text><text x="755" y="300" class="small">Semantic component kind</text><text x="755" y="332" class="small">Stack, Card, Text, Table, Button...</text>
  <rect x="585" y="380" width="440" height="120" class="card"/><text x="620" y="425" class="mono">props</text><text x="755" y="425" class="small">Styling, content, data paths, media,</text><text x="755" y="457" class="small">domain hints, action labels.</text>
  <rect x="585" y="520" width="440" height="100" class="card"/><text x="620" y="565" class="mono">children</text><text x="755" y="565" class="small">Ordered list of child ids.</text>
  <rect x="585" y="640" width="440" height="115" class="card"/><text x="620" y="685" class="mono">repeat</text><text x="755" y="685" class="small">Optional binding: statePath + key.</text><text x="755" y="718" class="small">Keeps repeated rows compact.</text>
  <rect x="585" y="775" width="440" height="95" class="card"/><text x="620" y="820" class="mono">on</text><text x="755" y="820" class="small">Event map: press -> openUrl/copy.</text>

  <!-- Metadata -->
  <rect x="1125" y="160" width="460" height="760" class="panel3 shadow"/>
  <text x="1165" y="220" class="subtitle">3. Compact Metadata</text>
  <text x="1165" y="270" class="text">Tables</text>
  <rect x="1165" y="295" width="370" height="170" class="card"/>
  <text x="1195" y="335" class="mono">columns[]</text><text x="1360" y="335" class="small">ordered labels</text>
  <text x="1195" y="375" class="mono">rows/statePath</text><text x="1360" y="375" class="small">all cell values</text>
  <text x="1195" y="415" class="mono">domain</text><text x="1360" y="415" class="small">weather, flight...</text>
  <text x="1195" y="455" class="mono">presentation</text><text x="1360" y="455" class="small">cards/table</text>
  <text x="1165" y="525" class="text">Dynamic Values</text>
  <rect x="1165" y="550" width="370" height="145" class="card"/>
  <text x="1195" y="590" class="mono">$item   $state</text>
  <text x="1195" y="630" class="mono">$bindState  $index</text>
  <text x="1195" y="670" class="mono">$cond   $template</text>
  <text x="1165" y="750" class="text">Media &amp; Actions</text>
  <rect x="1165" y="775" width="370" height="95" class="card"/>
  <text x="1195" y="815" class="small">Local asset paths, alt text, source URLs,</text>
  <text x="1195" y="848" class="small">buttons attached to relevant cards/rows.</text>

  <!-- Validation -->
  <rect x="1645" y="160" width="300" height="760" class="panel4 shadow"/>
  <text x="1685" y="220" class="subtitle">4. Validation Gate</text>
  <g transform="translate(1685,270)">
    <circle cx="18" cy="18" r="18" class="check"/><text x="10" y="27" font="700 26px Segoe UI" fill="#fff">✓</text><text x="55" y="25" class="small">Root exists</text>
    <circle cx="18" cy="88" r="18" class="check"/><text x="10" y="97" font="700 26px Segoe UI" fill="#fff">✓</text><text x="55" y="95" class="small">Child refs resolve</text>
    <circle cx="18" cy="158" r="18" class="check"/><text x="10" y="167" font="700 26px Segoe UI" fill="#fff">✓</text><text x="55" y="165" class="small">Types supported</text>
    <circle cx="18" cy="228" r="18" class="check"/><text x="10" y="237" font="700 26px Segoe UI" fill="#fff">✓</text><text x="55" y="235" class="small">Actions valid</text>
    <circle cx="18" cy="298" r="18" class="check"/><text x="10" y="307" font="700 26px Segoe UI" fill="#fff">✓</text><text x="55" y="305" class="small">Table aliases normalized</text>
    <circle cx="18" cy="368" r="18" class="check"/><text x="10" y="377" font="700 26px Segoe UI" fill="#fff">✓</text><text x="55" y="375" class="small">Expanded cells compacted</text>
    <circle cx="18" cy="438" r="18" class="check"/><text x="10" y="447" font="700 26px Segoe UI" fill="#fff">✓</text><text x="55" y="445" class="small">Empty props pruned</text>
    <circle cx="18" cy="508" r="18" class="warn"/><text x="9" y="517" font="700 26px Segoe UI" fill="#fff">!</text><text x="55" y="515" class="small">Fallback if invalid</text>
  </g>

  <!-- Renderer -->
  <rect x="1990" y="155" width="520" height="770" fill="none"/>
  <text x="1980" y="220" class="subtitle">5. Native Renderer</text>
  <rect x="1980" y="260" width="170" height="390" class="phone"/>
  <rect x="2002" y="295" width="126" height="320" class="screen"/>
  <rect x="2020" y="325" width="86" height="52" rx="14" fill="#e6fff5" stroke="#168a6b" stroke-width="2"/>
  <text x="2032" y="360" class="small">Card</text>
  <rect x="2020" y="395" width="86" height="82" rx="8" fill="#edf8ff" stroke="#1f6f8b" stroke-width="2"/>
  <line x1="2030" y1="420" x2="2096" y2="420" stroke="#1f6f8b" stroke-width="2"/><line x1="2030" y1="445" x2="2096" y2="445" stroke="#1f6f8b" stroke-width="2"/><line x1="2064" y1="398" x2="2064" y2="476" stroke="#1f6f8b" stroke-width="2"/>
  <rect x="2020" y="500" width="86" height="48" rx="24" fill="#168a9f"/><text x="2035" y="532" font="20px Segoe UI" fill="#fff">Button</text>
  <text x="1970" y="710" class="small">Adaptive mobile views:</text>
  <text x="1970" y="745" class="small">weather cards, flight cards,</text>
  <text x="1970" y="780" class="small">comparison tables, playlists,</text>
  <text x="1970" y="815" class="small">formula/code/email templates.</text>

  <!-- Flow arrows -->
  <path d="M485 535 C520 535 520 535 545 535" class="arrow"/>
  <path d="M1065 535 C1095 535 1095 535 1125 535" class="arrow"/>
  <path d="M1585 535 C1615 535 1615 535 1645 535" class="arrow"/>
  <path d="M1945 535 C1960 535 1960 535 1980 535" class="arrow"/>

  <!-- Bottom component catalog -->
  <rect x="55" y="975" width="2490" height="145" rx="30" fill="#f7f9fb" stroke="#d3e0e8" stroke-width="3"/>
  <text x="95" y="1030" class="subtitle">Supported Semantic Component Catalog</text>
  <g transform="translate(95,1060)">
    <rect class="chip" x="0" y="0" width="90" height="45"/><text class="chipText" x="20" y="30">Stack</text>
    <rect class="chip" x="105" y="0" width="75" height="45"/><text class="chipText" x="128" y="30">Row</text>
    <rect class="chip" x="195" y="0" width="80" height="45"/><text class="chipText" x="214" y="30">Card</text>
    <rect class="chip" x="290" y="0" width="75" height="45"/><text class="chipText" x="312" y="30">Text</text>
    <rect class="chip" x="380" y="0" width="85" height="45"/><text class="chipText" x="402" y="30">Table</text>
    <rect class="chip" x="480" y="0" width="90" height="45"/><text class="chipText" x="500" y="30">Image</text>
    <rect class="chip" x="585" y="0" width="75" height="45"/><text class="chipText" x="607" y="30">Icon</text>
    <rect class="chip" x="675" y="0" width="95" height="45"/><text class="chipText" x="696" y="30">Button</text>
    <rect class="chip" x="785" y="0" width="75" height="45"/><text class="chipText" x="809" y="30">Tabs</text>
    <rect class="chip" x="875" y="0" width="125" height="45"/><text class="chipText" x="895" y="30">CodeBlock</text>
    <rect class="chip" x="1015" y="0" width="145" height="45"/><text class="chipText" x="1033" y="30">FormulaBlock</text>
    <rect class="chip" x="1175" y="0" width="145" height="45"/><text class="chipText" x="1196" y="30">EmailPreview</text>
    <rect class="chip" x="1335" y="0" width="95" height="45"/><text class="chipText" x="1355" y="30">Divider</text>
  </g>
</svg>


